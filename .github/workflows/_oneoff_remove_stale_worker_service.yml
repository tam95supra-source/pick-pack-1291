name: Oneoff Remove Stale Worker Service

on:
  pull_request:
    branches: [ ci/domain-cutover-audit-base-20260824 ]
    paths:
      - 'ops/remove-stale-worker-trigger.txt'

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CUSTOM_URL: https://pickpack1291.cc.cd
      OLD_SERVICE: pick-pack-1291-service
    steps:
      - uses: actions/checkout@v4

      - name: Guard old service is detached and empty
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${H[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > /tmp/domains-before.json
          curl -fsS "${H[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services" > /tmp/services-before.json
          python3 - <<'PY'
          import json
          domains=json.load(open('/tmp/domains-before.json')).get('result') or []
          services=json.load(open('/tmp/services-before.json')).get('result') or []
          old=[x for x in services if x.get('id')=='pick-pack-1291-service']
          assert old,services
          assert not [x for x in domains if x.get('service')=='pick-pack-1291-service'],domains
          script=((old[0].get('default_environment') or {}).get('script'))
          assert script is None,old[0]
          custom=[x for x in domains if x.get('hostname')=='pickpack1291.cc.cd']
          assert custom and custom[0].get('service')=='pickpack',custom
          print('STALE_SERVICE_DELETE_GUARD_PASS')
          PY

      - name: Delete stale service object
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "${H[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$OLD_SERVICE")
          echo "delete_http=$code" | tee /tmp/delete-receipt.txt
          test "$code" = 200 || test "$code" = 204
          if [[ -s /tmp/delete.json ]]; then
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/delete.json'))
          assert j.get('success') is not False,j
          PY
          fi

      - name: Verify stale service removed and production custom domain healthy
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${H[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services" > /tmp/services-after.json
          python3 - <<'PY'
          import json
          services=json.load(open('/tmp/services-after.json')).get('result') or []
          ids=[x.get('id') for x in services]
          assert 'pick-pack-1291-service' not in ids,ids
          assert 'pickpack' in ids,ids
          print('STALE_SERVICE_REMOVED_PASS',ids)
          PY
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 40 "$CUSTOM_URL/health" > /tmp/custom-health-after.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/custom-health-after.json')); a=j.get('authority') or {}; r=j.get('replication') or {}
          assert j.get('ok') is True,j
          assert a.get('mode')=='SERVICE_PRIMARY',j
          assert a.get('scope')=='PRODUCTION',j
          if 'state' in r: assert r.get('state')=='HEALTHY',r
          if 'pending_count' in r: assert int(r.get('pending_count') or 0)==0,r
          print('PRODUCTION_CUSTOM_DOMAIN_STILL_HEALTHY')
          PY
          echo 'verdict=PASS' >> /tmp/delete-receipt.txt

      - name: Upload deletion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-worker-removal-evidence
          path: |
            /tmp/delete-receipt.txt
            /tmp/services-before.json
            /tmp/services-after.json
            /tmp/domains-before.json
            /tmp/custom-health-after.json
          if-no-files-found: ignore
          retention-days: 14
