name: Beta57 Owner Truth Patch

on:
  push:
    branches: [ agent/beta57-reset-fence-20260823 ]
    paths:
      - 'ops/beta57-owner-truth-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta57-reset-fence-20260823
          fetch-depth: 0
      - name: Apply latest owner truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          op=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt')
          s=op.read_text()
          old='            Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF"),\n'
          if old in s:
              s=s.replace(old,'',1)
          if 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' in s:
              raise SystemExit('staff bottom-nav entry still present')
          op.write_text(s)

          wf=Path('.github/workflows/app-fast-check.yml')
          w=wf.read_text()
          pos="          grep -q 'Triple(R.drawable.ic_pp_staff,\"Nhân sự\",\"STAFF\")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt\n"
          neg="          ! grep -q 'Triple(R.drawable.ic_pp_staff,\"Nhân sự\",\"STAFF\")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt\n"
          if pos in w:
              w=w.replace(pos,neg,1)
          if neg not in w:
              raise SystemExit('latest owner guard missing')
          wf.write_text(w)
          PY
          git config user.name github-actions[bot]
          git config user.email 4189826+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt .github/workflows/app-fast-check.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(beta57): remove staff tab per latest owner truth'
            git push origin HEAD:agent/beta57-reset-fence-20260823
          fi
