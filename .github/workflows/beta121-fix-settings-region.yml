name: Beta121 fix settings sync and DR harness

on:
  push:
    branches:
      - release/beta121-owner-ui-pda-source-20260905
    paths:
      - .github/workflows/beta121-fix-settings-region.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes and contracts
        run: |
          set -euo pipefail
          python3 tools/beta121_fix_settings_region.py
          python3 tools/beta121_owner_ui_pda_source_contract.py
          bash -n tools/cloud_dr_provider_preflight.sh
          git diff --check
      - name: Commit implementation and harness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt tools/beta121_owner_ui_pda_source_contract.py tools/cloud_dr_provider_preflight.sh
          if git diff --cached --quiet; then
            echo "BETA121_FIX_ALREADY_APPLIED"
            exit 0
          fi
          git commit -m "fix(beta121): recover scoped Turso DR preflight"
          git push origin HEAD:release/beta121-owner-ui-pda-source-20260905
