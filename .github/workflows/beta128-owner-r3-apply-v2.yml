name: Beta128 owner R3 apply v2

on:
  push:
    branches:
      - release/beta128-owner-r3-drop-realtime-20260905
    paths:
      - .github/workflows/beta128-owner-r3-apply-v2.yml
      - tools/beta128_owner_r3_apply.py

permissions:
  contents: write
  actions: read

concurrency:
  group: beta128-owner-r3-apply-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply owner R3 patch
        run: python3 tools/beta128_owner_r3_apply.py
      - name: Verify focused regression and canonical scope
        run: |
          set -euo pipefail
          python3 tools/beta128_owner_r3_contract.py
          python3 tools/owner_scope_guard_v2.py --base-ref beta/current
          python3 tools/owner_scope_guard_v2.py --bootstrap
          git diff --check
      - name: Commit implementation and canonical scope
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/beta128_owner_r3_patch.py app/build.gradle.kts app/src/main/java/vn/pickpack1291/app/beta/ReleaseNotes.kt app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt app/src/main/java/vn/pickpack1291/app/beta/PostMealAttendanceFeature.kt app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt qa/stable_invariants.yml docs/STABLE_INVARIANTS.md docs/handovers/HANDOVER_CURRENT.md CURRENT_STATE.md ops/OWNER_SCOPE_CURRENT.json ops/owner-command-ledger.jsonl
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(beta128): smooth realtime UI and refine drop receive"
          git push origin HEAD:release/beta128-owner-r3-drop-realtime-20260905
