ược tài nguyên");return@runOnUiThread};val resources=rr.json?.optJSONArray("resources")?:JSONArray();var row:JSONObject?=null;for(i in 0 until resources.length()){val x=resources.optJSONObject(i)?:continue;if(x.optString("resource_type")!="PDA")continue;val id=x.optString("resource_id");val last=runCatching{JSONObject(x.optString("metadata_json","{}"))}.getOrDefault(JSONObject()).optString("5 số cuối Seri");if(id.equals(typed,true)||last==typed||id.endsWith(typed)){row=x;break}};val serial=row?.optString("resource_id").orEmpty();if(serial.isBlank()){box.removeAllViews();showError("Không tìm thấy Seri PDA.");return@runOnUiThread};val mnv=row?.optString("leased_by_mnv").orEmpty().ifBlank{localMnvFor(serial)};if(mnv.isBlank()){box.removeAllViews();box.addView(info("PDA $serial hiện không được phiên ACTIVE nào giữ."));return@runOnUiThread};api.call("employee_context",JSONObject().put("mnv",mnv).put("include_options",true)){r->runOnUiThread{box.removeAllViews();if(handleAuth(r))return@runOnUiThread;if(!r.ok){showError(r.error?:"Không tải được phiên");return@runOnUiThread};if(r.json?.optString("state")!="ACTIVE"){box.addView(info("Phiên sử dụng PDA không còn ACTIVE."));return@runOnUiThread};val ctx=r.json?:JSONObject();val e=ctx.optJSONObject("employee")?:JSONObject();val ses=ctx.optJSONObject("session")?:JSONObject();if(ses.optString("pda_serial")!=serial){box.addView(info("PDA đã được thay đổi ở phiên khác. Đồng bộ lại rồi thử lại."));return@runOnUiThread};box.addView(employeeCard(e));box.addView(gap(6));box.addView(details(listOf("PDA hiện tại" to serial,"Ca" to dash(ses.optString("shift")),"Công việc trong ca" to workInShiftText(ctx))));box.addView(gap(7));val pdas=MasterDataCache.resourceOptions(this).optJSONArray("pdas")?:JSONArray();val newPda=pdaInput(pdas,serial);box.addView(labelled("PDA mới",newPda));box.addView(gap(7));val actions=row(bg);val change=smallButton("ĐỔI PDA",teal);val giveBack=smallButton("TRẢ PDA",orange);actions.addView(change,LinearLayout.LayoutParams(0,dp(44),1f).apply{marginEnd=dp(3)});actions.addView(giveBack,LinearLayout.LayoutParams(0,dp(44),1f).apply{marginStart=dp(3)});box.addView(actions,matchWrap())\n        fun mutate(nextPda:String,kind:String,why:String){val p=JSONObject().put("session_id",ses.optString("session_id")).put("mnv",mnv).put("shift",ses.optString("shift")).put("work_choice",ses.optString("work_choice")).put("pda_serial",nextPda).put("user_pick",ses.optString("user_pick")).put("pack_table",ses.optString("pack_table")).put("user_pack",ses.optString("user_pack")).put("resource_note",ses.optString("resource_note")).put("preserve_work_choice",true).put("mutation_kind","EDIT").put("audit_note","$kind PDA • $why").put("idempotency_key",UUID.randomUUID().toString());api.call("session_work_update",p){x->runOnUiThread{if(handleAuth(x))return@runOnUiThread;if(!x.ok)showError(x.error?:"Không cập nhật được PDA")else{TopNotice.show(this,"Đã ${if(kind=="Đổi")"đổi" else "trả"} PDA và lưu lịch sử.",TopNotice.Kind.SUCCESS);foregroundSync.requestSync();load()}}}}\n        change.setOnClickListener{val next=resolvePda(pdas,newPda.text.toString());if(next==null||next==serial){showError("Chọn PDA mới khác PDA hiện tại.");return@setOnClickListener};chooseReason("Lý do đổi PDA",changeReasons){mutate(next,"Đổi",it)}};giveBack.setOnClickListener{chooseReason("Lý do trả PDA",returnReasons){mutate("","Trả",it)}}\n        }}}}}\n        bindScannerEnter(serialField){load()};body.addView(gap(7));body.addView(primary("TÌM PDA",navy){load()},matchWrap());attach(root,body);serialField.requestFocus()\n    }\n\n'''
