name: Service Post Deploy Health

on:
  pull_request:
    branches:
      - ci/service-ra-projection-gate-20260823
    paths:
      - 'ops/service-post-deploy-health-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'diag/service-post-deploy-health-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production health read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --silent --show-error --max-time 20 \
            https://pickpack.1291.workers.dev/health \
            -o out/health.json
          python3 - <<'PY'
          import json
          p='out/health.json'
          j=json.load(open(p,encoding='utf-8'))
          assert j.get('ok') is True, j
          assert j.get('service')=='pickpack', j
          assert j.get('generation')=='m2-prod-reset-20260823-001', j
          a=j.get('authority') or {}
          assert int(a.get('authority_epoch',-1))==9, a
          assert a.get('mode')=='SERVICE_PRIMARY', a
          assert a.get('scope')=='PRODUCTION', a
          assert a.get('service_generation')=='m2-prod-reset-20260823-001', a
          r=j.get('replication') or {}
          assert r.get('state')=='HEALTHY', r
          assert int(r.get('pending_count',-1))==0, r
          assert int(r.get('failed_unresolved_count',0))==0, r
          assert int(r.get('drift_candidate_count',0))==0, r
          assert j.get('health_reason')=='CLEAN', j
          print(json.dumps(j,ensure_ascii=False,indent=2))
          PY
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "endpoint=https://pickpack.1291.workers.dev/health"
            echo "authority_epoch=9"
            echo "service_generation=m2-prod-reset-20260823-001"
            echo "authority_mode=SERVICE_PRIMARY"
            echo "replication=HEALTHY"
            echo "pending=0"
            echo "verdict=PASS"
          } > out/receipt.txt

      - name: Upload read-only health evidence
        uses: actions/upload-artifact@v4
        with:
          name: service-post-deploy-health
          path: out/*
          retention-days: 14
