name: OWNER scope continuity technical pass

on:
  push:
    branches:
      - 'control/owner-scope-continuity-v2-20260905'
    paths:
      - '.github/workflows/owner-scope-continuity-tech-pass.yml'

permissions:
  contents: write

env:
  CONTINUITY_BRANCH: release/beta127-owner-r2-complete-20260905

jobs:
  finalize-control-plane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml

      - name: Apply deterministic continuity finalizer
        run: python3 tools/owner_scope_continuity_finalize.py

      - name: OWNER scope guard self-test
        run: python3 tools/owner_scope_guard.py --self-test

      - name: OWNER scope negative regression
        run: python3 tools/owner_scope_guard_regression.py

      - name: OWNER scope drift and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --base-ref "origin/${CONTINUITY_BRANCH}"
          python3 tools/owner_scope_guard.py --bootstrap

      - name: Existing control-plane guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/owner_acceptance_ledger_guard.py --self-test
          python3 tools/public_repo_secret_guard.py --self-test
          python3 tools/public_repo_secret_guard.py --base-ref "origin/${CONTINUITY_BRANCH}"
          python3 tools/beta_current_sync_contract.py

      - name: Finalizer and invariant contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/finalize_beta83.sh
          bash -n tools/beta83_release_handoff_finalizer.sh
          grep -q 'OWNER_SCOPE_SEMANTICS_SHA' tools/finalize_beta83.sh
          grep -q 'owner_scope_semantics_sha256' tools/finalize_beta83.sh
          grep -q 'owner_scope_semantics_sha256' tools/beta83_release_handoff_finalizer.sh
          grep -q 'OWNER-SCOPE-CONTINUITY-001' qa/stable_invariants.yml
          grep -q 'OWNER-SCOPE-CONTINUITY-001' docs/STABLE_INVARIANTS.md
          grep -q -x 'WAIT_FOR_OWNER_ACCEPTANCE_OWNER_SCOPE_CONTINUITY_001' <(awk '/^## NEXT_ACTION/{getline; print}' docs/handovers/HANDOVER_CURRENT.md)
          git diff --quiet "origin/${CONTINUITY_BRANCH}" -- app service google-apps-script

      - name: Commit and remote readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools docs qa ops CURRENT_STATE.md
          git commit -m '[skip ci] control-plane: OWNER scope continuity Technical PASS'
          FINAL=$(git rev-parse HEAD)
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git fetch origin "${GITHUB_REF_NAME}" --quiet
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$FINAL"
          test "$(git show "origin/${GITHUB_REF_NAME}:ops/OWNER_SCOPE_CURRENT.json" | jq -r '.governance.status')" = 'TECHNICAL_PASS_AWAITING_OWNER'
          test "$(git show "origin/${GITHUB_REF_NAME}:CURRENT_STATE.md" | awk -F': ' '/^- next_action:/{print $2}')" = 'WAIT_FOR_OWNER_ACCEPTANCE_OWNER_SCOPE_CONTINUITY_001'
          git show "origin/${GITHUB_REF_NAME}:ops/OWNER_SCOPE_CURRENT.json" | jq -e '.semantics_sha256|length==64' >/dev/null
          git show "origin/${GITHUB_REF_NAME}:ops/OWNER_SCOPE_CURRENT.json" | jq -e '.scope_sha256|length==64' >/dev/null
