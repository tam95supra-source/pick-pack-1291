name: Service S64 PR Validation

on:
  pull_request:
    branches: [ agent/service-s63-resource-owner-lease-fix-20260824 ]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/service-s64-session-resource-model-20260824'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize S62 S63 S64
        run: |
          set -euo pipefail
          python3 tools/apply_service_s62_session_authority_fix.py
          python3 tools/apply_service_s63_resource_owner_lease_fix.py
          python3 tools/apply_service_s64_session_resource_model.py
          python3 tools/apply_service_s64_finalize.py
          grep -F '/v1/session/resources/mutate' service/src/entry_product.ts
          grep -F '/v1/session/model-version' service/src/entry_product.ts
          grep -F 'session_resource_assignments' service/src/session_resources_v64.ts
      - name: Typecheck
        working-directory: service
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Static business-rule assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('service/src/session_resources_v64.ts').read_text()
          assert 'PACK_MAPPING_INVALID' not in s
          assert 'resource_pack_map' not in s
          assert 'session_version_claims' in s
          assert 'state==="VOID"' in s
          assert 'duplicate_user' in s
          assert 'activeByMnv' in s
          m=Path('service/migrations/0007_session_resource_model_v64.sql').read_text()
          assert 'session_resource_assignments' in m
          assert 'session_positions' in m
          assert 'session_version_claims' in m
          h=Path('service/src/session_hotfix.ts').read_text()
          assert 'ATTENDANCE_SESSION_REQUIRED' in h
          assert 'deletedResources' in h and 'deletedPositions' in h
          e=Path('service/src/entry_product.ts').read_text()
          assert 'S64_SESSION_MULTI_POSITION_MULTI_RESOURCE' in e
          print('S64_BUSINESS_RULE_STATIC_PASS')
          PY
