name: Beta Stable data isolation audit
on:
  push:
    branches:
      - 'release/audit-beta104-stable-private-20260831'
    paths:
      - tools/beta_stable_data_isolation_audit.py
      - .github/workflows/beta-stable-data-isolation-audit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: beta-stable-data-isolation-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate audit verifier
        run: python3 -m py_compile tools/beta_stable_data_isolation_audit.py
      - name: Run reversible data isolation matrix
        run: python3 tools/beta_stable_data_isolation_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-stable-data-isolation-${{ github.run_id }}
          path: /tmp/beta-stable-data-isolation.json
          retention-days: 90
          if-no-files-found: error
