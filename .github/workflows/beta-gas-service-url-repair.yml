name: Beta GAS service URL repair

on:
  push:
    branches:
      - 'release/**'
    paths:
      - ops/beta-gas-service-url-repair-request.json

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate repair harness
        shell: bash
        run: python3 -m py_compile tools/beta_gas_service_url_repair.py
      - name: Get Apps Script access token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS --connect-timeout 15 --max-time 30 https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token)
          ACCESS_TOKEN=$(jq -r '.access_token//empty' <<<"$TOKEN_JSON")
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          printf 'ACCESS_TOKEN=%s\n' "$ACCESS_TOKEN" >> "$GITHUB_ENV"
      - name: Repair BETA GAS service discovery property with source/deployment recovery
        shell: bash
        run: python3 tools/beta_gas_service_url_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-gas-service-url-repair-${{ github.run_id }}
          path: /tmp/beta-gas-service-url-repair.json
          retention-days: 30
          if-no-files-found: error
