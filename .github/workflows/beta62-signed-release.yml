name: Beta62 Signed Release Gate

on:
  pull_request:
    branches: [ ci/beta62-signed-release-base-20260823 ]

permissions:
  contents: write
  actions: read

concurrency:
  group: beta62-signed-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    if: github.event.pull_request.head.ref == 'release/beta62-signed-trigger-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: a1d351ef0448e824a1b08d0675da555bf0ede534
      TARGET_VERSION: 0.4.2-beta.62
      TARGET_CODE: '68'
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1d351ef0448e824a1b08d0675da555bf0ede534
          fetch-depth: 0
      - name: Lock exact source and versions
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('app/build.gradle.kts').read_text()
          beta=re.search(r'create\("beta"\)\s*\{(.*?)\n\s*\}',s,re.S).group(1)
          stable=re.search(r'create\("stable"\)\s*\{(.*?)\n\s*\}',s,re.S).group(1)
          assert re.search(r'versionName\s*=\s*"0\.4\.2-beta\.62"',beta)
          assert re.search(r'versionCode\s*=\s*68',beta)
          assert re.search(r'versionName\s*=\s*"0\.1\.0-stable"',stable)
          assert re.search(r'versionCode\s*=\s*1',stable)
          print('VERSION_LOCK=PASS')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Beta release and Stable release validation
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease
      - name: Verify package/version metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          "$BT/aapt" dump badging "$BETA" > /tmp/beta.txt
          "$BT/aapt" dump badging "$STABLE" > /tmp/stable.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='68'" /tmp/beta.txt
          grep -q "versionName='0.4.2-beta.62'" /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable.txt
          grep -q "versionCode='1'" /tmp/stable.txt
          grep -q "versionName='0.1.0-stable'" /tmp/stable.txt
      - name: Sign exact Beta62 APK and verify owner certificate
        id: sign
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist
          APK_NAME="pick-pack-1291-public-beta-$TARGET_VERSION.apk"
          OUT="dist/$APK_NAME"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$OUT")
          printf '%s  %s\n' "$SHA" "$APK_NAME" > "dist/SHA256SUMS-$TARGET_VERSION.txt"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
      - name: Upload signed candidate artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-${{ env.TARGET_VERSION }}-signed-validation
          path: dist/*
          retention-days: 14
      - name: Publish immutable Beta62 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.sign.outputs.apk_name }}
          APK_SHA: ${{ steps.sign.outputs.apk_sha }}
          APK_SIZE: ${{ steps.sign.outputs.apk_size }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v${TARGET_VERSION}-publicbeta"
          cat > /tmp/release-notes.txt <<EOF
          Pick Pack 1291 Beta ${TARGET_VERSION}

          PP_CHANNEL=BETA
          PP_VERSION=${TARGET_VERSION}
          PP_VERSION_CODE=${TARGET_CODE}
          PP_SHA256=${APK_SHA}
          PP_SIZE=${APK_SIZE}
          PP_SIGNER_SHA256=${EXPECTED_SIGNER_SHA256}
          PP_APK_NAME=${APK_NAME}
          PP_MANDATORY=false
          PP_SOURCE_SHA=${SOURCE_SHA}
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pick Pack 1291 ${TARGET_VERSION}" --notes-file /tmp/release-notes.txt --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Pick Pack 1291 ${TARGET_VERSION}" --notes-file /tmp/release-notes.txt --prerelease
          fi
          gh release upload "$TAG" "dist/$APK_NAME#$APK_NAME" "dist/SHA256SUMS-$TARGET_VERSION.txt#SHA256SUMS-$TARGET_VERSION.txt" --repo "$GITHUB_REPOSITORY" --clobber
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$URL" -o /tmp/release.apk
          [[ "$(sha256sum /tmp/release.apk | awk '{print $1}')" == "$APK_SHA" ]]
          [[ "$(stat -c '%s' /tmp/release.apk)" == "$APK_SIZE" ]]
          printf 'verdict=PASS\nsource_sha=%s\nrun_id=%s\nartifact_id=%s\nversion=%s\nversion_code=%s\napk_name=%s\napk_sha256=%s\napk_size=%s\nsigner_sha256=%s\nrelease_tag=%s\nrelease_url=%s\nstable=UNTOUCHED\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "${{ steps.artifact.outputs.artifact-id }}" "$TARGET_VERSION" "$TARGET_CODE" "$APK_NAME" "$APK_SHA" "$APK_SIZE" "$EXPECTED_SIGNER_SHA256" "$TAG" "$URL" | tee /tmp/beta62-release-receipt.txt
      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: beta62-release-receipt
          path: /tmp/beta62-release-receipt.txt
          retention-days: 30
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
