name: Beta121 owner partial acceptance

on:
  push:
    branches:
      - 'release/beta121-owner-ui-pda-source-20260905'
    paths:
      - .github/workflows/beta121-owner-partial-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta121-owner-partial-acceptance
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/beta121-owner-ui-pda-source-20260905
          fetch-depth: 0
      - name: Record on release continuity branch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta121_record_owner_partial_acceptance.py .
          python3 tools/owner_acceptance_ledger_guard.py --base-ref HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md docs/STABLE_INVARIANTS.md docs/handovers/HANDOVER_CURRENT.md ops/beta-release-request.json ops/owner-acceptance-current.json ops/beta121-owner-acceptance-partial.json qa/stable_invariants.yml
          git diff --cached --quiet || git commit -m '[skip ci] record Beta121 OWNER partial acceptance 1/3 OK 2/4 pending'
          REL=$(git rev-parse HEAD)
          git push origin HEAD:release/beta121-owner-ui-pda-source-20260905
          echo "RELEASE_ACCEPTANCE_SHA=$REL"
      - name: Checkout canonical beta current
        uses: actions/checkout@v4
        with:
          ref: beta/current
          path: current
          fetch-depth: 0
      - name: Record canonical beta current
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git -C current rev-parse HEAD)
          python3 tools/beta121_record_owner_partial_acceptance.py current
          (cd current && python3 tools/owner_acceptance_ledger_guard.py --base-ref "$BASE")
          git -C current config user.name 'github-actions[bot]'
          git -C current config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C current add CURRENT_STATE.md docs/STABLE_INVARIANTS.md docs/handovers/HANDOVER_CURRENT.md ops/beta-release-request.json ops/owner-acceptance-current.json ops/beta121-owner-acceptance-partial.json qa/stable_invariants.yml
          git -C current diff --cached --quiet || git -C current commit -m '[skip ci] record Beta121 OWNER partial acceptance 1/3 OK 2/4 pending'
          CUR=$(git -C current rev-parse HEAD)
          git -C current push origin HEAD:beta/current
          git -C current fetch origin beta/current --quiet
          test "$(git -C current rev-parse origin/beta/current)" = "$CUR"
          test "$(jq -r '.checklist.revision' current/ops/owner-acceptance-current.json)" = 2
          test "$(jq -r '.checklist.items[0].status' current/ops/owner-acceptance-current.json)" = OWNER_OK
          test "$(jq -r '.checklist.items[1].status' current/ops/owner-acceptance-current.json)" = OWNER_NOT_OK
          test "$(jq -r '.checklist.items[2].status' current/ops/owner-acceptance-current.json)" = OWNER_OK
          test "$(jq -r '.checklist.items[3].status' current/ops/owner-acceptance-current.json)" = OWNER_NOT_OK
          echo "CANONICAL_ACCEPTANCE_SHA=$CUR"
