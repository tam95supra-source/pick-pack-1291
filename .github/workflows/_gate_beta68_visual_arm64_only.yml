name: Beta68 exact-source visual ARM64 only
on:
  push:
    branches: [ agent/beta68-from-beta66-20260824 ]
    paths: [ '.github/workflows/_gate_beta68_visual_arm64_only.yml' ]
permissions:
  contents: write
  actions: read
concurrency:
  group: beta68-exact-source-visual-arm64
  cancel-in-progress: true
jobs:
  visual:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '32748150618'
      DEBUG_ARTIFACT_ID: '9527993589'
      SOURCE_SHA: afd320af178ed36e67ace7f435d881b0c853c468
    steps:
      - uses: actions/checkout@v4
      - name: Persist start receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > ops/beta68-visual-arm64-start.txt <<EOF
          run_id=$GITHUB_RUN_ID
          source_run_id=$SOURCE_RUN_ID
          source_sha=$SOURCE_SHA
          debug_artifact_id=$DEBUG_ARTIFACT_ID
          runtime=macos-14_api29_arm64-v8a
          state=STARTED
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-visual-arm64-start.txt
          git commit -m 'ops: record Beta68 ARM64 visual run start'
          git push origin HEAD:agent/beta68-from-beta66-20260824
      - name: Download exact debug APK from locked candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$DEBUG_ARTIFACT_ID/zip" -o /tmp/debug.zip
          mkdir -p visual-input
          unzip -q /tmp/debug.zip -d visual-input
          test -s visual-input/app-beta-debug.apk
      - name: Capture login matrix API29 ARM64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -euo pipefail
            mkdir -p visual
            adb install -r visual-input/app-beta-debug.apk >/dev/null
            for spec in '320x568:160:login-320x568.png' '360x640:160:login-360x640.png' '480x800:240:login-480x800.png'; do
              IFS=: read -r size density name <<< "$spec"
              adb shell wm size "$size"
              adb shell wm density "$density"
              adb shell am force-stop vn.pickpack1291.app.beta.publicbeta
              adb shell am start -W -n vn.pickpack1291.app.beta.publicbeta/vn.pickpack1291.app.beta.FullBetaActivity >/dev/null
              sleep 2
              adb exec-out screencap -p > "visual/$name"
            done
      - name: Verify screenshot dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          exp={'login-320x568.png':(320,568),'login-360x640.png':(360,640),'login-480x800.png':(480,800)}
          for n,d in exp.items():
              b=(Path('visual')/n).read_bytes()
              assert len(b)>5000 and b[:8]==b'\x89PNG\r\n\x1a\n', n
              got=struct.unpack('>II',b[16:24]); assert got==d,(n,got,d)
              print(n,got,len(b))
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: beta68-login-visual-arm64
          path: visual/*.png
          retention-days: 30
          if-no-files-found: error
      - name: Persist visual evidence receipt
        shell: bash
        env:
          VISUAL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          cat > ops/beta68-visual-arm64-result.txt <<EOF
          verdict=PASS_FILES
          run_id=$GITHUB_RUN_ID
          source_run_id=$SOURCE_RUN_ID
          source_sha=$SOURCE_SHA
          debug_artifact_id=$DEBUG_ARTIFACT_ID
          visual_artifact_id=$VISUAL_ARTIFACT_ID
          matrix=320x568,360x640,480x800
          runtime=macos-14_api29_arm64-v8a
          human_inspection=PENDING
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-visual-arm64-result.txt
          git commit -m 'ops: record Beta68 ARM64 visual files PASS'
          git push origin HEAD:agent/beta68-from-beta66-20260824
