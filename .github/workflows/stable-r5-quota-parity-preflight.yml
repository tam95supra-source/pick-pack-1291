name: Stable R5 quota parity preflight

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    paths:
      - .github/workflows/stable-r5-quota-parity-preflight.yml
      - config/stable_r5_parity.json
      - ops/OWNER_SCOPE_CURRENT.json
      - ops/stable-private-provision-request.json
      - tools/owner_scope_guard.py
      - tools/owner_scope_guard_v2.py
      - tools/r5_stable_parity_guard.py
      - tools/stable_private_provision.py
      - service/src/quota_budget.ts
      - service/src/stable_sheet_bridge.ts
      - service/src/core.ts
      - service/src/sync_contract.ts
      - service/src/push.ts
      - service/src/d1_maintenance.ts
      - service/src/entry_product.ts
      - service/migrations/0015_r5_quota_realtime_revision.sql
      - service/migrations/0016_r5_background_terminal.sql
      - service/migrations/0017_r5_quota_budget.sql
      - service/migrations/0018_r5_gas_operation_budget.sql
      - app/build.gradle.kts

permissions:
  contents: read

concurrency:
  group: stable-r5-quota-parity-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Canonical scope and Stable READY_NOT_LIVE guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stable-r5-preflight
          python3 tools/owner_scope_guard.py --bootstrap
          jq -e '.requirements[] | select(.requirement_id=="R5-15" and .invariant_id=="QUOTA-REALTIME-DELTA-001" and .state=="LOCKED_REQUIREMENT_PENDING_FIX")' ops/OWNER_SCOPE_CURRENT.json >/dev/null
          python3 tools/r5_stable_parity_guard.py
          test "$(jq -r '.status' config/stable_r5_parity.json)" = "READY_NOT_LIVE"
          test "$(jq -r '.deploy_now' config/stable_r5_parity.json)" = "false"
          test "$(jq -r '.activation' config/stable_r5_parity.json)" = "OWNER_PROMOTE_ONLY"
      - name: Private Stable scheduler is idle by construction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stable_private_provision.py
          python3 - <<'PY'
          import importlib.util, json, pathlib
          p=pathlib.Path('tools/stable_private_provision.py')
          spec=importlib.util.spec_from_file_location('stable_private_provision',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          req=json.loads(pathlib.Path('ops/stable-private-provision-request.json').read_text())
          crons,sampling,profile=m.scheduler_profile(req)
          assert req['lifecycle_target']=='READY_NOT_LIVE'
          assert req['stable_public_activation'] is False
          assert profile=='PRIVATE_IDLE' and crons==[]
          assert 0 <= sampling < 1
          assert req.get('activation_crons'), 'ACTIVATION_CRONS_MISSING'
          print(json.dumps({'status':'PASS','profile':profile,'crons':crons,'sampling':sampling,'activation_crons_configured':True}))
          PY
      - name: Compile shared Service and Stable Android runtime
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix service install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm --prefix service run check
          gradle :app:compileStableDebugKotlin --no-daemon --stacktrace
      - name: Apply complete Stable schema locally only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stable-r5-d1-local && mkdir -p /tmp/stable-r5-d1-local
          (cd service && npx wrangler d1 migrations apply DB --local --persist-to /tmp/stable-r5-d1-local --config wrangler.jsonc) | tee /tmp/stable-r5-migrations.log
          grep -q '0015_r5_quota_realtime_revision.sql' /tmp/stable-r5-migrations.log
          grep -q '0016_r5_background_terminal.sql' /tmp/stable-r5-migrations.log
          grep -q '0017_r5_quota_budget.sql' /tmp/stable-r5-migrations.log
          grep -q '0018_r5_gas_operation_budget.sql' /tmp/stable-r5-migrations.log
          ! grep -qi 'incomplete input' /tmp/stable-r5-migrations.log
      - name: Quota limiter fail-closed locally
        shell: bash
        run: |
          set -euo pipefail
          cd service
          npx wrangler d1 execute DB --local --persist-to /tmp/stable-r5-d1-local --config wrangler.jsonc --command "INSERT INTO quota_usage(window_key,metric,used,hard_limit) SELECT 'STABLE_PREFLIGHT','GOOGLE_SHEETS_DAILY',250,hard_limit FROM quota_policy WHERE metric='GOOGLE_SHEETS_DAILY';" >/dev/null
          set +e
          npx wrangler d1 execute DB --local --persist-to /tmp/stable-r5-d1-local --config wrangler.jsonc --command "UPDATE quota_usage SET used=251 WHERE window_key='STABLE_PREFLIGHT' AND metric='GOOGLE_SHEETS_DAILY';" >/tmp/stable-r5-over.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -qi 'constraint\|quota_hard_limit' /tmp/stable-r5-over.log
      - name: Prove preflight cannot deploy or bind Beta resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/stable-r5-quota-parity-preflight.yml').read_text()
          forbidden=[
            'CLOUDFLARE_'+'API_TOKEN',
            'GOOGLE_'+'OAUTH',
            '--'+'remote',
            'wrangler'+' deploy',
            'gh release'+' create',
          ]
          found=[x for x in forbidden if x in text]
          assert not found, 'CLOUD_MUTATION_SURFACE:'+','.join(found)
          PY
          python3 tools/r5_stable_parity_guard.py
          test "$(jq -r '.environment_id' config/stable_r5_parity.json)" = "STABLE"
          test "$(jq -r '.service_audience' config/stable_r5_parity.json)" = "PICK_PACK_1291_STABLE"
          test "$(jq -r '.deploy_now' config/stable_r5_parity.json)" = "false"
          test "$(jq -r '.activation' config/stable_r5_parity.json)" = "OWNER_PROMOTE_ONLY"
      - name: Write machine-readable preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg scope_sha "$(jq -r '.scope_sha256' ops/OWNER_SCOPE_CURRENT.json)" \
            '{status:"PASS",evidence_class:"LOCAL_RUNTIME",channel:"STABLE",activation:"OWNER_PROMOTE_ONLY",deploy_now:false,source_sha:$source_sha,owner_scope_sha256:$scope_sha,service_compile:"PASS",stable_android_compile:"PASS",local_migrations:"PASS",quota_fail_closed:"PASS",gas_operation_budget_schema:"PASS",private_idle_scheduler:"PASS",isolation_static:"PASS",cloud_runtime:"NOT_VERIFIED"}' \
            > /tmp/stable-r5-preflight/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-r5-quota-parity-preflight-${{ github.run_id }}
          path: /tmp/stable-r5-preflight
          retention-days: 90
          if-no-files-found: warn
