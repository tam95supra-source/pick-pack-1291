name: Beta118 publish preflight repair

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-publish-preflight-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair publish harness only
        run: |
          python3 tools/beta118_publish_preflight_repair.py
          bash -n tools/beta83_publish_ota.sh
          git diff --check
      - name: Commit harness repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/beta83_publish_ota.sh
          git commit -m 'fix(beta118): verify rollback baseline candidate source'
          git push origin HEAD:release/beta118-owner-realtime-bulk-exit-20260904
