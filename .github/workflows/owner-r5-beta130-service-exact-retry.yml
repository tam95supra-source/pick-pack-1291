name: Owner R5 Beta130 exact service retry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-r5-production-service-writer
  cancel-in-progress: false
jobs:
  service-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap canonical scope and exact-byte fences
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          SOURCE_SHA=$(jq -er '.source_sha' ops/beta-release-request.json)
          BASE_SOURCE_SHA=$(jq -er '.base_source_sha' ops/beta-release-request.json)
          SCOPE_ID=$(jq -er '.scope_id' ops/OWNER_SCOPE_CURRENT.json)
          SCOPE_REV=$(jq -er '.revision' ops/OWNER_SCOPE_CURRENT.json)
          SCOPE_SHA=$(jq -er '.scope_sha256' ops/OWNER_SCOPE_CURRENT.json)
          SEMANTICS_SHA=$(jq -er '.semantics_sha256' ops/OWNER_SCOPE_CURRENT.json)
          LEDGER_HEAD=$(jq -er '.ledger_head_hash' ops/OWNER_SCOPE_CURRENT.json)
          test "$(jq -r '.owner_scope' ops/beta-release-request.json)" = "$SCOPE_ID"
          test "$(jq -r '.owner_checklist_revision' ops/beta-release-request.json)" = "$SCOPE_REV"
          test "$(jq -r '.owner_scope_sha256' ops/beta-release-request.json)" = "$SCOPE_SHA"
          test "$(jq -r '.owner_scope_semantics_sha256' ops/beta-release-request.json)" = "$SEMANTICS_SHA"
          test "$(jq -r '.owner_command_ledger_head' ops/beta-release-request.json)" = "$LEDGER_HEAD"
          test "$(jq -r '.candidate_locked' ops/beta-release-request.json)" = true
          test "$(jq -r '.live' ops/beta-release-request.json)" = false
          jq -e '.requirements[] | select(.requirement_id=="R5-15" and .state=="LOCKED_REQUIREMENT_PENDING_FIX")' ops/OWNER_SCOPE_CURRENT.json >/dev/null
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$BASE_SOURCE_SHA^{commit}"
          git diff --quiet "$SOURCE_SHA" HEAD -- app service google-apps-script
          echo "SERVICE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SERVICE_SOURCE_SHA=$BASE_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Patch quota and dynamic-runtime service gate in runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r5_quota_aware_service_gate_patch.py
          python3 tools/r5_dynamic_runtime_service_gate_patch.py
          bash -n tools/beta89_service_live_gate.sh
          bash -n tools/r5_service_convergence_gate.sh
          bash -n tools/r5_resolve_beta_live_runtime.sh
          bash -n tools/r5_exact_base_service_recovery.sh
          git diff --check
          test -z "$(git diff --name-only -- app service google-apps-script)"
      - name: Exact labor clock regression without network
        run: node --experimental-vm-modules tools/r5_labor_clock_regression.mjs /tmp/r5-labor-clock/receipt.json
      - name: Read-only Workers plan preflight before any deployment
        run: python3 tools/r5_free_plan_preflight.py /tmp/r5-plan-preflight/receipt.json
      - name: Typecheck exact service source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf service/node_modules service/package-lock.json service/.wrangler service/worker-configuration.d.ts service/wrangler.live.jsonc
          npm --prefix service install --include=dev --ignore-scripts --no-audit --no-fund
          test -x service/node_modules/.bin/wrangler
          test -d service/node_modules/fflate
          npm --prefix service run check
      - name: Resolve Beta LIVE runtime bindings read-only
        shell: bash
        run: |
          set -euo pipefail
          R5_RUNTIME_DIR=/tmp/r5-beta-live-runtime bash tools/r5_resolve_beta_live_runtime.sh
      - name: Deploy and verify exact service with canonical automatic recovery
        shell: bash
        run: |
          set +e
          set -uo pipefail
          bash tools/beta89_service_live_gate.sh
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            echo "Exact candidate service gate failed; restoring exact base service" >&2
            R5_RECOVERY_DIR=/tmp/r5-exact-base-service-recovery bash tools/r5_exact_base_service_recovery.sh || exit 97
            exit "$rc"
          fi
      - name: Upload exact service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta130-exact-service-${{ github.run_id }}
          path: |
            /tmp/beta89-service-live
            /tmp/r5-beta-live-runtime
            /tmp/r5-exact-base-service-recovery
            /tmp/r5-labor-clock
            /tmp/r5-plan-preflight
          retention-days: 30
          if-no-files-found: error
