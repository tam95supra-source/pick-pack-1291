name: Owner R5 Beta130 exact service retry
on:
  push:
    branches: [release/beta130-r5-rev6-20260906]
    paths:
      - .github/workflows/owner-r5-beta130-service-exact-retry.yml
permissions:
  contents: read
concurrency:
  group: owner-r5-beta130-exact-service-retry
  cancel-in-progress: false
jobs:
  service-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap and exact-byte fences
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          SOURCE_SHA=$(jq -er '.source_sha' ops/beta-release-request.json)
          BASE_SOURCE_SHA=$(jq -er '.base_source_sha' ops/beta-release-request.json)
          test "$(jq -r '.owner_scope' ops/beta-release-request.json)" = OWNER_20260906_R5_QUOTA_REALTIME
          test "$(jq -r '.owner_checklist_revision' ops/beta-release-request.json)" = 6
          test "$(jq -r '.candidate_locked' ops/beta-release-request.json)" = true
          test "$(jq -r '.live' ops/beta-release-request.json)" = false
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$BASE_SOURCE_SHA^{commit}"
          git diff --quiet "$SOURCE_SHA" HEAD -- app service google-apps-script
          echo "SERVICE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SERVICE_SOURCE_SHA=$BASE_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Patch transient-safe diagnostic harness in runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/beta89_service_live_gate.sh')
          s=p.read_text(encoding='utf-8')
          anchors=[
            'META=$(curl -fsS -H "Authorization: Bearer $GOOGLE_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$OUTBOUND_SHEET_ID?fields=sheets.properties(sheetId,title)")',
            'curl -fsS -H "Authorization: Bearer $GOOGLE_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$OUTBOUND_SHEET_ID/values/\'Nh%E1%BA%ADn%20h%C3%A0ng%20r%E1%BB%9Bt\'!A${BASE_ROW}:H${BASE_ROW}" > "$D/baseline-readback.json"',
            'curl -fsS -H "Authorization: Bearer $GOOGLE_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$OUTBOUND_SHEET_ID/values/\'Nh%E1%BA%ADn%20h%C3%A0ng%20r%E1%BB%9Bt\'!A2:H" > "$D/gsheet-drop-readback.json"',
            'curl -fsS -H "Authorization: Bearer $GOOGLE_TOKEN" "https://sheets.googleapis.com/v4/spreadsheets/$OUTBOUND_SHEET_ID/values/\'V%E1%BB%8B%20tr%C3%AD\'!A2:A" > "$D/gsheet-location-readback.json"',
          ]
          for old in anchors:
              if s.count(old)!=1:
                  raise SystemExit('SHEETS_READ_ANCHOR_COUNT:'+str(s.count(old))+':'+old[:70])
              new=old.replace('curl -fsS ','curl --retry 4 --retry-all-errors --retry-delay 1 -fsS ',1)
              s=s.replace(old,new,1)
          old='[[ "$REPL_OK" == 1 ]] || { echo OUTBOUND_OUTBOX_NOT_SYNCED >&2; exit 8; }'
          diag=[
              'if [[ "$REPL_OK" != 1 ]]; then',
              '  sql "SELECT o.* FROM outbound_replication_outbox o JOIN events e ON e.event_id=o.event_id WHERE e.actor_id=\'$LOGIN\' ORDER BY o.event_id;" > "$D/outbound-outbox-pending.json" || true',
              '  sql "SELECT name,sql FROM sqlite_master WHERE type=\'table\' AND name IN (\'outbound_replication_outbox\',\'sheet_replication_outbox\',\'runtime_config\');" > "$D/outbound-outbox-schema.json" || true',
              '  sql "SELECT config_key,config_value,updated_at FROM runtime_config WHERE upper(config_key) LIKE \'%QUOTA%\' OR upper(config_key) LIKE \'%SHEET%\' OR upper(config_key) LIKE \'%OUTBOX%\' OR upper(config_key) LIKE \'%REPLIC%\';" > "$D/outbound-runtime-config.json" || true',
              '  echo OUTBOUND_OUTBOX_NOT_SYNCED >&2',
              '  exit 8',
              'fi',
          ]
          new='\n'.join(diag)
          if s.count(old)!=1:
              raise SystemExit('OUTBOX_DIAG_ANCHOR_COUNT:'+str(s.count(old)))
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          bash -n tools/beta89_service_live_gate.sh
          git diff --check
          test -z "$(git diff --name-only -- app service google-apps-script)"
      - name: Typecheck exact service source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf service/node_modules service/package-lock.json service/.wrangler service/worker-configuration.d.ts service/wrangler.live.jsonc
          npm --prefix service install --ignore-scripts --no-audit --no-fund
          npm --prefix service run check
      - name: Deploy and verify exact service with clean automatic recovery
        shell: bash
        run: |
          set +e
          set -uo pipefail
          bash tools/beta89_service_live_gate.sh
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            echo "Exact service gate failed; restoring exact base service source" >&2
            rm -rf service/node_modules service/package-lock.json service/.wrangler service/worker-configuration.d.ts service/wrangler.live.jsonc
            git checkout "$BASE_SERVICE_SOURCE_SHA" -- service
            git clean -fd -- service
            npm --prefix service install --ignore-scripts --no-audit --no-fund
            test -d service/node_modules/fflate
            SERVICE_SOURCE_SHA="$BASE_SERVICE_SOURCE_SHA" bash tools/beta78_service_live_gate.sh || exit 97
            exit "$rc"
          fi
      - name: Upload exact service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta130-exact-service-${{ github.run_id }}
          path: /tmp/beta89-service-live
          retention-days: 30
          if-no-files-found: error
