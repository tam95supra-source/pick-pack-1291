name: Beta63 Materialize and Compile

on:
  push:
    branches:
      - agent/beta63-login-perf-session-mutation-fix-20260824
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta63-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Materialize Beta63 source
        run: python3 tools/apply_beta63_login_perf_session.py

      - name: Semantic release guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 69' app/build.gradle.kts
          grep -F 'versionName = "0.4.2-beta.63"' app/build.gradle.kts
          grep -F 'versionCode = 1' app/build.gradle.kts
          grep -F 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -F 'R.drawable.login_vietnam_bg' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -F 'R.drawable.login_supra_logo' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -F 'fun logoutFast()' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -F 'm2Runtime.ensureServiceSession(newToken, force = false)' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -F 'while(result.code==409 && result.error=="SESSION_WORK_CONFLICT" && retry<2)' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          if grep -Fq 'm2Transport.loginFromPassword(login, password)' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt; then
            echo 'Duplicate password-based Service login still present' >&2
            exit 1
          fi

      - name: Compile BetaDebug and StableDebug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleBetaDebug assembleStableDebug

      - name: Commit exact materialized product source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          if git diff --cached --quiet; then
            echo 'Materialized source already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(beta63): materialize login performance and mutation fixes [skip ci]'
          git push origin HEAD:agent/beta63-login-perf-session-mutation-fix-20260824
