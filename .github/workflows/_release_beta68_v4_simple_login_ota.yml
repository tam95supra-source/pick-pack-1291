name: Beta68 v4 simple-login exact OTA
on:
  push:
    branches: [ release/beta68-exact-20260824 ]
    paths: [ 'ops/TRIGGER_BETA68_V4_RELEASE.txt' ]
permissions:
  contents: write
  actions: read
concurrency:
  group: beta68-v4-exact-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '32754196617'
      ARTIFACT_ID: '9530301628'
      SOURCE_SHA: 63917d672aeced142cacda925300978deef65277
      TARGET_VERSION: 0.4.2-beta.68
      TARGET_CODE: '74'
      TARGET_PACKAGE: vn.pickpack1291.app.beta.publicbeta
      APK_NAME: pick-pack-1291-public-beta-0.4.2-beta.68.apk
      EXPECTED_SHA: 34554a19621be73ebc1e3bd64bef547959f5843f8d0fc902b5bcc8d573cf4641
      EXPECTED_SIZE: '13097861'
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      TAG: v0.4.2-beta.68-publicbeta
      GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require v4 human-inspected visual lock and capture pre-release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/release-result
          : > "$OUT"
          grep -qx 'verdict=PASS' ops/beta68-v4-visual-inspection.txt
          grep -qx "source_sha=$SOURCE_SHA" ops/beta68-v4-visual-inspection.txt
          grep -qx "candidate_run_id=$SOURCE_RUN_ID" ops/beta68-v4-visual-inspection.txt
          grep -qx "candidate_artifact_id=$ARTIFACT_ID" ops/beta68-v4-visual-inspection.txt
          grep -qx "apk_sha256=$EXPECTED_SHA" ops/beta68-v4-visual-inspection.txt
          grep -qx "apk_size=$EXPECTED_SIZE" ops/beta68-v4-visual-inspection.txt
          grep -qx 'matrix=320x568,360x640,480x800' ops/beta68-v4-visual-inspection.txt
          grep -qx 'login_model=SIMPLE_APP_THEME_V1' ops/beta68-v4-visual-inspection.txt
          grep -qx 'human_inspection=PASS' ops/beta68-v4-visual-inspection.txt
          MAIN_BEFORE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
          [[ "$MAIN_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/stable-before.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.66"}' > /tmp/beta-before.json
          jq -e '.ok==true' /tmp/beta-before.json >/dev/null
          echo "main_before=$MAIN_BEFORE" >> "$OUT"
          echo "visual_lock=PASS" >> "$OUT"

      - name: Download exact signed candidate artifact and verify immutable bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/release-result
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/candidate.zip
          rm -rf /tmp/candidate && mkdir -p /tmp/candidate
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          APK=$(find /tmp/candidate -type f -name "$APK_NAME" -print -quit)
          [[ -n "$APK" && -s "$APK" ]]
          [[ "$(sha256sum "$APK" | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' "$APK")" == "$EXPECTED_SIZE" ]]
          SUM=$(find /tmp/candidate -type f -name 'SHA256SUMS-*.txt' -print -quit)
          [[ -n "$SUM" ]] && grep -qx "$EXPECTED_SHA  $APK_NAME" "$SUM"
          META=$(find /tmp/candidate -type f -name 'release-meta.json' -print -quit)
          jq -e --arg v "$TARGET_VERSION" --argjson c "$TARGET_CODE" --arg p "$TARGET_PACKAGE" --arg s "$SOURCE_SHA" --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" --arg signer "$EXPECTED_SIGNER_SHA256" '.version_name==$v and .version_code==$c and .package==$p and .source_sha==$s and .apk_sha256==$h and .apk_size==$z and .signer_sha256==$signer and .stable_publish=="FORBIDDEN" and .visual_model=="SIMPLE_APP_THEME_V1"' "$META" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "artifact_exact_bytes=PASS" >> "$OUT"

      - name: Resolve current live Beta Drive parent and OAuth
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/release-result
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do [[ -n "${!v:-}" ]]; done
          TOKEN=$(curl -fsSL -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token | jq -r '.access_token // empty')
          [[ -n "$TOKEN" ]]
          echo "::add-mask::$TOKEN"
          echo "GOOGLE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          CURRENT_URL=$(jq -r '.apk_url // .download_url // .url // empty' /tmp/beta-before.json)
          CURRENT_FILE_ID=$(python3 - "$CURRENT_URL" <<'PY'
          import re,sys
          u=sys.argv[1]
          for p in (r'/d/([A-Za-z0-9_-]+)',r'[?&]id=([A-Za-z0-9_-]+)'):
            m=re.search(p,u)
            if m: print(m.group(1)); break
          else: raise SystemExit('CURRENT_OTA_NOT_DRIVE_URL')
          PY
          )
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files/$CURRENT_FILE_ID?fields=id,name,size,parents,description,appProperties" > /tmp/current-drive.json
          PARENT=$(jq -r '.parents[0] // empty' /tmp/current-drive.json)
          [[ -n "$PARENT" && "$(jq '.parents|length' /tmp/current-drive.json)" == 1 ]]
          echo "BETA_FOLDER_ID=$PARENT" >> "$GITHUB_ENV"
          echo "current_live_file_id=$CURRENT_FILE_ID" >> "$OUT"
          echo "beta_folder_id=$PARENT" >> "$OUT"

      - name: Publish exact candidate to same live Beta Drive folder
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/release-result
          NOTES=$(cat <<'EOF'
          Màn đăng nhập đơn giản, chuyên nghiệp, đồng bộ theme ứng dụng; không dùng nền demo và không tự bật bàn phím khi mở.
          Đổi / Trả PDA chỉ hiển thị PDA đang được sử dụng.
          Hiển thị đúng Dữ liệu người dùng và Bộ nhớ đệm của ứng dụng.
          Bật lại tự động kiểm tra OTA khi mở hoặc quay lại ứng dụng; không polling nền.
          Bổ sung trạng thái chi tiết, chính xác cho Mạng, Đồng bộ và Dịch vụ.
          EOF
          )
          export NOTES
          q=$(python3 - "$BETA_FOLDER_ID" "$APK_NAME" <<'PY'
          import sys,urllib.parse
          folder,name=sys.argv[1],sys.argv[2]
          name=name.replace("'","\\'")
          print(urllib.parse.quote("'%s' in parents and trashed=false and name='%s'"%(folder,name)))
          PY
          )
          curl -fsSL -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files?q=$q&fields=files(id,name,size,parents,description,appProperties)&pageSize=20" > /tmp/target-list.json
          COUNT=$(jq '.files|length' /tmp/target-list.json)
          [[ "$COUNT" -le 1 ]]
          META=$(jq -nc --arg n "$APK_NAME" --arg p "$BETA_FOLDER_ID" --arg d "$NOTES" --arg v "$TARGET_VERSION" --arg c "$TARGET_CODE" --arg h "$EXPECTED_SHA" '{name:$n,parents:[$p],mimeType:"application/vnd.android.package-archive",description:$d,appProperties:{channel:"BETA",version_name:$v,version_code:$c,sha256:$h,notes:$d}}')
          if [[ "$COUNT" == 0 ]]; then
            HDR=$(mktemp)
            curl -fsS -D "$HDR" -o /tmp/upload-init -X POST 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size,parents,description,appProperties' \
              -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json; charset=UTF-8' \
              -H 'X-Upload-Content-Type: application/vnd.android.package-archive' -H "X-Upload-Content-Length: $EXPECTED_SIZE" --data "$META"
            LOC=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");sub(/^location:[[:space:]]*/,"");print;exit}' "$HDR")
            [[ -n "$LOC" ]]
            curl -fsSL -X PUT "$LOC" -H 'Content-Type: application/vnd.android.package-archive' --data-binary @"$APK" > /tmp/target.json
            APK_ID=$(jq -r '.id' /tmp/target.json)
          else
            APK_ID=$(jq -r '.files[0].id' /tmp/target-list.json)
            curl -fsSL -X PATCH -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              "https://www.googleapis.com/drive/v3/files/$APK_ID?fields=id,name,size,parents,description,appProperties" \
              --data "$(jq -nc --arg d "$NOTES" --arg v "$TARGET_VERSION" --arg c "$TARGET_CODE" --arg h "$EXPECTED_SHA" '{description:$d,appProperties:{channel:"BETA",version_name:$v,version_code:$c,sha256:$h,notes:$d}}')" > /tmp/meta-patch.json
            curl -fsSL -X PATCH -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/vnd.android.package-archive' \
              "https://www.googleapis.com/upload/drive/v3/files/$APK_ID?uploadType=media&fields=id,name,size,parents,description,appProperties" --data-binary @"$APK" > /tmp/target.json
          fi
          [[ -n "$APK_ID" ]]
          curl -fsSL -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$APK_ID/permissions?fields=permissions(id,type,role)&supportsAllDrives=true" > /tmp/perms.json
          if ! jq -e '[.permissions[]|select(.type=="anyone" and .role=="reader")]|length>=1' /tmp/perms.json >/dev/null; then
            curl -fsSL -X POST -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Content-Type: application/json' "https://www.googleapis.com/drive/v3/files/$APK_ID/permissions?supportsAllDrives=true&fields=id,type,role" -d '{"type":"anyone","role":"reader"}' > /tmp/perm-created.json
          fi
          curl -fsSL -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$APK_ID?alt=media" -o /tmp/drive-live.apk
          [[ "$(sha256sum /tmp/drive-live.apk | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/drive-live.apk)" == "$EXPECTED_SIZE" ]]
          curl -fsSL -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$APK_ID?fields=id,name,size,parents,description,appProperties" > /tmp/drive-after.json
          [[ "$(jq -r '.parents[0]' /tmp/drive-after.json)" == "$BETA_FOLDER_ID" ]]
          [[ "$(jq -r '.size|tostring' /tmp/drive-after.json)" == "$EXPECTED_SIZE" ]]
          grep -Fq 'Màn đăng nhập đơn giản' <(jq -r '.description' /tmp/drive-after.json)
          echo "APK_ID=$APK_ID" >> "$GITHUB_ENV"
          echo "drive_exact_bytes=PASS" >> "$OUT"
          echo "drive_file_id=$APK_ID" >> "$OUT"

      - name: Publish exact same bytes as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/release-result
          cat > /tmp/release-notes.md <<'EOF'
          ## Beta68
          - Màn đăng nhập đơn giản, chuyên nghiệp, đồng bộ theme ứng dụng; không dùng nền demo và không tự bật bàn phím khi mở.
          - Đổi / Trả PDA chỉ hiển thị PDA đang được sử dụng.
          - Hiển thị đúng Dữ liệu người dùng và Bộ nhớ đệm của ứng dụng.
          - Bật lại tự động kiểm tra OTA khi mở hoặc quay lại ứng dụng; không polling nền.
          - Bổ sung trạng thái chi tiết, chính xác cho Mạng, Đồng bộ và Dịch vụ.

          Exact signed candidate from run 32754196617. Stable is not changed.
          EOF
          printf '%s  %s\n' "$EXPECTED_SHA" "$APK_NAME" > /tmp/SHA256SUMS-0.4.2-beta.68.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n1 "$TAG" 2>/dev/null || true)
            [[ "$TAG_SHA" == "$SOURCE_SHA" ]]
            gh release edit "$TAG" --prerelease --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" "$APK" /tmp/SHA256SUMS-0.4.2-beta.68.txt --clobber
          rm -rf /tmp/github-live && mkdir -p /tmp/github-live
          gh release download "$TAG" -p "$APK_NAME" -D /tmp/github-live
          [[ "$(sha256sum /tmp/github-live/$APK_NAME | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/github-live/$APK_NAME)" == "$EXPECTED_SIZE" ]]
          echo "github_prerelease=PASS" >> "$OUT"
          echo "github_tag=$TAG" >> "$OUT"

      - name: Verify live OTA exact version bytes notes and no Stable/main mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/release-result
          PASS=false
          for n in $(seq 1 20); do
            curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.66"}' > /tmp/ota-old.json
            if jq -e --arg v "$TARGET_VERSION" --argjson c "$TARGET_CODE" --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" '.ok==true and .available==true and .version_name==$v and .version_code==$c and .sha256==$h and .size==$z' /tmp/ota-old.json >/dev/null; then PASS=true; break; fi
            sleep 3
          done
          [[ "$PASS" == true ]]
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.68"}' > /tmp/ota-current.json
          jq -e --arg v "$TARGET_VERSION" --argjson c "$TARGET_CODE" '.ok==true and .available==false and .version_name==$v and .version_code==$c' /tmp/ota-current.json >/dev/null
          LIVE_URL=$(jq -r '.apk_url // .download_url // .url // empty' /tmp/ota-old.json)
          [[ "$LIVE_URL" == *"$APK_ID"* || "$LIVE_URL" == *"drive.google.com"* ]]
          curl -fsSL -L --connect-timeout 15 --max-time 120 "$LIVE_URL" -o /tmp/ota-public.apk
          [[ "$(sha256sum /tmp/ota-public.apk | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/ota-public.apk)" == "$EXPECTED_SIZE" ]]
          NOTES=$(jq -r '.notes // ""' /tmp/ota-old.json)
          printf '%s\n' "$NOTES" > /tmp/live-notes.txt
          NOTE_MODE=LIVE_DETAIL
          if ! grep -Eqi 'PDA|Bộ nhớ|Mạng|Đồng bộ|Dịch vụ|đăng nhập|OTA' /tmp/live-notes.txt; then NOTE_MODE=DRIVE_METADATA_DETAIL; fi
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/stable-after.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/stable-before.json')); b=json.load(open('/tmp/stable-after.json'))
          keys=('source','channel','version_name','version_code','sha256','size','apk_url','available','reason')
          assert {k:a.get(k) for k in keys}=={k:b.get(k) for k in keys},(a,b)
          PY
          MAIN_AFTER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
          MAIN_BEFORE=$(sed -n 's/^main_before=//p' "$OUT")
          [[ "$MAIN_AFTER" == "$MAIN_BEFORE" ]]
          echo "ota_live=PASS" >> "$OUT"
          echo "ota_version=$TARGET_VERSION" >> "$OUT"
          echo "ota_code=$TARGET_CODE" >> "$OUT"
          echo "ota_sha256=$EXPECTED_SHA" >> "$OUT"
          echo "ota_size=$EXPECTED_SIZE" >> "$OUT"
          echo "ota_url=$LIVE_URL" >> "$OUT"
          echo "ota_notes_mode=$NOTE_MODE" >> "$OUT"
          echo "stable_unchanged=PASS" >> "$OUT"
          echo "main_unchanged=PASS" >> "$OUT"

      - name: Persist immutable Beta68 v4 release receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo 'verdict=PASS'
            echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=$SOURCE_SHA"
            echo "candidate_run_id=$SOURCE_RUN_ID"
            echo "candidate_artifact_id=$ARTIFACT_ID"
            echo "beta_name=$TARGET_VERSION"
            echo "beta_code=$TARGET_CODE"
            echo "package=$TARGET_PACKAGE"
            echo "apk_file=$APK_NAME"
            echo "apk_sha256=$EXPECTED_SHA"
            echo "apk_size=$EXPECTED_SIZE"
            echo "signer_sha256=$EXPECTED_SIGNER_SHA256"
            echo 'login_model=SIMPLE_APP_THEME_V1'
            cat /tmp/release-result
            echo 'stable_name=0.1.0-stable'
            echo 'stable_code=1'
            echo 'stable_publish=FORBIDDEN'
          } > ops/beta68-v4-release-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-v4-release-result.txt
          git commit -m 'ops: record Beta68 v4 exact OTA PASS'
          git pull --rebase origin release/beta68-exact-20260824
          git push origin HEAD:release/beta68-exact-20260824
