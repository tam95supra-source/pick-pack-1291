name: Beta128 owner R3 applied-contract verify

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: beta128-owner-r3-applied-contract
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify OWNER R3 implementation is already applied
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/beta128_owner_r3_contract.py
          python3 tools/beta128_owner_r3_contract.py
          python3 tools/owner_scope_guard_v2.py --bootstrap
          git diff --check
          echo BETA128_OWNER_R3_ALREADY_APPLIED_PASS
