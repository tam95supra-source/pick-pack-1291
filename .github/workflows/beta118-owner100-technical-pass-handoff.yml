name: Beta118 owner100 technical pass handoff

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-owner100-technical-pass-handoff.yml

permissions:
  contents: write
  actions: read

jobs:
  record-technical-pass:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact evidence and unchanged product bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r:return json.load(r)
          for run in (33836246626,33837587706):
              d=get(f'/actions/runs/{run}')
              assert d['status']=='completed' and d['conclusion']=='success',(run,d['status'],d['conclusion'])
          jobs=get('/actions/runs/33835843259/jobs')['jobs']
          back=next(x for x in jobs if x['name']=='back36-only')
          assert back['status']=='completed' and back['conclusion']=='success'
          jobs=get('/actions/runs/33835144144/jobs')['jobs']
          visual=next(x for x in jobs if x['name']=='visual-pda-verify')
          step=next(x for x in visual['steps'] if x['name']=='Run visual matrix and direct candidate PDA functional gate')
          assert step['conclusion']=='success'
          jobs=get('/actions/runs/33833810807/jobs')['jobs']
          assert next(x for x in jobs if x['name']=='candidate')['conclusion']=='success'
          assert next(x for x in jobs if x['name']=='service-live-regression')['conclusion']=='success'
          print('BETA118_OWNER100_EVIDENCE_PASS')
          PY
          git diff --quiet 81944b8519cfb7995d78a5c1070c4af3ee2150be HEAD -- app service google-apps-script
      - name: Record invariant receipt and READY handoff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          invariant_id='REVIEW-100-SESSIONS-001'
          reg=Path('qa/stable_invariants.yml')
          s=reg.read_text(encoding='utf-8')
          assert f'id: {invariant_id}' not in s
          marker='impact_map:\n'
          assert marker in s
          block='''  - id: REVIEW-100-SESSIONS-001
            status: TECHNICAL_PASS_AWAITING_OWNER
            scope: review-session-projection
            rule: "Rà soát ngày hiện tại phải chiếu chính xác tập session ACTIVE/in-only canonical theo business_date; nhãn ca tương đương không phân biệt hoa/thường phải hội tụ về Ca 1/Ca HC/Ca 2; expected/actual MNV và session_id phải bằng nhau hai chiều, không extra/duplicate/missing/wrong-source, giữ đúng vị trí."
            regression_minimum: [exact_100_unique_mnv, exact_100_unique_session_id, bidirectional_set_diff_zero, case_insensitive_shift_projection, three_shift_buckets, position_preserved, active_in_only, no_wrong_source, local_cache_to_actual_ui]
            regression_case: "qa/beta118_owner_100_sessions_regression.md + tools/beta118_owner_100_sessions_contract.py + exact Android UI run 33836246626 + local-first UI run 33837587706"
            technical_candidate: "0.4.2-beta.118 LOCKED CANDIDATE / source 81944b8519cfb7995d78a5c1070c4af3ee2150be"
            technical_evidence: "Diagnosis 33829110432/9921008888: canonical/event/outbox=100, raw pre-fix UI=0, normalized=100, exact-set diffs zero, seed-set SHA256 cc5c5dabfdf2cbf4a89cfef74d8fbe2a9274769582ead27fb6391fcb35f303e6. Product fix ae80424706de74c72dea460e82bdd429090944cc. Exact candidate 33833810807/9922669910 APK SHA256 5216f0eb09f187aed9cb71dcc21cd145fdc3ba7ea7852c74ffe6f85dea2b478f size 14429173 signer d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e; candidate + Service PASS. Visual/PDA API29 step PASS 33835144144/9923142675; API36 Back PASS 33835843259/9923339401. Exact actual Android UI 33836246626/9923402264: expected_minus_actual=0, actual_minus_expected=0, positions=PASS, in_only=PASS. Local-first/realtime 33837587706/9923826221: two rows 341ms and retained after 1.8s, third row 41ms, warning initial 10ms/update 19ms, all PASS. No Beta118 OTA/publish; Beta117 remains LIVE."
            owner_acceptance: "PENDING_OWNER_CHECKLIST_1_TO_3"
            active_pass: false

          '''
          # normalize indentation after the multiline literal above
          import textwrap
          block=textwrap.dedent(block)
          # YAML invariant entries live under invariants:, so restore two-space entry indent.
          block='\n'.join(('  '+line if line else '') for line in block.splitlines())+'\n'
          s=s.replace(marker,block+'\n'+marker,1)
          reg.write_text(s,encoding='utf-8')

          stable=Path('docs/STABLE_INVARIANTS.md')
          t=stable.read_text(encoding='utf-8')
          assert '### REVIEW-100-SESSIONS-001' not in t
          t += '''\n\n### REVIEW-100-SESSIONS-001\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: Rà soát / projection 100 session owner test.\n- Rule: Rà soát phải hiển thị exact canonical ACTIVE/in-only set theo business_date; Ca 1/Ca HC/Ca 2 phải hội tụ không phân biệt hoa/thường; expected/actual MNV + session_id bằng nhau hai chiều, không thừa/trùng/thiếu/sai nguồn và giữ đúng vị trí.\n- Regression: exact 100 unique MNV/session_id / bidirectional set diff zero / case-insensitive shift projection / three shift buckets / positions / in-only / no wrong source / actual Android UI / local-first persistence.\n- Technical evidence: diagnosis 33829110432/9921008888; fix ae80424706de74c72dea460e82bdd429090944cc; exact candidate 33833810807/9922669910 SHA256 5216f0eb09f187aed9cb71dcc21cd145fdc3ba7ea7852c74ffe6f85dea2b478f; visual/PDA API29 33835144144/9923142675; API36 Back 33835843259/9923339401; exact-100 Android UI 33836246626/9923402264 PASS; local-first/realtime 33837587706/9923826221 PASS (2 rows 341ms, retained 1.8s, third 41ms, warning 10/19ms).\n- Release state: Beta118 NOT LIVE / NOT OTA; Beta117 remains LIVE.\n- OWNER acceptance: PENDING — checklist 1–3.\n'''
          stable.write_text(t,encoding='utf-8')

          receipt={
            'project':'APK PICK PACK 1291','owner':'Nguyễn Văn Tâm','status':'TECHNICAL_PASS_AWAITING_OWNER',
            'scope':'REVIEW-100-SESSIONS-001','beta118_live':False,'live_beta':'0.4.2-beta.117',
            'candidate':{'version':'0.4.2-beta.118','version_code':124,'source_sha':'81944b8519cfb7995d78a5c1070c4af3ee2150be','run_id':33833810807,'artifact_id':9922669910,'apk_sha256':'5216f0eb09f187aed9cb71dcc21cd145fdc3ba7ea7852c74ffe6f85dea2b478f','size':14429173,'signer_sha256':'d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e'},
            'evidence':{'diagnosis_run':33829110432,'diagnosis_artifact':9921008888,'exact_ui_run':33836246626,'exact_ui_artifact':9923402264,'back36_run':33835843259,'back36_artifact':9923339401,'visual_pda_run':33835144144,'visual_pda_artifact':9923142675,'localfirst_run':33837587706,'localfirst_artifact':9923826221},
            'exact_set':{'expected_minus_actual':0,'actual_minus_expected':0,'positions':'PASS','in_only':'PASS'},
            'localfirst':{'two_rows_ms':341,'retained_after_ms':1800,'three_rows_ms':41,'warning_initial_ms':10,'warning_update_ms':19,'status':'PASS'},
            'owner_acceptance':'PENDING','next_action':'OWNER_CHECKLIST_1_TO_3','ota_forbidden_until_owner_ok':True
          }
          Path('ops/beta118-owner100-technical-pass.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          archive='docs/handovers/HANDOVER_20260904_BETA118_OWNER100_TECHNICAL_PASS_READY.md'
          handover='''# PICK PACK 1291 — HANDOFF SCHEMA V2\n\n- schema_version: 2\n- status: READY\n- time_utc: 2026-09-04T04:41:01Z\n- owner: Nguyễn Văn Tâm\n- project: APK PICK PACK 1291\n- branch: release/beta118-owner-realtime-bulk-exit-20260904\n- candidate_source_sha: 81944b8519cfb7995d78a5c1070c4af3ee2150be\n- archive_file: docs/handovers/HANDOVER_20260904_BETA118_OWNER100_TECHNICAL_PASS_READY.md\n\n## Authority / release state\n- LIVE BETA remains 0.4.2-beta.117 / versionCode 123.\n- Beta118 is LOCKED CANDIDATE only: 0.4.2-beta.118 / versionCode 124 / package vn.pickpack1291.app.beta.publicbeta.\n- Candidate run/artifact: 33833810807 / 9922669910.\n- Exact APK SHA256: 5216f0eb09f187aed9cb71dcc21cd145fdc3ba7ea7852c74ffe6f85dea2b478f; size 14429173; signer d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e.\n- Stable/main/signer/authority unchanged. Beta118 publish/OTA remains FORBIDDEN until OWNER accepts blocker checklist.\n\n## Blocker 100 session — Technical PASS\n- Root cause: owner-seeded shifts were uppercase CA 1/CA HC/CA 2 while reconciliation grouping was case-sensitive. Canonical D1/event/outbox set was already exact 100.\n- Diagnosis 33829110432 / artifact 9921008888: canonical=100, event=100, outbox=100; expected-minus-canonical=0; canonical-minus-expected=0; raw pre-fix review=0; normalized review=100; seed-set SHA256 cc5c5dabfdf2cbf4a89cfef74d8fbe2a9274769582ead27fb6391fcb35f303e6.\n- Minimal product fix: ae80424706de74c72dea460e82bdd429090944cc, case-insensitive canonical shift projection; no destructive D1 reseed/rewrite.\n- Exact Android UI gate 33836246626 / artifact 9923402264: expected_minus_actual=0, actual_minus_expected=0, positions=PASS, in_only=PASS.\n- Local-first/realtime gate 33837587706 / artifact 9923826221: 2 rows immediate 341ms, retained after 1.8s, third row 41ms, warning initial 10ms and update 19ms; PASS.\n- Visual + direct PDA functional API29: step PASS run 33835144144 / artifact 9923142675.\n- Android 16/API36 Back: PASS run 33835843259 / artifact 9923339401.\n- Candidate + exact Service source: PASS run 33833810807.\n\n## Invariant state\n- REVIEW-100-SESSIONS-001 = TECHNICAL_PASS_AWAITING_OWNER.\n- Do NOT mark ACTIVE_PASS until Nguyễn Văn Tâm explicitly accepts all three checklist items.\n- Do NOT resume Beta118 publish/OTA before that OWNER acceptance.\n\n## OWNER checklist\n1. Rà soát hiển thị đúng chính xác 100 người expected.\n2. Ba bucket Ca 1 / Ca HC / Ca 2 + vị trí/in-only đúng.\n3. Không extra/duplicate/missing/wrong-source.\n\n## NEXT_ACTION\nOWNER_CHECKLIST_1_TO_3\n'''
          Path(archive).write_text(handover,encoding='utf-8')
          Path('docs/handovers/HANDOVER_CURRENT.md').write_text(handover,encoding='utf-8')
          PY
      - name: Commit and push with branch fencing
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/stable_invariants.yml docs/STABLE_INVARIANTS.md ops/beta118-owner100-technical-pass.json docs/handovers/HANDOVER_CURRENT.md docs/handovers/HANDOVER_20260904_BETA118_OWNER100_TECHNICAL_PASS_READY.md
          git commit -m 'docs(beta118): owner100 technical pass awaiting owner'
          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep 2
          done
          exit 1
