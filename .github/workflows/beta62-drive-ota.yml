name: Beta62 Drive OTA Publish Verify

on:
  pull_request:
    branches: [ ci/beta62-drive-ota-base-20260823 ]

permissions:
  contents: read

concurrency:
  group: beta62-drive-ota-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GSHEET_API_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  TARGET_VERSION: 0.4.2-beta.62
  FROM_VERSION: 0.4.2-beta.61
  TARGET_CODE: '68'
  EXPECTED_SHA: 5928520d6b22cf396c9ddef068616ea6cdb47110ea4b42cf9a85a3615dbfc694
  EXPECTED_SIZE: '13060715'
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e

jobs:
  publish-verify:
    if: github.event.pull_request.head.ref == 'release/beta62-drive-ota-trigger-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1d351ef0448e824a1b08d0675da555bf0ede534
          fetch-depth: 0
      - name: Verify live update discovery and exact download
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=false
          for attempt in $(seq 1 20); do
            if curl -fsSL --retry 2 --retry-delay 1 -H 'content-type: application/json' "$GSHEET_API_URL" \
              -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" > /tmp/from.json; then
              if python3 - <<'PY'
          import json,os,sys
          try:j=json.load(open('/tmp/from.json'))
          except Exception:sys.exit(1)
          available=j.get('available',j.get('update_available'))
          version=j.get('version_name',j.get('version',''))
          url=j.get('apk_url') or j.get('download_url') or j.get('url') or ''
          good=(j.get('ok') is True and available is True and str(version)==os.environ['TARGET_VERSION'] and str(j.get('sha256','')).lower()==os.environ['EXPECTED_SHA'].lower() and str(j.get('source',''))=='GOOGLE_DRIVE' and str(j.get('channel',''))=='BETA' and bool(url))
          if good: open('/tmp/url.txt','w').write(url)
          sys.exit(0 if good else 1)
          PY
              then ok=true; break; fi
            fi
            sleep 3
          done
          [[ "$ok" == true ]] || { echo 'LIVE_DISCOVERY_FAILED'; cat /tmp/from.json || true; exit 1; }
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$(cat /tmp/url.txt)" -o /tmp/ota.apk
          [[ "$(sha256sum /tmp/ota.apk | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/ota.apk)" == "$EXPECTED_SIZE" ]]
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0; fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"; yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Verify OTA package version code and production signer
        shell: bash
        run: |
          set -Eeuo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/aapt" dump badging /tmp/ota.apk > /tmp/badge.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/badge.txt
          grep -q "versionCode='$TARGET_CODE'" /tmp/badge.txt
          grep -q "versionName='$TARGET_VERSION'" /tmp/badge.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota.apk > /tmp/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          [[ "$CERT" == "$EXPECTED_SIGNER_SHA256" ]]
      - name: Verify self-update false and Stable isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" \
            -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$TARGET_VERSION\"}" > /tmp/self.json
          curl -fsSL --retry 4 --retry-delay 2 -H 'content-type: application/json' "$GSHEET_API_URL" \
            -d '{"action":"update_check","channel":"STABLE","current_version":"0.0.0"}' > /tmp/stable.json
          python3 - <<'PY'
          import json,os
          s=json.load(open('/tmp/self.json')); t=json.load(open('/tmp/stable.json'))
          assert s.get('ok') is True and s.get('available',s.get('update_available')) is False,s
          assert str(s.get('channel',''))=='BETA',s
          assert t.get('ok') is True,t
          assert str(t.get('channel',''))=='STABLE',t
          assert str(t.get('version_name',t.get('version',''))) != os.environ['TARGET_VERSION'],t
          PY
      - name: OTA release receipt
        shell: bash
        run: |
          printf 'verdict=PASS\nsource_sha=a1d351ef0448e824a1b08d0675da555bf0ede534\nversion=%s\nversion_code=%s\napk_sha256=%s\napk_size=%s\nsigner_sha256=%s\ndrive_apk_id=15Mac3NoN0R4tCqPuadIw2gm9NNimGKZm\ndrive_checksum_id=1LIbC3WgkuqNcaSQjpN2ZXhow2OGKwB1_\nfrom_version=%s\nstable=UNTOUCHED\nlive_ota=PASS\n' "$TARGET_VERSION" "$TARGET_CODE" "$EXPECTED_SHA" "$EXPECTED_SIZE" "$EXPECTED_SIGNER_SHA256" "$FROM_VERSION" | tee /tmp/beta62-drive-ota-receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beta62-drive-ota-receipt
          path: /tmp/beta62-drive-ota-receipt.txt
          retention-days: 30
