name: Oneoff Beta63 Materialize Compile

on:
  pull_request:
    branches:
      - stabilization/beta63-materialize-base-20260824
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: oneoff-beta63-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Materialize exact Beta63 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_beta63_login_perf_session.py')
          s=p.read_text()
          s=s.replace("replace_first_call_block(ops, 'api.call(\"logout\") {', replacement)", "replace_first_call_block(ops, 'api.call(\"logout\"){', replacement)")
          p.write_text(s)
          PY
          python3 tools/apply_beta63_login_perf_session.py

      - name: Compile Beta and Stable isolation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleBetaDebug assembleStableDebug

      - name: Guard source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 69' app/build.gradle.kts
          grep -F 'versionName = "0.4.2-beta.63"' app/build.gradle.kts
          grep -F 'versionCode = 1' app/build.gradle.kts
          grep -F 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -F 'R.drawable.login_vietnam_bg' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          grep -F 'fun logoutFast()' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -F 'm2Runtime.ensureServiceSession(newToken, force = false)' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -F 'retry<2' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          ! grep -Fq 'm2Transport.loginFromPassword(login, password)' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt

      - name: Commit materialized product source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          if git diff --cached --quiet; then
            echo 'No materialization diff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(beta63): materialize login perf and session mutation fixes [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
