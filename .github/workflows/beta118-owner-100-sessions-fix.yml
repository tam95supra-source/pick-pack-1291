name: Beta118 fix owner 100 sessions

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-owner-100-sessions-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic root-cause fix
        run: python3 tools/beta118_owner_100_sessions_fix.py
      - name: Verify exact regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta118_owner_100_sessions_contract.py
          python3 tools/beta116_owner_scope_contract.py
          python3 tools/beta117_owner_followup_contract.py
          python3 tools/beta118_owner_followup_contract.py
          git diff --check
      - name: Commit fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt \
            .github/workflows/beta118-owner-seed-100-sessions.yml \
            tools/beta118_owner_100_sessions_contract.py \
            qa/beta118_owner_100_sessions_regression.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "fix(beta118): keep exact owner seed set in reconciliation"
          git push origin HEAD:release/beta118-owner-realtime-bulk-exit-20260904
