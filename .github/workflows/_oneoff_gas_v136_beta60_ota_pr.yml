name: One-off GAS Beta60 OTA Idempotent Live Gate

on:
  pull_request:
    branches:
      - ci/beta60-release-gate-base-20260823

permissions:
  contents: read

concurrency:
  group: gas-live-deploy
  cancel-in-progress: false

jobs:
  deploy-or-verify:
    if: github.event.pull_request.head.ref == 'ops/gas-v136-beta60-ota-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: 0.4.2-beta.60
      TARGET_CODE: '66'
      TARGET_SHA256: 40d7526cee2806a170f8726428753ed796419263ca47a8a7d9332756d61bbd68
      TARGET_SIZE: '13044331'
      TARGET_APK_URL: https://github.com/tam95supra-source/pick-pack-1291/releases/download/v0.4.2-beta.60-publicbeta/pick-pack-1291-public-beta-0.4.2-beta.60.apk
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: OAuth and deployment identifiers
        id: auth
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in GAS_SCRIPT_ID GAS_DEPLOYMENT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do [[ -n "${!v:-}" ]]; done
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' <<<"$RESP")
          [[ -n "$SCRIPT_ID" && -n "$DEPLOYMENT_ID" && -n "$TOKEN" ]]
          echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"; echo "::add-mask::$TOKEN"
          echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"; echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"; echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Fresh-read currently deployed source and patch only if needed
        id: patch
        env:
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" > /tmp/dep.json
          OLD=$(python3 -c 'import json;print(json.load(open("/tmp/dep.json"))["deploymentConfig"]["versionNumber"])')
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content?versionNumber=$OLD" > /tmp/live.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/live.json')); fs=j.get('files',[])
          f=next((x for x in fs if x.get('name')=='PICK_PACK_API' and x.get('type')=='SERVER_JS'),None)
          assert f, 'PICK_PACK_API_NOT_FOUND'; s=f.get('source','')
          for n in ["action === 'service_discovery'","SERVICE_PRIMARY","function ppUpdateCheck_(body)"]:
              assert n in s, 'LIVE_GUARD:'+n
          if 'PP_BETA60_OTA_V136' in s and '0.4.2-beta.60' in s and os.environ['TARGET_SHA256'] in s:
              open('/tmp/already','w').write('1'); print('ALREADY_BETA60'); raise SystemExit
          assert '0.4.2-beta.59' in s, 'EXPECTED_LIVE_BETA59_OR_BETA60'
          st=s.index('function ppUpdateCheck_(body) {'); en=s.index('\nfunction ppJson_',st)
          new='''// PP_BETA60_OTA_V136: exact signed Beta60 metadata; Stable remains unavailable/untouched.\nfunction ppUpdateCheck_(body) {\n  const channel=ppFold_(body.channel||body._app_channel)==='STABLE'?'STABLE':'BETA';\n  const current=String(body.current_version||body._app_version||'').trim();\n  if(channel==='STABLE') return {ok:true,source:'GITHUB_RELEASE',channel:'STABLE',available:false,reason:'NO_RELEASE'};\n  const version="0.4.2-beta.60", available=ppOtaCompare_(version,current)>0;\n  const out={ok:true,source:'GITHUB_RELEASE',channel:'BETA',available:available,version_name:version,version_code:66,size:13044331,published_at:"2026-08-23T11:42:00Z",notes:"Beta60: tối ưu bố cục Nghiệp vụ; hoàn thiện Quét QR nhân sự, Thêm/Sửa/Xóa/Ra ca; sửa giờ vào-ra ca; đổi/trả PDA theo serial và lý do audit; đối soát ra-ca; hiển thị metadata tài nguyên; sửa Pack → Thêm Pick không làm mất Pack. OTA manual-only; Stable không thay đổi.",mandatory:false};\n  if(!available)return out;\n  out.sha256="40d7526cee2806a170f8726428753ed796419263ca47a8a7d9332756d61bbd68";\n  out.apk_url="https://github.com/tam95supra-source/pick-pack-1291/releases/download/v0.4.2-beta.60-publicbeta/pick-pack-1291-public-beta-0.4.2-beta.60.apk";\n  return out;\n}\n'''
          f['source']=s[:st]+new+s[en:]
          json.dump({'files':fs},open('/tmp/patched.json','w'),ensure_ascii=False)
          PY
          echo "old_version=$OLD" >> "$GITHUB_OUTPUT"
          if [[ -f /tmp/already ]]; then echo 'needs_deploy=false' >> "$GITHUB_OUTPUT"; else echo 'needs_deploy=true' >> "$GITHUB_OUTPUT"; fi

      - name: Deploy one new Apps Script version when Beta59 is still live
        if: steps.patch.outputs.needs_deploy == 'true'
        env:
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const j=require('/tmp/patched.json'),fs=require('fs');const s=j.files.find(x=>x.name==='PICK_PACK_API').source;fs.writeFileSync('/tmp/PICK_PACK_API.js',s)
          NODE
          node --check /tmp/PICK_PACK_API.js
          H=$(curl -sS -o /tmp/put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/patched.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          [[ "$H" == 200 ]] || { cat /tmp/put.out; exit 1; }
          H=$(curl -sS -o /tmp/ver.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Pick Pack 1291 Beta60 OTA exact metadata"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          [[ "$H" == 200 ]] || { cat /tmp/ver.json; exit 1; }
          V=$(python3 -c 'import json;print(json.load(open("/tmp/ver.json"))["versionNumber"])'); [[ "$V" -gt "${{ steps.patch.outputs.old_version }}" ]]
          python3 - "$SCRIPT_ID" "$V" <<'PY'
          import json,sys
          json.dump({'deploymentConfig':{'scriptId':sys.argv[1],'versionNumber':int(sys.argv[2]),'manifestFileName':'appsscript','description':'Pick Pack 1291 live API - Beta60 OTA'}},open('/tmp/dput.json','w'))
          PY
          H=$(curl -sS -o /tmp/dout -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/dput.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
          [[ "$H" == 200 ]] || { cat /tmp/dout; exit 1; }
          echo "deployed_version=$V" >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end OTA verification from production web app
        env:
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" > /tmp/dep2.json
          WEB=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/dep2.json')); w=[e.get('webApp',{}) for e in j.get('entryPoints',[]) if e.get('entryPointType')=='WEB_APP']; assert w and w[0].get('url'); print(w[0]['url'])
          PY
          )
          echo "::add-mask::$WEB"
          OK=false
          for n in $(seq 1 20); do
            curl -sSL --connect-timeout 20 --max-time 90 -H 'content-type: application/json' "$WEB" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.59"}' > /tmp/beta.json || true
            if TARGET_VERSION="$TARGET_VERSION" TARGET_SHA256="$TARGET_SHA256" TARGET_SIZE="$TARGET_SIZE" node - <<'NODE'
          const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/beta.json'));process.exit(j.ok===true&&j.source==='GITHUB_RELEASE'&&j.channel==='BETA'&&j.available===true&&j.version_name===process.env.TARGET_VERSION&&String(j.version_code)==='66'&&String(j.size)===process.env.TARGET_SIZE&&String(j.sha256||'').toLowerCase()===process.env.TARGET_SHA256&&String(j.apk_url||'').includes('v0.4.2-beta.60-publicbeta')?0:1)}catch(e){process.exit(1)}
          NODE
            then OK=true; break; fi
            sleep 3
          done
          [[ "$OK" == true ]] || { cat /tmp/beta.json; exit 1; }
          URL=$(python3 -c 'import json;print(json.load(open("/tmp/beta.json"))["apk_url"])')
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$URL" -o /tmp/b60.apk
          [[ "$(sha256sum /tmp/b60.apk|awk '{print $1}')" == "$TARGET_SHA256" ]]
          [[ "$(stat -c '%s' /tmp/b60.apk)" == "$TARGET_SIZE" ]]
          curl -fsSL -H 'content-type: application/json' "$WEB" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.60"}' > /tmp/self.json
          curl -fsSL -H 'content-type: application/json' "$WEB" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/stable.json
          curl -fsSL -H 'content-type: application/json' "$WEB" -d '{"action":"service_discovery"}' > /tmp/discovery.json
          node - <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('/tmp/self.json')),s=JSON.parse(fs.readFileSync('/tmp/stable.json')),d=JSON.parse(fs.readFileSync('/tmp/discovery.json'));
          if(!(a.ok===true&&a.channel==='BETA'&&a.available===false&&a.version_name==='0.4.2-beta.60'))process.exit(1);
          if(!(s.ok===true&&s.channel==='STABLE'&&s.available===false))process.exit(2);
          if(!(d.ok===true&&d.authority_mode==='SERVICE_PRIMARY'))process.exit(3);
          NODE
          echo 'Beta59 -> Beta60 OTA: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Beta60 exact downloaded bytes: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Beta60 self-check: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Stable untouched: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Service authority SERVICE_PRIMARY: PASS' >> "$GITHUB_STEP_SUMMARY"
