name: Owner R5 verify quota-aware delta batch now
on:
  push:
    branches: [release/beta130-r5-rev6-20260906]
    paths:
      - .github/workflows/owner-r5-beta130-service-delta-batch-now.yml
permissions:
  contents: read
concurrency:
  group: owner-r5-production-service-writer
  cancel-in-progress: false
jobs:
  service-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap and exact-byte fences
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          SOURCE_SHA=$(jq -er '.source_sha' ops/beta-release-request.json)
          BASE_SOURCE_SHA=$(jq -er '.base_source_sha' ops/beta-release-request.json)
          test "$(jq -r '.owner_scope' ops/beta-release-request.json)" = OWNER_20260906_R5_QUOTA_REALTIME
          test "$(jq -r '.owner_checklist_revision' ops/beta-release-request.json)" = 6
          test "$(jq -r '.candidate_locked' ops/beta-release-request.json)" = true
          test "$(jq -r '.live' ops/beta-release-request.json)" = false
          test "$SOURCE_SHA" = "d5442338e7413d46a8344a3682f7e08276309630"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$BASE_SOURCE_SHA^{commit}"
          git diff --quiet "$SOURCE_SHA" HEAD -- app service google-apps-script
          echo "SERVICE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SERVICE_SOURCE_SHA=$BASE_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Patch quota and dynamic-runtime gate in runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r5_quota_aware_service_gate_patch.py
          python3 tools/r5_dynamic_runtime_service_gate_patch.py
          bash -n tools/beta89_service_live_gate.sh
          bash -n tools/r5_service_convergence_gate.sh
          bash -n tools/r5_resolve_beta_live_runtime.sh
          bash -n tools/r5_exact_base_service_recovery.sh
          git diff --check
          test -z "$(git diff --name-only -- app service google-apps-script)"
      - name: Typecheck exact service source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf service/node_modules service/package-lock.json service/.wrangler service/worker-configuration.d.ts service/wrangler.live.jsonc
          npm --prefix service install --include=dev --ignore-scripts --no-audit --no-fund
          test -x service/node_modules/.bin/wrangler
          test -d service/node_modules/fflate
          npm --prefix service run check
      - name: Resolve Beta LIVE runtime bindings read-only
        shell: bash
        run: |
          set -euo pipefail
          R5_RUNTIME_DIR=/tmp/r5-beta-live-runtime bash tools/r5_resolve_beta_live_runtime.sh
      - name: Deploy and verify exact service with canonical automatic recovery
        shell: bash
        run: |
          set +e
          set -uo pipefail
          bash tools/beta89_service_live_gate.sh
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            echo "Exact candidate service gate failed; restoring exact base service" >&2
            R5_RECOVERY_DIR=/tmp/r5-exact-base-service-recovery bash tools/r5_exact_base_service_recovery.sh || exit 97
            exit "$rc"
          fi
      - name: Upload exact service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta130-delta-batch-service-${{ github.run_id }}
          path: |
            /tmp/beta89-service-live
            /tmp/r5-beta-live-runtime
            /tmp/r5-exact-base-service-recovery
          retention-days: 30
          if-no-files-found: error
