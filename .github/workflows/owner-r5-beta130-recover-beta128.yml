name: Owner R5 recover exact Beta128 service
on:
  push:
    branches: [work/r5-beta130-timeline-20260906]
    paths:
      - .github/workflows/owner-r5-beta130-recover-beta128.yml
permissions:
  contents: read
concurrency:
  group: owner-r5-beta-service-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_SERVICE_SOURCE_SHA: 5569d1e931436e02d118ed8ab57f2143de43b9f7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical and recovery fences
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          test "$(jq -r '.owner_scope' ops/beta-release-request.json)" = OWNER_20260906_R5_QUOTA_REALTIME
          test "$(jq -r '.owner_checklist_revision' ops/beta-release-request.json)" = 6
          test "$(jq -r '.base_source_sha' ops/beta-release-request.json)" = "$BASE_SERVICE_SOURCE_SHA"
          git cat-file -e "$BASE_SERVICE_SOURCE_SHA^{commit}"
      - name: Restore exact Beta128 service bytes
        run: |
          set -euo pipefail
          bash tools/restore_exact_service_tree.sh "$BASE_SERVICE_SOURCE_SHA"
          git diff --quiet "$BASE_SERVICE_SOURCE_SHA" -- service
          rm -rf service/node_modules service/package-lock.json service/.wrangler
          R5_CONVERGENCE_OUT=/tmp/r5-beta128-service-recovery \
          R5_DEPLOY_ONLY=1 \
          SERVICE_SOURCE_SHA="$BASE_SERVICE_SOURCE_SHA" \
          bash tools/r5_beta130_convergence_only_gate.sh
          jq -e '.status=="PASS" and .mode=="DEPLOY_ONLY_RECOVERY"' /tmp/r5-beta128-service-recovery/deploy-only-receipt.json >/dev/null
      - name: Upload recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta128-service-recovery-${{ github.run_id }}
          path: /tmp/r5-beta128-service-recovery
          retention-days: 30
          if-no-files-found: error
