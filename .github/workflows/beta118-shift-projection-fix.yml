name: Beta118 repair both 100-session projections

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-shift-projection-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Apply exact projection repair
        run: python3 tools/beta118_shift_projection_fix.py
      - name: Verify contracts and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta118_owner_100_sessions_contract.py
          python3 tools/beta116_owner_scope_contract.py
          python3 tools/beta117_owner_followup_contract.py
          python3 tools/beta118_owner_followup_contract.py
          gradle --no-daemon --build-cache :app:testBetaDebugUnitTest :app:assembleBetaDebug
          git diff --check
      - name: Commit product fix and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt tools/beta118_owner_100_sessions_contract.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix(beta118): show owner seed set in review and QR list"
          git push origin HEAD:release/beta118-owner-realtime-bulk-exit-20260904
