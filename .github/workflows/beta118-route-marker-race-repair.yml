name: Beta118 release marker race repair

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-route-marker-race-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch observational marker fencing only
        run: |
          set -euo pipefail
          python3 tools/beta118_route_marker_race_patch.py
          grep -Fq 'BETA_RUN_MARKER_SKIPPED_BRANCH_ADVANCED' .github/workflows/beta-release.yml
          git diff --check
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/beta-release.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: tolerate observational release marker branch advance'
          git push origin HEAD:release/beta118-owner-realtime-bulk-exit-20260904
