name: Beta118 release marker race repair

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-route-marker-race-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch observational marker fencing only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/beta-release.yml')
          s=p.read_text(encoding='utf-8')
          old='''          git add ops/beta-run-observe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: observe Beta run $RUN_ID"
          git push origin HEAD:"$RUN_REF"
'''
          new='''          git add ops/beta-run-observe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: observe Beta run $RUN_ID"
          if ! git push --force-with-lease="refs/heads/$RUN_REF:$RUN_SHA" origin HEAD:"$RUN_REF"; then
            REMOTE_SHA=$(git ls-remote origin "refs/heads/$RUN_REF" | awk '{print $1}')
            if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$RUN_SHA" ]]; then
              echo "BETA_RUN_MARKER_SKIPPED_BRANCH_ADVANCED:$RUN_SHA->$REMOTE_SHA"
            else
              echo "BETA_RUN_MARKER_PUSH_FAILED_WITHOUT_REF_ADVANCE" >&2
              exit 1
            fi
          fi
'''
          assert old in s, 'expected release marker block not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'BETA_RUN_MARKER_SKIPPED_BRANCH_ADVANCED' .github/workflows/beta-release.yml
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/beta-release.yml
          git commit -m 'ci: tolerate observational release marker branch advance'
          git push origin HEAD:release/beta118-owner-realtime-bulk-exit-20260904
