name: Owner R5 Beta130 convergence evidence
on:
  push:
    branches: [work/r5-beta130-timeline-20260906]
    paths:
      - .github/workflows/owner-r5-beta130-convergence-evidence.yml
permissions:
  contents: read
concurrency:
  group: owner-r5-beta130-convergence-evidence
  cancel-in-progress: false
jobs:
  service-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical rev6 and exact runtime fences
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          REQ=ops/beta-release-request.json
          SOURCE_SHA=$(jq -r '.source_sha' "$REQ")
          BASE_SOURCE_SHA=$(jq -r '.base_source_sha' "$REQ")
          test "$(jq -r '.owner_scope' "$REQ")" = OWNER_20260906_R5_QUOTA_REALTIME
          test "$(jq -r '.owner_checklist_revision' "$REQ")" = 6
          test "$(jq -r '.stage' "$REQ")" = BUILD_VERIFY
          test "$(git rev-parse "$SOURCE_SHA")" = "$SOURCE_SHA"
          test "$(git rev-parse "$BASE_SOURCE_SHA")" = "$BASE_SOURCE_SHA"
          git diff --quiet "$SOURCE_SHA" HEAD -- app service google-apps-script
          python3 tools/r5_quota_realtime_guard.py
          echo "SERVICE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SERVICE_SOURCE_SHA=$BASE_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Patch evidence harness in runner only
        run: |
          set -euo pipefail
          python3 tools/r5_beta130_convergence_timing_fix.py
          python3 tools/r5_beta130_safe_get_retry_fix.py
          git diff --check
          git diff --quiet HEAD -- app service google-apps-script
      - name: Typecheck exact service source
        run: |
          set -euo pipefail
          rm -rf service/node_modules service/package-lock.json
          npm --prefix service install --ignore-scripts --no-audit --no-fund
          npm --prefix service run check
      - name: Deploy and verify exact service source with robust recovery
        run: |
          set +e
          set -uo pipefail
          bash tools/beta89_service_live_gate.sh
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            echo "Service gate failed; restoring exact base service source" >&2
            bash tools/restore_exact_service_tree.sh "$BASE_SERVICE_SOURCE_SHA"
            rm -rf service/node_modules service/package-lock.json service/.wrangler
            npm --prefix service install --ignore-scripts --no-audit --no-fund
            npm --prefix service run check
            RECOVERY_SOURCE_SHA="$BASE_SERVICE_SOURCE_SHA"
            BASE_SERVICE_SOURCE_SHA="" SERVICE_SOURCE_SHA="$RECOVERY_SOURCE_SHA" bash tools/beta78_service_live_gate.sh || exit 97
            exit "$rc"
          fi
      - name: Upload exact service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta130-convergence-evidence-${{ github.run_id }}
          path: /tmp/beta89-service-live
          retention-days: 30
          if-no-files-found: error
