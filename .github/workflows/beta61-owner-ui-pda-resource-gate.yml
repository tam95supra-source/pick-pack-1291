name: Beta61 owner UI PDA resource gate

on:
  pull_request:
    branches:
      - ci/beta61-owner-ui-pda-resource-gate-base-20260823
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Detect validated source commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[beta61-source]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Beta61 source commit already validated; no patch loop.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Load exact patch recipe from gate base
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" --force
          git show "${{ github.base_ref }}:.github/scripts/beta61_owner_ui_pda_resource_patch.py" > /tmp/beta61_patch.py
          python3 /tmp/beta61_patch.py

      - name: Static owner contract checks
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          grep -F 'versionCode = 67' app/build.gradle.kts
          grep -F 'versionName = "0.4.2-beta.61"' app/build.gradle.kts
          grep -F 'versionCode = 1' app/build.gradle.kts
          grep -F 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -F 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -F 'val directOwnerActions=setOf(' app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          grep -F 'serial.takeLast(5)==q' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -F 'val pickHost=column(surface)' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -F 'choose.addView(deleteSelected' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -F 'Đã có đủ Pick & Pack trong ca.' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          git diff --check

      - name: Build Beta61 and Stable validation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleBetaDebug :app:assembleStableDebug

      - name: Commit validated Beta61 source back to feature branch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'pick-pack-1291-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt
          git diff --cached --check
          git commit -m 'feat: Beta61 owner UI PDA resource fixes [beta61-source]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
