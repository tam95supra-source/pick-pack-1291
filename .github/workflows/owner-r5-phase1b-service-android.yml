name: Owner R5 phase1b service Android delta

on:
  push:
    branches:
      - work/r5-quota-realtime-20260906
    paths:
      - .github/workflows/owner-r5-phase1b-service-android.yml

permissions:
  contents: write

concurrency:
  group: owner-r5-phase1b-service-android
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Canonical guard
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          python3 tools/finalizer_handoff_contract.py
      - name: Apply R5 indexed delta patch
        run: |
          set -euo pipefail
          python3 -m py_compile tools/r5_phase1b_apply.py
          python3 tools/r5_phase1b_apply.py
      - name: Service compile and delta contract
        run: |
          set -euo pipefail
          npm --prefix service install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm --prefix service run check
          grep -q 'authority_epoch=?2 AND e.service_generation=?3 AND e.authority_seq>?4' service/src/sync_contract.ts
          grep -q 'business_date_revision' service/src/index.ts
          grep -q 'sync_delta' service/src/legacy_sync_portable.ts
          ! grep -Eq 'LEFT[[:space:]]+JOIN[[:space:]]+events.*GROUP BY|MAX\(COALESCE\(e\.authority_seq' service/src/sync_contract.ts service/src/legacy_sync_portable.ts
      - name: Android compile and single-orchestrator guard
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileBetaDebugKotlin --no-daemon --stacktrace
          grep -q 'sync_delta' app/src/main/java/vn/pickpack1291/app/beta/M2DayReconciler.kt
          ! grep -q 'sync_day' app/src/main/java/vn/pickpack1291/app/beta/OperationalSyncEngine.kt
          ! grep -q 'sync_day' app/src/main/java/vn/pickpack1291/app/beta/M2BackgroundSync.kt
          grep -q 'scheduleCatchUp(applicationContext)' app/src/main/java/vn/pickpack1291/app/beta/M2Firebase.kt
          grep -q 'scheduleOutbox(app)' app/src/main/java/vn/pickpack1291/app/beta/ForegroundSyncCoordinator.kt
          git diff --check
      - name: Commit exact tested generated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service/src/sync_contract.ts service/src/legacy_sync_portable.ts service/src/index.ts app/src/main/java/vn/pickpack1291/app/beta/OperationalDataStore.kt app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt app/src/main/java/vn/pickpack1291/app/beta/ForegroundSyncCoordinator.kt app/src/main/java/vn/pickpack1291/app/beta/M2Firebase.kt
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'perf(r5): use indexed delta on Service and Android normal path'
          git push origin HEAD:work/r5-quota-realtime-20260906
