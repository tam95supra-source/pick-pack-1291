name: Agent Beta61 owner UI PDA resource fixes

on:
  push:
    branches:
      - agent/beta61-owner-ui-pda-resource-fixes-20260823

permissions:
  contents: write

jobs:
  patch-build:
    if: ${{ !contains(github.event.head_commit.message, '[beta61-source]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact Beta61 owner patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ops_path=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt')
          api_path=Path('app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt')
          gradle_path=Path('app/build.gradle.kts')
          ops=ops_path.read_text()
          api=api_path.read_text()
          gradle=gradle_path.read_text()

          def once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {n}')
              return text.replace(old,new,1)

          # Version: Beta60 is immutable; all source changes advance to Beta61.
          gradle=once(gradle,'versionCode = 66','versionCode = 67','beta versionCode')
          gradle=once(gradle,'versionName = "0.4.2-beta.60"','versionName = "0.4.2-beta.61"','beta versionName')
          gradle=gradle.replace('// Beta60: owner operations UX, audited session edits/deletes, PDA exchange and live resource details.','// Beta61: owner UI density, restored Staff tab, PDA holder list, attendance editor refinements, direct Service resource admin route.\n// Beta60 remains immutable and is the previous public baseline.')

          # Resource/owner calls must route to Service before the durable OPERATIONAL branch.
          call_anchor='''    fun call(action: String, payload: JSONObject = JSONObject(), callback: (Result) -> Unit) {\n        if(action in M2ServiceTransport.OPERATIONAL){\n            localExecutor.execute {\n                try {      if (action in setOf("resource_master_list","resource_master_upsert","resource_master_delete","history_correction","session_work_update","session_exit_guarded","attendance_time_correct","attendance_exit_delete","attendance_session_delete","service_connections","account_delete","history_delete")) {\n          val result=serviceOwnerCall(action,payload)\n          if(result.code==401) clearSession()\n          if(action in setOf("resource_master_upsert","resource_master_delete","history_correction")) AppHistory.record(appContext,action,result.ok,result.error.orEmpty())\n          callback(result)\n          return@execute\n      }\n\n                    val m2=m2Transport.operational(action,payload)'''
          call_repl='''    fun call(action: String, payload: JSONObject = JSONObject(), callback: (Result) -> Unit) {\n        val directOwnerActions=setOf("resource_master_list","resource_master_upsert","resource_master_delete","history_correction","session_work_update","session_exit_guarded","attendance_time_correct","attendance_exit_delete","attendance_session_delete","service_connections","account_delete","history_delete")\n        if(action in directOwnerActions){\n            localExecutor.execute {\n                try {\n                    val result=serviceOwnerCall(action,payload)\n                    if(action in setOf("resource_master_upsert","resource_master_delete","history_correction")) AppHistory.record(appContext,action,result.ok,result.error.orEmpty())\n                    callback(result)\n                } catch(t:Throwable){ callback(failure(t)) }\n            }\n            return\n        }\n        if(action in M2ServiceTransport.OPERATIONAL){\n            localExecutor.execute {\n                try {\n                    val m2=m2Transport.operational(action,payload)'''
          api=once(api,call_anchor,call_repl,'direct owner routing')

          start=api.index('    private fun serviceOwnerCall(action:String,payload:JSONObject):Result{')
          end=api.index('\n    private fun accountUpsert',start)
          service_owner='''    private fun serviceOwnerCall(action:String,payload:JSONObject):Result{\n        if(ServiceFaultInjection.cloudflareDisabled(appContext))return Result(false,-1,null,"TEST_CLOUDFLARE_DISABLED")\n        val d=m2Transport.discoverySnapshot()?:return Result(false,503,null,"SERVICE_DISCOVERY_UNAVAILABLE")\n        if(d.optString("authority_mode")!="SERVICE_PRIMARY")return Result(false,409,d,"SERVICE_NOT_WRITE_AUTHORITY")\n        val base=d.optString("service_url").trimEnd('/')\n        if(!base.startsWith("https://"))return Result(false,503,d,"SERVICE_URL_INVALID")\n        val path=when(action){\n            "history_correction"->"/v1/corrections"\n            "session_work_update"->"/v1/session/work"\n            "session_exit_guarded"->"/v1/session/exit"\n            "attendance_time_correct"->"/v1/session/time-correction"\n            "attendance_exit_delete"->"/v1/session/delete-exit"\n            "attendance_session_delete"->"/v1/session/delete-enter"\n            "service_connections"->"/v1/service/connections"\n            "account_delete"->"/v1/admin/accounts/delete"\n            "history_delete"->"/v1/history/delete"\n            else->"/v1/admin/resources"\n        }\n        val method=if(action in setOf("resource_master_list","service_connections"))"GET" else "POST"\n        val body=JSONObject(payload.toString())\n        if(action=="resource_master_upsert")body.put("operation","UPSERT")\n        if(action=="resource_master_delete")body.put("operation","DELETE")\n        fun request(bearer:String):Result{\n            var conn:HttpURLConnection?=null\n            return try{\n                conn=(URL(base+path).openConnection() as HttpURLConnection).apply{\n                    requestMethod=method;connectTimeout=6_000;readTimeout=12_000\n                    setRequestProperty("Accept","application/json")\n                    setRequestProperty("Authorization","Bearer $bearer")\n                    if(method=="POST"){doOutput=true;setRequestProperty("Content-Type","application/json; charset=utf-8")}\n                }\n                if(method=="POST")conn!!.outputStream.use{it.write(body.toString().toByteArray(Charsets.UTF_8))}\n                val http=conn!!.responseCode\n                val stream=if(http in 200..299)conn!!.inputStream else conn!!.errorStream\n                val text=stream?.bufferedReader(Charsets.UTF_8)?.use{it.readText()}.orEmpty()\n                val j=runCatching{if(text.isBlank())JSONObject() else JSONObject(text)}.getOrElse{JSONObject().put("error","HTTP_${http}_INVALID_JSON")}\n                val ok=http in 200..299&&j.optBoolean("ok",false)\n                val error=if(ok)null else (j.optJSONObject("error")?.optString("code")?.takeIf{it.isNotBlank()}?:j.optString("error","HTTP_$http"))\n                Result(ok,http,j,error)\n            }catch(t:Throwable){Result(false,-1,null,t.message?:"SERVICE_OWNER_CALL_FAILED")}finally{conn?.disconnect()}\n        }\n        var bearer=M2ServiceSessionManager.current(appContext).orEmpty()\n        if(bearer.isBlank())bearer=M2ServiceSessionManager.ensure(appContext,base,token,force=true).orEmpty()\n        if(bearer.isBlank())return Result(false,401,null,"SERVICE_SESSION_UNAVAILABLE")\n        var result=request(bearer)\n        if(result.code==401){\n            M2ServiceSessionManager.clearIfSame(appContext,bearer)\n            val fresh=M2ServiceSessionManager.ensure(appContext,base,token,force=true).orEmpty()\n            if(fresh.isNotBlank())result=request(fresh)\n        }\n        return result\n    }\n'''
          api=api[:start]+service_owner+api[end:]

          # Restore Staff tab.
          old_nav='''        val items=mutableListOf(\n            Triple(R.drawable.ic_pp_business,"Nghiệp vụ","BUSINESS"),\n            Triple(R.drawable.ic_pp_history,"Lịch sử","HISTORY"),\n            Triple(R.drawable.ic_pp_settings,"Cài đặt","SETTINGS")\n        )'''
          new_nav='''        val items=mutableListOf(\n            Triple(R.drawable.ic_pp_business,"Nghiệp vụ","BUSINESS"),\n            Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF"),\n            Triple(R.drawable.ic_pp_history,"Lịch sử","HISTORY"),\n            Triple(R.drawable.ic_pp_settings,"Cài đặt","SETTINGS")\n        )'''
          ops=once(ops,old_nav,new_nav,'restore Staff tab')

          # Compact header while preserving status semantics.
          header_pattern=r'    private fun headerStatusChip\(iconRes:Int,label:String,valueView:TextView,click:\(\)->Unit\)=row\(Color\.TRANSPARENT\)\.apply\{.*?\}\n    private fun greetingText'
          header_new='''    private fun headerStatusChip(iconRes:Int,label:String,valueView:TextView,click:()->Unit)=row(Color.TRANSPARENT).apply{\n        gravity=Gravity.CENTER_VERTICAL\n        setPadding(dp(5),dp(3),dp(5),dp(3))\n        background=round(Color.argb(32,255,255,255),12)\n        isClickable=true;isFocusable=true;setOnClickListener{click()}\n        addView(ImageView(this@OperationsActivity).apply{setImageResource(iconRes);imageTintList=ColorStateList.valueOf(Color.WHITE);setPadding(dp(1),dp(1),dp(1),dp(1))},size(dp(19),dp(19)))\n        addView(column(Color.TRANSPARENT).apply{\n            addView(txt(label,7f,Color.argb(210,255,255,255),false).apply{maxLines=1;setAutoSizeTextTypeUniformWithConfiguration(6,8,1,android.util.TypedValue.COMPLEX_UNIT_SP)})\n            addView(valueView.apply{maxLines=1;setAutoSizeTextTypeUniformWithConfiguration(6,9,1,android.util.TypedValue.COMPLEX_UNIT_SP)})\n        },LinearLayout.LayoutParams(0,-2,1f).apply{marginStart=dp(3)})\n    }\n    private fun greetingText'''
          ops,n=re.subn(header_pattern,header_new,ops,count=1,flags=re.S)
          if n!=1: raise RuntimeError(f'headerStatusChip patch: {n}')

          appbar_pattern=r'    private fun appBar\(title:String\)=column\(Color\.TRANSPARENT\)\.apply\{.*?refreshHeaderConnection\(\)\}\n    private fun activeTab'
          appbar_new='''    private fun appBar(title:String)=column(Color.TRANSPARENT).apply{\n        setPadding(dp(12),dp(7),dp(12),dp(8));background=gradient(navy,accent,0)\n        val identity=row(Color.TRANSPARENT).apply{gravity=Gravity.CENTER_VERTICAL}\n        if(!isRootScreen())identity.addView(ImageView(this@OperationsActivity).apply{setImageResource(R.drawable.ic_pp_back);imageTintList=ColorStateList.valueOf(Color.WHITE);setPadding(dp(6),dp(6),dp(6),dp(6));setOnClickListener{navigateBack()}},size(dp(32),dp(32)))\n        identity.addView(txt(greetingText(),15.2f,Color.WHITE,true).apply{maxLines=1;ellipsize=android.text.TextUtils.TruncateAt.END},LinearLayout.LayoutParams(0,-2,1f).apply{if(!isRootScreen())marginStart=dp(2)})\n        identity.addView(ImageView(this@OperationsActivity).apply{contentDescription="Làm mới và đồng bộ dữ liệu";setImageResource(R.drawable.ic_pp_refresh_round);imageTintList=ColorStateList.valueOf(Color.WHITE);setPadding(dp(6),dp(6),dp(6),dp(6));setOnClickListener{manualRefreshFromHeader(this)}},size(dp(32),dp(32)))\n        addView(identity,matchWrap());addView(gap(6))\n        val statuses=row(Color.TRANSPARENT).apply{gravity=Gravity.CENTER}\n        val net=txt("—",8.8f,Color.WHITE,true);networkStatusText=net\n        val syn=txt("—",8.8f,Color.WHITE,true);syncStatusText=syn\n        val svc=txt("—",8.8f,Color.WHITE,true);serviceStatusText=svc\n        statuses.addView(headerStatusChip(R.drawable.ic_pp_network,"Mạng",net){showHeaderStatusDetail("NETWORK")},LinearLayout.LayoutParams(0,dp(38),1f).apply{marginEnd=dp(2)})\n        statuses.addView(headerStatusChip(R.drawable.ic_pp_sync,"Đồng bộ",syn){showHeaderStatusDetail("SYNC")},LinearLayout.LayoutParams(0,dp(38),1f).apply{marginStart=dp(1);marginEnd=dp(1)})\n        statuses.addView(headerStatusChip(R.drawable.ic_pp_service,"Dịch vụ",svc){showHeaderStatusDetail("SERVICE")},LinearLayout.LayoutParams(0,dp(38),1f).apply{marginStart=dp(2)})\n        addView(statuses,matchWrap());refreshHeaderConnection()\n    }\n    private fun activeTab'''
          ops,n=re.subn(appbar_pattern,appbar_new,ops,count=1,flags=re.S)
          if n!=1: raise RuntimeError(f'appBar patch: {n}')

          # Compact business cards and row height.
          ops=once(ops,'setPadding(dp(9),dp(10),dp(9),dp(9))','setPadding(dp(7),dp(7),dp(7),dp(7))','business card padding')
          ops=once(ops,'addView(businessIconBubble(iconRes),size(dp(58),dp(58)))','addView(businessIconBubble(iconRes),size(dp(52),dp(52)))','business icon size')
          ops=once(ops,'addView(gap(9))\n        addView(txt(title,13.5f,ink,true)','addView(gap(6))\n        addView(txt(title,13.1f,ink,true)','business title gap')
          ops=once(ops,'addView(gap(5))\n        addView(View(this@OperationsActivity).apply{background=round(teal,2)},size(dp(28),dp(3)))','addView(gap(3))\n        addView(View(this@OperationsActivity).apply{background=round(teal,2)},size(dp(26),dp(3)))','business underline gap')
          ops=once(ops,'addView(a,LinearLayout.LayoutParams(0,dp(132),1f).apply{marginEnd=dp(4)})\n        addView(b,LinearLayout.LayoutParams(0,dp(132),1f).apply{marginStart=dp(4)})','addView(a,LinearLayout.LayoutParams(0,dp(122),1f).apply{marginEnd=dp(3)})\n        addView(b,LinearLayout.LayoutParams(0,dp(122),1f).apply{marginStart=dp(3)})','business row compact')
          ops=ops.replace('body.addView(gap(5))\n        body.addView(businessRow(cards[2],cards[3]));body.addView(gap(5))\n        body.addView(businessRow(cards[4],cards[5]));body.addView(gap(5))','body.addView(gap(4))\n        body.addView(businessRow(cards[2],cards[3]));body.addView(gap(4))\n        body.addView(businessRow(cards[4],cards[5]));body.addView(gap(4))',1)

          # Attendance editor: Add is never blocked by already having Pick+Pack; Edit starts with no boxes selected.
          ops=once(ops,'        if(editMode=="ADD"&&hadPick&&hadPack){TopNotice.show(this,"Đã có đủ Pick & Pack trong ca.",TopNotice.Kind.INFO);return}\n','', 'remove add Pick+Pack block')
          old_checks='''        val pickOn=CheckBox(this).apply{text="Có công việc PICK";isChecked=if(editMode=="ADD")!hadPick else hadPick;isEnabled=editMode=="EDIT"||!hadPick;setTextColor(if(isEnabled)ink else muted)}\n        val packOn=CheckBox(this).apply{text="Có công việc PACK";isChecked=if(editMode=="ADD")!hadPack else hadPack;isEnabled=editMode=="EDIT"||!hadPack;setTextColor(if(isEnabled)ink else muted)}\n        if(editMode=="ADD"&&!hadPick&&!hadPack){pickOn.isChecked=false;packOn.isChecked=false}\n        dialogBody.addView(pickOn,matchWrap());dialogBody.addView(packOn,matchWrap());dialogBody.addView(gap(7));val host=column(surface);dialogBody.addView(host,matchWrap())'''
          new_checks='''        val pickOn=CheckBox(this).apply{text="Có công việc PICK";isChecked=false;isEnabled=true;setTextColor(ink)}\n        val packOn=CheckBox(this).apply{text="Có công việc PACK";isChecked=false;isEnabled=true;setTextColor(ink)}\n        dialogBody.addView(pickOn,matchWrap());val pickHost=column(surface);dialogBody.addView(pickHost,matchWrap());dialogBody.addView(gap(5))\n        dialogBody.addView(packOn,matchWrap());val packHost=column(surface);dialogBody.addView(packHost,matchWrap());dialogBody.addView(gap(7))'''
          ops=once(ops,old_checks,new_checks,'checkbox/inline editor layout')
          ops=once(ops,'            host.removeAllViews();pdaField=null;selectedPda=null;pickSpinner=null;pickChoices.clear();selectedPack=null','            pickHost.removeAllViews();packHost.removeAllViews();pdaField=null;selectedPda=null;pickSpinner=null;pickChoices.clear();selectedPack=null','split editor hosts')
          sw=ops.index('    private fun sessionWorkEditor(ctx:JSONObject,mode:String){')
          p1=ops.index('            if(pickOn.isChecked){',sw)
          p2=ops.index('            if(packOn.isChecked){',p1)
          p3=ops.index('            if(!pickOn.isChecked&&!packOn.isChecked)',p2)
          pick_region=ops[p1:p2].replace('host.addView','pickHost.addView')
          pack_region=ops[p2:p3].replace('host.addView','packHost.addView')
          ops=ops[:p1]+pick_region+pack_region+ops[p3:]
          ops=once(ops,'            if(!pickOn.isChecked&&!packOn.isChecked)host.addView(info("Không gán công việc PICK/PACK. Lưu để trả toàn bộ tài nguyên đang giữ."))\n','', 'remove old clear-resources hint')
          old_toggles='''        var addToggleGuard=false\n        pickOn.setOnCheckedChangeListener{_,on->if(editMode=="ADD"&&!hadPick&&!hadPack&&on&&!addToggleGuard){addToggleGuard=true;packOn.isChecked=false;addToggleGuard=false};rebuild()}\n        packOn.setOnCheckedChangeListener{_,on->if(editMode=="ADD"&&!hadPick&&!hadPack&&on&&!addToggleGuard){addToggleGuard=true;pickOn.isChecked=false;addToggleGuard=false};rebuild()}'''
          new_toggles='''        var addToggleGuard=false\n        pickOn.setOnCheckedChangeListener{_,on->if(editMode=="ADD"&&on&&!addToggleGuard){addToggleGuard=true;packOn.isChecked=false;addToggleGuard=false};rebuild()}\n        packOn.setOnCheckedChangeListener{_,on->if(editMode=="ADD"&&on&&!addToggleGuard){addToggleGuard=true;pickOn.isChecked=false;addToggleGuard=false};rebuild()}'''
          ops=once(ops,old_toggles,new_toggles,'add one work kind per operation')
          ops=once(ops,'                val currentPick=ses.optString("user_pick").trim();if(currentPick.isNotBlank()&&!base.contains(currentPick))base.add(currentPick)','                val currentPick=if(editMode=="EDIT")ses.optString("user_pick").trim() else "";if(currentPick.isNotBlank()&&!base.contains(currentPick))base.add(currentPick)','add Pick starts new user choice')
          ops=once(ops,'                val currentTable=ses.optString("pack_table").trim();val currentUser=ses.optString("user_pack").trim()','                val currentTable=if(editMode=="EDIT")ses.optString("pack_table").trim() else "";val currentUser=if(editMode=="EDIT")ses.optString("user_pack").trim() else ""','add Pack starts new user choice')
          old_save='''            val pickChoice=if(pickOn.isChecked)pickChoices.getOrNull(pickSpinner?.selectedItemPosition?:0) else null;val pick=if(editMode=="ADD"&&hadPick)ses.optString("user_pick") else pickChoice?.first.orEmpty();val pda=if(editMode=="ADD"&&hadPick)ses.optString("pda_serial") else if(pickOn.isChecked)(selectedPda?.optString("serial").orEmpty().ifBlank{resolvePda(pdas,pdaField?.text?.toString().orEmpty()).orEmpty()}) else ""\n            p.put("pda_serial",pda).put("user_pick",pick)\n            var reissue=pickChoice?.second==true\n            if(editMode=="ADD"&&hadPack){p.put("pack_table",ses.optString("pack_table")).put("user_pack",ses.optString("user_pack"))}else if(packOn.isChecked){val row=selectedPack;if(row==null){showError("Chọn Bàn Pack + User Pack hợp lệ.");return@setPositiveButton};p.put("pack_table",row.optString("table")).put("user_pack",row.optString("user_pack"));reissue=reissue||row.optBoolean("duplicate_user")}else p.put("pack_table","").put("user_pack","")\n            if(reissue)p.put("duplicate_user",true)\n            val current=ses.optString("work_choice");val primary=when{pickOn.isChecked&&packOn.isChecked&&current in setOf("PICK","PACK")->current;pickOn.isChecked->"PICK";packOn.isChecked->"PACK";else->"KHONG"}\n            val baseNote=when{pickOn.isChecked&&packOn.isChecked->"PICK + PACK";pickOn.isChecked->"PICK";packOn.isChecked->"PACK";else->"Không gán công việc"};p.put("work_choice",primary).put("resource_note",ses.optString("resource_note")).put("mutation_kind",editMode).put("audit_note",if(reissue)"$baseNote • PHÁT LẠI USER" else baseNote)'''
          new_save='''            val pickChoice=if(pickOn.isChecked)pickChoices.getOrNull(pickSpinner?.selectedItemPosition?:0) else null\n            val pick=if(pickOn.isChecked)pickChoice?.first.orEmpty() else ses.optString("user_pick")\n            val pda=when{!pickOn.isChecked->ses.optString("pda_serial");editMode=="ADD"&&hadPick->ses.optString("pda_serial");else->selectedPda?.optString("serial").orEmpty().ifBlank{resolvePda(pdas,pdaField?.text?.toString().orEmpty()).orEmpty()}}\n            p.put("pda_serial",pda).put("user_pick",pick)\n            var reissue=pickChoice?.second==true\n            if(packOn.isChecked){val row=selectedPack;if(row==null){showError("Chọn Bàn Pack + User Pack hợp lệ.");return@setPositiveButton};p.put("pack_table",row.optString("table")).put("user_pack",row.optString("user_pack"));reissue=reissue||row.optBoolean("duplicate_user")}else{p.put("pack_table",ses.optString("pack_table")).put("user_pack",ses.optString("user_pack"))}\n            if(reissue)p.put("duplicate_user",true)\n            val current=ses.optString("work_choice").uppercase();val primary=if(current in setOf("PICK","PACK"))current else when{pickOn.isChecked->"PICK";packOn.isChecked->"PACK";else->"KHONG"}\n            val baseNote=when{pickOn.isChecked&&packOn.isChecked->"PICK + PACK";pickOn.isChecked->"PICK";packOn.isChecked->"PACK";else->"Điều chỉnh ca / thông tin"};p.put("work_choice",primary).put("resource_note",ses.optString("resource_note")).put("mutation_kind",editMode).put("audit_note",if(reissue)"$baseNote • PHÁT LẠI USER" else baseNote)'''
          ops=once(ops,old_save,new_save,'session work save semantics')

          # No confirmation when exiting without a PDA.
          old_no_pda='if(pda.isBlank()){AlertDialog.Builder(this).setTitle("Xác nhận RA CA").setMessage("Xác nhận kết thúc phiên?").setNegativeButton("Hủy",null).setPositiveButton("RA CA"){_,_->doExit("")}.show();return@setOnClickListener}'
          ops=once(ops,old_no_pda,'if(pda.isBlank()){doExit("");return@setOnClickListener}','exit without PDA')

          # Two balanced time-edit buttons on one row.
          old_active_time='if(isAdmin()){body.addView(gap(7));body.addView(smallButton("Sửa giờ vào – ra ca",navy).apply{setOnClickListener{editAttendanceTimes(ctx)}},matchWrap())}'
          new_active_time='''if(isAdmin()){body.addView(gap(7));val timeActions=row(bg);val editIn=smallButton("Sửa giờ vào",navy).apply{setOnClickListener{editAttendanceTime(ctx,"enter_at")}};val editOut=smallButton("Sửa giờ ra",teal).apply{isEnabled=ses.optString("exit_at").isNotBlank();alpha=if(isEnabled)1f else .42f;setOnClickListener{if(isEnabled)editAttendanceTime(ctx,"exit_at")}};timeActions.addView(editIn,LinearLayout.LayoutParams(0,dp(40),1f).apply{marginEnd=dp(3)});timeActions.addView(editOut,LinearLayout.LayoutParams(0,dp(40),1f).apply{marginStart=dp(3)});body.addView(timeActions,matchWrap())}'''
          ops=once(ops,old_active_time,new_active_time,'active time buttons')
          old_ended_time='body.addView(smallButton("SỬA GIỜ VÀO – RA CA",navy).apply{setOnClickListener{editAttendanceTimes(ctx)}},matchWrap());body.addView(gap(6));body.addView(gap(6));body.addView(primary("XÓA GHI NHẬN RA CA",red){deleteExitRecord(ctx)},matchWrap())'
          new_ended_time='''val timeActions=row(bg);timeActions.addView(smallButton("SỬA GIỜ VÀO",navy).apply{setOnClickListener{editAttendanceTime(ctx,"enter_at")}},LinearLayout.LayoutParams(0,dp(40),1f).apply{marginEnd=dp(3)});timeActions.addView(smallButton("SỬA GIỜ RA",teal).apply{setOnClickListener{editAttendanceTime(ctx,"exit_at")}},LinearLayout.LayoutParams(0,dp(40),1f).apply{marginStart=dp(3)});body.addView(timeActions,matchWrap());body.addView(gap(6));body.addView(primary("XÓA GHI NHẬN RA CA",red){deleteExitRecord(ctx)},matchWrap())'''
          ops=once(ops,old_ended_time,new_ended_time,'ended time buttons')

          # Resource list: remove the PDA explanatory note only.
          old_res_note='body.addView(info("Danh mục dùng chung. Thay đổi được ghi nhận vào lịch sử; xóa yêu cầu xác thực lại mật khẩu."));body.addView(gap(8))'
          new_res_note='if(type!="PDA"){body.addView(info("Danh mục dùng chung. Thay đổi được ghi nhận vào lịch sử; xóa yêu cầu xác thực lại mật khẩu."));body.addView(gap(8))}'
          ops=once(ops,old_res_note,new_res_note,'remove PDA list note')

          # History bulk controls in one balanced row.
