name: Beta69 candidate v6 status diagnostic
on:
  push:
    branches: [ release/beta69-owner-six-fixes-20260825 ]
    paths: [ '.github/workflows/_diag_beta69_candidate_v6_status.yml' ]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read candidate v6 workflow status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'repos/{repo}/actions/workflows/_oneoff_beta69_candidate_v6.yml/runs?branch=release%2Fbeta69-owner-six-fixes-20260825&per_page=5'
          j=json.loads(subprocess.check_output(['gh','api',url],text=True))
          lines=[]
          for r in j.get('workflow_runs',[])[:5]:
              lines.append(f"run_id={r.get('id')} status={r.get('status')} conclusion={r.get('conclusion')} head_sha={r.get('head_sha')} event={r.get('event')} created_at={r.get('created_at')}")
          open('ops/beta69-candidate-v6-status.txt','w').write('\n'.join(lines)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta69-candidate-v6-status.txt
          git commit -m 'ops: capture Beta69 candidate v6 workflow status' || true
          git push origin HEAD:release/beta69-owner-six-fixes-20260825
