name: Beta59 Attendance Push Gate

on:
  push:
    branches:
      - agent/beta59-attendance-owner-fixes-20260823
    paths:
      - 'ops/beta59-attendance-trigger.txt'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta59-attendance-owner-fixes-20260823
          fetch-depth: 0
      - name: Apply S60 patch
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_s60_beta59_attendance_owner_fix.py
          python3 tools/apply_s60_beta59_attendance_owner_fix.py
      - name: Static guards
        run: |
          set -euo pipefail
          F=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'S60_BETA59_OWNER_ATTENDANCE_UI' "$F"
          grep -q '"Quét QR nhân sự",""' "$F"
          grep -q 'Seri PDA được chọn' "$F"
          grep -q 'PDA SỬ DỤNG TRONG CA' "$F"
          grep -q 'sessionWorkEditor(ctx,"ADD")' "$F"
          grep -q 'sessionWorkEditor(ctx,"EDIT")' "$F"
          grep -q 'deleteSessionWork(ctx)' "$F"
          grep -q '"Ra lúc" to "—"' "$F"
          ! grep -q 'SERI PDA ĐÃ CHỌN' "$F"
          ! grep -q 'PDA ĐANG GIỮ TRONG PHIÊN' "$F"
          ! grep -q 'THÊM / SỬA CÔNG VIỆC TRONG CA' "$F"
          grep -q 'versionCode = 65' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.59"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          else
            SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
            mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Build Beta59 and Stable validation
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt app/build.gradle.kts
          git commit -m 'feat(beta59): attendance owner fixes'
          git push origin HEAD:agent/beta59-attendance-owner-fixes-20260823
