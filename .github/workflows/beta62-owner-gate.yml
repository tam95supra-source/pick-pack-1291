name: Beta62 Owner Gate

on:
  pull_request:
    branches: [ ci/beta62-owner-gate-base-20260823 ]

permissions:
  contents: write

concurrency:
  group: beta62-owner-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-compile:
    if: github.event.pull_request.head.ref == 'agent/beta62-owner-ui-mutation-faultfix-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize deterministic Beta62 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_beta62_owner_fixes.py
          python3 tools/apply_beta62_owner_fixes.py
      - name: Beta62 owner contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          op=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt').read_text()
          fb=Path('app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt').read_text()
          tr=Path('app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt').read_text()
          rb=Path('app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt').read_text()
          api=Path('app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt').read_text()
          log=Path('app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 68' in gradle and 'versionName = "0.4.2-beta.62"' in gradle
          assert 'versionCode = 1' in gradle and 'versionName = "0.1.0-stable"' in gradle
          assert 'private fun mnvInput(h:String)=scanField(h,true,50)' in op
          assert 'mnvInput("Scan / Nhập mã nhân viên")' in op
          assert 'if(!isRootScreen())navigateBack()' in op
          assert 'confirmPdaHandoverCondition' in op
          assert 'Nhập 5 số cuối PDA' in op
          pda=op[op.index('private fun pdaExchangeScreen'):]
          assert 'val find=primary("TÌM PDA"' not in pda
          assert 'Triple(R.drawable.ic_pp_account,"Quyền","ROLE_MODE")' in op
          assert 'setMessage("Nhập mật khẩu thực tế")' in op
          assert 'Nhập mã 4 số theo giờ Việt Nam' not in op
          assert 'ĐANG TRONG PHIÊN' not in op
          assert 'body.addView(status("ĐÃ RA CA"' not in op
          assert 'DirectOwnerDiagnostics.record' in api
          assert 'DirectOwnerDiagnostics.snapshotLines' in log
          assert 'GOOGLE_RELAY_TEST' not in rb
          assert 'SERVICE_D1_BLOCKED_TEST' in rb
          assert 'return flushFallbackItems(store.unresolvedMutations(100))' not in tr
          assert 'Hiện mật khẩu' in fb and 'ĐĂNG KÝ' in fb
          assert 'owner_launcher' not in fb[fb.index('private fun login()'):fb.index('private fun openMainShell()')]
          assert 'Pick Pack 1291' in fb and 'Supra DC Hưng Yên' in fb
          print('STATIC_OWNER_CONTRACTS=PASS')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Beta + Stable debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
      - name: Commit validated product source to Beta62 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt \
            app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt \
            app/src/main/java/vn/pickpack1291/app/beta/BetaApiClient.kt \
            app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt \
            app/src/main/java/vn/pickpack1291/app/beta/MasterDataCache.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: Beta62 owner UI mutation and fault-injection fixes [beta62-source]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
