name: Beta119 live SUPERADMIN auth regression

on:
  push:
    branches:
      - release/beta119-superadmin-auth-control-plane-20260904
    paths:
      - ops/beta119-live-auth-request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta119-live-superadmin-auth
  cancel-in-progress: false

jobs:
  live-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      RESULT_PATH: /tmp/beta119-live-auth-regression.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fence exact candidate and unchanged auth source
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta119-live-auth-request.json
          jq -e '.channel=="BETA" and .version_name=="0.4.2-beta.119" and .version_code==125 and .candidate_run_id==33864111135 and .candidate_artifact_id==9933396813 and .source_sha=="eeb45df6deae267d93a5fb15701a0a394885a549" and .gas_deploy_run_id==33864705259 and .stable_write==false' "$R" >/dev/null
          git diff --quiet "$(jq -r .source_sha "$R")" HEAD -- app google-apps-script
          python3 tools/beta119_superadmin_auth_contract.py
      - name: Get Google access token without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS --connect-timeout 15 --max-time 30 https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token)
          ACCESS_TOKEN=$(jq -r '.access_token//empty' <<<"$TOKEN_JSON")
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          printf 'ACCESS_TOKEN=%s\n' "$ACCESS_TOKEN" >> "$GITHUB_ENV"
      - name: Live auth regression with secret-free output
        run: python3 tools/beta119_live_auth_regression.py
      - name: Validate receipt contains no credential material
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status=="PASS" and .secret_values_recorded==false and .time_login=="PASS" and .legacy_static_superadmin_password=="REJECTED" and .otp_delivery=="PASS_NO_SECRET_IN_RESPONSE"' "$RESULT_PATH" >/dev/null
          ! grep -Eqi 'login_id|@|[0-9]{8}|token|password|otp_value|challenge' "$RESULT_PATH"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beta119-live-auth-${{ github.run_id }}
          path: /tmp/beta119-live-auth-regression.json
          retention-days: 30
          if-no-files-found: error
