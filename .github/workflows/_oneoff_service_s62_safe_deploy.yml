name: Oneoff Service S62 Safe Production Deploy

on:
  pull_request:
    branches:
      - deploy/service-s62-safe-base-20260824
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: oneoff-service-s62-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/service-s62-clean-exec-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock exact S62 source and typecheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 tools/apply_service_s62_session_authority_fix.py
          grep -F 'aOverride?:Awaited<ReturnType<typeof currentAuthority>>' service/src/session_hotfix.ts
          grep -F 'const a=aOverride??await currentAuthority(env.DB);' service/src/session_hotfix.ts
          test "$(grep -o ',idem,newVersion,a);const stmts=eventStmts(env.DB,e,a.authority_seq' service/src/session_hotfix.ts | wc -l)" -ge 5
          cd service
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Generate locked production Wrangler config
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.prod.s62.jsonc <<'EOF'
          {
            "$schema":"./node_modules/wrangler/config-schema.json",
            "name":"pick-pack-1291-service",
            "main":"src/entry_product.ts",
            "compatibility_date":"2026-08-08",
            "compatibility_flags":["nodejs_compat"],
            "workers_dev":true,
            "placement":{"mode":"smart"},
            "vars":{"SERVICE_GENERATION":"m2-prod-20260819-001","GOOGLE_SOURCE_SHEET_ID":"1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78"},
            "d1_databases":[{"binding":"DB","database_name":"pick-pack-1291-service-prod","database_id":"b619df89-528d-4126-a948-de0425037b11","migrations_dir":"migrations"}],
            "durable_objects":{"bindings":[{"name":"REALTIME_HUB","class_name":"RealtimeHub"}]},
            "migrations":[{"tag":"v1","new_sqlite_classes":["RealtimeHub"]}],
            "assets":{"directory":"./public","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/health","/v1/*","/internal/*"]},
            "triggers":{"crons":["*/1 * * * *"]},
            "observability":{"enabled":true,"head_sampling_rate":1}
          }
          EOF

      - name: Pre-deploy D1 and GAS authority fence
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler d1 execute pick-pack-1291-service-prod --remote --config wrangler.prod.s62.jsonc --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation,updated_at FROM authority_state WHERE singleton_id=1" --json > /tmp/pre-d1.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pre-d1.json'))
          rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'mode' in v and 'scope' in v: rows.append(v)
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(x)
          assert rows, x
          r=rows[0]
          assert r.get('mode')=='SERVICE_PRIMARY', r
          assert r.get('scope')=='PRODUCTION', r
          assert str(r.get('service_generation') or ''), r
          print('D1_AUTHORITY_PRE_PASS',r.get('authority_epoch'),r.get('authority_seq'),r.get('service_generation'))
          PY
          curl -fsSL --connect-timeout 20 --max-time 90 -H 'content-type: application/json' "$GAS_URL" -d '{"action":"service_discovery","_app_channel":"BETA","_app_version":"0.4.2-beta.62"}' > /tmp/pre-discovery.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/pre-discovery.json'))
          assert j.get('ok') is True,j
          assert j.get('authority_mode')=='SERVICE_PRIMARY',j
          a=j.get('authority') or {}
          assert a.get('scope')=='PRODUCTION',j
          print('GAS_DISCOVERY_PRE_PASS')
          print('gas_service_url='+str(j.get('service_url') or ''))
          print('gas_generation='+str(j.get('service_generation') or ''))
          PY

      - name: Deploy exact S62 source
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.prod.s62.jsonc --keep-vars 2>&1 | tee /tmp/deploy.log
          sed -n 's/.*Version ID: */worker_version_id=/p' /tmp/deploy.log | tail -1 > /tmp/version.txt || true
          grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 > /tmp/deploy-url.txt || true

      - name: Post-deploy D1, Cloudflare route and live endpoint verification
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute pick-pack-1291-service-prod --remote --config wrangler.prod.s62.jsonc --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation,updated_at FROM authority_state WHERE singleton_id=1" --json > /tmp/post-d1.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/post-d1.json'));rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'mode' in v and 'scope' in v: rows.append(v)
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(x);assert rows,x;r=rows[0]
          assert r.get('mode')=='SERVICE_PRIMARY',r
          assert r.get('scope')=='PRODUCTION',r
          print('D1_AUTHORITY_POST_PASS',r.get('authority_epoch'),r.get('authority_seq'),r.get('service_generation'))
          PY
          curl -fsS --connect-timeout 20 --max-time 60 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > /tmp/cf-subdomain.json
          python3 - <<'PY' > /tmp/cf-url.txt
          import json
          j=json.load(open('/tmp/cf-subdomain.json'));assert j.get('success') is True,j
          s=str((j.get('result') or {}).get('subdomain') or '').strip();assert s,s
          print('https://pick-pack-1291-service.'+s+'.workers.dev')
          PY
          python3 - <<'PY' > /tmp/gas-url.txt
          import json
          j=json.load(open('/tmp/pre-discovery.json'));print(str(j.get('service_url') or '').rstrip('/'))
          PY
          cat /tmp/gas-url.txt /tmp/deploy-url.txt /tmp/cf-url.txt | sed '/^$/d' | awk '!seen[$0]++' > /tmp/candidates.txt
          : > /tmp/live-url.txt
          : > /tmp/probe-summary.txt
          while read -r base; do
            host=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.urlparse(sys.argv[1]).hostname or "")' "$base")
            code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/health.json -w '%{http_code}' "$base/health" 2>/tmp/curl.err || true)
            if [[ "$code" != 200 ]]; then
              curl -fsS --connect-timeout 10 --max-time 30 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$host&type=A" > /tmp/doh.json || true
              ip=$(python3 - <<'PY'
          import json
          try:j=json.load(open('/tmp/doh.json'))
          except:print('');raise SystemExit
          ans=j.get('Answer') or []
          print(next((str(x.get('data')) for x in ans if x.get('type')==1 and x.get('data')),''))
          PY
          )
              if [[ -n "$ip" ]]; then code=$(curl -sS --resolve "$host:443:$ip" --connect-timeout 10 --max-time 30 -o /tmp/health.json -w '%{http_code}' "$base/health" 2>/tmp/curl.err || true); fi
            fi
            echo "$base $code" >> /tmp/probe-summary.txt
            if [[ "$code" == 200 ]] && python3 - <<'PY'
          import json
          try:j=json.load(open('/tmp/health.json'))
          except:raise SystemExit(1)
          a=j.get('authority') if isinstance(j.get('authority'),dict) else {}
          ok=j.get('ok') is True and (j.get('authority_mode') or a.get('mode'))=='SERVICE_PRIMARY' and (j.get('authority_scope') or a.get('scope'))=='PRODUCTION'
          raise SystemExit(0 if ok else 1)
          PY
            then echo "$base" > /tmp/live-url.txt; break; fi
          done < /tmp/candidates.txt
          cat /tmp/probe-summary.txt
          test -s /tmp/live-url.txt
          LIVE_URL=$(cat /tmp/live-url.txt)
          probe(){ curl -sS -o /tmp/probe.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' "$LIVE_URL$1"; }
          r1=$(probe /v1/session/work); r2=$(probe /v1/session/exit); r3=$(probe /v1/session/time-correction); r4=$(probe /v1/session/delete-exit); r5=$(probe /v1/session/delete-enter)
          test "$r1" = 401; test "$r2" = 401; test "$r3" = 401; test "$r4" = 401; test "$r5" = 401
          GAS_SERVICE_URL=$(cat /tmp/gas-url.txt)
          route_match=no; [[ "$GAS_SERVICE_URL" == "$LIVE_URL" ]] && route_match=yes
          {
            echo "source_sha=${{ github.event.pull_request.head.sha }}"
            cat /tmp/version.txt 2>/dev/null || true
            echo "live_service_url=$LIVE_URL"
            echo "gas_service_url=$GAS_SERVICE_URL"
            echo "gas_route_matches_live=$route_match"
            echo "session_work_route=$r1"
            echo "session_exit_route=$r2"
            echo "time_correction_route=$r3"
            echo "delete_exit_route=$r4"
            echo "delete_enter_route=$r5"
            echo "authority=SERVICE_PRIMARY/PRODUCTION"
            echo "deploy=PASS"
            echo "verdict=$([[ "$route_match" == yes ]] && echo PASS || echo ROUTE_DRIFT)"
          } > /tmp/service-s62-deploy-receipt.txt
          cat /tmp/service-s62-deploy-receipt.txt
          [[ "$route_match" == yes ]]

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-s62-production-deploy-evidence
          path: |
            /tmp/service-s62-deploy-receipt.txt
            /tmp/pre-d1.json
            /tmp/post-d1.json
            /tmp/pre-discovery.json
            /tmp/probe-summary.txt
            /tmp/deploy-url.txt
            /tmp/cf-url.txt
            /tmp/gas-url.txt
            /tmp/live-url.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove generated production config
        if: always()
        working-directory: service
        run: rm -f wrangler.prod.s62.jsonc
