name: Oneoff Service S62 Safe Production Deploy

on:
  pull_request:
    branches:
      - deploy/service-s62-safe-base-20260824
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: oneoff-service-s62-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/service-s62-session-authority-cas-fix-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock exact S62 source and typecheck
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 tools/apply_service_s62_session_authority_fix.py
          grep -F 'aOverride?:Awaited<ReturnType<typeof currentAuthority>>' service/src/session_hotfix.ts
          grep -F 'const a=aOverride??await currentAuthority(env.DB);' service/src/session_hotfix.ts
          test "$(grep -o ',idem,newVersion,a);const stmts=eventStmts(env.DB,e,a.authority_seq' service/src/session_hotfix.ts | wc -l)" -ge 5
          cd service
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Discover current workers.dev URL from Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          code=$(curl -sS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 \
            -o /tmp/cf-subdomain.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          test "$code" = 200
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,re
          j=json.load(open('/tmp/cf-subdomain.json'))
          assert j.get('success') is True,j
          r=j.get('result') or {}
          sub=str(r.get('subdomain') or '').strip()
          assert re.fullmatch(r'[A-Za-z0-9.-]+',sub),sub
          url=f'https://pick-pack-1291-service.{sub}.workers.dev'
          print('SERVICE_URL='+url)
          print('WORKERS_SUBDOMAIN='+sub)
          PY
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/cf-subdomain.json'))
          print('Cloudflare workers subdomain discovered:',(j.get('result') or {}).get('subdomain',''))
          PY

      - name: Pre-deploy production health fence
        shell: bash
        run: |
          set -euo pipefail
          fetch_health(){
            local out="$1" code
            code=$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$SERVICE_URL/health" 2>/tmp/curl.err || true)
            if [[ "$code" != 200 ]]; then
              code=$(curl --doh-url https://cloudflare-dns.com/dns-query -sS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$SERVICE_URL/health" 2>>/tmp/curl.err || true)
            fi
            echo "$code"
          }
          code=$(fetch_health /tmp/pre-health.json)
          if [[ "$code" != 200 ]]; then cat /tmp/curl.err >&2 || true; fi
          test "$code" = 200
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/pre-health.json'))
          assert j.get('ok') is True,j
          a=j.get('authority') if isinstance(j.get('authority'),dict) else {}
          mode=j.get('authority_mode') or a.get('mode')
          scope=j.get('authority_scope') or a.get('scope')
          assert mode=='SERVICE_PRIMARY',(mode,j)
          assert scope=='PRODUCTION',(scope,j)
          r=j.get('replication') if isinstance(j.get('replication'),dict) else {}
          if 'state' in r: assert r.get('state')=='HEALTHY',r
          if 'pending_count' in r: assert int(r.get('pending_count') or 0)==0,r
          print('PREHEALTH_FENCE_PASS')
          PY

      - name: Generate locked production Wrangler config
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.prod.s62.jsonc <<'EOF'
          {
            "$schema":"./node_modules/wrangler/config-schema.json",
            "name":"pick-pack-1291-service",
            "main":"src/entry_product.ts",
            "compatibility_date":"2026-08-08",
            "compatibility_flags":["nodejs_compat"],
            "workers_dev":true,
            "placement":{"mode":"smart"},
            "vars":{"SERVICE_GENERATION":"m2-prod-20260819-001","GOOGLE_SOURCE_SHEET_ID":"1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78"},
            "d1_databases":[{"binding":"DB","database_name":"pick-pack-1291-service-prod","database_id":"b619df89-528d-4126-a948-de0425037b11","migrations_dir":"migrations"}],
            "durable_objects":{"bindings":[{"name":"REALTIME_HUB","class_name":"RealtimeHub"}]},
            "migrations":[{"tag":"v1","new_sqlite_classes":["RealtimeHub"]}],
            "assets":{"directory":"./public","binding":"ASSETS","not_found_handling":"single-page-application","run_worker_first":["/health","/v1/*","/internal/*"]},
            "triggers":{"crons":["*/1 * * * *"]},
            "observability":{"enabled":true,"head_sampling_rate":1}
          }
          EOF

      - name: Deploy exact S62 source
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.prod.s62.jsonc --keep-vars 2>&1 | tee /tmp/deploy.log
          sed -n 's/.*Version ID: */worker_version_id=/p' /tmp/deploy.log | tail -1 > /tmp/version.txt || true

      - name: Post-deploy authority, health and route probes
        shell: bash
        run: |
          set -euo pipefail
          curl_service(){
            local method="$1" path="$2" out="$3" data="${4:-}" code
            local args=(-sS --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}')
            if [[ "$method" == POST ]]; then args+=(-H 'content-type: application/json' -d "$data"); fi
            code=$(curl "${args[@]}" "$SERVICE_URL$path" 2>/tmp/post-curl.err || true)
            if [[ -z "$code" || "$code" == 000 ]]; then
              code=$(curl --doh-url https://cloudflare-dns.com/dns-query "${args[@]}" "$SERVICE_URL$path" 2>>/tmp/post-curl.err || true)
            fi
            echo "$code"
          }
          ok=false
          for n in 1 2 3 4 5 6; do
            code=$(curl_service GET /health /tmp/post-health.json)
            if [[ "$code" == 200 ]] && python3 - <<'PY'
          import json
          try:
              j=json.load(open('/tmp/post-health.json'))
              a=j.get('authority') if isinstance(j.get('authority'),dict) else {}
              r=j.get('replication') if isinstance(j.get('replication'),dict) else {}
              good=j.get('ok') is True and (j.get('authority_mode') or a.get('mode'))=='SERVICE_PRIMARY' and (j.get('authority_scope') or a.get('scope'))=='PRODUCTION'
              if 'state' in r and r.get('state')!='HEALTHY': good=False
              if 'pending_count' in r and int(r.get('pending_count') or 0)!=0: good=False
              raise SystemExit(0 if good else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then ok=true; break; fi
            sleep 3
          done
          if [[ "$ok" != true ]]; then cat /tmp/post-curl.err >&2 || true; fi
          test "$ok" = true
          r1=$(curl_service POST /v1/session/work /tmp/probe1.json '{}')
          r2=$(curl_service POST /v1/session/exit /tmp/probe2.json '{}')
          r3=$(curl_service POST /v1/session/time-correction /tmp/probe3.json '{}')
          r4=$(curl_service POST /v1/session/delete-exit /tmp/probe4.json '{}')
          r5=$(curl_service POST /v1/session/delete-enter /tmp/probe5.json '{}')
          test "$r1" = 401; test "$r2" = 401; test "$r3" = 401; test "$r4" = 401; test "$r5" = 401
          {
            echo "source_sha=${{ github.event.pull_request.head.sha }}"
            echo "service_url=$SERVICE_URL"
            cat /tmp/version.txt 2>/dev/null || true
            echo "session_work_route=$r1"
            echo "session_exit_route=$r2"
            echo "time_correction_route=$r3"
            echo "delete_exit_route=$r4"
            echo "delete_enter_route=$r5"
            echo "authority=SERVICE_PRIMARY/PRODUCTION"
            echo "replication=HEALTHY_0"
            echo "verdict=PASS"
          } > /tmp/service-s62-deploy-receipt.txt
          cat /tmp/service-s62-deploy-receipt.txt

      - name: Upload sanitized deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: service-s62-production-deploy-evidence
          path: |
            /tmp/service-s62-deploy-receipt.txt
            /tmp/pre-health.json
            /tmp/post-health.json
          retention-days: 14

      - name: Remove generated production config
        if: always()
        working-directory: service
        run: rm -f wrangler.prod.s62.jsonc
