name: Beta68 candidate v3 adaptive login visual

on:
  push:
    branches: [ agent/beta68-from-beta66-20260824 ]
    paths:
      - '.github/workflows/_oneoff_beta68_candidate_v3_visual_pass.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta68-candidate-v3
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      apk_sha: ${{ steps.sign.outputs.sha }}
      apk_size: ${{ steps.sign.outputs.size }}
      candidate_artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      debug_artifact_id: ${{ steps.debug_upload.outputs.artifact-id }}
    env:
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Persist candidate start receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > ops/beta68-candidate-v3-start.txt <<EOF
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          version=0.4.2-beta.68
          version_code=74
          state=STARTED
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-candidate-v3-start.txt
          git commit -m 'ops: record Beta68 candidate v3 start'
          git push origin HEAD:agent/beta68-from-beta66-20260824

      - name: Materialize Beta66 baseline plus Beta68 fixes and visual correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apply_beta64_owner_seven_fixes.py \
            tools/apply_beta64_compile_fix.py \
            tools/apply_beta65_session_resource_login_parity.py \
            tools/apply_beta65_behavior_compile_fix.py \
            tools/apply_beta65_scope_compile_fix.py \
            tools/apply_beta65_login_reference_finish.py \
            tools/apply_beta66_login_fullframe.py \
            tools/apply_beta68_owner_five_fixes.py \
            tools/apply_beta68_login_visual_pass.py
          python3 tools/apply_beta64_owner_seven_fixes.py
          python3 tools/apply_beta64_compile_fix.py
          python3 tools/apply_beta65_session_resource_login_parity.py
          python3 tools/apply_beta65_behavior_compile_fix.py
          python3 tools/apply_beta65_scope_compile_fix.py
          python3 tools/apply_beta65_login_reference_finish.py
          python3 tools/apply_beta66_login_fullframe.py
          python3 tools/apply_beta68_owner_five_fixes.py
          python3 tools/apply_beta68_login_visual_pass.py

      - name: Beta68 functional and visual static gates
        shell: bash
        run: |
          set -euo pipefail
          GR=app/build.gradle.kts
          FULL=app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          UPD=app/src/main/java/vn/pickpack1291/app/beta/UpdateManager.kt
          MAN=app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 74' "$GR"
          grep -q 'versionName = "0.4.2-beta.68"' "$GR"
          grep -q 'versionCode = 1' "$GR"
          grep -q 'versionName = "0.1.0-stable"' "$GR"
          grep -q 'android:name=".FullBetaActivity"' "$MAN"
          sed -n '/private fun login()/,/private fun openMainShell()/p' "$FULL" > /tmp/login.kt
          grep -q 'login_vietnam_bg' /tmp/login.kt
          grep -q 'ImageView.ScaleType.FIT_CENTER' /tmp/login.kt
          grep -q 'SOFT_INPUT_STATE_ALWAYS_HIDDEN' /tmp/login.kt
          grep -q 'root.requestFocus()' /tmp/login.kt
          ! grep -q 'user.requestFocus()' /tmp/login.kt
          grep -q 'login_supra_logo' /tmp/login.kt
          grep -Fq 'Copyright 2026 Supra DC Hưng Yên - tamnv2 - Chuyên viên Pick Pack 1291' /tmp/login.kt
          grep -q 'Quên mật khẩu?' /tmp/login.kt
          grep -q 'Hiện mật khẩu' /tmp/login.kt
          grep -q 'Đăng ký' /tmp/login.kt
          grep -q 'fun checkAutomatic(activity:Activity)' "$UPD"
          grep -Fq '• $it' "$UPD"
          grep -Fq 'UpdateManager.checkAutomatic(this)' "$FULL"
          grep -Fq 'UpdateManager.checkAutomatic(this)' "$OPS"
          grep -Fq 'val mnv=localMnvFor(serial)' "$OPS"
          grep -Fq '"Dữ liệu người dùng"' "$OPS"
          grep -Fq '"Bộ nhớ đệm"' "$OPS"
          grep -Fq 'private data class AppStorageUsage' "$OPS"
          grep -Fq 'headerStatusChip(R.drawable.ic_pp_network,"Mạng"' "$OPS"
          grep -Fq 'headerStatusChip(R.drawable.ic_pp_sync,"Đồng bộ"' "$OPS"
          grep -Fq 'headerStatusChip(R.drawable.ic_pp_service,"Dịch vụ"' "$OPS"
          echo BETA68_V3_STATIC_PASS

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble Beta68 and verify Stable isolation
        shell: bash
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug :app:assembleBetaRelease

      - name: Sign exact Beta68 candidate v3
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/aapt" dump badging "$UNSIGNED" > /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='74'" /tmp/beta.txt
          grep -q "versionName='0.4.2-beta.68'" /tmp/beta.txt
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta68
          OUT=dist/beta68/pick-pack-1291-public-beta-0.4.2-beta.68.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" "$UNSIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$OUT")
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" > dist/beta68/SHA256SUMS-0.4.2-beta.68.txt
          cat > dist/beta68/release-meta.json <<EOF
          {"version_name":"0.4.2-beta.68","version_code":74,"package":"vn.pickpack1291.app.beta.publicbeta","source_sha":"$GITHUB_SHA","apk_sha256":"$SHA","apk_size":$SIZE,"signer_sha256":"$EXPECTED_SIGNER_SHA256","stable_version":"0.1.0-stable","stable_code":1,"stable_publish":"FORBIDDEN","service_change":"NONE","visual_model":"ADAPTIVE_DEMO_FIT_CENTER_V1"}
          EOF
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          rm -f "$KS" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"

      - name: Upload exact signed candidate v3
        uses: actions/upload-artifact@v4
        id: candidate_upload
        with:
          name: pick-pack-1291-0.4.2-beta.68-candidate-v3
          path: dist/beta68/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK for visual gate v3
        uses: actions/upload-artifact@v4
        id: debug_upload
        with:
          name: beta68-visual-debug-input-v3
          path: app/build/outputs/apk/beta/debug/app-beta-debug.apk
          retention-days: 7
          if-no-files-found: error

  visual-matrix:
    needs: build-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beta68-visual-debug-input-v3
          path: visual-input

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Capture exact login matrix API29 Linux KVM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            mkdir -p visual
            adb install -r visual-input/app-beta-debug.apk >/dev/null
            adb shell wm size 320x568
            adb shell wm density 160
            adb shell am force-stop vn.pickpack1291.app.beta.publicbeta
            adb shell am start -W -n vn.pickpack1291.app.beta.publicbeta/vn.pickpack1291.app.beta.FullBetaActivity >/dev/null
            sleep 2
            adb exec-out screencap -p > visual/login-320x568.png
            adb shell wm size 360x640
            adb shell wm density 160
            adb shell am force-stop vn.pickpack1291.app.beta.publicbeta
            adb shell am start -W -n vn.pickpack1291.app.beta.publicbeta/vn.pickpack1291.app.beta.FullBetaActivity >/dev/null
            sleep 2
            adb exec-out screencap -p > visual/login-360x640.png
            adb shell wm size 480x800
            adb shell wm density 240
            adb shell am force-stop vn.pickpack1291.app.beta.publicbeta
            adb shell am start -W -n vn.pickpack1291.app.beta.publicbeta/vn.pickpack1291.app.beta.FullBetaActivity >/dev/null
            sleep 2
            adb exec-out screencap -p > visual/login-480x800.png

      - name: Enforce visual evidence dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          exp={'login-320x568.png':(320,568),'login-360x640.png':(360,640),'login-480x800.png':(480,800)}
          for n,d in exp.items():
              b=(Path('visual')/n).read_bytes()
              assert len(b)>5000 and b[:8]==b'\x89PNG\r\n\x1a\n',n
              got=struct.unpack('>II',b[16:24]); assert got==d,(n,got,d)
              print(n,got,len(b))
          print('BETA68_V3_VISUAL_FILES_PASS')
          PY

      - uses: actions/upload-artifact@v4
        id: visual_upload
        with:
          name: beta68-login-visual-v3
          path: visual/*.png
          retention-days: 30
          if-no-files-found: error
