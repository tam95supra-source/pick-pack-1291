name: Beta125 exact nav visual diagnostic
on:
  push:
    branches: [release/beta125-navigation-frame-20260905]
    paths:
      - '.github/workflows/beta125-exact-nav-visual-diagnostic.yml'
permissions:
  actions: read
  contents: read
jobs:
  exact-nav-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate-33955316061
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33955316061
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate verification harness
        run: bash tools/build_beta83_verify_harness.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Verify exact candidate and retain failed screenshot evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta83_verify_matrix.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta125-exact-nav-visual-${{ github.run_id }}
          path: /tmp/beta-verify
          retention-days: 30
          if-no-files-found: error
