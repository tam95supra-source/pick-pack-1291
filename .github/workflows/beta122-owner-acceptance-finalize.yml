name: Beta122 owner acceptance finalize

on:
  push:
    branches: [beta/current]
    paths:
      - '.github/workflows/beta122-owner-acceptance-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-owner-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/current
          fetch-depth: 0
      - name: Record OWNER acceptance and lock invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          UTC = "2026-09-05T02:37:19Z"
          LOCAL = "2026-09-05T09:37:19+07:00"
          EPOCH = 202609050937
          VERSION = "0.4.2-beta.122"
          CODE = 128
          SOURCE = "fd26d18b0ae81cbc919824141f3670a3fe3b276e"
          APK = "b06d1cf470fa840f53c9641397bf16cdfa3ce5d20651349f4ac3bb6e0ef4b54b"
          SIZE = 14429173
          SIGNER = "d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e"

          req_path = Path("ops/beta-release-request.json")
          req = json.loads(req_path.read_text())
          assert req["stage"] == "pass_live"
          assert req["version_name"] == VERSION and req["version_code"] == CODE
          assert req["source_sha"] == SOURCE and req["apk_sha256"] == APK
          assert req["technical_pass_status"] == "PASS" and req["ota_readback_status"] == "PASS"
          assert req["live"] is True and req["stable_publish"] == "FORBIDDEN"
          req["owner_acceptance"] = "OWNER_ACCEPTANCE_COMPLETE"
          req["owner_checklist_id"] = "BETA122_OWNER_ACCEPTANCE_20260905_R1"
          req["owner_checklist_revision"] = 3
          req["owner_acceptance_receipt"] = "ops/beta122-owner-acceptance.json"
          req["next_action"] = "OWNER_ACCEPTANCE_COMPLETE"
          req_path.write_text(json.dumps(req, ensure_ascii=False, indent=2) + "\n")

          ledger_path = Path("ops/owner-acceptance-current.json")
          old = json.loads(ledger_path.read_text())
          assert int(old["state_epoch"]) < EPOCH
          prior_responses = list(old.get("checklist", {}).get("owner_responses", []))
          prior_responses.append({
              "recorded_at": LOCAL,
              "response": "2 4 ok.",
              "items": {"2": "OK", "4": "OK"}
          })
          ledger = {
            "schema_version": 1,
            "state_epoch": EPOCH,
            "channel": "BETA",
            "public_beta": {
              "version_name": VERSION,
              "version_code": CODE,
              "source_sha": SOURCE,
              "apk_sha256": APK,
              "technical_status": "PASS_LIVE"
            },
            "owner_scope": {
              "scope_id": "OWNER_20260905_BETA122_EFFECTIVE_ROLE_PDA_SOURCE_UI",
              "status": "OWNER_ACCEPTANCE_COMPLETE",
              "requirements": [
                {"id":"UI-STATUS-DETAIL-VI-003","status":"ACTIVE_PASS","rule":"Status header/detail Vietnamese + icons + manual sync accepted."},
                {"id":"SUPERADMIN-EFFECTIVE-ROLE-003","status":"ACTIVE_PASS","rule":"Only role selector may use actual SUPERADMIN; every business surface/action obeys effective USER/ADMIN/SUPERADMIN."},
                {"id":"SETTINGS-REGION-INHOUSE-DROP-001","status":"ACTIVE_PASS","rule":"Settings grouped regions, Inhouse pending card and drop-receive table accepted."},
                {"id":"PDA-SOURCE-MASTER-001","status":"ACTIVE_PASS","rule":"PDA source visible/editable in Android PDA information and Resource PDA list using canonical source catalog."}
              ]
            },
            "technical_evidence": {
              "candidate_run_id": 33937101147,
              "candidate_artifact_id": 9960620587,
              "fast_check_run_id": 33937614821,
              "visual_pda_run_id": 33937614831,
              "visual_pda_artifact_id": 9960788555,
              "device_discovery_run_id": 33938053451,
              "device_discovery_artifact_id": 9960858682,
              "runtime_dod_run_id": 33938184655,
              "runtime_dod_artifact_id": 9960886189,
              "terminal_run_id": 33938535151,
              "publish_artifact_id": 9960999680,
              "ota_device_artifact_id": 9961036406,
              "final_artifact_id": 9961041181,
              "release_lock_receipt": "ops/beta122-release-lock.json",
              "technical_receipt": "ops/beta122-technical-pass.json",
              "owner_receipt": "ops/beta122-owner-acceptance.json"
            },
            "checklist": {
              "checklist_id": "BETA122_OWNER_ACCEPTANCE_20260905_R1",
              "revision": 3,
              "status": "OWNER_ACCEPTANCE_COMPLETE",
              "items": [
                {"number":1,"id":"UI-STATUS-DETAIL-VI-003","status":"OWNER_OK","test":"OWNER confirmed item 1 OK on Beta121; preserved through Beta122."},
                {"number":2,"id":"SUPERADMIN-EFFECTIVE-ROLE-003","status":"OWNER_OK","test":"OWNER rechecked Beta122 fix and replied item 2 OK."},
                {"number":3,"id":"SETTINGS-REGION-INHOUSE-DROP-001","status":"OWNER_OK","test":"OWNER confirmed item 3 OK on Beta121; preserved through Beta122."},
                {"number":4,"id":"PDA-SOURCE-MASTER-001","status":"OWNER_OK","test":"OWNER rechecked Beta122 fix and replied item 4 OK."}
              ],
              "owner_responses": prior_responses
            },
            "previous_acceptance": {
              "version_name": "0.4.2-beta.121",
              "state_epoch": 202609050820,
              "checklist_id": "BETA121_OWNER_ACCEPTANCE_20260905_R1",
              "revision": 2,
              "status": "PARTIAL_ACCEPTANCE_PENDING_FIX"
            },
            "fencing": old.get("fencing", {}),
            "security": old.get("security", {}),
            "next_action": "OWNER_ACCEPTANCE_COMPLETE"
          }
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n")

          receipt = {
            "status": "OWNER_ACCEPTANCE_COMPLETE",
            "accepted_at": LOCAL,
            "state_epoch": EPOCH,
            "version_name": VERSION,
            "version_code": CODE,
            "package": "vn.pickpack1291.app.beta.publicbeta",
            "source_sha": SOURCE,
            "apk_sha256": APK,
            "apk_size": SIZE,
            "signer_sha256": SIGNER,
            "terminal_run_id": 33938535151,
            "publish_artifact_id": 9960999680,
            "ota_device_artifact_id": 9961036406,
            "final_artifact_id": 9961041181,
            "owner_response": "2 4 ok.",
            "invariants": {
              "UI-STATUS-DETAIL-VI-003": "ACTIVE_PASS",
              "SUPERADMIN-EFFECTIVE-ROLE-003": "ACTIVE_PASS",
              "SETTINGS-REGION-INHOUSE-DROP-001": "ACTIVE_PASS",
              "PDA-SOURCE-MASTER-001": "ACTIVE_PASS"
            },
            "stable_unchanged": True,
            "main_unchanged": True,
            "authority_change": "NONE",
            "next_action": "OWNER_ACCEPTANCE_COMPLETE"
          }
          Path("ops/beta122-owner-acceptance.json").write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n")

          def patch_yaml_block(text, item_id, owner_line):
              start = text.index(f"  - id: {item_id}\n")
              nxt = text.find("\n  - id: ", start + 1)
              end = len(text) if nxt < 0 else nxt
              block = text[start:end]
              block = block.replace("status: TECHNICAL_PASS_AWAITING_OWNER", "status: ACTIVE_PASS", 1)
              lines = block.splitlines()
              for i, line in enumerate(lines):
                  if line.strip().startswith("owner_acceptance:"):
                      lines[i] = f'    owner_acceptance: "{owner_line}"'
                  if line.strip() == "active_pass: false":
                      lines[i] = "    active_pass: true"
              return text[:start] + "\n".join(lines) + text[end:]

          qpath = Path("qa/stable_invariants.yml")
          q = qpath.read_text()
          q = patch_yaml_block(q, "SUPERADMIN-EFFECTIVE-ROLE-003", "PASS — OWNER item 2 OK after Beta122 recheck, 2026-09-05 09:37 +07:00.")
          q = patch_yaml_block(q, "PDA-SOURCE-MASTER-001", "PASS — OWNER item 4 OK after Beta122 recheck, 2026-09-05 09:37 +07:00.")
          qpath.write_text(q)

          def patch_md_block(text, heading, next_heading, owner_line):
              start = text.index(f"### {heading}\n")
              end = text.find(f"\n### {next_heading}\n", start) if next_heading else -1
              if end < 0: end = len(text)
              block = text[start:end]
              block = block.replace("- Status: TECHNICAL_PASS_AWAITING_OWNER", "- Status: ACTIVE_PASS", 1)
              lines = block.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith("- OWNER acceptance:"):
                      lines[i] = f"- OWNER acceptance: {owner_line}"
              return text[:start] + "\n".join(lines) + text[end:]

          mpath = Path("docs/STABLE_INVARIANTS.md")
          m = mpath.read_text()
          m = patch_md_block(m, "SUPERADMIN-EFFECTIVE-ROLE-003", "SETTINGS-REGION-INHOUSE-DROP-001", "PASS — OWNER item 2 OK after Beta122 recheck, 2026-09-05 09:37 +07:00.")
          m = patch_md_block(m, "PDA-SOURCE-MASTER-001", "Beta121 re-verification — OTA-BETA-001", "PASS — OWNER item 4 OK after Beta122 recheck, 2026-09-05 09:37 +07:00.")
          m = m.replace("## Beta122 follow-up — TECHNICAL_PASS_AWAITING_OWNER items 2/4", "## Beta122 follow-up — OWNER_ACCEPTANCE_COMPLETE")
          m = m.replace("- `SUPERADMIN-EFFECTIVE-ROLE-003`: TECHNICAL_PASS_AWAITING_OWNER.", "- `SUPERADMIN-EFFECTIVE-ROLE-003`: ACTIVE_PASS — OWNER item 2 OK.")
          m = m.replace("- `PDA-SOURCE-MASTER-001`: TECHNICAL_PASS_AWAITING_OWNER.", "- `PDA-SOURCE-MASTER-001`: ACTIVE_PASS — OWNER item 4 OK.")
          m += "\n- OWNER final acceptance: items 2/4 OK at 2026-09-05 09:37 +07:00; all four Beta122 scope invariants are ACTIVE_PASS.\n"
          mpath.write_text(m)

          current = f'''# CURRENT STATE — PICK PACK 1291

- updated_at: {UTC}
- status: BETA122_OWNER_ACCEPTED_LIVE
- continuity_branch: release/beta122-effective-role-pda-source-ui-20260905
- source_sha: {SOURCE}
- beta_live: {VERSION} (versionCode {CODE})
- package: vn.pickpack1291.app.beta.publicbeta
- candidate_run: 33937101147
- candidate_artifact: 9960620587
- verify_run: 33937614831
- verify_artifact: 9960788555
- apk_sha256: {APK}
- apk_size: {SIZE}
- signer_sha256: {SIGNER}
- terminal_run: 33938535151
- publish_artifact: 9960999680
- ota_device_artifact: 9961036406
- final_artifact: 9961041181
- fast_check: PASS run 33937614821
- service_gate: PASS inherited run 33929895214 artifact 9958376646; service/GAS bytes unchanged
- visual_matrix: PASS 320x568 / 360x640 / 480x800
- human_visual: PASS
- pda_functional_pre_ota: PASS
- device_regression: PASS run 33938053451 artifact 9960858682
- runtime_dod: PASS run 33938184655 artifact 9960886189
- beta_ota: exact {VERSION} PASS via GitHub Release
- apk_transport: GITHUB_RELEASE_ONLY
- google_drive_apk: FORBIDDEN
- stable: unchanged / not public
- main_sha: 021dac5c6932b3ac5c60ce8fdba562ddf3d9688f
- authority: SERVICE_PRIMARY / PRODUCTION / epoch 9 / generation m2-prod-reset-20260823-001
- owner_acceptance: COMPLETE
- active_pass: UI-STATUS-DETAIL-VI-003; SUPERADMIN-EFFECTIVE-ROLE-003; SETTINGS-REGION-INHOUSE-DROP-001; PDA-SOURCE-MASTER-001
- technical_receipt: ops/beta122-technical-pass.json
- owner_receipt: ops/beta122-owner-acceptance.json
- next_action: OWNER_ACCEPTANCE_COMPLETE
'''
          Path("CURRENT_STATE.md").write_text(current)

          archive = "docs/handovers/HANDOVER_20260905-023719_beta122-owner-accepted.md"
          handoff = f'''# PICK PACK 1291 — HANDOFF SCHEMA V2

- schema_version: 2
- status: READY
- time_utc: {UTC}
- owner: Nguyễn Văn Tâm
- branch: beta/current
- technical_receipt: ops/beta122-technical-pass.json
- owner_receipt: ops/beta122-owner-acceptance.json
- archive_file: {archive}

## Mục tiêu + DoD
Beta122 LIVE, Technical DoD PASS và OWNER acceptance hoàn tất. OWNER đã nghiệm thu item 2 và 4 OK; item 1 và 3 đã ACTIVE_PASS từ trước và được bảo toàn.

## LIVE / exact candidate
- Beta: {VERSION} / versionCode {CODE} / package vn.pickpack1291.app.beta.publicbeta.
- Source: {SOURCE}.
- Candidate: run 33937101147 / artifact 9960620587.
- APK SHA256: {APK} / size {SIZE} / signer {SIGNER}.
- Terminal publish/OTA/install/open/readback/finalize: PASS run 33938535151.
- Publish artifact 9960999680 / OTA device 9961036406 / final 9961041181.
- Stable/main/signer/authority: unchanged.

## OWNER acceptance / invariants
- UI-STATUS-DETAIL-VI-003: ACTIVE_PASS.
- SUPERADMIN-EFFECTIVE-ROLE-003: ACTIVE_PASS — OWNER item 2 OK.
- SETTINGS-REGION-INHOUSE-DROP-001: ACTIVE_PASS.
- PDA-SOURCE-MASTER-001: ACTIVE_PASS — OWNER item 4 OK.
- Acceptance ledger: OWNER_ACCEPTANCE_COMPLETE, state_epoch {EPOCH}, checklist revision 3.

## Blocker
Không có.

## NEXT_ACTION
OWNER_ACCEPTANCE_COMPLETE
'''
          Path("docs/handovers/HANDOVER_CURRENT.md").write_text(handoff)
          Path(archive).write_text(handoff)

          # Final local assertions before commit.
          assert 'TECHNICAL_PASS_AWAITING_OWNER' not in patch_yaml_block.__name__  # no-op sanity
          q2 = qpath.read_text()
          for item in ("SUPERADMIN-EFFECTIVE-ROLE-003", "PDA-SOURCE-MASTER-001"):
              s = q2.index(f"  - id: {item}\n")
              e = q2.find("\n  - id: ", s + 1)
              b = q2[s: len(q2) if e < 0 else e]
              assert "status: ACTIVE_PASS" in b and "active_pass: true" in b
          assert json.loads(ledger_path.read_text())["next_action"] == "OWNER_ACCEPTANCE_COMPLETE"
          assert json.loads(req_path.read_text())["owner_acceptance"] == "OWNER_ACCEPTANCE_COMPLETE"
          PY
      - name: Commit and read back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/beta122-owner-acceptance-finalize.yml
          git add CURRENT_STATE.md docs/STABLE_INVARIANTS.md docs/handovers/HANDOVER_CURRENT.md docs/handovers/HANDOVER_20260905-023719_beta122-owner-accepted.md qa/stable_invariants.yml ops/owner-acceptance-current.json ops/beta122-owner-acceptance.json ops/beta-release-request.json
          git commit -m '[skip ci] record Beta122 OWNER acceptance complete 2/4 OK'
          git push origin HEAD:beta/current
          git fetch origin beta/current
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/beta/current)"
          grep -q 'status: BETA122_OWNER_ACCEPTED_LIVE' CURRENT_STATE.md
          grep -q 'OWNER_ACCEPTANCE_COMPLETE' docs/handovers/HANDOVER_CURRENT.md
          python - <<'PY'
          import json
          a=json.load(open('ops/owner-acceptance-current.json'))
          r=json.load(open('ops/beta-release-request.json'))
          assert a['owner_scope']['status']=='OWNER_ACCEPTANCE_COMPLETE'
          assert all(x['status']=='ACTIVE_PASS' for x in a['owner_scope']['requirements'])
          assert r['owner_acceptance']=='OWNER_ACCEPTANCE_COMPLETE'
          PY
