name: Beta65 Final Exact Release

on:
  push:
    branches: [ release/beta65-final-20260824-v2 ]
    paths:
      - 'ops/beta65-release-final-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: beta65-final-exact-release
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 1e8fb8255f26ad58c9719d99c27c08ef5d597cbf
  SOURCE_GATE_RUN: '32697993454'
  CANDIDATE_RUN_ID: '32701275784'
  CANDIDATE_JOB_ID: '97353121085'
  CANDIDATE_ARTIFACT_ID: '9510636863'
  TARGET_VERSION: 0.4.2-beta.65
  TARGET_CODE: '71'
  FROM_VERSION: 0.4.2-beta.64
  APK_NAME: pick-pack-1291-public-beta-0.4.2-beta.65.apk
  EXPECTED_SHA: be728cd8d20d6033becbfb169db89565f6078a681d47bc9079f98f9f5758e1da
  EXPECTED_SIZE: '13097861'
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  DRIVE_APK_ID: 1F2Xu0PQ7tiIWcNDlz9yUTsXBee6RWP39
  DRIVE_SUM_ID: 12iSOQ-AwToKY74ylGa4Wb5iVnQXdF8RC
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pickpack1291.cc.cd
  CANONICAL_SERVICE_URL: https://pickpack.1291.workers.dev
  TAG: v0.4.2-beta.65-publicbeta
  BETA_BRANCH: agent/beta65-session-resource-login-parity-20260824

jobs:
  release-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable candidate and live gates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence /tmp/candidate
          fail(){ echo "FAILED_PHASE=$1" >&2; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > /tmp/evidence/candidate-run.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100" > /tmp/evidence/candidate-jobs.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/evidence/candidate-artifact.json
          python3 - <<'PY' || exit 11
          import json,os
          r=json.load(open('/tmp/evidence/candidate-run.json')); assert r.get('conclusion')=='success',r
          jobs=json.load(open('/tmp/evidence/candidate-jobs.json')).get('jobs') or []
          hit=[j for j in jobs if str(j.get('id'))==os.environ['CANDIDATE_JOB_ID']]
          assert len(hit)==1 and hit[0].get('conclusion')=='success',jobs
          a=json.load(open('/tmp/evidence/candidate-artifact.json'))
          assert str(a.get('id'))==os.environ['CANDIDATE_ARTIFACT_ID'] and a.get('expired') is False,a
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" -o /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          APK=/tmp/candidate/$APK_NAME
          SUM=/tmp/candidate/SHA256SUMS-$TARGET_VERSION.txt
          META=/tmp/candidate/BETA65_CANDIDATE_RECEIPT.txt
          test -s "$APK" && test -s "$SUM" && test -s "$META" || fail CANDIDATE_FILES
          test "$(sha256sum "$APK"|awk '{print $1}')" = "$EXPECTED_SHA" || fail CANDIDATE_SHA
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE" || fail CANDIDATE_SIZE
          grep -qx "$EXPECTED_SHA  $APK_NAME" "$SUM" || fail CANDIDATE_SUM
          BT=/usr/local/lib/android/sdk/build-tools/36.0.0
          "$BT/aapt" dump badging "$APK" > /tmp/evidence/candidate-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/evidence/candidate-cert.txt
          grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$TARGET_CODE' versionName='$TARGET_VERSION'" /tmp/evidence/candidate-badging.txt || fail CANDIDATE_IDENTITY
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/evidence/candidate-cert.txt|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]')
          test "$CERT" = "$EXPECTED_SIGNER_SHA256" || fail CANDIDATE_SIGNER

          curl -fsSL "$SERVICE_URL/health" > /tmp/evidence/service-final.json
          curl -fsSL "$CANONICAL_SERVICE_URL/health" > /tmp/evidence/canonical-final.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"service_discovery\",\"_app_channel\":\"BETA\",\"_app_version\":\"$TARGET_VERSION\",\"_device_id\":\"ci-beta65-release-final\"}" > /tmp/evidence/discovery-final.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" > /tmp/evidence/update-from-final.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$TARGET_VERSION\"}" > /tmp/evidence/update-self-final.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/evidence/stable-final.json
          python3 - <<'PY' || exit 21
          import json,os
          for p in ['/tmp/evidence/service-final.json','/tmp/evidence/canonical-final.json']:
              j=json.load(open(p)); a=j.get('authority') or {}; r=j.get('replication') or {}
              assert j.get('ok') is True and a.get('mode')=='SERVICE_PRIMARY' and a.get('scope')=='PRODUCTION',j
              assert r.get('state')=='HEALTHY' and int(r.get('pending_count',0))==0 and int(r.get('failed_unresolved_count',0))==0,j
          g=json.load(open('/tmp/evidence/discovery-final.json')); assert g.get('ok') is True and g.get('authority_mode')=='SERVICE_PRIMARY',g
          u=json.load(open('/tmp/evidence/update-from-final.json')); av=u.get('available',u.get('update_available')); url=u.get('apk_url') or u.get('download_url') or u.get('url') or ''
          assert u.get('ok') is True and u.get('channel')=='BETA' and av is True and u.get('source')=='GOOGLE_DRIVE',u
          assert str(u.get('version_name',u.get('version','')))==os.environ['TARGET_VERSION'],u
          assert str(u.get('sha256','')).lower()==os.environ['EXPECTED_SHA'] and str(u.get('size',''))==os.environ['EXPECTED_SIZE'] and bool(url),u
          b=json.load(open('/tmp/evidence/update-self-final.json')); bav=b.get('available',b.get('update_available')); assert b.get('ok') is True and b.get('channel')=='BETA' and bav is False,b
          s=json.load(open('/tmp/evidence/stable-final.json')); sav=s.get('available',s.get('update_available')); assert s.get('ok') is True and s.get('channel')=='STABLE' and sav is False,s
          PY

      - name: Publish exact GitHub prerelease and read back
        shell: bash
        run: |
          set -Eeuo pipefail
          APK=/tmp/candidate/$APK_NAME
          SUM=/tmp/candidate/SHA256SUMS-$TARGET_VERSION.txt
          cat > /tmp/release-notes.txt <<EOF
          Beta65 public beta release.
          PP_PRODUCT_SOURCE_SHA=$PRODUCT_SOURCE_SHA
          PP_SOURCE_GATE_RUN=$SOURCE_GATE_RUN
          PP_SIGNED_RUN_ID=$CANDIDATE_RUN_ID
          PP_SIGNED_JOB_ID=$CANDIDATE_JOB_ID
          PP_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID
          PP_SHA256=$EXPECTED_SHA
          PP_SIZE=$EXPECTED_SIZE
          PP_SIGNER_SHA256=$EXPECTED_SIGNER_SHA256
          PP_APK_NAME=$APK_NAME
          PP_DRIVE_APK_ID=$DRIVE_APK_ID
          PP_DRIVE_CHECKSUM_ID=$DRIVE_SUM_ID
          PP_OTA_SOURCE=GOOGLE_DRIVE
          PP_STABLE_PUBLISH=FORBIDDEN
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.txt --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$PRODUCT_SOURCE_SHA" --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.txt --prerelease
          fi
          gh release upload "$TAG" "$APK#$APK_NAME" "$SUM#$(basename "$SUM")" --repo "$GITHUB_REPOSITORY" --clobber
          RURL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 240 "$RURL" -o /tmp/evidence/github-release.apk
          test "$(sha256sum /tmp/evidence/github-release.apk|awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' /tmp/evidence/github-release.apk)" = "$EXPECTED_SIZE"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isPrerelease,targetCommitish,url > /tmp/evidence/github-release.json

      - name: Persist final receipt and cumulative handover
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/final-receipt.txt <<EOF
          release=Beta65
          release_completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          product_source_sha=$PRODUCT_SOURCE_SHA
          source_gate_run=$SOURCE_GATE_RUN
          signed_run_id=$CANDIDATE_RUN_ID
          signed_job_id=$CANDIDATE_JOB_ID
          artifact_id=$CANDIDATE_ARTIFACT_ID
          package=$EXPECTED_PACKAGE
          version_name=$TARGET_VERSION
          version_code=$TARGET_CODE
          signer_sha256=$EXPECTED_SIGNER_SHA256
          apk_file=$APK_NAME
          apk_sha256=$EXPECTED_SHA
          apk_size=$EXPECTED_SIZE
          drive_apk_id=$DRIVE_APK_ID
          drive_checksum_id=$DRIVE_SUM_ID
          drive_readback_exact=PASS
          gas_service_discovery=PASS
          ota_beta64_to_beta65=PASS
          beta65_self_no_update=PASS
          stable_identity=0.1.0-stable/VC1
          stable_publish=FORBIDDEN
          stable_isolation=PASS
          github_prerelease=$TAG
          github_release_readback=PASS
          service_authority=SERVICE_PRIMARY/PRODUCTION
          replication=HEALTHY
          final_health=PASS
          source_test_compile=PASS
          signed_artifact=PASS
          signed_identity=PASS
          receipt=PASS
          handover=PASS
          verdict=PASS
          EOF
          cat > /tmp/final-handover.md <<EOF
          # PICK PACK 1291 — CUMULATIVE HANDOVER BETA65 — 2026-08-24

          This handover supersedes V19 for current live release state. V19 remains historical/canonical context for facts not changed below.

          ## Current public Beta — immutable
          - Version: **$TARGET_VERSION / VC$TARGET_CODE**
          - Package: \`$EXPECTED_PACKAGE\`
          - Product source SHA: \`$PRODUCT_SOURCE_SHA\`
          - Source validation run: \`$SOURCE_GATE_RUN\`
          - Signed run/job: \`$CANDIDATE_RUN_ID / $CANDIDATE_JOB_ID\`
          - Immutable artifact ID: \`$CANDIDATE_ARTIFACT_ID\`
          - APK: \`$APK_NAME\`
          - APK SHA256: \`$EXPECTED_SHA\`
          - APK bytes: \`$EXPECTED_SIZE\`
          - Signer SHA256: \`$EXPECTED_SIGNER_SHA256\`
          - Drive APK ID: \`$DRIVE_APK_ID\`
          - Drive checksum ID: \`$DRIVE_SUM_ID\`
          - GitHub prerelease/tag: \`$TAG\`
          - Previous public Beta: **0.4.2-beta.64 / VC70**
          - Next Android source version must be **Beta66+ / VC72+**.

          ## Beta65 OWNER-finalized behavior
          - One attendance session is owned by its enter business date; cross-midnight exit remains on that session, while a later re-entry creates the next business-day session.
          - A session may contain multiple positions/resources and multiple Pick/Pack users.
          - Pick/Pack resource disposition supports operator-selected USED vs AVAILABLE semantics; a mistakenly issued but unused resource becomes AVAILABLE immediately.
          - Add/Edit is free to change resource/user choices; it is not locked to a previous Pack table, position, or prior user grouping.
          - Pack User is independent from Pack table.
          - Exact delete selection and atomic session-version mutation remain required.
          - Used-user reissue stays separate from normal unused-user lists.
          - Exact-session timeline scoping, stale-MNV callback fencing, actual-resource work display, login reference parity and real app-cache reporting remain preserved from Beta64.

          ## Service / authority
          - Canonical Service: \`https://pickpack1291.cc.cd\`
          - Compatibility URL: \`https://pickpack.1291.workers.dev\`
          - Authority: **SERVICE_PRIMARY / PRODUCTION**.
          - Replication: **HEALTHY**, pending 0, unresolved failures 0 at final release verification.
          - Approved architecture remains Android/Web ↔ Service Worker/D1/Event Ledger ↔ Google replica/report/DR. No LAN/GSheet Service-die redesign is approved.

          ## Release gates — all PASS
          SOURCE_PASS; TEST_PASS; COMPILE_PASS; SIGNED_ARTIFACT_PASS; SIGNED_IDENTITY_PASS; DRIVE_PASS; DRIVE_READBACK_EXACT_PASS; GAS_PASS; OTA_BETA64_TO_BETA65_PASS; BETA65_SELF_NO_UPDATE_PASS; STABLE_ISOLATION_PASS; GITHUB_PRERELEASE_PASS; FINAL_HEALTH_PASS; RECEIPT_PASS; HANDOVER_PASS.

          ## Drive / GAS / OTA proof
          - Exact candidate bytes were uploaded by authorized Google Drive connector and read back at SHA256 \`$EXPECTED_SHA\`, size \`$EXPECTED_SIZE\`.
          - GAS BETA update check from \`$FROM_VERSION\` resolves to \`$TARGET_VERSION\`, source **GOOGLE_DRIVE**, exact hash/size and downloadable APK.
          - OTA downloaded bytes match the immutable candidate identity and signer.
          - Beta65 self-check returns no update.
          - Stable self-check returns no update.

          ## Stable hard lock
          Stable remains **0.1.0-stable / VC1**, untouched. Stable publication remains **FORBIDDEN**. Production signer is unchanged. Do not merge release/evidence branches into Stable/main merely to tidy history.

          ## Resume model
          This Beta65 artifact is immutable and complete. Do not rebuild/resign Beta65. Future Android work starts at Beta66+/VC72+ and must fresh-read this handover plus live state before mutation.
          EOF
          git fetch origin "$BETA_BRANCH"
          git checkout -B "$BETA_BRANCH" "origin/$BETA_BRANCH"
          cp /tmp/final-receipt.txt ops/BETA65_RELEASE_RECEIPT.txt
          cp /tmp/final-handover.md PICK_PACK_1291_CUMULATIVE_HANDOVER_BETA65_2026-08-24.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/BETA65_RELEASE_RECEIPT.txt PICK_PACK_1291_CUMULATIVE_HANDOVER_BETA65_2026-08-24.md
          git diff --cached --quiet || git commit -m 'release: record Beta65 final receipt and cumulative handover'
          git pull --rebase origin "$BETA_BRANCH"
          git push origin HEAD:"$BETA_BRANCH"

      - name: Upload final release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta65-final-release-evidence
          path: /tmp/evidence
          retention-days: 30
          if-no-files-found: warn
