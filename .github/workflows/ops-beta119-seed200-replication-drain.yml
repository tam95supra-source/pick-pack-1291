name: Beta119 seed200 final recovery

on:
  push:
    branches:
      - ops/beta119-seed200-replication-drain-20260904
    paths:
      - .github/workflows/ops-beta119-seed200-replication-drain.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta119-seed200-final-recovery
  cancel-in-progress: false

jobs:
  recover-final-15:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fence Beta LIVE and exact seed population
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          cfg=json.load(open('config/environment_contracts.json',encoding='utf-8'))
          b=cfg['environments']['BETA']; s=cfg['environments']['STABLE']
          assert b['lifecycle']=='LIVE' and b['current_service']['worker']=='pickpack'
          assert b['current_service']['d1_database']=='pick-pack-1291-service-prod'
          assert s['lifecycle']!='LIVE' and s['stable_publish_allowed'] is False
          PY
          npm --prefix service install --ignore-scripts --no-audit --no-fund
          npx --prefix service wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT mode,scope FROM authority_state WHERE singleton_id=1; SELECT COUNT(*) n FROM attendance_sessions WHERE business_date='2026-09-04' AND state='ACTIVE' AND exit_at IS NULL; SELECT COUNT(*) n FROM labor_sessions WHERE business_date='2026-09-04';" > /tmp/pre.json
          python3 - <<'PY'
          import json
          rows=[]
          for x in json.load(open('/tmp/pre.json')): rows += x.get('results') or []
          a=next(x for x in rows if 'mode' in x); nums=[int(x['n']) for x in rows if 'n' in x]
          assert a['mode']=='SERVICE_PRIMARY' and a['scope']=='PRODUCTION'
          assert nums[:2]==[200,0],nums
          PY
      - name: Recover only the 15 Sheet-missing seed outbox rows
        shell: bash
        run: |
          set -euo pipefail
          SQL="UPDATE sheet_replication_outbox SET status='RETRY',claim_token=NULL,claimed_at=NULL,next_attempt_at=datetime('now'),last_error_class='OWNER_SEED200_FINAL15_RECOVERY',last_error='Exact Sheet-missing seed event requeued after readback' WHERE event_id LIKE 'OWNER_SEED200_20260904_099_%' OR event_id LIKE 'OWNER_SEED200_20260904_100_%' OR event_id LIKE 'OWNER_SEED200_20260904_115_%' OR event_id LIKE 'OWNER_SEED200_20260904_164_%' OR event_id LIKE 'OWNER_SEED200_20260904_165_%' OR event_id LIKE 'OWNER_SEED200_20260904_181_%' OR event_id LIKE 'OWNER_SEED200_20260904_182_%' OR event_id LIKE 'OWNER_SEED200_20260904_183_%' OR event_id LIKE 'OWNER_SEED200_20260904_184_%' OR event_id LIKE 'OWNER_SEED200_20260904_185_%' OR event_id LIKE 'OWNER_SEED200_20260904_191_%' OR event_id LIKE 'OWNER_SEED200_20260904_192_%' OR event_id LIKE 'OWNER_SEED200_20260904_193_%' OR event_id LIKE 'OWNER_SEED200_20260904_194_%' OR event_id LIKE 'OWNER_SEED200_20260904_195_%'; SELECT changes() changed;"
          npx --prefix service wrangler d1 execute "$D1_NAME" --remote --json --command "$SQL" > /tmp/recover.json
          python3 - <<'PY'
          import json
          rows=[]
          for x in json.load(open('/tmp/recover.json')): rows += x.get('results') or []
          changed=[int(x['changed']) for x in rows if 'changed' in x]
          assert changed and changed[-1]==15, changed
          print('final15_requeue=PASS changed=15')
          PY
      - name: Wait for official cron writer to sync exact final 15
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            npx --prefix service wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT status,COUNT(*) n FROM sheet_replication_outbox WHERE event_id LIKE 'OWNER_SEED200_20260904_%' AND (event_id LIKE 'OWNER_SEED200_20260904_099_%' OR event_id LIKE 'OWNER_SEED200_20260904_100_%' OR event_id LIKE 'OWNER_SEED200_20260904_115_%' OR event_id LIKE 'OWNER_SEED200_20260904_164_%' OR event_id LIKE 'OWNER_SEED200_20260904_165_%' OR event_id LIKE 'OWNER_SEED200_20260904_181_%' OR event_id LIKE 'OWNER_SEED200_20260904_182_%' OR event_id LIKE 'OWNER_SEED200_20260904_183_%' OR event_id LIKE 'OWNER_SEED200_20260904_184_%' OR event_id LIKE 'OWNER_SEED200_20260904_185_%' OR event_id LIKE 'OWNER_SEED200_20260904_191_%' OR event_id LIKE 'OWNER_SEED200_20260904_192_%' OR event_id LIKE 'OWNER_SEED200_20260904_193_%' OR event_id LIKE 'OWNER_SEED200_20260904_194_%' OR event_id LIKE 'OWNER_SEED200_20260904_195_%') GROUP BY status ORDER BY status;" > /tmp/poll.json
            if python3 - <<'PY'
          import json,sys
          rows=[]
          for x in json.load(open('/tmp/poll.json')): rows += x.get('results') or []
          sys.exit(0 if rows==[{'status':'SYNCED','n':15}] else 1)
          PY
            then echo "final15_outbox=SYNCED_15"; break; fi
            test "$i" -lt 12 || { cat /tmp/poll.json; exit 9; }
            sleep 20
          done
      - name: Final D1 readback
        shell: bash
        run: |
          set -euo pipefail
          npx --prefix service wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT shift,COUNT(*) n FROM attendance_sessions WHERE business_date='2026-09-04' AND state='ACTIVE' AND exit_at IS NULL GROUP BY shift ORDER BY shift; SELECT work_choice,COUNT(*) n FROM attendance_sessions WHERE business_date='2026-09-04' GROUP BY work_choice ORDER BY work_choice; SELECT status,COUNT(*) n FROM sheet_replication_outbox WHERE event_id LIKE 'OWNER_SEED200_20260904_%' GROUP BY status ORDER BY status;" > /tmp/final.json
          cat /tmp/final.json | jq -c '[.[]|.results]'
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/final.json'))
          assert j[0]['results']==[{'shift':'Ca 1','n':80},{'shift':'Ca 2','n':80},{'shift':'Ca HC','n':40}]
          assert j[1]['results']==[{'work_choice':'KHONG','n':194},{'work_choice':'PACK','n':3},{'work_choice':'PICK','n':3}]
          assert j[2]['results']==[{'status':'SYNCED','n':200}]
          print('seed200_d1_final=PASS synced=200')
          PY
