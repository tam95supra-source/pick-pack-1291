name: Beta75 publish exact candidate

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - ops/beta-release-request.json
      - .github/workflows/beta-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: beta75-publish-exact
  cancel-in-progress: false

jobs:
  publish-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate exact Beta75 lock and HUMAN receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stage=="publish" and .version_name=="0.4.2-beta.75" and .version_code==81 and .candidate_run_id==32849057694 and .candidate_artifact_id==9563625638 and .locked_run_id==32849057694 and .locked_artifact_id==9563625638 and .locked_sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .locked_size==13147013 and .locked_package=="vn.pickpack1291.app.beta.publicbeta" and .locked_signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .visual_receipt_commit=="007795a656fa14236ed766b164ca80bb5872fb32" and .final_visual_run_id==32860235560 and .final_visual_artifact_id==9568028848 and .stable_publish=="FORBIDDEN" and .service_change=="NONE" and .authority_change=="NONE"' ops/beta-release-request.json >/dev/null
          jq -e '.status=="PASS" and .result=="HUMAN_VISUAL_PASS" and .candidate.version_name=="0.4.2-beta.75" and .candidate.version_code==81 and .candidate.build_run==32849057694 and .candidate.artifact_id==9563625638 and .candidate.sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .candidate.size==13147013 and .candidate.signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .visual.run_id==32860235560 and .visual.artifact_id==9568028848 and .visual.android_build_or_sign_in_visual==false and .human_inspection["320x568"].no_wrong_route_loading_crop_overlap==true and .human_inspection["360x640"].no_wrong_route_loading_crop_overlap==true and .human_inspection["480x800"].no_wrong_route_loading_crop_overlap==true and .human_inspection["480x800"].add_dialog_correct==true and .stable_publish=="FORBIDDEN"' ops/beta75-visual-inspection.json >/dev/null
          git fetch --no-tags --depth=1 origin 007795a656fa14236ed766b164ca80bb5872fb32
          git show 007795a656fa14236ed766b164ca80bb5872fb32:ops/beta75-visual-inspection.json > /tmp/locked-visual.json
          jq -S -c . /tmp/locked-visual.json > /tmp/locked-visual.canon
          jq -S -c . ops/beta75-visual-inspection.json > /tmp/current-visual.canon
          cmp -s /tmp/locked-visual.canon /tmp/current-visual.canon
          bash -n tools/publish_beta75_ota.sh
          ! grep -Eq 'assemble|bundle|apksigner|jarsigner|signingConfig' tools/publish_beta75_ota.sh
          ! grep -Eq 'git push .*main|refs/heads/main|stable-release|publish.*STABLE' tools/publish_beta75_ota.sh

      - uses: actions/download-artifact@v4
        with:
          name: beta75-candidate-32849057694
          path: /tmp/beta75-preflight
          repository: tam95supra-source/pick-pack-1291
          run-id: 32849057694
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight exact bytes and materialized publisher
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/beta75-preflight/pick-pack-1291-public-beta-0.4.2-beta.75.apk
          META=/tmp/beta75-preflight/release-meta.json
          test -f "$APK" -a -f "$META"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913"
          test "$(stat -c '%s' "$APK")" = "13147013"
          jq -e '.version_name=="0.4.2-beta.75" and .version_code==81 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha=="e475b8476e99a9230683dbbf6ec266235960ed5b" and .apk_sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .apk_size==13147013 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN" and .service_change=="NONE"' "$META" >/dev/null
          P=$(BETA75_MATERIALIZE_ONLY=1 bash tools/publish_beta75_ota.sh)
          test -f "$P"
          bash -n "$P"
          grep -Fq 'TARGET_VERSION=0.4.2-beta.75' "$P"
          grep -Fq 'SOURCE_RUN_ID=32849057694' "$P"
          grep -Fq 'ARTIFACT_ID=9563625638' "$P"
          grep -Fq 'EXPECTED_SHA=6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913' "$P"
          grep -Fq 'VISUAL_RUN=32860235560' "$P"
          grep -Fq 'VISUAL_ARTIFACT=9568028848' "$P"
          ! grep -Fq '32842363597' "$P"
          ! grep -Fq '9561088652' "$P"
          ! grep -Eq 'assemble|bundle|apksigner|jarsigner|signingConfig' "$P"

      - name: Publish exact Beta75 bytes and verify LIVE
        shell: bash
        run: bash tools/publish_beta75_ota.sh

      - name: Upload Beta75 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta75-release-evidence-${{ github.run_id }}
          path: /tmp/beta75-release-evidence
          retention-days: 30
          if-no-files-found: warn
