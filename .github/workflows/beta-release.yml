name: Beta74 publish exact candidate

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - ops/beta-release-request.json
      - .github/workflows/beta-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: beta74-publish-exact
  cancel-in-progress: false

jobs:
  publish-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate exact Beta74 lock
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stage=="publish" and .version_name=="0.4.2-beta.74" and .version_code==80 and .locked_run_id==32842363597 and .locked_artifact_id==9561088652 and .locked_sha256=="37cadd74088179f1e17872c7474622681941cc5f546807cea769517d9f98b017" and .locked_size==13130629 and .locked_package=="vn.pickpack1291.app.beta.publicbeta" and .locked_signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN"' ops/beta-release-request.json >/dev/null
          jq -e '.status=="PASS" and .result=="HUMAN_VISUAL_PASS" and .candidate.build_run==32842363597 and .candidate.artifact_id==9561088652 and .candidate.sha256=="37cadd74088179f1e17872c7474622681941cc5f546807cea769517d9f98b017" and .candidate.size==13130629 and .visual.artifact_id==9561153695 and .human_inspection["320x568"].nhat_ky_visible==true and .human_inspection["360x640"].nhat_ky_visible==true and .human_inspection["480x800"].nhat_ky_visible==true' ops/beta74-visual-inspection.json >/dev/null
          grep -Fq 'BASE_SHA=85b58348209e97c93957d45275a2fc031c764d48' tools/publish_beta74_ota.sh
          grep -Fq "src=src.replace(needle,'for i in 1 2 3 4 5 6; do',1)" tools/publish_beta74_ota.sh
          grep -Fq "src=src.replace(needle,'for i in 1 2 3 4 5 6 7 8; do',1)" tools/publish_beta74_ota.sh
          bash -n tools/publish_beta74_ota.sh
          ! grep -Eq 'assemble|bundle|apksigner|jarsigner|signingConfig' tools/publish_beta74_ota.sh
          ! grep -Eq 'git push .*main|refs/heads/main|stable-release|publish.*STABLE' tools/publish_beta74_ota.sh

      - name: Publish exact Beta74 bytes and verify LIVE
        shell: bash
        run: bash tools/publish_beta74_ota.sh

      - name: Upload Beta74 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta74-release-evidence-${{ github.run_id }}
          path: /tmp/beta74-release-evidence
          retention-days: 30
          if-no-files-found: warn
