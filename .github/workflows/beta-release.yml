name: Beta release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - ops/beta-release-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.route.outputs.stage }}
      candidate_run_id: ${{ steps.route.outputs.candidate_run_id }}
      candidate_artifact_name: ${{ steps.route.outputs.candidate_artifact_name }}
      verify_run_id: ${{ steps.route.outputs.verify_run_id }}
      verify_artifact_name: ${{ steps.route.outputs.verify_artifact_name }}
      base_candidate_run_id: ${{ steps.route.outputs.base_candidate_run_id }}
      base_candidate_artifact_name: ${{ steps.route.outputs.base_candidate_artifact_name }}
      base_live_final_run_id: ${{ steps.route.outputs.base_live_final_run_id }}
      base_live_final_artifact_name: ${{ steps.route.outputs.base_live_final_artifact_name }}
      source_sha: ${{ steps.route.outputs.source_sha }}
      base_source_sha: ${{ steps.route.outputs.base_source_sha }}
      service_gate_required: ${{ steps.route.outputs.service_gate_required }}
      prior_verify_run_id: ${{ steps.route.outputs.prior_verify_run_id }}
      prior_verify_artifact_name: ${{ steps.route.outputs.prior_verify_artifact_name }}
      rollback_publish_run_id: ${{ steps.route.outputs.rollback_publish_run_id }}
      rollback_publish_artifact_name: ${{ steps.route.outputs.rollback_publish_artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: route
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta-release-request.json
          jq -e '(.version_name|type=="string" and test("^0\\.4\\.2-beta\\.[0-9]+$")) and (.version_code|type=="number") and .stable_publish=="FORBIDDEN" and .authority_change=="NONE"' "$R" >/dev/null
          STAGE=$(jq -r '.stage' "$R")
          case "$STAGE" in
            BUILD_VERIFY)
              jq -e '.human_visual_pass==false and (.source_sha|type=="string" and length==40) and (.base_source_sha|type=="string" and length==40) and (.service_gate_required|type=="boolean")' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- app service google-apps-script
              ;;
            VERIFY_ONLY)
              jq -e '.candidate_locked==true and (.candidate_run_id|type=="number") and (.candidate_artifact_name|type=="string" and length>0) and
                     (.apk_sha256|type=="string" and length==64) and (.apk_size|type=="number") and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40) and
                     (.signer_sha256|type=="string" and length==64)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            SERVICE_ONLY)
              jq -e '.candidate_locked==true and (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- app service google-apps-script
              ;;
            VISUAL_ONLY)
              jq -e '.candidate_locked==true and (.candidate_run_id|type=="number") and (.candidate_artifact_name|type=="string" and length>0) and
                     (.apk_sha256|type=="string" and length==64) and (.apk_size|type=="number") and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            SERVICE_DISCOVERY_ONLY)
              jq -e '.candidate_locked==true and (.candidate_run_id|type=="number") and (.candidate_artifact_name|type=="string" and length>0) and
                     (.apk_sha256|type=="string" and length==64) and (.apk_size|type=="number") and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40) and
                     (.signer_sha256|type=="string" and length==64)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            BACK36_ONLY)
              jq -e '.candidate_locked==true and (.candidate_run_id|type=="number") and (.candidate_artifact_name|type=="string" and length>0) and
                     (.prior_verify_run_id|type=="number") and (.prior_verify_artifact_name|type=="string" and length>0) and
                     (.apk_sha256|type=="string" and length==64) and (.apk_size|type=="number") and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40) and
                     (.signer_sha256|type=="string" and length==64)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            BETA_AUTH_MIGRATE)
              jq -e '.candidate_locked==true and .stable_publish=="FORBIDDEN" and .authority_change=="NONE" and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            STABLE_PRIVATE_APK_VERIFY)
              jq -e '.candidate_locked==true and .stable_publish=="FORBIDDEN" and .authority_change=="NONE" and
                     (.candidate_run_id|type=="number") and (.candidate_artifact_name|type=="string" and length>0) and
                     (.apk_sha256|type=="string" and length==64) and (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            RUNTIME_DOD_VERIFY)
              jq -e '.candidate_locked==true and .stable_publish=="FORBIDDEN" and .authority_change=="NONE" and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              ;;
            BETA_DOMAIN_PREPARE)
              jq -e '.candidate_locked==true and .stable_publish=="FORBIDDEN" and .authority_change=="NONE" and
                     (.source_sha|type=="string" and length==40) and (.candidate_source_sha|type=="string" and length==40)' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- service google-apps-script
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app
              python3 -m py_compile tools/beta_domain_prepare.py
              ;;
            ROLLBACK_ONLY)
              jq -e '.candidate_locked==true and .stable_publish=="FORBIDDEN" and .authority_change=="NONE" and
                     (.base_candidate_run_id|type=="number") and (.base_candidate_artifact_name|type=="string" and length>0) and
                     (.rollback_publish_run_id|type=="number") and (.rollback_publish_artifact_name|type=="string" and length>0)' "$R" >/dev/null
              bash -n tools/beta83_rollback.sh tools/ensure_beta_github_release.sh
              ;;
            pass_live)
              jq -e '.live==true and .candidate_locked==true and .human_visual_pass==true and .visual_matrix=="PASS" and
                     .pda_functional_pre_ota=="PASS" and .back_api36=="PASS" and .fast_check=="PASS" and
                     .runtime_dod_status=="PASS" and .device_regression_status=="PASS" and
                     .technical_pass_status=="PASS" and (.owner_acceptance=="PENDING" or .owner_acceptance=="COMPLETE") and
                     .rebuild==false and .resign==false and .apk_transport=="GITHUB_RELEASE_ONLY" and .google_drive_apk=="FORBIDDEN" and
                     (.candidate_source_sha|type=="string" and length==40) and (.apk_sha256|type=="string" and length==64) and (.apk_size|type=="number") and
                     (.publish_run_id|type=="string" and test("^[0-9]+$"))' "$R" >/dev/null
              git diff --quiet "$(jq -r '.candidate_source_sha' "$R")" HEAD -- app service google-apps-script
              test "$(jq -r '.version_name' ops/beta-ota-current.json)" = "$(jq -r '.version_name' "$R")"
              test "$(jq -r '.version_code' ops/beta-ota-current.json)" = "$(jq -r '.version_code' "$R")"
              test "$(jq -r '.sha256' ops/beta-ota-current.json)" = "$(jq -r '.apk_sha256' "$R")"
              test "$(jq -r '.size' ops/beta-ota-current.json)" = "$(jq -r '.apk_size' "$R")"
              test "$(jq -r '.source' ops/beta-ota-current.json)" = "GITHUB_RELEASE"
              ;;
            PUBLISH)
              jq -e '.candidate_locked==true and .human_visual_pass==true and .visual_matrix=="PASS" and .pda_functional_pre_ota=="PASS" and
                     .rebuild==false and .resign==false and .back_api36=="PASS" and .fast_check=="PASS" and
                     .beta_auth_status=="PASS" and .stable_gas_repair_status=="PASS" and .beta_domain_status=="PASS" and .runtime_dod_status=="PASS" and
                     .device_regression_status=="PASS" and (.device_regression_run_id|type=="number") and (.device_regression_artifact_id|type=="number") and
                     (.runtime_dod_run_id|type=="number") and (.runtime_dod_artifact_id|type=="number") and
                     (.candidate_run_id|type=="number") and (.candidate_artifact_name|type=="string" and length>0) and
                     (.verify_run_id|type=="number") and (.verify_artifact_name|type=="string" and length>0) and
                     (.base_candidate_run_id|type=="number") and (.base_candidate_artifact_name|type=="string" and length>0) and
                     (.base_live_final_run_id|type=="number") and (.base_live_final_artifact_name|type=="string" and length>0) and
                     (.apk_sha256|type=="string" and length==64) and (.apk_size|type=="number") and
                     .apk_transport=="GITHUB_RELEASE_ONLY" and .google_drive_apk=="FORBIDDEN" and
                     ((.human_visual_sizes|sort)==(["320x568","360x640","480x800"]|sort))' "$R" >/dev/null
              git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- app service google-apps-script
              bash -n tools/beta83_publish_ota.sh tools/beta83_rollback.sh tools/beta83_ota_device_gate.sh tools/ensure_beta_github_release.sh tools/finalize_beta83.sh tools/beta83_release_handoff_finalizer.sh tools/beta83_handoff_finalizer.sh
              python3 -m py_compile tools/gas_ota_static_contract.py tools/gas_version_inventory.py
              python3 tools/gas_ota_static_contract.py --self-test
              ! grep -Eqi 'googleapis\.com/drive|drive\.google\.com|drive\.usercontent\.google\.com|drive_file_id|drive_staging_exact|DRIVE_FOLDER_ID|BẢN THỬ NGHIỆM' \
                tools/beta83_publish_ota.sh tools/beta83_rollback.sh tools/beta83_ota_device_gate.sh
              ;;
            *)
              echo "Unsupported stage: $STAGE" >&2
              exit 1
              ;;
          esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$(jq -r '.candidate_run_id // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_name=$(jq -r '.candidate_artifact_name // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "verify_run_id=$(jq -r '.verify_run_id // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "verify_artifact_name=$(jq -r '.verify_artifact_name // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "base_candidate_run_id=$(jq -r '.base_candidate_run_id // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "base_candidate_artifact_name=$(jq -r '.base_candidate_artifact_name // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "base_live_final_run_id=$(jq -r '.base_live_final_run_id // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "base_live_final_artifact_name=$(jq -r '.base_live_final_artifact_name // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r '.source_sha // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "base_source_sha=$(jq -r '.base_source_sha // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "service_gate_required=$(jq -r '.service_gate_required // false' "$R")" >> "$GITHUB_OUTPUT"
          echo "prior_verify_run_id=$(jq -r '.prior_verify_run_id // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "prior_verify_artifact_name=$(jq -r '.prior_verify_artifact_name // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "rollback_publish_run_id=$(jq -r '.rollback_publish_run_id // empty' "$R")" >> "$GITHUB_OUTPUT"
          echo "rollback_publish_artifact_name=$(jq -r '.rollback_publish_artifact_name // empty' "$R")" >> "$GITHUB_OUTPUT"

      - name: Publish fenced run marker
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REQUEST_NONCE=$(jq -r '.execution_nonce' ops/beta-release-request.json)
          REQUEST_STAGE=$(jq -r '.stage' ops/beta-release-request.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RUN_REF"
          git checkout -B "$RUN_REF" "origin/$RUN_REF"
          CURRENT_NONCE=$(jq -r '.execution_nonce' ops/beta-release-request.json)
          if [[ "$CURRENT_NONCE" != "$REQUEST_NONCE" ]]; then
            echo "RUN_MARKER_STALE_SKIP"
            exit 0
          fi
          jq -n --argjson run_id "$RUN_ID" --arg run_sha "$RUN_SHA" --arg ref "$RUN_REF" --arg nonce "$REQUEST_NONCE" --arg stage "$REQUEST_STAGE" \
            '{run_id:$run_id,run_sha:$run_sha,ref:$ref,execution_nonce:$nonce,stage:$stage,observed_at:(now|todateiso8601)}' > ops/beta-run-observe.json
          git add ops/beta-run-observe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: observe Beta run $RUN_ID"
          git push origin HEAD:"$RUN_REF"

  candidate:
    name: candidate
    needs: route
    if: ${{ needs.route.outputs.stage == 'BUILD_VERIFY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk";ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools";unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline";mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV";echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build sign and lock requested Beta candidate
        shell: bash
        run: bash tools/beta83_candidate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beta-candidate-${{ github.run_id }}
          path: /tmp/beta-candidate/*
          retention-days: 30
          if-no-files-found: error

  service_live:
    name: service-live-regression
    needs: [route,candidate]
    if: ${{ always() && needs.route.result == 'success' && needs.route.outputs.service_gate_required == 'true' && (needs.route.outputs.stage == 'SERVICE_ONLY' || needs.route.outputs.stage == 'VERIFY_ONLY' || (needs.route.outputs.stage == 'BUILD_VERIFY' && needs.candidate.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      D1_NAME: pick-pack-1291-service-prod
      SERVICE_SOURCE_SHA: ${{ needs.route.outputs.source_sha }}
      BASE_SERVICE_SOURCE_SHA: ${{ needs.route.outputs.base_source_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate Worker types and typecheck exact service source
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$SERVICE_SOURCE_SHA" HEAD -- app service google-apps-script
          npm --prefix service install --ignore-scripts --no-audit --no-fund
          npm --prefix service run check
      - name: Deploy and verify exact service source with automatic recovery
        shell: bash
        run: |
          set +e
          set -uo pipefail
          bash tools/beta89_service_live_gate.sh
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            echo "Service gate failed; restoring exact base service source" >&2
            git checkout "$BASE_SERVICE_SOURCE_SHA" -- service
            git clean -fd -- service
            npm --prefix service install --ignore-scripts --no-audit --no-fund
            SERVICE_SOURCE_SHA="$BASE_SERVICE_SOURCE_SHA" bash tools/beta78_service_live_gate.sh || exit 97
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-service-${{ github.run_id }}
          path: /tmp/beta89-service-live
          retention-days: 30
          if-no-files-found: error

  verify:
    name: visual-pda-verify
    needs: [route,candidate,service_live]
    if: ${{ always() && needs.route.result == 'success' && (needs.route.outputs.stage == 'VISUAL_ONLY' || (needs.route.outputs.stage == 'VERIFY_ONLY' && (needs.route.outputs.service_gate_required != 'true' || needs.service_live.result == 'success')) || (needs.route.outputs.stage == 'BUILD_VERIFY' && needs.candidate.result == 'success' && (needs.route.outputs.service_gate_required != 'true' || needs.service_live.result == 'success'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.route.outputs.stage == 'BUILD_VERIFY' }}
        with:
          name: beta-candidate-${{ github.run_id }}
          path: /tmp/beta-candidate
      - uses: actions/download-artifact@v4
        if: ${{ needs.route.outputs.stage == 'VERIFY_ONLY' || needs.route.outputs.stage == 'VISUAL_ONLY' }}
        with:
          name: ${{ needs.route.outputs.candidate_artifact_name }}
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run_id }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate verification harness
        shell: bash
        run: bash tools/build_beta83_verify_harness.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run visual matrix and direct candidate PDA functional gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta83_verify_matrix.sh
      - name: Run Android 16 / API36 system Back regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta89_back_api36.sh
      - name: Upload visual and functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-verify-${{ github.run_id }}
          path: |
            /tmp/beta-verify
            /tmp/beta-back36
          retention-days: 30
          if-no-files-found: error

  service_discovery_only:
    name: service-discovery-only
    needs: route
    if: ${{ needs.route.outputs.stage == 'SERVICE_DISCOVERY_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.candidate_artifact_name }}
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run_id }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate verification harness
        shell: bash
        run: bash tools/build_beta83_verify_harness.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run exact stale-discovery cache regression only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/service_discovery_device_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-service-discovery-${{ github.run_id }}
          path: /tmp/beta-service-discovery
          retention-days: 90
          if-no-files-found: error

  back36_only:
    name: back36-only
    needs: route
    if: ${{ needs.route.outputs.stage == 'BACK36_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.candidate_artifact_name }}
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.prior_verify_artifact_name }}
          path: /tmp/prior-verify
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.prior_verify_run_id }}
      - name: Restore prior visual functional receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/beta-verify
          find /tmp/prior-verify -type f -name 'receipt.json' -path '*/beta-verify/*' -print -quit | xargs -r -I{} cp {} /tmp/beta-verify/receipt.json
          if [[ ! -f /tmp/beta-verify/receipt.json ]]; then
            find /tmp/prior-verify -type f -name 'receipt.json' -print -quit | xargs -r -I{} cp {} /tmp/beta-verify/receipt.json
          fi
          jq -e '.status=="PASS" and .functional_pass==true and (.visual_sizes|sort)==(["320x568","360x640","480x800"]|sort)' /tmp/beta-verify/receipt.json >/dev/null
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate verification harness
        shell: bash
        run: bash tools/build_beta83_verify_harness.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run only Android 16 API36 Back regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta89_back_api36.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-verify-${{ github.run_id }}
          path: |
            /tmp/beta-verify
            /tmp/beta-back36
          retention-days: 30
          if-no-files-found: error

  beta_auth_migrate:
    name: beta-auth-migrate
    needs: route
    if: ${{ needs.route.outputs.stage == 'BETA_AUTH_MIGRATE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
