name: Beta release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - ops/beta-release-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.r.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: r
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta-release-request.json
          jq -e '.stage=="PUBLISH" and .version_name=="0.4.2-beta.82" and .version_code==88 and .human_visual_pass==true and .rebuild==false and .resign==false and .stable_publish=="FORBIDDEN" and .authority_change=="NONE"' "$R" >/dev/null
          git diff --quiet "$(jq -r '.source_sha' "$R")" HEAD -- app service google-apps-script
          echo "stage=PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: route
    if: ${{ needs.route.outputs.stage == 'PUBLISH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: beta82-candidate-33097369281
          path: /tmp/beta82-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33097369281
      - uses: actions/download-artifact@v4
        with:
          name: beta82-verify-33099453424
          path: /tmp/beta82-verify
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33099453424
      - name: Publish exact Beta82 bytes after fresh production readbacks
        shell: bash
        run: bash tools/beta82_publish_ota.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta82-publish-${{ github.run_id }}
          path: /tmp/beta82-publish
          retention-days: 30
          if-no-files-found: error

  pda_verify:
    name: pda-verify
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beta81-candidate-33073351925
          path: /tmp/beta81
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33073351925
      - uses: actions/download-artifact@v4
        with:
          name: beta82-candidate-33097369281
          path: /tmp/beta82-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33097369281
      - uses: actions/download-artifact@v4
        with:
          name: beta82-publish-${{ github.run_id }}
          path: /tmp/beta82-publish
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Build separate OTA verification harness
        shell: bash
        run: bash tools/build_beta82_verify_harness.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Install Beta81 then OTA to exact Beta82 and read back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta82_ota_device_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta82-pda-${{ github.run_id }}
          path: /tmp/beta82-pda
          retention-days: 30
          if-no-files-found: error

  rollback:
    name: rollback-beta81
    needs: [publish,pda_verify]
    if: ${{ always() && needs.publish.result == 'success' && needs.pda_verify.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beta82-publish-${{ github.run_id }}
          path: /tmp/beta82-publish
      - name: Restore Beta81 OTA
        shell: bash
        run: bash tools/beta82_rollback.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta82-rollback-${{ github.run_id }}
          path: /tmp/beta82-rollback
          retention-days: 30
          if-no-files-found: error

  finalize:
    name: finalize
    needs: [publish,pda_verify]
    if: ${{ needs.publish.result == 'success' && needs.pda_verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: beta82-publish-${{ github.run_id }}
          path: /tmp/beta82-publish-final
      - uses: actions/download-artifact@v4
        with:
          name: beta82-pda-${{ github.run_id }}
          path: /tmp/beta82-pda-final
      - name: Finalize state and canonical handoff
        shell: bash
        run: bash tools/finalize_beta82.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beta82-final-${{ github.run_id }}
          path: /tmp/beta82-final/receipt.json
          retention-days: 90
          if-no-files-found: error

  handoff_finalizer:
    name: handoff-finalizer
    needs: [publish,pda_verify,rollback,finalize]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create deterministic handoff TXT
        shell: bash
        run: bash tools/beta82_handoff_finalizer.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PICK_PACK_1291_HANDOFF_${{ github.run_id }}
          path: /tmp/PICK_PACK_1291_HANDOFF_${{ github.run_id }}.txt
          retention-days: 90
          if-no-files-found: error
