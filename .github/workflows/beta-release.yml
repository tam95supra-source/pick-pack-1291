name: Beta78 exact OTA publish

on:
  push:
    branches:
      - feature/beta78-old-session-outbound-service-20260826
    paths:
      - .github/workflows/beta-release.yml
      - tools/publish_beta78_ota.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: beta78-exact-ota-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact locked Beta78 candidate
        uses: actions/download-artifact@v4
        with:
          name: beta78-candidate-32978373007
          path: /tmp/beta78-candidate
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 32978373007

      - name: Publish exact bytes to Drive Beta and OTA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/publish_beta78_ota.sh
          bash -n tools/publish_beta78_ota.sh
          bash tools/publish_beta78_ota.sh

      - name: Upload Beta78 publish receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta78-publish-${{ github.run_id }}
          path: /tmp/beta78-publish
          retention-days: 30
          if-no-files-found: warn
