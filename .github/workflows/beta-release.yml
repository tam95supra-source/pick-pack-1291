name: Beta80 exact OTA publish
# PDA functional trigger: device-bound-live-bearer

on:
  push:
    branches:
      - feature/beta78-old-session-outbound-service-20260826
    paths:
      - .github/workflows/beta-release.yml
      - tools/publish_beta80_ota.sh
      - tools/beta80_pda_device_gate.sh
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta80-exact-ota-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[pda-verify-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact locked Beta80 candidate
        uses: actions/download-artifact@v4
        with:
          name: beta80-candidate-33028423645
          path: /tmp/beta80-candidate
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33028423645

      - name: Validate Beta80 exact lock and human visual PASS
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/beta80-candidate/pick-pack-1291-public-beta-0.4.2-beta.80.apk
          META=/tmp/beta80-candidate/release-meta.json
          test -f "$APK" -a -f "$META"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69"
          test "$(stat -c '%s' "$APK")" = "13196221"
          jq -e '.version_name=="0.4.2-beta.80" and .version_code==86 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha=="38d6f08aa63600f4ef09fd524428beccebc4bb6f" and .build_run==33028423645 and .apk_sha256=="1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69" and .apk_size==13196221 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .candidate_locked==true and .stable_publish=="FORBIDDEN" and .service_run==33028423645 and .authority_change=="NONE"' "$META" >/dev/null
          jq -e '.status=="PASS" and .result=="HUMAN_VISUAL_PASS" and .candidate.version_name=="0.4.2-beta.80" and .candidate.version_code==86 and .candidate.build_run==33028423645 and .candidate.artifact_id==9629377960 and .candidate.sha256=="1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69" and .service.live_run==33028423645 and .service.artifact_id==9629315986 and .service.session_v2_gate=="ENTER_SNAPSHOT_MUTATE_EXIT_PASS" and .visual.run_id==33028423645 and .visual.artifact_id==9629445113 and .visual.android_build_or_sign_in_visual==false and .human_inspection["320x568"].active_actions_visible_after_scroll==true and .human_inspection["360x640"].active_actions_visible_after_scroll==true and .human_inspection["480x800"].active_actions_visible==true and .ota_installer_contract.file_provider==true and .ota_installer_contract.direct_android_installer_intent==true and .stable_publish=="FORBIDDEN" and .rebuild_after_candidate_lock==false and .resign_after_candidate_lock==false' ops/beta80-visual-inspection.json >/dev/null
          jq -e '.stage=="publish" and .mode=="PUBLISH_ONLY_EXACT_BYTES" and .version_name=="0.4.2-beta.80" and .version_code==86 and .candidate_run_id==33028423645 and .candidate_artifact_id==9629377960 and .locked_sha256=="1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69" and .locked_size==13196221 and .locked_signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .service_run_id==33028423645 and .service_artifact_id==9629315986 and .service_live_gate=="ENTER_SNAPSHOT_MUTATE_EXIT_PASS" and .final_visual_artifact_id==9629445113 and .stable_publish=="FORBIDDEN" and .rebuild==false and .resign==false and .authority_change=="NONE"' ops/beta-release-request.json >/dev/null
          bash -n tools/publish_beta80_ota.sh
          grep -Fq 'TARGET_VERSION=0.4.2-beta.80' tools/publish_beta80_ota.sh
          grep -Fq 'TARGET_CODE=86' tools/publish_beta80_ota.sh
          grep -Fq 'SOURCE_SHA=38d6f08aa63600f4ef09fd524428beccebc4bb6f' tools/publish_beta80_ota.sh
          grep -Fq 'CANDIDATE_RUN=33028423645' tools/publish_beta80_ota.sh
          grep -Fq 'CANDIDATE_ARTIFACT=9629377960' tools/publish_beta80_ota.sh
          grep -Fq 'VISUAL_ARTIFACT=9629445113' tools/publish_beta80_ota.sh
          grep -Fq 'EXPECTED_SHA=1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69' tools/publish_beta80_ota.sh
          grep -Fq 'EXPECTED_SIZE=13196221' tools/publish_beta80_ota.sh
          grep -Fq 'PREV_VERSION=0.4.2-beta.79' tools/publish_beta80_ota.sh
          grep -Fq 'service_artifact:9629315986' tools/publish_beta80_ota.sh
          grep -Fq 'session_v2_gate:"ENTER_SNAPSHOT_MUTATE_EXIT_PASS"' tools/publish_beta80_ota.sh
          grep -Fq 'generic OTA contract already serves Beta80' tools/publish_beta80_ota.sh
          ! grep -Eq 'gradle|assembleBeta|assembleStable|apksigner|jarsigner|signingConfig' tools/publish_beta80_ota.sh
          echo 'beta80_publish_only_preflight=PASS'

      - name: Publish exact bytes to Drive Beta and OTA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/publish_beta80_ota.sh
          bash -n tools/publish_beta80_ota.sh
          bash tools/publish_beta80_ota.sh

      - name: Upload Beta80 publish receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta80-publish-${{ github.run_id }}
          path: /tmp/beta80-publish
          retention-days: 30
          if-no-files-found: warn

  pda-verify:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pda-verify-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      EXPECTED_SHA: 1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69
      EXPECTED_SIZE: '13196221'
      EXPECTED_SIGNER: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SERVICE_URL: https://pickpack.1291.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download exact old Beta79
        uses: actions/download-artifact@v4
        with:
          name: beta79-candidate-33020009122
          path: /tmp/beta79
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33020009122

      - name: Download exact locked Beta80
        uses: actions/download-artifact@v4
        with:
          name: beta80-candidate-33028423645
          path: /tmp/beta80
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33028423645

      - name: Download successful Beta80 publish receipt
        uses: actions/download-artifact@v4
        with:
          name: beta80-publish-33030927064
          path: /tmp/beta80-publish-receipt
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33030927064

      - name: Validate exact artifacts and materialize PDA harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/beta80-pda-verify
          OLD=/tmp/beta79/pick-pack-1291-public-beta-0.4.2-beta.79.apk
          NEW=/tmp/beta80/pick-pack-1291-public-beta-0.4.2-beta.80.apk
          test -f "$OLD" -a -f "$NEW"
          test "$(sha256sum "$OLD" | awk '{print $1}')" = "547e1242a7d0bb057332ce38c46313771da33235fc0e384a908c14207e26e056"
          test "$(sha256sum "$NEW" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$NEW")" = "$EXPECTED_SIZE"
          jq -e --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" '.status=="PASS" and .version_name=="0.4.2-beta.80" and .version_code==86 and .candidate_artifact==9629377960 and .apk_sha256==$h and .apk_size==$z and .ota_exact_bytes==true and .stable_unchanged==true and .main_unchanged==true and .authority_change=="NONE"' /tmp/beta80-publish-receipt/receipt.json >/dev/null
          OTA_URL=$(jq -r '.apk_url' /tmp/beta80-publish-receipt/receipt.json)
          test -n "$OTA_URL" -a "$OTA_URL" != null
          echo "::add-mask::$OTA_URL"
          echo "OTA_URL=$OTA_URL" >> "$GITHUB_ENV"
          echo "OLD_APK=$OLD" >> "$GITHUB_ENV"
          echo "NEW_APK=$NEW" >> "$GITHUB_ENV"
          tail -n +2 tools/beta80_pda_verify.py.gz.b64 | base64 -d | gzip -d > /tmp/beta80_pda_verify.py
          test "$(sha256sum /tmp/beta80_pda_verify.py | awk '{print $1}')" = "b1917b5b0fd55a432957d46a78c8394edfec30f475d9a4b6b5837c46e783e04b"
          python3 -m py_compile /tmp/beta80_pda_verify.py
          grep -Fq 'url_b64' tools/Beta80VerifyInstrumentation.java
          grep -Fq 'pkg.contains("packageinstaller")' tools/Beta80VerifyInstrumentation.java
          grep -Fq 'OTA_URL_B64=' tools/beta80_pda_device_gate.sh
          grep -Fq 'fileprovider_installer_clicked' tools/beta80_pda_device_gate.sh
          grep -Fq 'ota_installer_clicked' tools/beta80_pda_device_gate.sh
          grep -Fq 'device-logcat.txt' tools/beta80_pda_device_gate.sh
          grep -Fq 'FP_REINSTALL_DONE' tools/beta80_pda_device_gate.sh
          grep -Fq 'direct-owner-after-enter.xml' tools/beta80_pda_device_gate.sh
          ! grep -Eq 'gradle|assembleBeta|assembleStable|apksigner.*pick-pack|jarsigner' /tmp/beta80_pda_verify.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated D1 fixture and exact Service bearer
        shell: bash
        run: |
          set -euo pipefail
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do test -n "${!n:-}"; echo "::add-mask::${!n}"; done
          cd service
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          LIST=$(npx wrangler d1 list --json)
          D1_ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$D1_ID"
          echo "::add-mask::$D1_ID"
          curl -fsS "$SERVICE_URL/v1/authority" > /tmp/beta80-pda-verify/authority-before.json
          GEN=$(jq -r '.authority.service_generation' /tmp/beta80-pda-verify/authority-before.json)
          EPOCH=$(jq -r '.authority.authority_epoch' /tmp/beta80-pda-verify/authority-before.json)
          jq -e '.ok==true and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' /tmp/beta80-pda-verify/authority-before.json >/dev/null
          python3 - "$D1_ID" "$GEN" <<'PY'
          from pathlib import Path
          import sys
          p=Path('wrangler.jsonc');s=p.read_text(encoding='utf-8');d1,generation=sys.argv[1:]
          repl={
            '"name": "pick-pack-1291-service-m1-staging"':'"name": "pickpack"',
            '"SERVICE_GENERATION": "m2-precutover-20260819-001"':f'"SERVICE_GENERATION": "{generation}"',
            '"database_name": "pick-pack-1291-m1-staging"':'"database_name": "pick-pack-1291-service-prod"',
            '"database_id": "__M1_D1_DATABASE_ID__"':f'"database_id": "{d1}"',
          }
          for a,b in repl.items():
              if a not in s: raise SystemExit('LIVE_CONFIG_ANCHOR_MISSING:'+a)
              s=s.replace(a,b,1)
          Path('wrangler.live.jsonc').write_text(s,encoding='utf-8')
          PY
          sql(){ npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "$1" --json; }
          DATES=$(sql "SELECT business_date FROM business_dates ORDER BY sequence_no DESC LIMIT 2;")
          TEST_TODAY=$(jq -r '.[0].results[0].business_date // empty' <<<"$DATES")
          TEST_OLD_DATE=$(jq -r '.[0].results[1].business_date // empty' <<<"$DATES")
          test -n "$TEST_TODAY" -a -n "$TEST_OLD_DATE" -a "$TEST_TODAY" != "$TEST_OLD_DATE"
          SUFFIX=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-10)
          TEST_LOGIN="__B80PDA_LOGIN_$SUFFIX"
          TEST_MNV="98${GITHUB_RUN_ID: -9}${GITHUB_RUN_ATTEMPT}"
          DEVICE="__B80PDA_DEVICE_$SUFFIX"
          TEST_PASSWORD="B80-${SUFFIX}-fixture"
          echo "::add-mask::$TEST_LOGIN"
          echo "::add-mask::$TEST_MNV"
          echo "::add-mask::$DEVICE"
          echo "::add-mask::$TEST_PASSWORD"
          AUTH_MATERIAL=$(node - "$TEST_PASSWORD" "$SUFFIX" <<'NODE'
          const c=require('crypto');
          const [pw,suffix]=process.argv.slice(2);
          const salt=c.createHash('sha256').update('beta80-pda-salt:'+suffix).digest().subarray(0,16);
          const key=c.pbkdf2Sync(pw,salt,120000,32,'sha256');
          const verifier=`pbkdf2_sha256$120000$${salt.toString('base64url')}$${key.toString('base64url')}`;
          const vh=c.createHash('sha256').update(verifier).digest('hex');
          process.stdout.write(JSON.stringify({verifier,vh}));
          NODE
          )
          VERIFIER=$(jq -r '.verifier' <<<"$AUTH_MATERIAL")
          VH=$(jq -r '.vh' <<<"$AUTH_MATERIAL")
          EXISTING_MNV=$(sql "SELECT COUNT(*) n FROM employees WHERE mnv='$TEST_MNV';")
          test "$(jq -r '.[0].results[0].n' <<<"$EXISTING_MNV")" = "0"
          sql "DELETE FROM auth_challenges WHERE login_id='$TEST_LOGIN'; DELETE FROM auth_sessions WHERE login_id='$TEST_LOGIN'; DELETE FROM accounts WHERE login_id='$TEST_LOGIN';" >/dev/null
          sql "INSERT INTO accounts(login_id,verifier,verifier_hash,role,display_name,position,email,status,source_row,source_checksum,is_shadow_test) VALUES('$TEST_LOGIN','$VERIFIER','$VH','SUPERADMIN','Beta80 PDA Verify','TEST','verify@example.invalid','ACTIVE',-80,'b80-pda-test',1); INSERT INTO employees(mnv,full_name,main_position,source_row,source_checksum) VALUES('$TEST_MNV','Beta80 PDA Verify','TEST',-80,'b80-pda-test');" >/dev/null
          CHALLENGE=$(curl -fsS -H 'content-type: application/json' "$SERVICE_URL/v1/auth/challenge" -d "$(jq -nc --arg l "$TEST_LOGIN" '{login_id:$l}')")
          jq -e '.ok==true and (.challenge_id|length)>0 and (.challenge|length)>0 and (.salt|length)>0 and .iterations>=100000' <<<"$CHALLENGE" >/dev/null
          PROOF=$(node - "$TEST_PASSWORD" "$CHALLENGE" <<'NODE'
          const c=require('crypto');
          const [pw,raw]=process.argv.slice(2),j=JSON.parse(raw);
          const key=c.pbkdf2Sync(pw,Buffer.from(j.salt,'base64url'),Number(j.iterations),32,'sha256');
          process.stdout.write(c.createHmac('sha256',key).update(j.challenge).digest('base64url'));
          NODE
          )
          LOGIN_BODY=$(jq -nc --arg l "$TEST_LOGIN" --arg cid "$(jq -r '.challenge_id' <<<"$CHALLENGE")" --arg p "$PROOF" --arg d "$DEVICE" '{login_id:$l,challenge_id:$cid,proof:$p,device_id:$d,device_label:"Beta80 PDA Verify",client_source:"PDA"}')
          LOGIN_RESULT=$(curl -fsS -H 'content-type: application/json' "$SERVICE_URL/v1/auth/login" -d "$LOGIN_BODY")
          jq -e '.ok==true and (.token|length)>40' <<<"$LOGIN_RESULT" >/dev/null
          SERVICE_TOKEN=$(jq -r '.token' <<<"$LOGIN_RESULT")
          echo "::add-mask::$SERVICE_TOKEN"
          cd ..
          MAIN_BEFORE=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
          test -n "$MAIN_BEFORE" -a "$MAIN_BEFORE" != null
          {
            echo "TEST_LOGIN=$TEST_LOGIN"
            echo "TEST_MNV=$TEST_MNV"
            echo "TEST_TODAY=$TEST_TODAY"
            echo "TEST_OLD_DATE=$TEST_OLD_DATE"
            echo "SERVICE_TOKEN=$SERVICE_TOKEN"
            echo "TEST_PASSWORD=$TEST_PASSWORD"
            echo "AUTHORITY_EPOCH_BEFORE=$EPOCH"
            echo "AUTHORITY_GENERATION_BEFORE=$GEN"
            echo "MAIN_BEFORE=$MAIN_BEFORE"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build separate signed instrumentation harness only
        shell: bash
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do test -n "${!v:-}"; done
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -f "$SDK/platforms/android-36/android.jar" ]]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          BT="$SDK/build-tools/36.0.0"
          test -x "$BT/d8" -a -x "$BT/aapt" -a -x "$BT/apksigner"
          mkdir -p /tmp/b80h/src/vn/pickpack1291/verify /tmp/b80h/classes /tmp/b80h/dex
          cat > /tmp/b80h/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="vn.pickpack1291.verify">
            <uses-sdk android:minSdkVersion="29" android:targetSdkVersion="36"/>
            <application android:label="Beta80 Verify"/>
            <instrumentation android:name=".Beta80VerifyInstrumentation" android:targetPackage="vn.pickpack1291.app.beta.publicbeta" android:functionalTest="true" android:handleProfiling="false"/>
          </manifest>
          XML
          cp tools/Beta80VerifyInstrumentation.java /tmp/b80h/src/vn/pickpack1291/verify/Beta80VerifyInstrumentation.java
          javac -source 8 -target 8 -cp "$SDK/platforms/android-36/android.jar" -d /tmp/b80h/classes /tmp/b80h/src/vn/pickpack1291/verify/Beta80VerifyInstrumentation.java
          mapfile -t HARNESS_CLASSES < <(find /tmp/b80h/classes -type f -name '*.class' -print | sort)
          test "${#HARNESS_CLASSES[@]}" -ge 2
          "$BT/d8" --lib "$SDK/platforms/android-36/android.jar" --output /tmp/b80h/dex "${HARNESS_CLASSES[@]}"
          "$BT/aapt" package -f -M /tmp/b80h/AndroidManifest.xml -I "$SDK/platforms/android-36/android.jar" -F /tmp/b80h/harness-unsigned.apk
          (cd /tmp/b80h/dex && "$BT/aapt" add /tmp/b80h/harness-unsigned.apk classes.dex >/dev/null)
          KS=/tmp/b80h/release.jks
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > /tmp/b80h/store.pass
          printf '%s' "$SIGNING_KEY_PASSWORD" > /tmp/b80h/key.pass
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass file:/tmp/b80h/store.pass --key-pass file:/tmp/b80h/key.pass --out /tmp/beta80-verify-harness.apk /tmp/b80h/harness-unsigned.apk
          "$BT/apksigner" verify --print-certs /tmp/beta80-verify-harness.apk > /tmp/b80h/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/b80h/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          test "$CERT" = "$EXPECTED_SIGNER"
          echo "VERIFY_HARNESS_APK=/tmp/beta80-verify-harness.apk" >> "$GITHUB_ENV"
          rm -f "$KS" /tmp/b80h/store.pass /tmp/b80h/key.pass

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Verify OTA installer and exact historical session on installed Beta80
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta80_pda_device_gate.sh

      - name: Cleanup isolated D1 fixture
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f service/wrangler.live.jsonc && -n "${TEST_MNV:-}" && -n "${TEST_LOGIN:-}" ]]; then
            cd service
            npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.live.jsonc --command "DELETE FROM outbound_replication_outbox WHERE event_id IN (SELECT event_id FROM events WHERE actor_id='$TEST_LOGIN'); DELETE FROM sheet_replication_outbox WHERE event_id IN (SELECT event_id FROM events WHERE actor_id='$TEST_LOGIN'); DELETE FROM mutation_assertions WHERE event_id IN (SELECT event_id FROM events WHERE actor_id='$TEST_LOGIN'); DELETE FROM push_outbox WHERE payload_json LIKE '%$TEST_MNV%'; DELETE FROM resource_daily_consumption WHERE mnv='$TEST_MNV'; DELETE FROM resource_leases WHERE mnv='$TEST_MNV'; DELETE FROM historical_session_snapshots WHERE mnv='$TEST_MNV'; DELETE FROM attendance_sessions WHERE mnv='$TEST_MNV'; DELETE FROM events WHERE actor_id='$TEST_LOGIN'; DELETE FROM auth_challenges WHERE login_id='$TEST_LOGIN'; DELETE FROM auth_sessions WHERE login_id='$TEST_LOGIN'; DELETE FROM accounts WHERE login_id='$TEST_LOGIN'; DELETE FROM employees WHERE mnv='$TEST_MNV';" --json > /tmp/beta80-pda-verify/cleanup.json 2>&1
          fi
          exit 0

      - name: Upload Beta80 PDA functional receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta80-pda-functional-${{ github.run_id }}
          path: /tmp/beta80-pda-verify
          retention-days: 30
          if-no-files-found: error

  finalize:
    needs: pda-verify
    if: ${{ needs.pda-verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69
      EXPECTED_SIZE: '13196221'
      EXPECTED_SIGNER: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      BRANCH: feature/beta78-old-session-outbound-service-20260826
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final PDA receipt
        uses: actions/download-artifact@v4
        with:
          name: beta80-pda-functional-${{ github.run_id }}
          path: /tmp/beta80-pda

      - name: Validate receipt, update state and handoff, push once
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/beta80-pda/receipt.json
          test -f "$R"
          jq -e --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" --arg s "$EXPECTED_SIGNER" '
            .status=="PASS" and .version_name=="0.4.2-beta.80" and .version_code==86 and
            .candidate_artifact==9629377960 and .apk_sha256==$h and .apk_size==$z and .signer_sha256==$s and
            .ota_from_beta79_positive_update_click==true and .ota_downloadmanager_exact_sha==true and
            .fileprovider_installer_intent_seen==true and .android_installer_clicked==true and
            .file_picker_required==false and .installed_and_opened_beta80==true and
            .session.shared_qr_ui==true and .session.not_found==false and .session.wrong_session==false and .session.d1_final=="ENDED" and
            .beta_readback.ok==true and .beta_readback.channel=="BETA" and .beta_readback.available==true and .beta_readback.version_name=="0.4.2-beta.80" and .beta_readback.sha256==$h and .beta_readback.size==$z and
            .stable_unchanged==true and .main_unchanged==true and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION" and .authority_change=="NONE"
          ' "$R" >/dev/null

          JOBS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")
          PDA_JOB_ID=$(jq -r '.jobs[] | select(.name=="pda-verify" and .conclusion=="success") | .id' <<<"$JOBS" | head -n1)
          test -n "$PDA_JOB_ID" -a "$PDA_JOB_ID" != null
          mkdir -p /tmp/beta80-final
          NOW=$(TZ=Asia/Bangkok date '+%Y-%m-%dT%H:%M:%S%z')
          STAMP=$(TZ=Asia/Bangkok date '+%Y%m%d-%H%M%S')
          ARCHIVE="docs/handovers/HANDOVER_${STAMP}_beta80-pass-live.md"
          MAIN_SHA=$(jq -r '.main_sha' "$R")
          AUTH_EPOCH=$(jq -r '.authority.authority_epoch' "$R")
          AUTH_GEN=$(jq -r '.authority.service_generation' "$R")
          SID=$(jq -r '.session.session_id' "$R")
          OLD_DATE=$(jq -r '.session.business_date' "$R")

          jq --argjson run "$GITHUB_RUN_ID" --argjson job "$PDA_JOB_ID" --arg source "38d6f08aa63600f4ef09fd524428beccebc4bb6f" --arg finalized "$NOW" '. + {terminal_run_id:$run,pda_job_id:$job,source_sha:$source,finalized_at:$finalized,final_receipt:true}' "$R" > /tmp/beta80-final/pda-receipt.json

          cat > CURRENT_STATE.md <<EOF
          # CURRENT STATE — PICK PACK 1291

          - updated_at: $NOW
          - status: BETA80_PASS_LIVE
          - continuity_branch: $BRANCH
          - source_sha: 38d6f08aa63600f4ef09fd524428beccebc4bb6f
          - workflow_head_sha: $GITHUB_SHA
          - beta_live: 0.4.2-beta.80 (versionCode 86)
          - candidate_artifact: 9629377960
          - apk_sha256: $EXPECTED_SHA
          - apk_size: $EXPECTED_SIZE
          - signer_sha256: $EXPECTED_SIGNER
          - terminal_run: $GITHUB_RUN_ID
          - pda_job: $PDA_JOB_ID
          - session_receipt: Vào ca UI -> mở đúng session_id $SID -> Sửa Ca 2 -> Bắn ra; final ENDED; NOT_FOUND=false
          - beta_ota: exact Beta80 PASS
          - stable: unchanged
          - main_sha: $MAIN_SHA (unchanged)
          - authority: SERVICE_PRIMARY / PRODUCTION / epoch $AUTH_EPOCH / generation $AUTH_GEN (unchanged)
          - next_action: WAIT_FOR_OWNER_NEW_SCOPE
          EOF

          mkdir -p docs/handovers
          cat > docs/handovers/HANDOVER_CURRENT.md <<EOF
          # PICK PACK 1291 — HANDOFF SCHEMA V2

          - schema_version: 2
          - status: READY
          - time: $NOW
          - owner: Nguyễn Văn Tâm
          - branch: $BRANCH
          - working_head_sha: $GITHUB_SHA
          - archive_file: $ARCHIVE

          ## Mục tiêu + DoD
          Hoàn tất Beta80 bằng exact locked APK; OTA cài thật; FileProvider/PackageInstaller PASS; chuỗi Vào ca -> mở đúng session_id -> Sửa -> Bắn ra không NOT_FOUND; Stable/main/signer/authority không đổi; receipt terminal thật.

          ## LIVE / TARGET / CANDIDATE
          - LIVE BETA: 0.4.2-beta.80 / versionCode 86.
          - TARGET: PASS/LIVE hoàn tất.
          - CANDIDATE LOCKED: artifact 9629377960; source 38d6f08aa63600f4ef09fd524428beccebc4bb6f; SHA256 $EXPECTED_SHA; size $EXPECTED_SIZE; signer $EXPECTED_SIGNER.
          - Stable: unchanged.
          - main: $MAIN_SHA unchanged.
          - authority: SERVICE_PRIMARY / PRODUCTION / epoch $AUTH_EPOCH / generation $AUTH_GEN unchanged.

          ## Evidence / locked identity
          - Terminal workflow run: $GITHUB_RUN_ID.
          - pda-verify job: $PDA_JOB_ID SUCCESS.
          - Exact OTA download + Android PackageInstaller + FileProvider self-update: PASS.
          - Historical session: business_date $OLD_DATE; exact session_id $SID; edit + exit; final D1 state ENDED; NOT_FOUND=false; wrong_session=false.
          - Final receipt artifact: beta80-final-$GITHUB_RUN_ID / pda-receipt.json.

          ## File / commit đã đổi
          - .github/workflows/beta-release.yml: fixture dùng live Service challenge/login; finalize needs pda-verify.
          - CURRENT_STATE.md và handoff canonical/archive do finalize sinh sau PASS.

          ## Lỗi + root cause + đường PASS / cấm lặp
          - Run 33045490625 / job 98428394466: ATTENDANCE_ENTER_V2_FAILED:401:SERVICE_SESSION_UNAVAILABLE.
          - Root cause: fixture tự ký bearer bằng secret suy diễn không phải live Service token; APK không lỗi.
          - PASS: tạo verifier hợp lệ, gọi live /v1/auth/challenge + /v1/auth/login để nhận bearer thật; giữ exact Beta80.
          - Cấm lặp: không tự suy diễn SERVICE_TOKEN_SECRET; không rebuild/resign APK để sửa lỗi harness auth.

          ## Workspace / CI / external state
          - Exact APK/build/visual/Service/publish bytes không đổi.
          - Beta OTA readback PASS; Stable/main/authority unchanged.
          - Fixture D1 được cleanup sau gate.

          ## Việc còn lại
          Không còn việc trong scope Beta80.

          ## Blocker / quyền
          Không có blocker OWNER.

          ## Invariants
          Không đổi Stable/main/signer/authority; publish dùng exact bytes; không thêm backend/provider/authority.

          ## NEXT_ACTION
          WAIT_FOR_OWNER_NEW_SCOPE
          EOF
          cp docs/handovers/HANDOVER_CURRENT.md "$ARCHIVE"

          mapfile -t OLD_ARCHIVES < <(find docs/handovers -maxdepth 1 -type f -name 'HANDOVER_20????????-??????_*.md' | sort)
          if (( ${#OLD_ARCHIVES[@]} > 5 )); then
            for f in "${OLD_ARCHIVES[@]:0:${#OLD_ARCHIVES[@]}-5}"; do rm -f "$f"; done
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md docs/handovers
          git diff --cached --quiet && { echo 'FINALIZE_STATE_NOT_CHANGED'; exit 1; }
          git commit -m '[skip ci] finalize Beta80 PASS/LIVE'
          FINAL_COMMIT=$(git rev-parse HEAD)
          git push origin "HEAD:$BRANCH"
          git fetch origin "$BRANCH" --quiet
          test "$(git rev-parse origin/$BRANCH)" = "$FINAL_COMMIT"
          test "$(git show origin/$BRANCH:docs/handovers/HANDOVER_CURRENT.md | sha256sum | awk '{print $1}')" = "$(sha256sum docs/handovers/HANDOVER_CURRENT.md | awk '{print $1}')"
          test "$(git show origin/$BRANCH:$ARCHIVE | sha256sum | awk '{print $1}')" = "$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          jq --arg commit "$FINAL_COMMIT" '. + {handoff_commit_sha:$commit,readback:true}' /tmp/beta80-final/pda-receipt.json > /tmp/beta80-final/pda-receipt.final.json
          mv /tmp/beta80-final/pda-receipt.final.json /tmp/beta80-final/pda-receipt.json
          jq -e '.status=="PASS" and .final_receipt==true and .readback==true and (.handoff_commit_sha|length)==40' /tmp/beta80-final/pda-receipt.json >/dev/null
          cat /tmp/beta80-final/pda-receipt.json

      - name: Upload final Beta80 receipt
        uses: actions/upload-artifact@v4
        with:
          name: beta80-final-${{ github.run_id }}
          path: /tmp/beta80-final/pda-receipt.json
          retention-days: 90
          if-no-files-found: error
