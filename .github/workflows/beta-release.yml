name: Beta77 exact candidate visual retry

on:
  push:
    branches:
      - feature/beta77-owner-fixes-20260826
    paths:
      - .github/workflows/beta-release.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: beta77-exact-visual-retry
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download locked Beta77 candidate from run 32953924512
        uses: actions/download-artifact@v4
        with:
          name: beta77-candidate-32953924512
          path: /tmp/beta77-candidate
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 32953924512

      - name: Preflight patched harness and lock exact candidate
        shell: bash
        run: |
          set -euo pipefail
          META=/tmp/beta77-candidate/release-meta.json
          APK=/tmp/beta77-candidate/pick-pack-1291-public-beta-0.4.2-beta.77.apk
          test -f "$META" -a -f "$APK"
          jq -e '.version_name=="0.4.2-beta.77" and .version_code==83 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha=="43579d1f7f01816cddbdbbcce0a2f19d95d16d91" and .build_run==32953924512 and .apk_sha256=="6ce7838f6f0725ca98b4f3d9237d38aec60092f4488b2795a32ae3f9d24371fb" and .apk_size==13196165 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .candidate_locked==true and .stable_publish=="FORBIDDEN" and .gas_run==32932894375 and .service_run==32953215533 and .authority_change=="NONE"' "$META" >/dev/null
          test "$(sha256sum "$APK" | awk '{print $1}')" = "6ce7838f6f0725ca98b4f3d9237d38aec60092f4488b2795a32ae3f9d24371fb"
          test "$(stat -c '%s' "$APK")" = "13196165"
          python3 -m py_compile tools/run_beta76_visual.py
          bash -n tools/run_beta76_visual_v2.sh
          grep -Fq "'app_process', '/system/bin'" tools/run_beta76_visual.py
          grep -Fq "UiAutomationShellWrapper wrapper" tools/VisualHierarchyDumper.java
          ! grep -Fq "waitForIdle" tools/VisualHierarchyDumper.java
          grep -Fq "/data/local/tmp/beta77-window.xml" tools/run_beta76_visual.py
          test -f tools/VisualHierarchyDumper.java -a -f tools/UiAutomationShellWrapper.java
          command -v javac >/dev/null
          command -v jar >/dev/null
          ANDROID_JAR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/platforms/android-36/android.jar"
          test -f "$ANDROID_JAR"
          DUMPER_BUILD="$(mktemp -d /tmp/beta77-dumper-preflight.XXXXXX)"
          trap 'rm -rf "$DUMPER_BUILD"' EXIT
          mkdir -p "$DUMPER_BUILD/classes"
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$DUMPER_BUILD/classes" tools/UiAutomationShellWrapper.java tools/VisualHierarchyDumper.java
          jar cf "$DUMPER_BUILD/beta77-visual-dumper.jar" -C "$DUMPER_BUILD/classes" com/android/commands/uiautomator/VisualHierarchyDumper.class
          test -s "$DUMPER_BUILD/beta77-visual-dumper.jar"
          ! jar tf "$DUMPER_BUILD/beta77-visual-dumper.jar" | grep -Fq 'UiAutomationShellWrapper.class'
          ! grep -Eq 'gradle|assemble|bundle|apksigner|jarsigner|signingConfig' tools/run_beta76_visual_v2.sh
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=6ce7838f6f0725ca98b4f3d9237d38aec60092f4488b2795a32ae3f9d24371fb" >> "$GITHUB_ENV"
          echo "EXPECTED_SIZE=13196165" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run exact Beta77 visual matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r "$APK"
            bash tools/run_beta76_visual_v2.sh

      - name: Upload exact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta77-visual-${{ github.run_id }}
          path: /tmp/beta77-visual
          retention-days: 30
          if-no-files-found: error
