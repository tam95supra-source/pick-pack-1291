name: Beta81 exact OTA publish

on:
  push:
    branches:
      - feature/beta78-old-session-outbound-service-20260826
    paths:
      - .github/workflows/beta-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta81-exact-ota-publish
  cancel-in-progress: false

env:
  SOURCE_SHA: 963ed28a90d2bb3e4a950ae8100fef15edfa86c5
  CANDIDATE_RUN: '33073351925'
  CANDIDATE_ARTIFACT_ID: '9646920908'
  CANDIDATE_ARTIFACT_NAME: beta81-candidate-33073351925
  VISUAL_ARTIFACT_ID: '9647045177'
  VISUAL_ARTIFACT_NAME: beta81-visual-33073351925
  SERVICE_ARTIFACT_ID: '9646805806'
  SERVICE_ARTIFACT_NAME: beta81-service-live-33073351925
  EXPECTED_SIGNER: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  TARGET_VERSION: 0.4.2-beta.81
  TARGET_CODE: '87'
  PREV_VERSION: 0.4.2-beta.80
  PREV_CODE: '86'
  PREV_SHA: 1210bf57ff3bb48a723aa40d2efc8ec922c5e632e4c1d9928bf4dbe843654a69
  PREV_SIZE: '13196221'
  PREV_DRIVE_FILE_ID: 1ylv495ZdXtUONI663KockKn9SxVn_tZy
  BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
  SERVICE_URL: https://pickpack.1291.workers.dev

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      apk_sha: ${{ steps.identity.outputs.apk_sha }}
      apk_size: ${{ steps.identity.outputs.apk_size }}
      drive_file_id: ${{ steps.publish.outputs.drive_file_id }}
      apk_url_b64: ${{ steps.publish.outputs.apk_url_b64 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact locked Beta81 candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: /tmp/beta81-candidate
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33073351925

      - name: Validate exact candidate and locked evidence
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/beta81-candidate/pick-pack-1291-public-beta-0.4.2-beta.81.apk
          META=/tmp/beta81-candidate/release-meta.json
          test -f "$APK" -a -f "$META"
          jq -e --arg s "$SOURCE_SHA" --arg signer "$EXPECTED_SIGNER" '
            .version_name=="0.4.2-beta.81" and .version_code==87 and
            .package=="vn.pickpack1291.app.beta.publicbeta" and
            .source_sha==$s and .build_run==33073351925 and
            .signer_sha256==$signer and .candidate_locked==true and
            .stable_publish=="FORBIDDEN" and .service_run==33073351925 and
            .authority_change=="NONE"
          ' "$META" >/dev/null
          APK_SHA=$(jq -r '.apk_sha256' "$META")
          APK_SIZE=$(jq -r '.apk_size' "$META")
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' "$APK")" = "$APK_SIZE"
          test "$APK_SHA" != "null" -a ${#APK_SHA} -eq 64
          test "$APK_SIZE" -gt 1000000

          check_artifact(){
            local id="$1" expected="$2"
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "/tmp/artifact-$id.json"
            jq -e --arg n "$expected" --argjson id "$id" '.id==$id and .name==$n and .expired==false' "/tmp/artifact-$id.json" >/dev/null
          }
          check_artifact "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_NAME"
          check_artifact "$VISUAL_ARTIFACT_ID" "$VISUAL_ARTIFACT_NAME"
          check_artifact "$SERVICE_ARTIFACT_ID" "$SERVICE_ARTIFACT_NAME"
          jq -e '.digest=="sha256:16b79ea2fef49c7a1091cb1f02a2a9e0dce7708aabbe51c830cee3f67b9b95e2"' "/tmp/artifact-$CANDIDATE_ARTIFACT_ID.json" >/dev/null
          jq -e '.digest=="sha256:ca119c02e7e4133892b337245205bd3a06bd4635fd435f20a74ae7a1cb2d54b7"' "/tmp/artifact-$VISUAL_ARTIFACT_ID.json" >/dev/null
          jq -e '.digest=="sha256:e5503a019509a2c8a31bf7a169c4fd15c07581f9aa4a3bef7e42135ad5e4c3ec"' "/tmp/artifact-$SERVICE_ARTIFACT_ID.json" >/dev/null

          git diff --quiet "$SOURCE_SHA" HEAD -- app service google-apps-script
          git diff --check "$SOURCE_SHA" HEAD
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"

      - name: Publish exact Beta81 bytes and read back OTA
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_DEPLOYMENT_ID GH_TOKEN; do test -n "${!n:-}"; done
          E=/tmp/beta81-publish
          mkdir -p "$E"
          APK=/tmp/beta81-candidate/pick-pack-1291-public-beta-0.4.2-beta.81.apk
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' "$APK")" = "$APK_SIZE"

          MAIN_BEFORE=$(curl -fsSL --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
          test -n "$MAIN_BEFORE" -a "$MAIN_BEFORE" != null
          curl -fsSL --connect-timeout 15 --max-time 30 "$SERVICE_URL/v1/authority" > "$E/authority-before.json"
          jq -e '.ok==true and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' "$E/authority-before.json" >/dev/null

          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
          DEPLOYMENT_ID="$RAW"
          if [[ "$RAW" == *"/s/"* ]]; then DEPLOYMENT_ID="${RAW#*/s/}"; DEPLOYMENT_ID="${DEPLOYMENT_ID%%/*}"; fi
          test -n "$DEPLOYMENT_ID"
          GAS_URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          echo "::add-mask::$DEPLOYMENT_ID"
          echo "::add-mask::$GAS_URL"

          read_update(){
            local channel="$1" current="$2" out="$3" attempt
            for attempt in 0 1 2; do
              if curl -fsSL --connect-timeout 15 --max-time 30 -H 'content-type: application/json' "$GAS_URL" \
                -d "{\"action\":\"update_check\",\"channel\":\"$channel\",\"current_version\":\"$current\"}" > "$out" \
                && jq -e --arg ch "$channel" '.ok==true and .channel==$ch and (.available==true or .available==false)' "$out" >/dev/null 2>&1; then return 0; fi
              [[ "$attempt" -lt 2 ]] || break
              sleep $((2 + attempt * 4))
            done
            jq -c . "$out" 2>/dev/null >&2 || true
            return 1
          }

          read_update STABLE 0.1.0-stable "$E/stable-before.json"
          jq -e '.ok==true and .channel=="STABLE" and .available==false and .reason=="NO_APK"' "$E/stable-before.json" >/dev/null
          read_update BETA "$PREV_VERSION" "$E/beta-before.json"

          TARGET_ALREADY=0
          if jq -e --arg h "$APK_SHA" --argjson z "$APK_SIZE" \
            '.ok==true and .channel=="BETA" and .available==true and .version_name=="0.4.2-beta.81" and .sha256==$h and .size==$z and ((.apk_url//"")|length)>0' \
            "$E/beta-before.json" >/dev/null 2>&1; then
            TARGET_ALREADY=1
          else
            jq -e --arg h "$PREV_SHA" --argjson z "$PREV_SIZE" \
              '.ok==true and .channel=="BETA" and .available==true and .version_name=="0.4.2-beta.80" and .sha256==$h and .size==$z and ((.apk_url//"")|length)>0' \
              "$E/beta-before.json" >/dev/null
          fi

          TOKEN_JSON=$(curl -fsS --connect-timeout 15 --max-time 30 https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token)
          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<<"$TOKEN_JSON")
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"

          DRIVE_OK=0
          for attempt in 0 1 2; do
            HTTP=$(curl -sS --connect-timeout 15 --max-time 30 -o "$E/drive-folder.json" -w '%{http_code}' \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files/$BETA_FOLDER_ID?fields=id,name,mimeType" || printf '000')
            if [[ "$HTTP" == 200 ]] && jq -e --arg id "$BETA_FOLDER_ID" '.id==$id' "$E/drive-folder.json" >/dev/null 2>&1; then DRIVE_OK=1; break; fi
            [[ "$attempt" -lt 2 ]] || break
            sleep $((2 + attempt * 4))
          done
          test "$DRIVE_OK" = 1

          FILE_ID=""
          APK_URL=""
          if [[ "$TARGET_ALREADY" == 1 ]]; then
            APK_URL=$(jq -r '.apk_url' "$E/beta-before.json")
            FILE_ID=$(python3 - "$APK_URL" <<'PY'
          import sys,urllib.parse
          u=urllib.parse.urlparse(sys.argv[1]); q=urllib.parse.parse_qs(u.query)
          print((q.get("id") or [""])[0])
          PY
)
            test -n "$FILE_ID"
          else
            APK_NAME=pick-pack-1291-public-beta-0.4.2-beta.81.apk
            Q="'$BETA_FOLDER_ID' in parents and name='$APK_NAME' and trashed=false"
            curl -fsS --get --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=$Q" --data-urlencode 'fields=files(id,name,size,modifiedTime)' \
              https://www.googleapis.com/drive/v3/files > "$E/drive-search.json"
            COUNT=$(jq '.files|length' "$E/drive-search.json")
            while read -r id; do
              [[ -n "$id" ]] || continue
              curl -fsS --connect-timeout 15 --max-time 120 -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://www.googleapis.com/drive/v3/files/$id?alt=media" -o "$E/existing.apk" || continue
              if [[ "$(sha256sum "$E/existing.apk" | awk '{print $1}')" == "$APK_SHA" && "$(stat -c '%s' "$E/existing.apk")" == "$APK_SIZE" ]]; then FILE_ID="$id"; break; fi
            done < <(jq -r '.files[]?.id' "$E/drive-search.json")
            if [[ -z "$FILE_ID" && "$COUNT" -gt 0 ]]; then
              echo "BETA81_NAME_COLLISION_NONEXACT" >&2
              exit 31
            fi
            if [[ -z "$FILE_ID" ]]; then
              META_JSON=$(jq -nc --arg n "$APK_NAME" --arg p "$BETA_FOLDER_ID" '{name:$n,parents:[$p]}')
              curl -fsS --connect-timeout 15 --max-time 120 -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -F "metadata=$META_JSON;type=application/json;charset=UTF-8" \
                -F "file=@$APK;type=application/vnd.android.package-archive" \
                'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size' > "$E/drive-upload.json"
              FILE_ID=$(jq -r '.id // empty' "$E/drive-upload.json")
              test -n "$FILE_ID"
            fi
            echo "::add-mask::$FILE_ID"
            DESC="Beta81 exact OTA; SHA256 $APK_SHA; candidate run $CANDIDATE_RUN; artifact $CANDIDATE_ARTIFACT_ID; signer $EXPECTED_SIGNER"
            jq -nc --arg d "$DESC" '{description:$d}' > "$E/drive-meta.json"
            curl -fsS --connect-timeout 15 --max-time 30 -X PATCH -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @"$E/drive-meta.json" "https://www.googleapis.com/drive/v3/files/$FILE_ID?fields=id,name,size,description" > "$E/drive-meta-out.json"

            curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files/$FILE_ID/permissions?fields=permissions(id,type,role)" > "$E/permissions.json"
            if ! jq -e '.permissions[]? | select(.type=="anyone" and .role=="reader")' "$E/permissions.json" >/dev/null; then
              curl -fsS --connect-timeout 15 --max-time 30 -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
                -d '{"type":"anyone","role":"reader"}' \
                "https://www.googleapis.com/drive/v3/files/$FILE_ID/permissions?fields=id,type,role" > "$E/permission-created.json"
            fi
            for u in \
              "https://drive.usercontent.google.com/download?id=$FILE_ID&export=download&confirm=t" \
              "https://drive.google.com/uc?export=download&id=$FILE_ID"; do
              rm -f "$E/public.apk"
              if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 120 "$u" -o "$E/public.apk" \
                && [[ "$(sha256sum "$E/public.apk" | awk '{print $1}')" == "$APK_SHA" ]] \
                && [[ "$(stat -c '%s' "$E/public.apk")" == "$APK_SIZE" ]]; then APK_URL="$u"; break; fi
            done
            test -n "$APK_URL"
          fi
          echo "::add-mask::$FILE_ID"
          echo "::add-mask::$APK_URL"

          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 120 "$APK_URL" -o "$E/ota-readback.apk"
          test "$(sha256sum "$E/ota-readback.apk" | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' "$E/ota-readback.apk")" = "$APK_SIZE"
          cmp -s "$APK" "$E/ota-readback.apk"

          PASS=0
          for attempt in 0 1 2; do
            read_update BETA "$PREV_VERSION" "$E/beta-after.json" || true
            if jq -e --arg h "$APK_SHA" --argjson z "$APK_SIZE" \
              '.ok==true and .channel=="BETA" and .available==true and .version_name=="0.4.2-beta.81" and .sha256==$h and .size==$z and ((.apk_url//"")|length)>0' \
              "$E/beta-after.json" >/dev/null 2>&1; then PASS=1; break; fi
            [[ "$attempt" -lt 2 ]] && sleep $((2 + attempt * 4))
          done
          test "$PASS" = 1
          RETURNED_URL=$(jq -r '.apk_url' "$E/beta-after.json")
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 120 "$RETURNED_URL" -o "$E/ota-contract-readback.apk"
          test "$(sha256sum "$E/ota-contract-readback.apk" | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' "$E/ota-contract-readback.apk")" = "$APK_SIZE"
          cmp -s "$APK" "$E/ota-contract-readback.apk"

          read_update BETA "$TARGET_VERSION" "$E/beta-current-target.json"
          jq -e '.ok==true and .channel=="BETA" and .available==false and .version_name=="0.4.2-beta.81"' "$E/beta-current-target.json" >/dev/null
          read_update STABLE 0.1.0-stable "$E/stable-after.json"
          jq -e '.ok==true and .channel=="STABLE" and .available==false and .reason=="NO_APK"' "$E/stable-after.json" >/dev/null
          jq -S . "$E/stable-before.json" > "$E/stable-before.canon"
          jq -S . "$E/stable-after.json" > "$E/stable-after.canon"
          cmp -s "$E/stable-before.canon" "$E/stable-after.canon"

          MAIN_AFTER=$(curl -fsSL --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
          test "$MAIN_AFTER" = "$MAIN_BEFORE"
          curl -fsSL --connect-timeout 15 --max-time 30 "$SERVICE_URL/v1/authority" > "$E/authority-after.json"
          jq -e --slurpfile b "$E/authority-before.json" \
            '.ok==true and .authority.mode==$b[0].authority.mode and .authority.scope==$b[0].authority.scope and .authority.authority_epoch==$b[0].authority.authority_epoch and .authority.service_generation==$b[0].authority.service_generation' \
            "$E/authority-after.json" >/dev/null

          jq -n \
            --arg version "$TARGET_VERSION" --argjson code "$TARGET_CODE" --arg source "$SOURCE_SHA" \
            --arg h "$APK_SHA" --argjson z "$APK_SIZE" --arg signer "$EXPECTED_SIGNER" \
            --arg file "$FILE_ID" --arg url "$RETURNED_URL" --arg main "$MAIN_AFTER" \
            --argjson target_already "$TARGET_ALREADY" \
            --slurpfile beta "$E/beta-after.json" --slurpfile current "$E/beta-current-target.json" \
            --slurpfile stable "$E/stable-after.json" --slurpfile auth "$E/authority-after.json" \
            '{status:"PASS",channel:"BETA",version_name:$version,version_code:$code,package:"vn.pickpack1291.app.beta.publicbeta",
              source_sha:$source,candidate_run:33073351925,candidate_artifact:9646920908,visual_artifact:9647045177,service_artifact:9646805806,
              apk_sha256:$h,apk_size:$z,signer_sha256:$signer,drive_file_id:$file,apk_url:$url,ota_exact_bytes:true,
              publish_mode:(if $target_already==1 then "REUSED_ALREADY_LIVE_EXACT" else "PUBLISHED_EXACT_BYTES" end),
              beta_readback:$beta[0],target_current_readback:$current[0],stable_readback:$stable[0],stable_unchanged:true,
              main_sha:$main,main_unchanged:true,authority:$auth[0].authority,authority_change:"NONE",gas_code_changed:false}' > "$E/receipt.json"
          jq -e '.status=="PASS" and .ota_exact_bytes==true and .stable_unchanged==true and .main_unchanged==true and .authority_change=="NONE"' "$E/receipt.json" >/dev/null
          echo "drive_file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          printf '%s' "$RETURNED_URL" | base64 -w0 | sed 's/^/apk_url_b64=/' >> "$GITHUB_OUTPUT"
          cat "$E/receipt.json"

      - name: Upload Beta81 publish receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta81-publish-${{ github.run_id }}
          path: /tmp/beta81-publish
          retention-days: 30
          if-no-files-found: warn

  pda-verify:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      APK_SHA: ${{ needs.publish.outputs.apk_sha }}
      APK_SIZE: ${{ needs.publish.outputs.apk_size }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Beta80 baseline
        uses: actions/download-artifact@v4
        with:
          name: beta80-candidate-33028423645
          path: /tmp/beta80
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33028423645

      - name: Download exact Beta81 candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: /tmp/beta81
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33073351925

      - name: Download Beta81 publish receipt
        uses: actions/download-artifact@v4
        with:
          name: beta81-publish-${{ github.run_id }}
          path: /tmp/beta81-publish

      - name: Validate exact OTA inputs
        shell: bash
        run: |
          set -euo pipefail
          OLD=/tmp/beta80/pick-pack-1291-public-beta-0.4.2-beta.80.apk
          NEW=/tmp/beta81/pick-pack-1291-public-beta-0.4.2-beta.81.apk
          META=/tmp/beta81/release-meta.json
          R=/tmp/beta81-publish/receipt.json
          test -f "$OLD" -a -f "$NEW" -a -f "$META" -a -f "$R"
          test "$(sha256sum "$OLD" | awk '{print $1}')" = "$PREV_SHA"
          test "$(stat -c '%s' "$OLD")" = "$PREV_SIZE"
          test "$(sha256sum "$NEW" | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' "$NEW")" = "$APK_SIZE"
          jq -e --arg h "$APK_SHA" --argjson z "$APK_SIZE" --arg signer "$EXPECTED_SIGNER" \
            '.status=="PASS" and .version_name=="0.4.2-beta.81" and .version_code==87 and .candidate_artifact==9646920908 and .apk_sha256==$h and .apk_size==$z and .signer_sha256==$signer and .ota_exact_bytes==true and .stable_unchanged==true and .main_unchanged==true' "$R" >/dev/null
          OTA_URL=$(jq -r '.apk_url' "$R")
          test -n "$OTA_URL" -a "$OTA_URL" != null
          echo "::add-mask::$OTA_URL"
          {
            echo "OLD_APK=$OLD"
            echo "NEW_APK=$NEW"
            echo "OTA_URL=$OTA_URL"
            echo "MAIN_BEFORE=$(jq -r '.main_sha' "$R")"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build separate signed Beta81 verification harness only
        shell: bash
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do test -n "${!v:-}"; done
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -f "$SDK/platforms/android-36/android.jar" ]]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          BT="$SDK/build-tools/36.0.0"
          test -x "$BT/d8" -a -x "$BT/aapt" -a -x "$BT/apksigner"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p /tmp/b81h/src/vn/pickpack1291/verify /tmp/b81h/classes /tmp/b81h/dex /tmp/beta81-pda-verify
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tools/Beta80VerifyInstrumentation.java")
          s=p.read_text(encoding="utf-8")
          s=s.replace("import java.lang.reflect.Method;", "import java.lang.reflect.Method;\nimport org.json.JSONArray;\nimport org.json.JSONObject;\nimport java.time.LocalDate;\nimport java.time.ZoneId;")
          s=s.replace('else if("historical".equals(mode)) historical();', 'else if("historical".equals(mode)) historical();\n      else if("beta81checks".equals(mode)) beta81checks();')
          s=s.replace('.putString("notes","Beta80 OTA exact candidate")\n      .putInt("version_code",86)', '.putString("notes","Beta81 OTA exact candidate")\n      .putInt("version_code",87)')
          marker="\n}"
          method=r'''
            private void assertTrue(boolean v,String msg){ if(!v)throw new IllegalStateException(msg); }
          
            private void beta81checks() throws Exception {
              String mnv=req("mnv"), mnv2=req("mnv2");
              seedAuth(); seedService();
              String today=LocalDate.now(ZoneId.of("Asia/Ho_Chi_Minh")).toString();
              String oldDate=LocalDate.parse(today).minusDays(1).toString();
          
              JSONObject master=new JSONObject().put("ok",true).put("master_revision",81001L)
                .put("staff",new JSONArray()
                  .put(new JSONObject().put("mnv",mnv).put("full_name","Beta81 Test A").put("main_position","PICK").put("supplier","TEST").put("department","OPS").put("site","1291").put("warehouse","HY1"))
                  .put(new JSONObject().put("mnv",mnv2).put("full_name","Beta81 Test B").put("main_position","PACK").put("supplier","TEST").put("department","OPS").put("site","1291").put("warehouse","HY1")))
                .put("pdas",new JSONArray()
                  .put(new JSONObject().put("serial","MT90-B81-OLD").put("status","Tốt"))
                  .put(new JSONObject().put("serial","MT90-B81-FREE").put("status","Tốt")))
                .put("pda_statuses",new JSONArray().put("Tốt"))
                .put("user_picks",new JSONArray().put("PICK-B81-OLD").put("PICK-B81-FREE"))
                .put("pack_bundles",new JSONArray()
                  .put(new JSONObject().put("table","TABLE-B81-OLD").put("user_pack","PACK-B81-OLD"))
                  .put(new JSONObject().put("table","TABLE-B81-FREE").put("user_pack","PACK-B81-FREE")));
          
              ClassLoader cl=target.getClassLoader();
              Class<?> mc=cl.loadClass("vn.pickpack1291.app.beta.MasterDataCache");
              Object mci=mc.getField("INSTANCE").get(null);
              mc.getMethod("save",Context.class,JSONObject.class).invoke(mci,target,master);
          
              Class<?> sc=cl.loadClass("vn.pickpack1291.app.beta.OperationalDataStore");
              Object store=sc.getConstructor(Context.class).newInstance(target);
              Method saveDay=sc.getMethod("saveDay",JSONObject.class);
          
              JSONObject currentSession=new JSONObject()
                .put("session_id","beta81-current-active").put("mnv",mnv).put("business_date",today)
                .put("shift","Ca 2").put("work_choice","PICK").put("state","ACTIVE")
                .put("enter_at",today+"T12:00:00Z").put("exit_at","").put("version",1);
              JSONObject currentDay=new JSONObject().put("business_date",today).put("day_revision",81001L)
                .put("sessions",new JSONArray().put(currentSession)).put("events",new JSONArray()).put("labor",new JSONArray());
              saveDay.invoke(store,currentDay);
          
              open("BUSINESS");
              waitText("Ca 2 – 1/0",true,false,15000);
              mark("reconciliation_home_1_0",true);
              clickText("Quét QR nhân sự",true,15000);
              waitText("Ca 2 – 1/0",true,false,15000);
              mark("reconciliation_qr_1_0",true);
          
              JSONObject emptyCurrent=new JSONObject().put("business_date",today).put("day_revision",81002L)
                .put("sessions",new JSONArray()).put("events",new JSONArray()).put("labor",new JSONArray());
              saveDay.invoke(store,emptyCurrent);
              JSONObject oldSession=new JSONObject()
                .put("session_id","beta81-old-active").put("mnv",mnv).put("business_date",oldDate)
                .put("shift","Ca 2").put("work_choice","PICK").put("state","ACTIVE")
                .put("enter_at",oldDate+"T16:30:00Z").put("exit_at","").put("version",3)
                .put("pda_serial","MT90-B81-OLD").put("user_pick","PICK-B81-OLD")
                .put("pack_table","TABLE-B81-OLD").put("user_pack","PACK-B81-OLD");
              JSONObject oldDay=new JSONObject().put("business_date",oldDate).put("day_revision",81003L)
                .put("sessions",new JSONArray().put(oldSession)).put("events",new JSONArray()).put("labor",new JSONArray());
              saveDay.invoke(store,oldDay);
          
              Class<?> pc=cl.loadClass("vn.pickpack1291.app.beta.PdaLocalProjection");
              Object pci=pc.getField("INSTANCE").get(null);
              JSONObject ctx=(JSONObject)pc.getMethod("employeeContext",Context.class,String.class).invoke(pci,target,mnv);
              assertTrue(ctx!=null && "ACTIVE".equals(ctx.optString("state")),"ROLLOVER_STATE_NOT_ACTIVE");
              assertTrue(today.equals(ctx.optString("business_date")),"ROLLOVER_CONTEXT_DATE_NOT_NEW_DAY");
              JSONObject ses=ctx.optJSONObject("session");
              assertTrue(ses!=null && "beta81-old-active".equals(ses.optString("session_id")),"ROLLOVER_WRONG_SESSION");
              assertTrue(oldDate.equals(ses.optString("business_date")),"ROLLOVER_OLD_DATE_LOST");
              mark("rollover_old_active_preserved",true);
          
              JSONObject options=(JSONObject)pc.getMethod("resourceOptions",Context.class,String.class).invoke(pci,target,mnv2);
              boolean pdaBusy=true;
              JSONArray pdas=options.optJSONArray("pdas");
              for(int i=0;i<(pdas==null?0:pdas.length());i++) if("MT90-B81-OLD".equals(pdas.optJSONObject(i).optString("serial"))) pdaBusy=false;
              boolean pickBusy=true;
              JSONArray picks=options.optJSONArray("user_picks");
              for(int i=0;i<(picks==null?0:picks.length());i++) if("PICK-B81-OLD".equals(picks.optString(i))) pickBusy=false;
              boolean packBusy=true;
              JSONArray packs=options.optJSONArray("pack_tables");
              for(int i=0;i<(packs==null?0:packs.length());i++){
                JSONObject x=packs.optJSONObject(i);
                if(x!=null && ("TABLE-B81-OLD".equals(x.optString("table")) || "PACK-B81-OLD".equals(x.optString("user_pack")))) packBusy=false;
              }
              assertTrue(pdaBusy && pickBusy && packBusy,"OLD_ACTIVE_RESOURCE_RELEASED");
              mark("old_resources_preserved",true);
          
              seedService(); open("BUSINESS");
              clickText("Quét QR nhân sự",true,15000);
              seedService(); setEmployee(mnv);
              waitText("CẢNH BÁO: PHIÊN CA CŨ",false,false,15000);
              waitText("Ra ca",true,true,15000);
              mark("scanned_old_warning",true);
              ok("BETA81_THREE_FIXES_PASS");
            }
          '''
          idx=s.rfind(marker)
          if idx<0: raise SystemExit("CLASS_END_NOT_FOUND")
          s=s[:idx]+method+s[idx:]
          Path("/tmp/b81h/src/vn/pickpack1291/verify/Beta80VerifyInstrumentation.java").write_text(s,encoding="utf-8")
          PY
          javac -source 8 -target 8 -cp "$SDK/platforms/android-36/android.jar" \
            -d /tmp/b81h/classes /tmp/b81h/src/vn/pickpack1291/verify/Beta80VerifyInstrumentation.java
          mapfile -t CLASSES < <(find /tmp/b81h/classes -type f -name '*.class' -print | sort)
          test "${#CLASSES[@]}" -ge 2
          "$BT/d8" --lib "$SDK/platforms/android-36/android.jar" --output /tmp/b81h/dex "${CLASSES[@]}"
          cat > /tmp/b81h/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="vn.pickpack1291.verify">
            <uses-sdk android:minSdkVersion="29" android:targetSdkVersion="36"/>
            <application android:label="Beta81 Verify"/>
            <instrumentation android:name=".Beta80VerifyInstrumentation" android:targetPackage="vn.pickpack1291.app.beta.publicbeta" android:functionalTest="true" android:handleProfiling="false"/>
          </manifest>
          XML
          "$BT/aapt" package -f -M /tmp/b81h/AndroidManifest.xml -I "$SDK/platforms/android-36/android.jar" -F /tmp/b81h/harness-unsigned.apk
          (cd /tmp/b81h/dex && "$BT/aapt" add /tmp/b81h/harness-unsigned.apk classes.dex >/dev/null)
          KS=/tmp/b81h/release.jks
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > /tmp/b81h/store.pass
          printf '%s' "$SIGNING_KEY_PASSWORD" > /tmp/b81h/key.pass
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass file:/tmp/b81h/store.pass --key-pass file:/tmp/b81h/key.pass \
            --out /tmp/beta81-verify-harness.apk /tmp/b81h/harness-unsigned.apk
          "$BT/apksigner" verify --print-certs /tmp/beta81-verify-harness.apk > /tmp/b81h/cert.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/b81h/cert.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
          test "$CERT" = "$EXPECTED_SIGNER"
          rm -f "$KS" /tmp/b81h/store.pass /tmp/b81h/key.pass
          echo "VERIFY_HARNESS_APK=/tmp/beta81-verify-harness.apk" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: OTA install exact Beta81 and verify three fixes on device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -euo pipefail
            OUT=/tmp/beta81-pda-verify
            PKG=vn.pickpack1291.app.beta.publicbeta
            VERIFY=vn.pickpack1291.verify/.Beta80VerifyInstrumentation
            mkdir -p "$OUT"
            adb root >"$OUT/adb-root.txt" 2>&1 || true
            adb wait-for-device
            test "$(adb shell id -u 2>/dev/null | tr -d '\r')" = "0"

            adb uninstall "$PKG" >/dev/null 2>&1 || true
            adb install "$OLD_APK" >"$OUT/install-beta80.txt"
            adb shell dumpsys package "$PKG" >"$OUT/package-beta80.txt"
            grep -Fq 'versionName=0.4.2-beta.80' "$OUT/package-beta80.txt"
            grep -Eq 'versionCode=86([[:space:]]|$)' "$OUT/package-beta80.txt"
            adb shell appops set "$PKG" REQUEST_INSTALL_PACKAGES allow >/dev/null 2>&1 || true
            adb install -r "$VERIFY_HARNESS_APK" >"$OUT/install-harness.txt"

            URL_B64=$(printf '%s' "$OTA_URL" | base64 -w0)
            adb shell am instrument -w -r \
              -e mode ota -e version "$TARGET_VERSION" -e url_b64 "$URL_B64" -e sha "$APK_SHA" \
              "$VERIFY" >"$OUT/ota-instrument.txt" 2>&1 &
            OTA_PID=$!
            UPDATED=0
            for _ in $(seq 1 180); do
              adb shell dumpsys package "$PKG" >"$OUT/package-current.txt" 2>/dev/null || true
              if grep -Fq 'versionName=0.4.2-beta.81' "$OUT/package-current.txt" && grep -Eq 'versionCode=87([[:space:]]|$)' "$OUT/package-current.txt"; then
                cp "$OUT/package-current.txt" "$OUT/package-beta81.txt"
                UPDATED=1
                break
              fi
              sleep 0.5
            done
            test "$UPDATED" = 1
            kill "$OTA_PID" >/dev/null 2>&1 || true
            wait "$OTA_PID" || true

            DOWNLOADED="/sdcard/Android/data/$PKG/files/Download/pick-pack-1291-beta-0.4.2-beta.81.apk"
            adb pull "$DOWNLOADED" "$OUT/ota-downloaded.apk" >/dev/null
            test "$(sha256sum "$OUT/ota-downloaded.apk" | awk '{print $1}')" = "$APK_SHA"
            test "$(stat -c '%s' "$OUT/ota-downloaded.apk")" = "$APK_SIZE"

            BASE_PATH=$(adb shell pm path "$PKG" | head -n1 | sed 's/^package://' | tr -d '\r')
            test -n "$BASE_PATH"
            adb pull "$BASE_PATH" "$OUT/installed-base.apk" >/dev/null
            test "$(sha256sum "$OUT/installed-base.apk" | awk '{print $1}')" = "$APK_SHA"
            test "$(stat -c '%s' "$OUT/installed-base.apk")" = "$APK_SIZE"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$OUT/installed-base.apk" >"$OUT/installed-cert.txt"
            INSTALLED_SIGNER=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$OUT/installed-cert.txt" | sed 's/.*digest: //' | tr 'A-F' 'a-f' | tr -d ':[:space:]')
            test "$INSTALLED_SIGNER" = "$EXPECTED_SIGNER"

            adb install -r "$VERIFY_HARNESS_APK" >"$OUT/reinstall-harness.txt"
            adb shell ip link set eth0 down >/dev/null 2>&1 || true
            MNV=981810081
            MNV2=981810082
            adb shell am instrument -w -r \
              -e mode beta81checks -e login beta81_verify -e mnv "$MNV" -e mnv2 "$MNV2" \
              -e service_token offline-beta81 -e service_url http://127.0.0.1:1 \
              "$VERIFY" >"$OUT/beta81checks.txt" 2>&1
            grep -Fq 'INSTRUMENTATION_CODE: 0' "$OUT/beta81checks.txt"
            adb shell cat "/data/user/0/$PKG/shared_prefs/pp_beta80_verify.xml" >"$OUT/beta81-flags.xml"
            for flag in reconciliation_home_1_0 reconciliation_qr_1_0 rollover_old_active_preserved old_resources_preserved scanned_old_warning; do
              grep -Fq "name=\"$flag\" value=\"true\"" "$OUT/beta81-flags.xml"
            done

            RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID" | tr -d '\r\n\t ')
            DEPLOYMENT_ID="$RAW"
            if [[ "$RAW" == *"/s/"* ]]; then DEPLOYMENT_ID="${RAW#*/s/}"; DEPLOYMENT_ID="${DEPLOYMENT_ID%%/*}"; fi
            GAS_URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
            echo "::add-mask::$GAS_URL"
            read_update(){
              local ch="$1" cur="$2" file="$3" attempt
              for attempt in 0 1 2; do
                if curl -fsSL --connect-timeout 15 --max-time 30 -H 'content-type: application/json' "$GAS_URL" \
                  -d "{\"action\":\"update_check\",\"channel\":\"$ch\",\"current_version\":\"$cur\"}" > "$file"; then return 0; fi
                [[ "$attempt" -lt 2 ]] || break
                sleep $((2 + attempt * 4))
              done
              return 1
            }
            read_update BETA "$PREV_VERSION" "$OUT/beta-old-readback.json"
            jq -e --arg h "$APK_SHA" --argjson z "$APK_SIZE" \
              '.ok==true and .channel=="BETA" and .available==true and .version_name=="0.4.2-beta.81" and .sha256==$h and .size==$z' "$OUT/beta-old-readback.json" >/dev/null
            read_update BETA "$TARGET_VERSION" "$OUT/beta-current-readback.json"
            jq -e '.ok==true and .channel=="BETA" and .available==false and .version_name=="0.4.2-beta.81"' "$OUT/beta-current-readback.json" >/dev/null
            read_update STABLE 0.1.0-stable "$OUT/stable-readback.json"
            jq -e '.ok==true and .channel=="STABLE" and .available==false and .reason=="NO_APK"' "$OUT/stable-readback.json" >/dev/null

            MAIN_AFTER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
            test "$MAIN_AFTER" = "$MAIN_BEFORE"
            curl -fsSL --connect-timeout 15 --max-time 30 "$SERVICE_URL/v1/authority" > "$OUT/authority.json"
            jq -e '.ok==true and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' "$OUT/authority.json" >/dev/null
            AUTH_EPOCH=$(jq -r '.authority.authority_epoch' "$OUT/authority.json")
            AUTH_GEN=$(jq -r '.authority.service_generation' "$OUT/authority.json")
            test "$AUTH_EPOCH" = "9"
            test "$AUTH_GEN" = "m2-prod-reset-20260823-001"

            jq -n \
              --arg h "$APK_SHA" --argjson z "$APK_SIZE" --arg signer "$INSTALLED_SIGNER" --arg main "$MAIN_AFTER" \
              --slurpfile beta "$OUT/beta-old-readback.json" --slurpfile current "$OUT/beta-current-readback.json" \
              --slurpfile stable "$OUT/stable-readback.json" --slurpfile auth "$OUT/authority.json" \
              '{status:"PASS",version_name:"0.4.2-beta.81",version_code:87,candidate_run:33073351925,candidate_artifact:9646920908,
                visual_artifact:9647045177,service_artifact:9646805806,apk_sha256:$h,apk_size:$z,signer_sha256:$signer,
                ota_from_beta80:true,ota_download_exact:true,installed_exact_bytes:true,installed_and_opened_beta81:true,
                fixes:{reconciliation_ended_exit_only:true,reconciliation_home_1_0:true,reconciliation_qr_1_0:true,
                       scanned_old_session_warning:true,midnight_rollover_old_active_preserved:true,old_resources_not_released:true},
                beta_readback:$beta[0],target_current_readback:$current[0],stable_readback:$stable[0],stable_unchanged:true,
                main_sha:$main,main_unchanged:true,authority:$auth[0].authority,authority_change:"NONE"}' > "$OUT/receipt.json"
            jq -e '.status=="PASS" and .fixes.reconciliation_ended_exit_only==true and .fixes.reconciliation_qr_1_0==true and .fixes.scanned_old_session_warning==true and .fixes.midnight_rollover_old_active_preserved==true and .fixes.old_resources_not_released==true and .stable_unchanged==true and .main_unchanged==true and .authority_change=="NONE"' "$OUT/receipt.json" >/dev/null
            cat "$OUT/receipt.json"

      - name: Upload Beta81 PDA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta81-pda-functional-${{ github.run_id }}
          path: /tmp/beta81-pda-verify
          retention-days: 30
          if-no-files-found: error

  finalize:
    needs: [publish, pda-verify]
    if: ${{ needs.publish.result == 'success' && needs.pda-verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      APK_SHA: ${{ needs.publish.outputs.apk_sha }}
