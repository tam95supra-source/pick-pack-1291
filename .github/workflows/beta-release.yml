      - name: Converge Beta auth replacement-first
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta_auth_converge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-auth-${{ github.run_id }}
          path: /tmp/beta-auth-converge-receipt.json
          retention-days: 90
          if-no-files-found: error

  stable_private_apk_verify:
    name: stable-private-apk-verify
    needs: route
    if: ${{ needs.route.outputs.stage == 'STABLE_PRIVATE_APK_VERIFY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.candidate_artifact_name }}
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run_id }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Validate verifier
        run: bash -n tools/stable_private_apk_verify.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Build and verify Stable private APK side-by-side
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/stable_private_apk_verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-private-apk-${{ github.run_id }}
          path: /tmp/stable-private-apk
          retention-days: 30
          if-no-files-found: error

  runtime_dod_verify:
    name: runtime-dod-verify
    needs: route
    if: ${{ needs.route.outputs.stage == 'RUNTIME_DOD_VERIFY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate runtime verifier
        run: |
          python3 -m py_compile tools/beta_stable_runtime_verify.py
          python3 tools/beta_stable_runtime_verify.py --self-test
      - name: Verify Beta Stable runtime Technical DoD
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta_stable_runtime_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-stable-runtime-${{ github.run_id }}
          path: /tmp/beta-stable-runtime-verify.json
          retention-days: 90
          if-no-files-found: error

  beta_domain_prepare:
    name: beta-domain-prepare
    needs: route
    if: ${{ needs.route.outputs.stage == 'BETA_DOMAIN_PREPARE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Beta domain preparer
        run: python3 -m py_compile tools/beta_domain_prepare.py
      - name: Prepare Beta custom domain only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta_domain_prepare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-domain-prepare-${{ github.run_id }}
          path: /tmp/beta-domain-prepare-receipt.json
          retention-days: 90
          if-no-files-found: error

  publish:
    name: publish
    needs: route
    if: ${{ needs.route.outputs.stage == 'PUBLISH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BETA_RELEASE_TOKEN_RAW: ${{ secrets.BETA_RELEASE_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.candidate_artifact_name }}
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.verify_artifact_name }}
          path: /tmp/beta-verify
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.verify_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.base_candidate_artifact_name }}
          path: /tmp/beta-base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.base_candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.base_live_final_artifact_name }}
          path: /tmp/beta-base-final
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.base_live_final_run_id }}
      - name: Normalize owner release token
        shell: bash
        run: |
          set -euo pipefail
          RAW="${BETA_RELEASE_TOKEN_RAW:-}"
          TOKEN="$(printf '%s' "$RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//;s/^(Bearer|token)[[:space:]]+//I')"
          test -n "$TOKEN"
          case "$TOKEN" in
            github_pat_*|ghp_*|ghs_*|ghu_*|gho_*|ghr_*) ;;
            *) echo "BETA_RELEASE_TOKEN_FORMAT_INVALID" >&2; exit 66 ;;
          esac
          echo "::add-mask::$TOKEN"
          printf 'GH_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
      - name: Publish exact requested Beta bytes after fresh production readbacks
        shell: bash
        run: bash tools/beta83_publish_ota.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-publish-${{ github.run_id }}
          path: /tmp/beta-publish
          retention-days: 30
          if-no-files-found: error

  pda_verify:
    name: pda-verify
    needs: [route,publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.base_candidate_artifact_name }}
          path: /tmp/beta-base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.base_candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.candidate_artifact_name }}
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: beta-publish-${{ github.run_id }}
          path: /tmp/beta-publish
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate OTA verification harness
        shell: bash
        run: bash tools/build_beta83_verify_harness.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Install current Beta baseline then OTA to exact candidate and read back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta83_ota_device_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-pda-${{ github.run_id }}
          path: /tmp/beta-pda
          retention-days: 30
          if-no-files-found: error

  rollback_only:
    name: rollback-beta-only
    needs: route
    if: ${{ needs.route.outputs.stage == 'ROLLBACK_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.base_candidate_artifact_name }}
          path: /tmp/beta-base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.base_candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.rollback_publish_artifact_name }}
          path: /tmp/beta-publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.rollback_publish_run_id }}
      - name: Restore Beta baseline OTA
        shell: bash
        run: bash tools/beta83_rollback.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta83-rollback-${{ github.run_id }}
          path: /tmp/beta-rollback
          retention-days: 30
          if-no-files-found: error

  rollback:
    name: rollback-beta
    needs: [route,publish,pda_verify]
    if: ${{ always() && needs.route.outputs.stage == 'PUBLISH' && needs.publish.result == 'success' && needs.pda_verify.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.base_candidate_artifact_name }}
          path: /tmp/beta-base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.base_candidate_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: beta-publish-${{ github.run_id }}
          path: /tmp/beta-publish
      - name: Restore Beta baseline OTA
        shell: bash
        run: bash tools/beta83_rollback.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta83-rollback-${{ github.run_id }}
          path: /tmp/beta-rollback
          retention-days: 30
          if-no-files-found: error

  finalize:
    name: finalize
    needs: [route,publish,pda_verify]
    if: ${{ needs.publish.result == 'success' && needs.pda_verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: beta-publish-${{ github.run_id }}
          path: /tmp/beta-publish-final
      - uses: actions/download-artifact@v4
        with:
          name: beta-pda-${{ github.run_id }}
          path: /tmp/beta-pda-final
      - name: Finalize state and canonical handoff
        shell: bash
        run: bash tools/finalize_beta83.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beta-final-${{ github.run_id }}
          path: /tmp/beta-final/receipt.json
          retention-days: 90
          if-no-files-found: error

  handoff-finalizer:
    name: handoff-finalizer
    needs: [route,candidate,service_live,verify,service_discovery_only,back36_only,beta_auth_migrate,stable_private_apk_verify,runtime_dod_verify,beta_domain_prepare,publish,pda_verify,rollback_only,rollback,finalize]
    if: ${{ always() && needs.route.outputs.stage != 'pass_live' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create pre-OTA handoff
        if: ${{ needs.route.outputs.stage != 'PUBLISH' }}
        shell: bash
        run: bash tools/beta83_handoff_finalizer.sh
      - name: Create release handoff
        if: ${{ needs.route.outputs.stage == 'PUBLISH' }}
        shell: bash
        run: bash tools/beta83_release_handoff_finalizer.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PICK_PACK_1291_HANDOFF_${{ github.run_id }}
          path: /tmp/PICK_PACK_1291_HANDOFF_${{ github.run_id }}.txt
          retention-days: 90
          if-no-files-found: error
