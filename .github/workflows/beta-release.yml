name: Beta release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - ops/beta-release-request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.route.outputs.stage }}
      candidate_run: ${{ steps.route.outputs.candidate_run }}
      candidate_name: ${{ steps.route.outputs.candidate_name }}
      candidate_id: ${{ steps.route.outputs.candidate_id }}
      candidate_digest: ${{ steps.route.outputs.candidate_digest }}
    steps:
      - uses: actions/checkout@v4
      - id: route
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta-release-request.json
          jq -e '
            .stage=="VERIFY_ONLY" and
            .version_name=="0.4.2-beta.82" and .version_code==88 and
            .source_sha=="70c2be4c2866fc71607bb4ad48229cc3ed2d231f" and
            .candidate_run_id==33097369281 and .candidate_artifact_id==9657063583 and
            .apk_sha256=="6b09f5ed289e9a26b3fa93e95ee0885b2d2736c13cf7b1be0245f4f3cd216dbc" and
            .apk_size==13196221 and
            .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and
            .package=="vn.pickpack1291.app.beta.publicbeta" and
            .rebuild==false and .resign==false and
            .stable_publish=="FORBIDDEN" and .authority_change=="NONE"
          ' "$R" >/dev/null
          ! grep -R -F 'startActivitySync(' tools/Beta82UiChecksInstrumentation.java
          echo "stage=$(jq -r '.stage' "$R")" >> "$GITHUB_OUTPUT"
          echo "candidate_run=$(jq -r '.candidate_run_id' "$R")" >> "$GITHUB_OUTPUT"
          echo "candidate_name=$(jq -r '.candidate_artifact_name' "$R")" >> "$GITHUB_OUTPUT"
          echo "candidate_id=$(jq -r '.candidate_artifact_id' "$R")" >> "$GITHUB_OUTPUT"
          echo "candidate_digest=$(jq -r '.candidate_artifact_digest' "$R")" >> "$GITHUB_OUTPUT"

  verify:
    name: visual-pda-verify
    needs: route
    if: ${{ needs.route.outputs.stage == 'VERIFY_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight exact locked candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          A=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.route.outputs.candidate_id }}")
          jq -e             --arg n "${{ needs.route.outputs.candidate_name }}"             --arg d "${{ needs.route.outputs.candidate_digest }}"             --argjson id "${{ needs.route.outputs.candidate_id }}"             '.id==$id and .name==$n and .digest==$d and .expired==false' <<<"$A" >/dev/null
          git diff --quiet 70c2be4c2866fc71607bb4ad48229cc3ed2d231f HEAD -- app service
          ! grep -R -F 'startActivitySync(' tools/Beta82UiChecksInstrumentation.java
          grep -Fq 'target.startActivity(i);' tools/Beta82UiChecksInstrumentation.java
          grep -Fq 'ACTIVITY_START_TIMEOUT' tools/Beta82UiChecksInstrumentation.java
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.candidate_name }}
          path: /tmp/beta82-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.route.outputs.candidate_run }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          R=ops/beta-release-request.json
          M=/tmp/beta82-candidate/release-meta.json
          APK=/tmp/beta82-candidate/pick-pack-1291-public-beta-0.4.2-beta.82.apk
          test -f "$M" -a -f "$APK"
          jq -e --arg h "$(jq -r '.apk_sha256' "$R")" --argjson z "$(jq -r '.apk_size' "$R")"             --arg source "$(jq -r '.source_sha' "$R")" --arg signer "$(jq -r '.signer_sha256' "$R")" '
            .version_name=="0.4.2-beta.82" and .version_code==88 and
            .package=="vn.pickpack1291.app.beta.publicbeta" and
            .source_sha==$source and .build_run==33097369281 and
            .apk_sha256==$h and .apk_size==$z and .signer_sha256==$signer and
            .candidate_locked==true and .stable_publish=="FORBIDDEN" and .authority_change=="NONE"
          ' "$M" >/dev/null
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$(jq -r '.apk_sha256' "$R")"
          test "$(stat -c '%s' "$APK")" = "$(jq -r '.apk_size' "$R")"
      - name: Build separate verification harness
        shell: bash
        run: bash tools/build_beta82_verify_harness.sh
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run visual matrix and direct candidate PDA functional gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash tools/beta82_verify_matrix.sh
      - name: Upload visual and functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta82-verify-${{ github.run_id }}
          path: /tmp/beta82-verify
          retention-days: 30
          if-no-files-found: error

  handoff-finalizer:
    name: handoff-finalizer
    needs: [route,verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create automatic handoff
        shell: bash
        run: bash tools/beta82_handoff_finalizer.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PICK_PACK_1291_HANDOFF_${{ github.run_id }}
          path: /tmp/PICK_PACK_1291_HANDOFF_${{ github.run_id }}.txt
          retention-days: 90
          if-no-files-found: error
