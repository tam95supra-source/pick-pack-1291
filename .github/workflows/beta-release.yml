name: Beta candidate pipeline

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - .github/workflows/beta-release.yml
      - tools/run_beta72_visual.py

permissions:
  contents: write
  actions: read

concurrency:
  group: beta72-owner-five-fixes
  cancel-in-progress: false

jobs:
  build-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize Beta72 owner five fixes once
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_beta72_owner_five_fixes.py tools/run_beta72_visual.py
          if ! grep -q 'versionName = "0.4.2-beta.72"' app/build.gradle.kts; then
            python3 tools/apply_beta72_owner_five_fixes.py
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app
            git commit -m 'fix(beta72): owner session resource layout rules'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          grep -q 'versionCode = 78' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.72"' app/build.gradle.kts
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Owner regression gates
        shell: bash
        run: |
          set -euo pipefail
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -Fq 'Dùng user cố định theo số điện thoại / họ tên.' "$OPS"
          grep -Fq 'PDA — bắt buộc, gõ 5 số cuối' "$OPS"
          grep -Fq 'User Pack theo Bàn Pack' "$OPS"
          grep -Fq 'Vị trí Pick bắt buộc phải chọn PDA' "$OPS"
          grep -Fq 'Vị trí Pack bắt buộc phải chọn Bàn Pack và User Pack đúng theo bàn.' "$OPS"
          grep -Fq 'shiftDetails(shiftSummaryRows(s,false))' "$OPS"
          grep -Fq 'compactReissueButton("Phát lại"' "$OPS"
          ! grep -Fq 'PDA (tùy chọn)' "$OPS"
          ! grep -Fq 'User Pack — độc lập với bàn' "$OPS"
          ! grep -Fq 'Không dùng User Pick' "$OPS"
          grep -Fq 'Ai thực hiện:' "$OPS"
          grep -Fq 'Nội dung thay đổi' "$OPS"
          grep -Fq 'transportViHeader(net.transport)' "$OPS"
          grep -Fq 'Cảnh báo đối soát $shift chưa khớp' "$OPS"
          grep -Fq 'override fun onBackPressed()' "$OPS"
          grep -Fq 'if(!isRootScreen())navigateBack()' "$OPS"
          grep -Fq 'local active sessions are the first authority for the PDA holder list' "$OPS"
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble Beta and Stable isolation
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug :app:assembleBetaRelease

      - name: Sign exact Beta72 candidate
        id: sign
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do test -n "${!v:-}"; done
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          U=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/aapt" dump badging "$U" > /tmp/badging.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badging.txt
          grep -q "versionCode='78'" /tmp/badging.txt
          grep -q "versionName='0.4.2-beta.72'" /tmp/badging.txt
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta72
          OUT=dist/beta72/pick-pack-1291-public-beta-0.4.2-beta.72.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" "$U"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          APK_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          APK_SIZE=$(stat -c '%s' "$OUT")
          printf '%s  %s\n' "$APK_SHA" "$(basename "$OUT")" > dist/beta72/SHA256SUMS-0.4.2-beta.72.txt
          jq -nc --arg source "$SOURCE_SHA" --arg sha "$APK_SHA" --argjson size "$APK_SIZE" --arg signer "$EXPECTED_SIGNER_SHA256" \
            '{version_name:"0.4.2-beta.72",version_code:78,package:"vn.pickpack1291.app.beta.publicbeta",source_sha:$source,apk_sha256:$sha,apk_size:$size,signer_sha256:$signer,stable_version:"0.1.0-stable",stable_code:1,stable_publish:"FORBIDDEN",service_change:"NONE"}' \
            > dist/beta72/release-meta.json
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          rm -f "$KS" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"

      - name: Upload exact signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: beta72-candidate-${{ github.run_id }}
          path: dist/beta72/*
          retention-days: 30
          if-no-files-found: error

      - name: Verify exact candidate before visual gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run Beta72 visual matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r "$APK"
            python3 tools/run_beta72_visual.py

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta72-visual-${{ github.run_id }}
          path: /tmp/visual
          retention-days: 30
          if-no-files-found: error
