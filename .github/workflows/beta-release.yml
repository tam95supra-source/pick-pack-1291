name: Beta locked release pipeline

on:
  push:
    branches:
      - release/**
    paths:
      - ops/beta-release-request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-locked-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-locked-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate request and publish exact locked candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.stage' ops/beta-release-request.json)" = publish
          target="$(jq -r '.version_name' ops/beta-release-request.json)"
          beta_no="$(sed -nE 's/^0\.4\.2-beta\.([0-9]+)$/\1/p' <<<"$target")"
          test -n "$beta_no"
          script="tools/publish_beta${beta_no}_ota.sh"
          test -f "$script"
          bash "$script"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-evidence-${{ github.run_id }}
          path: /tmp/beta*-evidence
          retention-days: 30
          if-no-files-found: warn
