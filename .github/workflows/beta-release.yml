name: Beta release clean pipeline

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - ops/beta-release-request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: beta71-clean-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.request.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          STAGE=$(jq -r '.stage' ops/beta-release-request.json)
          test "$STAGE" = candidate -o "$STAGE" = publish
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

  candidate:
    needs: prepare
    if: needs.prepare.outputs.stage == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      apk_sha: ${{ steps.sign.outputs.apk_sha }}
      apk_size: ${{ steps.sign.outputs.apk_size }}
      artifact_id: ${{ steps.candidate_artifact.outputs.artifact-id }}
    env:
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize canonical Beta71 from Beta68 once
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION=$(jq -r '.version_name' ops/beta-release-request.json)
          TARGET_CODE=$(jq -r '.version_code' ops/beta-release-request.json)
          test "$TARGET_VERSION" = 0.4.2-beta.71
          test "$TARGET_CODE" = 77
          if ! grep -q 'versionName = "0.4.2-beta.71"' app/build.gradle.kts; then
            python3 -m py_compile \
              tools/apply_beta64_owner_seven_fixes.py \
              tools/apply_beta64_compile_fix.py \
              tools/apply_beta65_session_resource_login_parity.py \
              tools/apply_beta65_behavior_compile_fix.py \
              tools/apply_beta65_scope_compile_fix.py \
              tools/apply_beta65_login_reference_finish.py \
              tools/apply_beta66_login_fullframe.py \
              tools/apply_beta68_owner_five_fixes.py \
              tools/apply_beta68_login_visual_pass.py \
              tools/apply_beta71_owner_requests_v5.py \
              tools/apply_beta71_owner_requests_final.py \
              tools/apply_beta71_pda_local_holder.py
            python3 tools/apply_beta64_owner_seven_fixes.py
            python3 tools/apply_beta64_compile_fix.py
            python3 tools/apply_beta65_session_resource_login_parity.py
            python3 tools/apply_beta65_behavior_compile_fix.py
            python3 tools/apply_beta65_scope_compile_fix.py
            python3 tools/apply_beta65_login_reference_finish.py
            python3 tools/apply_beta66_login_fullframe.py
            python3 tools/apply_beta68_owner_five_fixes.py
            python3 tools/apply_beta68_login_visual_pass.py
            python3 tools/apply_beta71_owner_requests_final.py
            python3 tools/apply_beta71_pda_local_holder.py
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app
            git commit -m 'build: materialize canonical Beta71 from Beta68'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.71"' app/build.gradle.kts
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Owner regression gates
        shell: bash
        run: |
          set -euo pipefail
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -Fq 'Ai thực hiện:' "$OPS"
          grep -Fq 'Nội dung thay đổi' "$OPS"
          grep -Fq 'transportViHeader(net.transport)' "$OPS"
          grep -Fq 'Chờ đồng bộ: $queue' "$OPS"
          grep -Fq 'Đường đi dữ liệu' "$OPS"
          grep -Fq 'Cảnh báo đối soát $shift chưa khớp' "$OPS"
          grep -Fq 'Animation.INFINITE' "$OPS"
          grep -Fq 'Chạm để xem chi tiết • Đổi PDA • Trả PDA' "$OPS"
          grep -Fq 'override fun onBackPressed()' "$OPS"
          grep -Fq 'if(!isRootScreen())navigateBack()' "$OPS"
          grep -Fq 'sessionWorkChangeDetail(payload:JSONObject)' "$OPS"
          grep -Fq '"REPLACE_RESOURCE"' "$OPS"
          grep -Fq 'local active sessions are the first authority for the PDA holder list' "$OPS"
          ! grep -Fq 'if(!rr.ok){showError(rr.error?:"Không tải được tài nguyên");return@runOnUiThread}' "$OPS"
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Assemble Beta and Stable isolation
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug :app:assembleBetaRelease

      - name: Sign exact Beta71 candidate
        id: sign
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do test -n "${!v:-}"; done
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          U=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/aapt" dump badging "$U" > /tmp/badging.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/badging.txt
          grep -q "versionCode='77'" /tmp/badging.txt
          grep -q "versionName='0.4.2-beta.71'" /tmp/badging.txt
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta71
          OUT=dist/beta71/pick-pack-1291-public-beta-0.4.2-beta.71.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" "$U"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          APK_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          APK_SIZE=$(stat -c '%s' "$OUT")
          printf '%s  %s\n' "$APK_SHA" "$(basename "$OUT")" > dist/beta71/SHA256SUMS-0.4.2-beta.71.txt
          jq -nc --arg source "$SOURCE_SHA" --arg sha "$APK_SHA" --argjson size "$APK_SIZE" --arg signer "$EXPECTED_SIGNER_SHA256" \
            '{version_name:"0.4.2-beta.71",version_code:77,package:"vn.pickpack1291.app.beta.publicbeta",source_sha:$source,apk_sha256:$sha,apk_size:$size,signer_sha256:$signer,stable_version:"0.1.0-stable",stable_code:1,stable_publish:"FORBIDDEN",service_change:"NONE"}' \
            > dist/beta71/release-meta.json
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          rm -f "$KS" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"

      - name: Upload exact signed candidate
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta71-candidate-${{ github.run_id }}
          path: dist/beta71/*
          retention-days: 30
          if-no-files-found: error

  visual:
    needs:
      - prepare
      - candidate
    if: needs.prepare.outputs.stage == 'candidate' && needs.candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_SHA: ${{ needs.candidate.outputs.apk_sha }}
      EXPECTED_SIZE: ${{ needs.candidate.outputs.apk_size }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/beta71-clean-from-beta68-20260825

      - uses: actions/download-artifact@v4
        with:
          name: beta71-candidate-${{ github.run_id }}
          path: /tmp/candidate

      - name: Verify candidate input
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/candidate -type f -name 'pick-pack-1291-public-beta-0.4.2-beta.71.apk' -print -quit)
          test -n "$APK"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Beta71 visual matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r "$APK"
            python3 tools/run_beta71_visual.py

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta71-visual-${{ github.run_id }}
          path: /tmp/visual
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.stage == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish locked Beta71 bytes and verify OTA
        shell: bash
        run: bash tools/publish_beta71_ota.sh
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta71-release-evidence-${{ github.run_id }}
          path: /tmp/beta71-evidence
          retention-days: 30
          if-no-files-found: warn
