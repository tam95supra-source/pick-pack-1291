name: Beta76 publish exact candidate

on:
  push:
    branches:
      - feature/beta76-nhan-hang-rot-20260825
    paths:
      - ops/beta-release-request.json
      - tools/publish_beta76_ota.sh
      - .github/workflows/beta-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: beta76-publish-exact
  cancel-in-progress: false

jobs:
  publish-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate exact Beta76 lock and HUMAN receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stage=="publish" and .version_name=="0.4.2-beta.76" and .version_code==82 and .candidate_run_id==32875201581 and .candidate_artifact_id==9573716441 and .locked_run_id==32875201581 and .locked_artifact_id==9573716441 and .locked_sha256=="7018977f28d09434de27e6c6e90a7a51ec11c77831285d7e466c7aeeeeef9ee2" and .locked_size==13179781 and .locked_package=="vn.pickpack1291.app.beta.publicbeta" and .locked_signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .visual_receipt_commit=="aa3123d3b0c20230f441c3db9aaf9d516c9e481e" and .final_visual_run_id==32906107089 and .final_visual_artifact_id==9584898561 and .stable_publish=="FORBIDDEN" and .service_change=="NONE" and .authority_change=="NONE"' ops/beta-release-request.json >/dev/null
          jq -e '.status=="PASS" and .result=="HUMAN_VISUAL_PASS" and .candidate.version_name=="0.4.2-beta.76" and .candidate.version_code==82 and .candidate.build_run==32875201581 and .candidate.artifact_id==9573716441 and .candidate.sha256=="7018977f28d09434de27e6c6e90a7a51ec11c77831285d7e466c7aeeeeef9ee2" and .candidate.size==13179781 and .candidate.signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .visual.run_id==32906107089 and .visual.artifact_id==9584898561 and .visual.android_build_or_sign_in_visual==false and .human_inspection["320x568"].drop_receive_screen_correct==true and .human_inspection["360x640"].drop_receive_screen_correct==true and .human_inspection["480x800"].drop_receive_screen_correct==true and .human_inspection["320x568"].owner_crud_buttons_visible==true and .human_inspection["360x640"].owner_crud_buttons_visible==true and .human_inspection["480x800"].owner_crud_buttons_visible==true and .human_inspection["320x568"].keyboard_qr_not_obscured==true and .human_inspection["360x640"].keyboard_qr_not_obscured==true and .human_inspection["480x800"].keyboard_qr_not_obscured==true and .human_inspection["320x568"].add_clear_actions_visible==true and .human_inspection["360x640"].add_clear_actions_visible==true and .human_inspection["480x800"].add_clear_actions_visible==true and .human_inspection["320x568"].no_wrong_route_loading_crop_overlap==true and .human_inspection["360x640"].no_wrong_route_loading_crop_overlap==true and .human_inspection["480x800"].no_wrong_route_loading_crop_overlap==true and .stable_publish=="FORBIDDEN"' ops/beta76-visual-inspection.json >/dev/null
          git fetch --no-tags --depth=1 origin aa3123d3b0c20230f441c3db9aaf9d516c9e481e
          git show aa3123d3b0c20230f441c3db9aaf9d516c9e481e:ops/beta76-visual-inspection.json > /tmp/locked-beta76-visual.json
          cmp -s /tmp/locked-beta76-visual.json ops/beta76-visual-inspection.json
          bash -n tools/publish_beta76_ota.sh
          echo 'lock_receipt_preflight=PASS'

      - uses: actions/download-artifact@v4
        with:
          name: beta76-candidate-32875201581
          path: /tmp/beta76-preflight
          repository: tam95supra-source/pick-pack-1291
          run-id: 32875201581
          github-token: ${{ github.token }}

      - name: Preflight exact bytes and publish-only materialization
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/beta76-preflight/pick-pack-1291-public-beta-0.4.2-beta.76.apk
          META=/tmp/beta76-preflight/release-meta.json
          test -f "$APK" -a -f "$META"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "7018977f28d09434de27e6c6e90a7a51ec11c77831285d7e466c7aeeeeef9ee2"
          test "$(stat -c '%s' "$APK")" = "13179781"
          jq -e '.version_name=="0.4.2-beta.76" and .version_code==82 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha=="0d81793eabf465716a4fe36038d143b11220667f" and .build_run==32875201581 and .apk_sha256=="7018977f28d09434de27e6c6e90a7a51ec11c77831285d7e466c7aeeeeef9ee2" and .apk_size==13179781 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN" and .service_change=="NONE"' "$META" >/dev/null
          P=$(BETA76_MATERIALIZE_ONLY=1 bash tools/publish_beta76_ota.sh)
          test -f "$P"
          bash -n "$P"
          grep -Fq 'TARGET_VERSION=0.4.2-beta.76' "$P"
          grep -Fq 'TARGET_CODE=82' "$P"
          grep -Fq 'SOURCE_RUN_ID=32875201581' "$P"
          grep -Fq 'ARTIFACT_ID=9573716441' "$P"
          grep -Fq 'EXPECTED_SHA=7018977f28d09434de27e6c6e90a7a51ec11c77831285d7e466c7aeeeeef9ee2' "$P"
          grep -Fq 'EXPECTED_SIZE=13179781' "$P"
          grep -Fq 'VISUAL_RUN=32906107089' "$P"
          grep -Fq 'VISUAL_ARTIFACT=9584898561' "$P"
          grep -Fq 'stable_publish=="FORBIDDEN"' "$P"
          ! grep -Eq 'gradle|assemble|bundle|apksigner|jarsigner|signingConfig' "$P"
          ! grep -Eq 'git push .*main|refs/heads/main|stable-release|publish.*STABLE' "$P"
          echo 'exact_bytes_publish_only_preflight=PASS'

      - name: Publish exact Beta76 bytes and verify LIVE
        shell: bash
        run: bash tools/publish_beta76_ota.sh

      - name: Upload Beta76 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta76-release-evidence-${{ github.run_id }}
          path: /tmp/beta76-release-evidence
          retention-days: 30
          if-no-files-found: warn
