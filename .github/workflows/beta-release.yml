name: Beta release clean pipeline

on:
  push:
    branches: [ release/beta71-clean-from-beta68-20260825 ]
    paths: [ 'ops/beta-release-request.json' ]

permissions:
  contents: write
  actions: read

concurrency:
  group: beta71-clean-release
  cancel-in-progress: false

jobs:
  publish-locked-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Publish exact locked Beta71 and verify OTA
        shell: bash
        run: bash tools/publish_beta71_ota.sh

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta71-release-evidence-${{ github.run_id }}
          path: /tmp/beta71-evidence
          retention-days: 30
          if-no-files-found: warn
