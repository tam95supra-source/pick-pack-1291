name: Beta76 exact visual rerun

on:
  push:
    branches:
      - feature/beta76-nhan-hang-rot-20260825
    paths:
      - .github/workflows/beta-release.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: beta76-visual-exact-rerun
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_RUN: '32875201581'
      CANDIDATE_ARTIFACT_ID: '9573716441'
      CANDIDATE_SOURCE: 0d81793eabf465716a4fe36038d143b11220667f
      EXPECTED_SHA: 7018977f28d09434de27e6c6e90a7a51ec11c77831285d7e466c7aeeeeef9ee2
      EXPECTED_SIZE: '13179781'
      EXPECTED_SIGNER: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: beta76-candidate-32875201581
          path: /tmp/beta76-candidate
          repository: tam95supra-source/pick-pack-1291
          run-id: 32875201581
          github-token: ${{ github.token }}

      - name: Verify exact locked candidate; no build or sign
        shell: bash
        run: |
          set -euo pipefail
          META=/tmp/beta76-candidate/release-meta.json
          APK=/tmp/beta76-candidate/pick-pack-1291-public-beta-0.4.2-beta.76.apk
          jq -e --arg source "$CANDIDATE_SOURCE" --arg sha "$EXPECTED_SHA" --argjson size "$EXPECTED_SIZE" --arg signer "$EXPECTED_SIGNER" --argjson run "$CANDIDATE_RUN" '.version_name=="0.4.2-beta.76" and .version_code==82 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha==$source and .build_run==$run and .apk_sha256==$sha and .apk_size==$size and .signer_sha256==$signer and .candidate_locked==true and .stable_publish=="FORBIDDEN"' "$META" >/dev/null
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE"
          python3 -m py_compile tools/run_beta76_visual.py
          bash -n tools/run_beta76_visual_v2.sh
          ! grep -Eq 'gradle|assemble|bundle|apksigner|jarsigner|signingConfig' tools/run_beta76_visual_v2.sh
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run exact Beta76 visual matrix v2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r "$APK"
            bash tools/run_beta76_visual_v2.sh

      - name: Upload exact visual evidence v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta76-visual-v2-${{ github.run_id }}
          path: /tmp/beta76-visual
          retention-days: 30
          if-no-files-found: error
