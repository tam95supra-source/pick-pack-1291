name: Beta75 visual exact candidate

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - ops/beta-release-request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: beta75-visual-exact
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact Beta75 visual-only request
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stage=="visual" and .version_name=="0.4.2-beta.75" and .version_code==81 and .candidate_run_id==32849057694 and .candidate_artifact_id==9563625638 and .source_sha=="e475b8476e99a9230683dbbf6ec266235960ed5b" and .apk_sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .apk_size==13147013 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN"' ops/beta-release-request.json >/dev/null
          test "$(git diff e475b8476e99a9230683dbbf6ec266235960ed5b HEAD --name-only -- app/src app/build.gradle.kts service google-apps-script | wc -l)" -eq 0
      - uses: actions/download-artifact@v4
        with:
          name: beta75-candidate-32849057694
          path: /tmp/beta75-candidate
          repository: tam95supra-source/pick-pack-1291
          run-id: 32849057694
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preflight exact candidate and harness
        shell: bash
        run: |
          set -euo pipefail
          META=/tmp/beta75-candidate/release-meta.json
          APK=/tmp/beta75-candidate/pick-pack-1291-public-beta-0.4.2-beta.75.apk
          test -f "$META" -a -f "$APK"
          jq -e '.version_name=="0.4.2-beta.75" and .version_code==81 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha=="e475b8476e99a9230683dbbf6ec266235960ed5b" and .apk_sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .apk_size==13147013 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN"' "$META" >/dev/null
          test "$(sha256sum "$APK" | awk '{print $1}')" = "6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913"
          test "$(stat -c '%s' "$APK")" = "13147013"
          python3 -m py_compile tools/run_beta75_visual.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/run_beta75_visual.py').read_text(encoding='utf-8')
          compile(s,'run_beta75_visual.py','exec')
          assert "module','PDA_EXCHANGE'" in s
          assert 'pp_operational_45d.db' in s
          assert all(x in s for x in ('320x568','360x640','480x800'))
          forbidden=("adb('shell','uiauto"+'mator', "adb('shell','am','instru"+'ment')
          assert all(x not in s for x in forbidden)
          print('visual_preflight=PASS')
          PY
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" >> "$GITHUB_ENV"
          echo "EXPECTED_SIZE=13147013" >> "$GITHUB_ENV"
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run Beta75 visual matrix on exact APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            timeout 60s adb install -r "$APK"
            timeout 240s python3 tools/run_beta75_visual.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta75-visual-${{ github.run_id }}
          path: /tmp/visual
          retention-days: 30
          if-no-files-found: error
