name: Beta release clean pipeline

on:
  push:
    branches: [ release/beta71-clean-from-beta68-20260825 ]
    paths: [ 'ops/beta-release-request.json' ]

permissions:
  contents: write
  actions: read

jobs:
  export-publish-evidence:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_ARTIFACT_ID: '9546292748'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Export exact publish attempt evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.stage' ops/beta-release-request.json)" = publish-diagnostic
          mkdir -p /tmp/evidence ops/diagnostics/beta71-publish-attempt2
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" > /tmp/evidence.zip
          unzip -q /tmp/evidence.zip -d /tmp/evidence
          cp /tmp/evidence/* ops/diagnostics/beta71-publish-attempt2/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/diagnostics/beta71-publish-attempt2
          git commit -m 'diag: persist Beta71 publish attempt 2 evidence'
          git push origin "HEAD:$GITHUB_REF_NAME"
