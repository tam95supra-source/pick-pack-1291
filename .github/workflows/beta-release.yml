name: Beta75 exact visual probe

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - ops/beta-release-request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: beta75-visual-exact
  cancel-in-progress: false

jobs:
  visual-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate exact Beta75 probe request
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stage=="probe" and .version_name=="0.4.2-beta.75" and .version_code==81 and .candidate_run_id==32849057694 and .candidate_artifact_id==9563625638 and .source_sha=="e475b8476e99a9230683dbbf6ec266235960ed5b" and .apk_sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .apk_size==13147013 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN" and .probe=="480x800-add-dialog"' ops/beta-release-request.json >/dev/null
          git fetch --no-tags --depth=1 origin e475b8476e99a9230683dbbf6ec266235960ed5b
          test -z "$(git diff e475b8476e99a9230683dbbf6ec266235960ed5b HEAD --name-only -- app/src app/build.gradle.kts service google-apps-script)"
      - uses: actions/download-artifact@v4
        with:
          name: beta75-candidate-32849057694
          path: /tmp/beta75-candidate
          repository: tam95supra-source/pick-pack-1291
          run-id: 32849057694
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight exact candidate and probe
        shell: bash
        run: |
          set -euo pipefail
          META=/tmp/beta75-candidate/release-meta.json
          APK=/tmp/beta75-candidate/pick-pack-1291-public-beta-0.4.2-beta.75.apk
          test -f "$META" -a -f "$APK"
          jq -e '.version_name=="0.4.2-beta.75" and .version_code==81 and .package=="vn.pickpack1291.app.beta.publicbeta" and .source_sha=="e475b8476e99a9230683dbbf6ec266235960ed5b" and .apk_sha256=="6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913" and .apk_size==13147013 and .signer_sha256=="d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e" and .stable_publish=="FORBIDDEN"' "$META" >/dev/null
          test "$(sha256sum "$APK" | awk '{print $1}')" = "6e08dc974281cc7b5428d22cf406179447cdeb95443dc19fa1db2b4d32344913"
          test "$(stat -c '%s' "$APK")" = "13147013"
          python3 -m py_compile tools/run_beta75_visual.py
          grep -q "WH=(480,800)" tools/run_beta75_visual.py
          grep -q "probe-480-add-dialog.png" tools/run_beta75_visual.py
          ! grep -Eq 'gradle|apksigner|uiautomator|am instrument' tools/run_beta75_visual.py
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run exact 480x800 probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            timeout 60s adb install -r "$APK"
            timeout 20s adb root
            timeout 20s adb wait-for-device
            timeout 300s python3 tools/run_beta75_visual.py
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta75-probe-${{ github.run_id }}
          path: /tmp/probe
          retention-days: 30
          if-no-files-found: error
