name: Beta candidate pipeline

on:
  push:
    branches:
      - release/beta71-clean-from-beta68-20260825
    paths:
      - ops/beta-release-request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: beta73-owner-scope
  cancel-in-progress: false

jobs:
  visual-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCKED_RUN_ID: '32820317675'
      LOCKED_ARTIFACT_ID: '9552942024'
      EXPECTED_SHA: ad037c1a17d245f90ead59539c5595cc5df6a568b8657ce636cc43d101175fd2
      EXPECTED_SIZE: '13130629'
      APK: dist/beta73-locked/pick-pack-1291-public-beta-0.4.2-beta.73.apk
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact visual retry request
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stage=="visual_retry" and .version_name=="0.4.2-beta.73" and .version_code==79 and .locked_run_id==32820317675 and .locked_artifact_id==9552942024' ops/beta-release-request.json >/dev/null
          python3 -m py_compile tools/run_beta73_visual.py tools/run_beta72_visual.py tools/run_beta71_visual.py

      - name: Download exact locked candidate
        uses: actions/download-artifact@v4
        with:
          name: beta73-candidate-32820317675
          path: dist/beta73-locked
          github-token: ${{ github.token }}
          run-id: 32820317675

      - name: Verify exact SHA and size before visual
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run Beta73 visual matrix on exact artifact
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb install -r "$APK"
            python3 tools/run_beta73_visual.py

      - name: Upload exact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta73-visual-exact-${{ github.run_id }}
          path: /tmp/visual
          retention-days: 30
          if-no-files-found: error
