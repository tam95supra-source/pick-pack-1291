name: Beta69 locked candidate visual matrix v3
on:
  push:
    branches: [ release/beta69-owner-six-fixes-20260825 ]
    paths: [ '.github/workflows/_gate_beta69_visual_matrix_v3.yml' ]
permissions:
  contents: write
  actions: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PKG: vn.pickpack1291.app.beta.publicbeta
      ACT: vn.pickpack1291.app.beta.OperationsActivity
      ARTIFACT_ID: '9533366227'
      EXPECTED_SHA: 251530388165c7a9a8572053238b5d44b47a6747c5e94f270230e65ce68d4cda
      EXPECTED_SIZE: '13114245'
      EXPECTED_VERSION: 0.4.2-beta.69
      EXPECTED_CODE: '75'
      BRANCH: release/beta69-owner-six-fixes-20260825
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch and verify exact locked candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/beta69 /tmp/visual
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/beta69/candidate.zip
          unzip -q /tmp/beta69/candidate.zip -d /tmp/beta69/artifact
          APK=$(find /tmp/beta69/artifact -type f -name 'pick-pack-1291-public-beta-0.4.2-beta.69.apk' | head -1)
          test -n "$APK"
          GOT_SHA=$(sha256sum "$APK" | awk '{print $1}')
          GOT_SIZE=$(stat -c '%s' "$APK")
          test "$GOT_SHA" = "$EXPECTED_SHA"
          test "$GOT_SIZE" = "$EXPECTED_SIZE"
          echo "APK=$APK" >> "$GITHUB_ENV"
          printf 'artifact=%s\nsha256=%s\nsize=%s\n' "$ARTIFACT_ID" "$GOT_SHA" "$GOT_SIZE" | tee /tmp/visual/candidate.txt
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run exact locked candidate and capture visual matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb wait-for-device
            adb install -r "$APK"
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
            BADGING=$($AAPT dump badging "$APK" | head -1)
            echo "$BADGING" | tee /tmp/visual/badging.txt
            echo "$BADGING" | grep -F "name='${PKG}'"
            echo "$BADGING" | grep -F "versionCode='${EXPECTED_CODE}'"
            echo "$BADGING" | grep -F "versionName='${EXPECTED_VERSION}'"
            adb root
            adb wait-for-device
            adb shell am force-stop "$PKG" || true
            adb shell mkdir -p "/data/user/0/$PKG/shared_prefs" "/data/user/0/$PKG/databases"
            APP_UID=$(adb shell stat -c %u "/data/user/0/$PKG" | tr -d '\r')
            APP_GID=$(adb shell stat -c %g "/data/user/0/$PKG" | tr -d '\r')
            echo "uid=$APP_UID gid=$APP_GID" | tee /tmp/visual/app-owner.txt
            python3 - <<'PY'
            import json,sqlite3,html
            now=1787610500000
            day={'ok':True,'business_date':'2026-08-25','day_revision':69,'sessions':[
              {'session_id':'VIS-42267-A','mnv':'42267','full_name':'Nguyễn Văn Minh','state':'ACTIVE','shift':'Ca 1','enter_at':'2026-08-25T05:05:00+07:00','exit_at':'','pda_serial':'MT90-123456789','work_choice':'Pick','main_position':'Pick / Pack','resource_assignments_v64':[{'assignment_id':'asg-pda','resource_type':'PDA','resource_id':'MT90-123456789','status':'ACTIVE'},{'assignment_id':'asg-pick','resource_type':'USER_PICK','resource_id':'user16','status':'ACTIVE'}],'positions_v64':[{'position_key':'PICK','position_label':'Pick','status':'ACTIVE'}]},
              {'session_id':'VIS-51001-B','mnv':'51001','full_name':'Trần Thị Lan','state':'ENDED','shift':'Ca 1','enter_at':'2026-08-25T05:00:00+07:00','exit_at':'2026-08-25T05:12:00+07:00','pda_serial':'','work_choice':'Pack'}]}
            history=[
              {'event_id':'VIS-H-RESOURCE','event_type':'RESOURCE_CHANGE','created_at':'2026-08-25T05:10:00+07:00','updated_at':'2026-08-25T05:10:00+07:00','actor':'tamnv2','actor_name':'Nguyễn Văn Tâm','actor_role':'ADMIN','device_id':'VISUAL-PDA','source':'PDA','status':'ACKED','mnv':'42267','full_name':'Nguyễn Văn Minh','detail':'Sửa thông tin trong ca','payload':{'mnv':'42267','full_name':'Nguyễn Văn Minh','operations':[{'op':'REPLACE_RESOURCE','assignment_id':'asg-pda','resource_type':'PDA','resource_id':'MT90-123456789','new_resource_id':'MT90-987654321','reason':'Đổi thiết bị trong ca','disposition':'AVAILABLE'},{'op':'ADD_POSITION','position_key':'PACK','position_label':'Pack'}],'before':{'pda_serial':'MT90-123456789','work_choice':'Pick'},'after':{'pda_serial':'MT90-987654321','work_choice':'Pick & Pack'}}},
              {'event_id':'VIS-H-ENTER','event_type':'ATTENDANCE_ENTER','created_at':'2026-08-25T05:05:00+07:00','updated_at':'2026-08-25T05:05:00+07:00','actor':'tamnv2','actor_name':'Nguyễn Văn Tâm','actor_role':'ADMIN','device_id':'VISUAL-PDA','source':'PDA','status':'ACKED','mnv':'42267','full_name':'Nguyễn Văn Minh','payload':{'mnv':'42267','full_name':'Nguyễn Văn Minh','shift':'Ca 1','enter_at':'2026-08-25T05:05:00+07:00'}}]
            db='/tmp/visual/pp_operational_45d.db'; con=sqlite3.connect(db)
            con.execute('CREATE TABLE day_snapshot(business_date TEXT PRIMARY KEY NOT NULL,day_revision INTEGER NOT NULL,snapshot_json TEXT NOT NULL,saved_at INTEGER NOT NULL)')
            con.execute('CREATE TABLE local_history(event_id TEXT PRIMARY KEY NOT NULL,body_json TEXT NOT NULL,status TEXT NOT NULL,last_error TEXT,queued_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)')
            con.execute('CREATE TABLE mutation_outbox(event_id TEXT PRIMARY KEY NOT NULL,body_json TEXT NOT NULL,exclusive INTEGER NOT NULL DEFAULT 0,status TEXT NOT NULL,attempt_count INTEGER NOT NULL DEFAULT 0,next_attempt_at INTEGER NOT NULL,queued_at INTEGER NOT NULL,updated_at INTEGER NOT NULL,last_error TEXT)')
            con.execute('CREATE TABLE sync_meta(meta_key TEXT PRIMARY KEY NOT NULL,meta_value TEXT NOT NULL)')
            con.execute('INSERT INTO day_snapshot VALUES(?,?,?,?)',('2026-08-25',69,json.dumps(day,ensure_ascii=False),now))
            for i,h in enumerate(history): con.execute('INSERT INTO local_history VALUES(?,?,?,?,?,?)',(h['event_id'],json.dumps(h,ensure_ascii=False),'ACKED',None,now-i*1000,now-i*1000))
            con.commit(); con.close()
            master={'ok':True,'master_revision':69,'staff':[{'mnv':'42267','full_name':'Nguyễn Văn Minh','supplier':'NLV','main_position':'Pick / Pack','department':'Pickpack','site':'1291','warehouse':'HY1'},{'mnv':'51001','full_name':'Trần Thị Lan','supplier':'NLV','main_position':'Pack','department':'Pickpack','site':'1291','warehouse':'HY1'}],'pdas':[{'serial':'MT90-123456789','status':'ACTIVE'},{'serial':'MT90-555555555','status':'AVAILABLE'}],'user_picks':['user16','user17'],'pack_bundles':[]}
            def prefs(path,values):
              rows=["<?xml version='1.0' encoding='utf-8' standalone='yes' ?>",'<map>']
              for k,v in values.items():
                if isinstance(v,int): rows.append(f'<long name="{html.escape(k)}" value="{v}" />')
                else: rows.append(f'<string name="{html.escape(k)}">{html.escape(str(v))}</string>')
              rows.append('</map>'); open(path,'w').write('\n'.join(rows))
            prefs('/tmp/visual/pick_pack_auth_session_v2.xml',{'token':'beta69-visual-offline-token','login_id':'tamnv2','display_name':'Nguyễn Văn Tâm','role':'ADMIN','position':'Chuyên viên Pick Pack 1291','email':'visual@example.invalid'})
            prefs('/tmp/visual/pp1291_master_cache.xml',{'snapshot':json.dumps(master,ensure_ascii=False),'revision':69,'saved_at':now})
            PY
            adb push /tmp/visual/pp_operational_45d.db /data/local/tmp/pp_operational_45d.db >/dev/null
            adb push /tmp/visual/pick_pack_auth_session_v2.xml /data/local/tmp/pick_pack_auth_session_v2.xml >/dev/null
            adb push /tmp/visual/pp1291_master_cache.xml /data/local/tmp/pp1291_master_cache.xml >/dev/null
            adb shell cp /data/local/tmp/pp_operational_45d.db "/data/user/0/$PKG/databases/pp_operational_45d.db"
            adb shell cp /data/local/tmp/pick_pack_auth_session_v2.xml "/data/user/0/$PKG/shared_prefs/pick_pack_auth_session_v2.xml"
            adb shell cp /data/local/tmp/pp1291_master_cache.xml "/data/user/0/$PKG/shared_prefs/pp1291_master_cache.xml"
            adb shell chown "$APP_UID:$APP_GID" "/data/user/0/$PKG/databases/pp_operational_45d.db" "/data/user/0/$PKG/shared_prefs/pick_pack_auth_session_v2.xml" "/data/user/0/$PKG/shared_prefs/pp1291_master_cache.xml"
            adb shell chmod 600 "/data/user/0/$PKG/databases/pp_operational_45d.db" "/data/user/0/$PKG/shared_prefs/pick_pack_auth_session_v2.xml" "/data/user/0/$PKG/shared_prefs/pp1291_master_cache.xml"
            adb shell settings put global airplane_mode_on 1 || true
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null 2>&1 || true
            cat >/tmp/visual/ui.py <<'PY'
            import subprocess,sys,re,xml.etree.ElementTree as ET,time
            def dump(path='/tmp/visual/window.xml'):
              subprocess.call(['adb','shell','uiautomator','dump','/sdcard/window.xml'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              data=subprocess.check_output(['adb','exec-out','cat','/sdcard/window.xml']); open(path,'wb').write(data); return ET.fromstring(data)
            def texts(r): return '\n'.join((n.attrib.get('text','')+' '+n.attrib.get('content-desc','')).strip() for n in r.iter() if n.attrib.get('text') or n.attrib.get('content-desc'))
            def find(q):
              r=dump(); q=q.casefold()
              for n in r.iter():
                if q in (n.attrib.get('text','')+' '+n.attrib.get('content-desc','')).casefold():
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:return tuple(map(int,m.groups()))
            cmd=sys.argv[1]
            if cmd=='tap':
              b=find(sys.argv[2]);
              if not b: sys.exit(2)
              subprocess.check_call(['adb','shell','input','tap',str((b[0]+b[2])//2),str((b[1]+b[3])//2)]);time.sleep(.7)
            elif cmd=='assert':
              t=texts(dump()); open('/tmp/visual/all-text.txt','w').write(t)
              if sys.argv[2].casefold() not in t.casefold(): print(t); sys.exit(3)
            elif cmd=='absent':
              t=texts(dump())
              if sys.argv[2].casefold() in t.casefold(): print(t); sys.exit(4)
            elif cmd=='dump': print(texts(dump(sys.argv[2])))
            PY
            capture(){ dir="$1"; tag="$2"; adb exec-out screencap -p > "/tmp/visual/$dir/$tag.png"; python3 /tmp/visual/ui.py dump "/tmp/visual/$dir/$tag.xml" > "/tmp/visual/$dir/$tag.txt" || true; }
            tap_any(){ for q in "$@"; do python3 /tmp/visual/ui.py tap "$q" && return 0 || true; done; return 1; }
            start_home(){ adb shell am force-stop "$PKG"; adb shell am start -W -n "$PKG/$ACT" >/tmp/visual/start.txt; sleep 2; python3 /tmp/visual/ui.py assert 'Mạng'; python3 /tmp/visual/ui.py assert 'Đồng bộ'; python3 /tmp/visual/ui.py assert 'Dịch vụ'; }
            assert_resumed(){ adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F "$PKG" >/dev/null; }
            for SPEC in '320x568:160' '360x640:160' '480x800:240'; do
              SIZE=${SPEC%:*}; DENS=${SPEC#*:}; DIR=${SIZE}x${DENS}; mkdir -p "/tmp/visual/$DIR"
              adb shell wm size "$SIZE"; adb shell wm density "$DENS"; sleep 1
              start_home; python3 /tmp/visual/ui.py assert 'Ca 1'
              capture "$DIR" '01-home-warning-a'; sleep .75; capture "$DIR" '02-home-warning-b'
              tap_any 'Mạng'; capture "$DIR" '03-network-detail'; python3 /tmp/visual/ui.py assert 'Internet'; adb shell input keyevent 4; sleep .4
              tap_any 'Đổi / Trả PDA' 'Đổi / Trả'; sleep .7; capture "$DIR" '04-pda-exchange'; python3 /tmp/visual/ui.py assert 'MT90-123456789'; python3 /tmp/visual/ui.py absent 'MT90-555555555'
              adb shell input keyevent 4; sleep .6; assert_resumed; python3 /tmp/visual/ui.py assert 'Mạng'; capture "$DIR" '05-back-parent'
              tap_any 'Lịch sử'; sleep .8; capture "$DIR" '06-history-list'; python3 /tmp/visual/ui.py assert 'Nguyễn Văn Tâm'
              tap_any 'Nguyễn Văn Tâm' 'Sửa thông tin' 'tài nguyên'; sleep .6; capture "$DIR" '07-history-detail'; python3 /tmp/visual/ui.py assert 'Ai thực hiện'; python3 /tmp/visual/ui.py assert 'Nội dung thay đổi'
              adb shell input keyevent 4; sleep .4; tap_any 'Nghiệp vụ' || true; sleep .4
              if ! python3 /tmp/visual/ui.py tap 'Scan / Nhập mã nhân viên'; then tap_any 'QUÉT QR NHÂN SỰ' 'Quét QR nhân sự'; python3 /tmp/visual/ui.py tap 'Scan / Nhập mã nhân viên'; fi
              adb shell input text 42267; adb shell input keyevent 66; sleep 2; capture "$DIR" '08-session-timeline'; python3 /tmp/visual/ui.py assert 'Diễn biến trong ca'; python3 /tmp/visual/ui.py absent 'REPLACE_RESOURCE'; assert_resumed
            done
            python3 - <<'PY'
            import struct
            from pathlib import Path
            expected={'320x568x160':(320,568),'360x640x160':(360,640),'480x800x240':(480,800)}; rows=[]
            for d,wh in expected.items():
              p=Path('/tmp/visual')/d; imgs=sorted(p.glob('*.png')); assert len(imgs)>=8,(d,len(imgs))
              for f in imgs:
                b=f.read_bytes(); assert b[:8]==b'\x89PNG\r\n\x1a\n'; w,h=struct.unpack('>II',b[16:24]); assert (w,h)==wh,(f,(w,h),wh); assert len(b)>4000,(f,len(b))
              assert (p/'01-home-warning-a.png').read_bytes()!=(p/'02-home-warning-b.png').read_bytes(),d+' warning animation frames identical'
              rows.append(f'{d}: screenshots={len(imgs)} dimensions={wh[0]}x{wh[1]} runtime_assertions=PASS')
            Path('/tmp/visual/runtime-summary.txt').write_text('\n'.join(rows)+'\n')
            PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta69-locked-candidate-visual-matrix-v3
          path: /tmp/visual
          if-no-files-found: error
          retention-days: 14
      - name: Persist visual gate receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS='FAIL'; test -f /tmp/visual/runtime-summary.txt && STATUS='RUNTIME_PASS_AWAITING_HUMAN_INSPECTION' || true
          { echo "status=$STATUS"; echo "run_id=${GITHUB_RUN_ID}"; echo "candidate_artifact=$ARTIFACT_ID"; echo "candidate_sha256=$EXPECTED_SHA"; echo "candidate_size=$EXPECTED_SIZE"; echo "version=$EXPECTED_VERSION"; echo "version_code=$EXPECTED_CODE"; echo "package=$PKG"; echo 'matrix=320x568@160,360x640@160,480x800@240'; test -f /tmp/visual/runtime-summary.txt && cat /tmp/visual/runtime-summary.txt || true; } >/tmp/visual-receipt.txt
          CONTENT=$(base64 -w0 /tmp/visual-receipt.txt)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ops/beta69-visual-matrix-v3-result.txt" -f message='ops: record Beta69 visual matrix v3' -f content="$CONTENT" -f branch="$BRANCH" >/dev/null || true
          cat /tmp/visual-receipt.txt
