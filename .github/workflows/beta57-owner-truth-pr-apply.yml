name: Beta57 Owner Truth PR Apply

on:
  pull_request:
    branches: [ agent/beta57-reset-fence-20260823 ]
    paths:
      - 'ops/beta57-pr-apply-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta57-reset-fence-20260823
          fetch-depth: 0
      - name: Apply latest owner truth directly to isolated Beta57 branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt')
          s=p.read_text()
          staff='            Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF"),\n'
          if staff in s:
              s=s.replace(staff,'',1)
          if 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' in s:
              raise SystemExit('STAFF bottom-nav still present')
          p.write_text(s)
          print('PASS owner truth source patch')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(beta57): remove Staff bottom tab per owner truth'
            git push origin HEAD:agent/beta57-reset-fence-20260823
          fi
