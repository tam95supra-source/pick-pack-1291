name: Beta64 owner seven fixes candidate

on:
  push:
    branches: [ agent/beta64-owner-seven-fixes-20260824 ]
    paths:
      - 'ops/beta64-owner-seven-fixes-trigger.txt'
  pull_request:
    branches: [ agent/beta63-login-perf-session-mutation-fix-20260824 ]
    paths:
      - 'app/build.gradle.kts'
      - 'tools/apply_beta64_owner_seven_fixes.py'
      - 'ops/beta64-owner-seven-fixes-trigger.txt'
      - '.github/workflows/_oneoff_beta64_owner_seven_fixes.yml'

permissions:
  contents: read

concurrency:
  group: beta64-owner-seven-fixes-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pin and materialize Beta64
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_product_source_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 -m py_compile tools/apply_beta64_owner_seven_fixes.py
          python3 tools/apply_beta64_owner_seven_fixes.py
          grep -q 'versionCode = 70' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.64"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -q 'sameEmployeeContext' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Dung lượng cache ứng dụng' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'Chọn User Pick đã dùng' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'sessionTimelineItems(mnv:String,ses:JSONObject)' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'designH=designW\*1.5f' app/src/main/java/vn/pickpack1291/app/beta/FullBetaActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile BetaDebug and StableDebug
        shell: bash
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
      - name: Build Beta release candidate
        shell: bash
        run: gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease
      - name: Sign exact Beta64 and verify package
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/aapt" dump badging "$UNSIGNED" > /tmp/beta.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta.txt
          grep -q "versionCode='70'" /tmp/beta.txt
          grep -q "versionName='0.4.2-beta.64'" /tmp/beta.txt
          KS="$RUNNER_TEMP/release.jks"; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"; printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta64
          OUT=dist/beta64/pick-pack-1291-public-beta-0.4.2-beta.64.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" "$UNSIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          SHA=$(sha256sum "$OUT" | awk '{print $1}'); SIZE=$(stat -c '%s' "$OUT")
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" > dist/beta64/SHA256SUMS-0.4.2-beta.64.txt
          cat > dist/beta64/release-meta.json <<EOF
          {"version_name":"0.4.2-beta.64","version_code":70,"package":"vn.pickpack1291.app.beta.publicbeta","checkout_product_source_sha":"$checkout_product_source_sha","workflow_event_sha":"$GITHUB_SHA","apk_sha256":"$SHA","apk_size":$SIZE,"signer_sha256":"$EXPECTED_SIGNER_SHA256","stable_version":"0.1.0-stable","stable_code":1,"stable_publish":"FORBIDDEN"}
          EOF
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          rm -f "$KS" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: pick-pack-1291-0.4.2-beta.64-signed
          path: dist/beta64/*
          retention-days: 30
      - name: Candidate receipt
        shell: bash
        run: |
          echo "BETA64_CANDIDATE_PASS"
          echo "source=$checkout_product_source_sha"
          echo "sha=${{ steps.sign.outputs.sha }}"
          echo "size=${{ steps.sign.outputs.size }}"
          echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
