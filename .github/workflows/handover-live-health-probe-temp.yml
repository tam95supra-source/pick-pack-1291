name: TEMP Handover Live Health Probe

on:
  push:
    branches: [ diag/handover-live-health-20260823-1410 ]
    paths:
      - '.github/workflows/handover-live-health-probe-temp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/handover-live-health-20260823-1410
      - name: Probe production health read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          curl --fail-with-body --silent --show-error --max-time 20 'https://pickpack.1291.workers.dev/health' > ops/handover-live-health.json
          printf '\n' >> ops/handover-live-health.json
          cat ops/handover-live-health.json
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/handover-live-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(diag): persist handover live health'
            git push origin HEAD:diag/handover-live-health-20260823-1410
          fi
