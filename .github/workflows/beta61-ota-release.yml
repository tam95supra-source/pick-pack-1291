name: Beta61 Signed OTA Release

on:
  push:
    branches:
      - agent/beta61-owner-ui-pda-resource-fixes-20260823
    paths:
      - '.github/workflows/beta61-ota-release.yml'
      - 'ops/beta61-ota-release-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: beta61-signed-ota-release
  cancel-in-progress: false

env:
  TARGET_VERSION: 0.4.2-beta.61
  TARGET_CODE: '67'
  FROM_VERSION: 0.4.2-beta.60
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
  STABLE_FOLDER_ID: 1kxTd2rFfWutc2KWDwqgK8WYWDmSygIN4

jobs:
  build-sign-publish-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - name: Checkout exact Beta61 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Lock source metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'versionCode = 67' app/build.gradle.kts
          grep -F 'versionName = "0.4.2-beta.61"' app/build.gradle.kts
          grep -F 'versionCode = 1' app/build.gradle.kts
          grep -F 'versionName = "0.1.0-stable"' app/build.gradle.kts
          git log -1 --pretty=%B | grep -Eq '\[beta61-source\]|one-off Beta61 signed OTA pipeline'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Beta61 and Stable validation release APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease

      - name: Verify unsigned package identity and Stable isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"; test -s "$STABLE"
          "$BT/aapt" dump badging "$BETA" > /tmp/beta.badge
          "$BT/aapt" dump badging "$STABLE" > /tmp/stable.badge
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/beta.badge
          grep -q "versionCode='$TARGET_CODE'" /tmp/beta.badge
          grep -q "versionName='$TARGET_VERSION'" /tmp/beta.badge
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable.badge
          grep -q "versionCode='1'" /tmp/stable.badge
          grep -q "versionName='0.1.0-stable'" /tmp/stable.badge

      - name: Sign exact Beta61 and verify production signer
        id: sign
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta
          APK_NAME="pick-pack-1291-public-beta-$TARGET_VERSION.apk"
          APK="dist/beta/$APK_NAME"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$APK" app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$APK")
          SUM_NAME="SHA256SUMS-$TARGET_VERSION.txt"
          printf '%s  %s\n' "$SHA" "$APK_NAME" > "dist/beta/$SUM_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SUM_NAME=$SUM_NAME" >> "$GITHUB_ENV"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Probe live OTA authority before publish
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -sSL --connect-timeout 20 --max-time 90 -H 'content-type: application/json' "$GAS_URL" \
            -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" > /tmp/pre.json
          python3 - <<'PY' > /tmp/mode
          import json
          j=json.load(open('/tmp/pre.json'))
          src=str(j.get('source','')).upper()
          url=str(j.get('apk_url') or j.get('download_url') or j.get('url') or '')
          if src=='GITHUB_RELEASE' or url.startswith('https://github.com/'):
              print('GITHUB_RELEASE')
          elif src=='GOOGLE_DRIVE' or 'drive.google.com' in url or 'googleusercontent.com' in url:
              print('GOOGLE_DRIVE')
          else:
              print('UNKNOWN')
          PY
          MODE=$(cat /tmp/mode)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "LIVE_OTA_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Live OTA mode before publish: $MODE"

      - name: Publish immutable Beta61 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="v${TARGET_VERSION}-publicbeta"
          cat > /tmp/notes.txt <<EOF
          Pick Pack 1291 Beta $TARGET_VERSION

          PP_CHANNEL=BETA
          PP_VERSION=$TARGET_VERSION
          PP_VERSION_CODE=$TARGET_CODE
          PP_SHA256=$APK_SHA
          PP_SIZE=$APK_SIZE
          PP_SIGNER_SHA256=$EXPECTED_SIGNER_SHA256
          PP_APK_NAME=$APK_NAME
          PP_MANDATORY=false
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/notes.txt --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/notes.txt --prerelease
          fi
          gh release upload "$TAG" "$APK#$APK_NAME" "dist/beta/$SUM_NAME#$SUM_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$RELEASE_URL" -o /tmp/github-live.apk
          test "$(sha256sum /tmp/github-live.apk | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' /tmp/github-live.apk)" = "$APK_SIZE"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"

      - name: Publish Beta61 to legacy Drive only when live OTA is not GitHub Release
        if: steps.probe.outputs.mode != 'GITHUB_RELEASE'
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do [[ -n "${!v:-}" ]]; done
          TOKEN=$(curl -fsSL https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token' | jq -r '.access_token // empty')
          [[ -n "$TOKEN" ]]; echo "::add-mask::$TOKEN"
          q=$(python3 - "$STABLE_FOLDER_ID" <<'PY'
          import sys,urllib.parse
          print(urllib.parse.quote("'%s' in parents and trashed=false"%sys.argv[1]))
          PY
          )
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files?q=$q&fields=files(id,name,size)&pageSize=1000" > /tmp/stable-before.json
          STABLE_BEFORE=$(jq '.files|length' /tmp/stable-before.json)
          upload_or_replace(){
            local file="$1" name="$2" mime="$3" q id meta hdr loc size
            q=$(python3 - "$BETA_FOLDER_ID" "$name" <<'PY'
          import sys,urllib.parse
          folder,name=sys.argv[1],sys.argv[2].replace("'","\\'")
          print(urllib.parse.quote("'%s' in parents and trashed=false and name='%s'"%(folder,name)))
          PY
          )
            curl -fsSL -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files?q=$q&fields=files(id,name,size)&pageSize=100" > /tmp/existing.json
            while read -r id; do [[ -z "$id" ]] || curl -fsSL -X DELETE -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files/$id" >/dev/null; done < <(jq -r '.files[].id' /tmp/existing.json)
            size=$(stat -c '%s' "$file")
            meta=$(jq -nc --arg n "$name" --arg p "$BETA_FOLDER_ID" --arg m "$mime" '{name:$n,parents:[$p],mimeType:$m}')
            hdr=$(mktemp)
            curl -fsS -D "$hdr" -o /tmp/upload-init -X POST 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size,mimeType,parents' \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json; charset=UTF-8' -H "X-Upload-Content-Type: $mime" -H "X-Upload-Content-Length: $size" --data "$meta"
            loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");sub(/^location:[[:space:]]*/,"");print;exit}' "$hdr")
            [[ -n "$loc" ]]
            curl -fsSL -X PUT "$loc" -H "Content-Type: $mime" --data-binary @"$file"
          }
          APK_JSON=$(upload_or_replace "$APK" "$APK_NAME" 'application/vnd.android.package-archive')
          APK_ID=$(printf '%s' "$APK_JSON" | jq -r '.id')
          SUM_JSON=$(upload_or_replace "dist/beta/$SUM_NAME" "$SUM_NAME" 'text/plain')
          [[ -n "$APK_ID" && "$APK_ID" != null ]]
          curl -fsSL -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            "https://www.googleapis.com/drive/v3/files/$APK_ID/permissions?supportsAllDrives=true&fields=id,type,role" -d '{"type":"anyone","role":"reader"}' >/tmp/perm.json || true
          q2=$(python3 - "$STABLE_FOLDER_ID" <<'PY'
          import sys,urllib.parse
          print(urllib.parse.quote("'%s' in parents and trashed=false"%sys.argv[1]))
          PY
          )
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files?q=$q2&fields=files(id,name,size)&pageSize=1000" > /tmp/stable-after.json
          test "$(jq '.files|length' /tmp/stable-after.json)" = "$STABLE_BEFORE"

      - name: Verify live OTA discovery exact bytes and signer
        shell: bash
        run: |
          set -Eeuo pipefail
          good=false
          for n in $(seq 1 24); do
            code=$(curl -sSL --connect-timeout 20 --max-time 90 -o /tmp/update.json -w '%{http_code}' -H 'content-type: application/json' "$GAS_URL" \
              -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" || true)
            if [[ "$code" == 200 ]] && python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/update.json'))
          available=j.get('available',j.get('update_available'))
          version=str(j.get('version_name',j.get('version','')))
          sha=str(j.get('sha256','')).lower()
          url=str(j.get('apk_url') or j.get('download_url') or j.get('url') or '')
          ok=(j.get('ok') is True and available is True and str(j.get('channel',''))=='BETA' and version==os.environ['TARGET_VERSION'] and sha==os.environ['APK_SHA'].lower() and bool(url))
          raise SystemExit(0 if ok else 1)
          PY
            then good=true; break; fi
            echo "OTA retry $n/24 HTTP=$code" >&2; cat /tmp/update.json >&2 || true; sleep 5
          done
          [[ "$good" == true ]]
          python3 - <<'PY' > /tmp/ota-url
          import json
          j=json.load(open('/tmp/update.json')); print(j.get('apk_url') or j.get('download_url') or j.get('url') or '')
          PY
          OTA_URL=$(cat /tmp/ota-url)
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$OTA_URL" -o /tmp/ota.apk
          test "$(sha256sum /tmp/ota.apk | awk '{print $1}')" = "$APK_SHA"
          test "$(stat -c '%s' /tmp/ota.apk)" = "$APK_SIZE"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/aapt" dump badging /tmp/ota.apk > /tmp/live.badge
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/live.badge
          grep -q "versionCode='$TARGET_CODE'" /tmp/live.badge
          grep -q "versionName='$TARGET_VERSION'" /tmp/live.badge
          "$BT/apksigner" verify --verbose --print-certs /tmp/ota.apk > /tmp/live.cert
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/live.cert
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$TARGET_VERSION\"}" > /tmp/self.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/self.json'))
          assert j.get('ok') is True and j.get('available',j.get('update_available')) is False, j
          PY
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"999.999.999"}' > /tmp/stable.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/stable.json'))
          assert j.get('ok') is True and j.get('available',j.get('update_available')) is False, j
          assert str(j.get('version_name',j.get('version',''))) != os.environ['TARGET_VERSION'], j
          PY
          echo "OTA_URL=$OTA_URL" >> "$GITHUB_ENV"

      - name: Verify older Beta48 also discovers Beta61
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.48"}' > /tmp/from48.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/from48.json'))
          assert j.get('ok') is True and j.get('available',j.get('update_available')) is True, j
          assert str(j.get('version_name',j.get('version','')))==os.environ['TARGET_VERSION'], j
          assert str(j.get('sha256','')).lower()==os.environ['APK_SHA'].lower(), j
          PY

      - name: Retain only 10 public Beta GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY' > /tmp/delete.tsv
          import json,re
          rows=[]
          for r in json.load(open('/tmp/releases.json')):
              m=re.fullmatch(r'v0\.4\.2-beta\.(\d+)-publicbeta',str(r.get('tag_name','')))
              if m: rows.append((int(m.group(1)),int(r['id']),r['tag_name']))
          rows.sort(reverse=True)
          for _,rid,tag in rows[10:]: print(f'{rid}\t{tag}')
          PY
          while IFS=$'\t' read -r rid tag; do
            [[ -z "${rid:-}" ]] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$rid"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done < /tmp/delete.tsv

      - name: Emit release receipt artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          cat > receipt/beta61-ota-release.txt <<EOF
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          version=$TARGET_VERSION
          version_code=$TARGET_CODE
          apk_name=${APK_NAME:-}
          apk_sha256=${APK_SHA:-}
          apk_size=${APK_SIZE:-}
          signer_sha256=$EXPECTED_SIGNER_SHA256
          release_tag=${RELEASE_TAG:-}
          release_url=${RELEASE_URL:-}
          live_ota_mode=${LIVE_OTA_MODE:-}
          ota_url=${OTA_URL:-}
          stable=UNTOUCHED
          verdict=${{ job.status }}
          EOF

      - name: Upload signed APK and receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta61-signed-ota-release-evidence
          path: |
            dist/beta/*
            receipt/*
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
