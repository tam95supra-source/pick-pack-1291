name: Beta57 Owner Truth Fix

on:
  push:
    branches: [ agent/beta57-reset-fence-20260823 ]
    paths:
      - '.github/workflows/beta57-owner-truth-fix.yml'
      - 'ops/beta57-owner-truth-trigger.txt'

permissions:
  contents: write

concurrency:
  group: beta57-owner-truth-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply latest owner navigation truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt')
          s=p.read_text()
          old='            Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF"),\n'
          if old in s:
              s=s.replace(old,'',1)
          elif 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' in s:
              raise SystemExit('STAFF bottom-nav anchor shape changed')
          p.write_text(s)

          w=Path('.github/workflows/app-fast-check.yml')
          t=w.read_text()
          old_guard="          grep -q 'Triple(R.drawable.ic_pp_staff,\"Nhân sự\",\"STAFF\")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt\n"
          new_guard="          ! grep -q 'Triple(R.drawable.ic_pp_staff,\"Nhân sự\",\"STAFF\")' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt\n"
          if old_guard in t:
              t=t.replace(old_guard,new_guard,1)
          elif new_guard not in t:
              raise SystemExit('STAFF static guard anchor missing')
          w.write_text(t)

          if 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' in p.read_text():
              raise SystemExit('STAFF tab still present')
          print('PASS - STAFF bottom tab removed and static guard inverted')
          PY
      - name: Commit latest owner truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt .github/workflows/app-fast-check.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(beta57): remove Staff tab per latest owner truth'
            git push origin HEAD:agent/beta57-reset-fence-20260823
          fi
