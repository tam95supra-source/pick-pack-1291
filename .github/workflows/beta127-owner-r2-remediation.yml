name: Beta127 OWNER R2 remediation

on:
  push:
    branches:
      - release/beta127-owner-r2-complete-20260905
    paths:
      - .github/workflows/beta127-owner-r2-remediation.yml

permissions:
  contents: write

concurrency:
  group: beta127-owner-r2-remediation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Apply deterministic remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/beta127_owner_r2_remediation.py
          python3 tools/beta127_owner_r2_remediation.py
          python3 tools/beta123_owner_scope_contract.py
          git diff --check
      - name: Compile and unit regression
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:compileBetaDebugKotlin :app:testBetaDebugUnitTest
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/ReleaseNotes.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt \
            tools/beta123_owner_scope_contract.py \
            tools/build_beta83_verify_harness.sh \
            qa/beta127_owner_r2_regression.md
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "fix(beta127): close OWNER R2 visual false-pass gaps"
          git push origin HEAD:release/beta127-owner-r2-complete-20260905
