name: Beta65 Final Release CI

on:
  pull_request:
    branches: [ ci/beta65-final-release-base-20260824 ]
    paths:
      - 'ops/beta65-final-release-ci-trigger.txt'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: beta65-final-release-ci
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 1e8fb8255f26ad58c9719d99c27c08ef5d597cbf
  SOURCE_GATE_RUN: '32697993454'
  CANDIDATE_RUN_ID: '32701275784'
  CANDIDATE_JOB_ID: '97353121085'
  CANDIDATE_ARTIFACT_ID: '9510636863'
  TARGET_VERSION: 0.4.2-beta.65
  TARGET_CODE: '71'
  FROM_VERSION: 0.4.2-beta.64
  APK_NAME: pick-pack-1291-public-beta-0.4.2-beta.65.apk
  EXPECTED_SHA: be728cd8d20d6033becbfb169db89565f6078a681d47bc9079f98f9f5758e1da
  EXPECTED_SIZE: '13097861'
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  DRIVE_APK_ID: 1F2Xu0PQ7tiIWcNDlz9yUTsXBee6RWP39
  DRIVE_SUM_ID: 12iSOQ-AwToKY74ylGa4Wb5iVnQXdF8RC
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pickpack1291.cc.cd
  CANONICAL_SERVICE_URL: https://pickpack.1291.workers.dev
  TAG: v0.4.2-beta.65-publicbeta
  BETA_BRANCH: agent/beta65-session-resource-login-parity-20260824

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Execute exact verified final release pipeline
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=.github/workflows/_oneoff_beta65_release_final_push.yml
          test -s "$SRC"
          python3 - "$SRC" /tmp <<'PY'
          import sys
          src,outdir=sys.argv[1:]
          lines=open(src,encoding='utf-8').read().splitlines()
          names=[
            'Verify immutable candidate and live gates',
            'Publish exact GitHub prerelease and read back',
            'Persist final receipt and cumulative handover',
          ]
          for n,name in enumerate(names,1):
              marker='      - name: '+name
              i=lines.index(marker)
              while i < len(lines) and lines[i].strip()!='run: |': i+=1
              assert i<len(lines),name
              i+=1; body=[]
              while i<len(lines):
                  line=lines[i]
                  if line.startswith('      - name:'): break
                  if line.startswith('          '): body.append(line[10:])
                  elif line.strip()=='': body.append('')
                  else: raise AssertionError((name,repr(line)))
                  i+=1
              assert body,name
              open(f'{outdir}/beta65-final-step{n}.sh','w',encoding='utf-8').write('\n'.join(body)+'\n')
          PY
          for f in /tmp/beta65-final-step1.sh /tmp/beta65-final-step2.sh /tmp/beta65-final-step3.sh; do chmod +x "$f"; bash "$f"; done
      - name: Upload final release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta65-final-release-ci-evidence
          path: /tmp/evidence
          retention-days: 30
          if-no-files-found: warn
