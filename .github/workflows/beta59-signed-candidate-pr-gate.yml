name: Beta59 Signed Candidate PR Gate

on:
  pull_request:
    branches:
      - ci/beta59-signed-gate-base-20260823

permissions:
  contents: read

jobs:
  build-sign-verify:
    if: github.head_ref == 'release/beta59-signed-candidate-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
      EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
      EXPECTED_BETA_NAME: 0.4.2-beta.59
      EXPECTED_BETA_CODE: '65'
      EXPECTED_STABLE_NAME: 0.1.0-stable
      EXPECTED_STABLE_CODE: '1'

    steps:
      - name: Checkout exact Beta59 candidate branch
        uses: actions/checkout@v4
        with:
          ref: release/beta59-signed-candidate-20260823
          fetch-depth: 0

      - name: Validate immutable release contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "95b4f590d3af5418cd32c9a29d5abac3a997ede4" || true
          grep -q 'versionCode = 65' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.59"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'S60_BETA59_OWNER_ATTENDANCE_UI' "$OPS"
          grep -q 'S60_BETA59_SHIFT_RECONCILIATION_EXACT' "$OPS"
          grep -q 'Quét QR nhân sự' "$OPS"
          grep -q 'Seri PDA được chọn' "$OPS"
          grep -q 'PDA SỬ DỤNG TRONG CA' "$OPS"
          grep -q 'mutation_kind' "$OPS"
          grep -q 'deleteSessionWork' "$OPS"
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Beta59 and Stable validation release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease

      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -f "$BETA"; test -f "$STABLE"
          "$BT/aapt" dump badging "$BETA" > /tmp/beta_badging.txt
          "$BT/aapt" dump badging "$STABLE" > /tmp/stable_badging.txt
          grep -q "package: name='vn.pickpack1291.app.beta.publicbeta'" /tmp/beta_badging.txt
          grep -q "versionCode='65'" /tmp/beta_badging.txt
          grep -q "versionName='0.4.2-beta.59'" /tmp/beta_badging.txt
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable_badging.txt
          grep -q "versionCode='1'" /tmp/stable_badging.txt
          grep -q "versionName='0.1.0-stable'" /tmp/stable_badging.txt

      - name: Sign Beta59 only and verify signer
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do
            [[ -n "${!v:-}" ]]
          done
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta59
          OUT=dist/beta59/pick-pack-1291-public-beta-0.4.2-beta.59.apk
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/store.pass" \
            --key-pass "file:$RUNNER_TEMP/key.pass" \
            --out "$OUT" \
            app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert.txt
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$OUT")
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" > dist/beta59/SHA256SUMS.txt
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_commit=95b4f590d3af5418cd32c9a29d5abac3a997ede4"
            echo "beta_name=0.4.2-beta.59"
            echo "beta_code=65"
            echo "beta_package=vn.pickpack1291.app.beta.publicbeta"
            echo "stable_name=0.1.0-stable"
            echo "stable_code=1"
            echo "stable_publish=FORBIDDEN"
            echo "signer_sha256=$EXPECTED_SIGNER_SHA256"
            echo "apk_sha256=$SHA"
            echo "apk_size=$SIZE"
            echo "build=PASS"
            echo "package=PASS"
            echo "sign=PASS"
            echo "ota_publish=NOT_RUN"
            echo "verdict=PASS"
          } > dist/beta59/RECEIPT.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload exact signed Beta59 candidate
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-beta59-signed-candidate
          path: dist/beta59/*
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
