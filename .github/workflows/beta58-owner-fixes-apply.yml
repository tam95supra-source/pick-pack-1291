name: Beta58 Owner Fixes Apply

on:
  pull_request:
    branches:
      - release/beta57-final-20260823

permissions:
  contents: write

jobs:
  apply-and-compile:
    if: github.head_ref == 'agent/beta58-owner-fixes-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta58 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta58-owner-fixes-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply OperationsActivity patch
        run: python ops/beta58_operations_patch.py

      - name: Validate diff and contracts
        run: |
          git diff --check
          grep -q 'versionCode = 64' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.58"' app/build.gradle.kts
          grep -q 'S59_BETA58_LOG_ACCOUNTING' app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt
          grep -q 'S59_BETA58_SHIFT_RECONCILIATION_HOME' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'renderShiftDiscrepancy' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'if(ServiceFaultInjection.cloudflareDisabled(this)){return if(!ServiceFaultInjection.googleDisabled(this))"Google Drive" else "OFFLINE"}' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Compile Beta58
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileBetaDebugKotlin --no-daemon

      - name: Commit patched OperationsActivity
        run: |
          if git diff --quiet -- app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt; then
            echo 'OperationsActivity is already patched.'
            exit 0
          fi
          git config user.name 'pick-pack-1291-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          git commit -m 'fix: move shift reconciliation and correct fallback label'
          git push origin HEAD:agent/beta58-owner-fixes-20260823
