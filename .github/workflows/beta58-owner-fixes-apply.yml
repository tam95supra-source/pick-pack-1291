name: Beta58 Owner Fixes Apply

on:
  push:
    branches:
      - agent/beta58-owner-fixes-20260823
    paths:
      - ops/beta58_owner_fixes.py
      - .github/workflows/beta58-owner-fixes-apply.yml

permissions:
  contents: write

jobs:
  apply-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta58-owner-fixes-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic owner fixes
        run: python ops/beta58_owner_fixes.py

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'versionName = "0.4.2-beta.58"' app/build.gradle.kts
          grep -q 'S59_BETA58_LOG_ACCOUNTING' app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt
          grep -q 'S59_BETA58_SHIFT_RECONCILIATION_HOME' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'renderShiftDiscrepancy' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Compile Beta58
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileBetaDebugKotlin --no-daemon

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'pick-pack-1291-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          git commit -m 'fix: Beta58 logs fallback label and shift reconciliation'
          git push origin HEAD:agent/beta58-owner-fixes-20260823
