name: Beta58 Owner Fixes Apply

on:
  pull_request:
    branches:
      - release/beta57-final-20260823

permissions:
  contents: write

jobs:
  apply-and-compile:
    if: github.head_ref == 'agent/beta58-owner-fixes-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Beta58 branch
        uses: actions/checkout@v4
        with:
          ref: agent/beta58-owner-fixes-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply OperationsActivity patch
        run: python ops/beta58_operations_patch.py

      - name: Validate diff and contracts
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'versionCode = 64' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.58"' app/build.gradle.kts
          grep -q 'S59_BETA58_LOG_ACCOUNTING' app/src/main/java/vn/pickpack1291/app/beta/LocalLogManager.kt
          grep -q 'S59_BETA58_SHIFT_RECONCILIATION_HOME' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          ! grep -q 'renderShiftDiscrepancy' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -q 'if(ServiceFaultInjection.cloudflareDisabled(this)){return if(!ServiceFaultInjection.googleDisabled(this))"Google Drive" else "OFFLINE"}' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" \
             && -f "$ANDROID_HOME/platforms/android-36/android.jar" \
             && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compile Beta58
        run: gradle --no-daemon --build-cache :app:compileBetaDebugKotlin

      - name: Commit patched OperationsActivity
        run: |
          if git diff --quiet -- app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt; then
            echo 'OperationsActivity is already patched.'
            exit 0
          fi
          git config user.name 'pick-pack-1291-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          git commit -m 'fix: move shift reconciliation and correct fallback label'
          git push origin HEAD:agent/beta58-owner-fixes-20260823
