name: Beta69 session detail usage v2
on:
  push:
    branches: [ release/beta69-owner-six-fixes-20260825 ]
    paths: [ 'ops/TRIGGER_BETA69_SESSION_USAGE_V2.txt' ]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize and grep session flow
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_beta64_owner_seven_fixes.py
          python3 tools/apply_beta64_compile_fix.py
          python3 tools/apply_beta65_session_resource_login_parity.py
          python3 tools/apply_beta65_behavior_compile_fix.py
          python3 tools/apply_beta65_scope_compile_fix.py
          python3 tools/apply_beta65_login_reference_finish.py
          python3 tools/apply_beta66_login_fullframe.py
          python3 tools/apply_beta68_owner_five_fixes.py
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -n -C 14 -E 'sessionWorkDetail\(|Diễn biến|operations|RESOURCE_CHANGE|session_resource_mutate' "$OPS" | head -n 260 > ops/beta69-session-usage-v2.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add ops/beta69-session-usage-v2.txt
          git commit -m 'ops: capture Beta69 session detail usage v2'
          git push origin HEAD:release/beta69-owner-six-fixes-20260825
