# continuity rev6 archive aligned
name: Owner R5 full technical DoD preprod

on:
  push:
    branches:
      - work/r5-quota-realtime-20260906
    paths:
      - .github/workflows/owner-r5-full-technical-dod.yml

permissions:
  contents: read

concurrency:
  group: owner-r5-full-technical-dod-preprod
  cancel-in-progress: false

jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Canonical scope and handoff guards
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          python3 tools/finalizer_handoff_contract.py
          test "$(jq -r '.revision' ops/OWNER_SCOPE_CURRENT.json)" = "6"
          test "$(jq -r '.ledger_head_sequence' ops/OWNER_SCOPE_CURRENT.json)" = "8"
      - name: Service Beta and Stable shared-runtime compile
        run: |
          set -euo pipefail
          npm --prefix service install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm --prefix service run check
          gradle :app:compileBetaDebugKotlin :app:compileStableDebugKotlin --no-daemon --stacktrace
          python3 tools/r5_stable_parity_guard.py
      - name: Full Wrangler local migration chain and quota fail-closed
        run: |
          set -euo pipefail
          rm -rf /tmp/r5-d1-integrated && mkdir -p /tmp/r5-d1-integrated
          (cd service && npx wrangler d1 migrations apply DB --local --persist-to /tmp/r5-d1-integrated --config wrangler.jsonc) | tee /tmp/r5-integrated-migrations.log
          ! grep -qi 'incomplete input' /tmp/r5-integrated-migrations.log
          cd service
          npx wrangler d1 execute DB --local --persist-to /tmp/r5-d1-integrated --config wrangler.jsonc --command "INSERT INTO quota_usage(window_key,metric,used,hard_limit) SELECT 'FULL','GOOGLE_SHEETS_DAILY',250,hard_limit FROM quota_policy WHERE metric='GOOGLE_SHEETS_DAILY';" >/dev/null
          set +e
          npx wrangler d1 execute DB --local --persist-to /tmp/r5-d1-integrated --config wrangler.jsonc --command "UPDATE quota_usage SET used=251 WHERE window_key='FULL' AND metric='GOOGLE_SHEETS_DAILY';" >/tmp/r5-integrated-quota-over.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: O1 status load 0 1540 10000
        run: |
          set -euo pipefail
          python3 tools/r5_quota_realtime_guard.py
      - name: Integrated architecture quota and failure contracts
        run: |
          set -euo pipefail
          python3 tools/r5_full_technical_dod.py
          node --check service/public/app.js
          git diff --check
      - name: Stable preflight remains non-live and isolated
        run: |
          set -euo pipefail
          test "$(jq -r '.status' config/stable_r5_parity.json)" = "READY_NOT_LIVE"
          test "$(jq -r '.deploy_now' config/stable_r5_parity.json)" = "false"
          test "$(jq -r '.environment_id' config/stable_r5_parity.json)" = "STABLE"
          test "$(jq -r '.service_audience' config/stable_r5_parity.json)" = "PICK_PACK_1291_STABLE"
          test "$(jq -r '.activation' config/stable_r5_parity.json)" = "OWNER_PROMOTE_ONLY"
          ! grep -q 'wrangler deploy' .github/workflows/owner-r5-full-technical-dod.yml
      - name: Source safety and no protected release mutation
        run: |
          set -euo pipefail
          test "$(jq -r '.scope_id' ops/OWNER_SCOPE_CURRENT.json)" = "OWNER_20260906_R5_QUOTA_REALTIME"
          test "$(jq -r '.requirements[] | select(.requirement_id=="R5-15") | .state' ops/OWNER_SCOPE_CURRENT.json)" = "LOCKED_REQUIREMENT_PENDING_FIX"
          test "$(jq -r '.stage' ops/beta-release-request.json)" = "pass_live"
          echo R5_PREPROD_RELEASE_FENCE_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-r5-full-technical-dod-preprod-${{ github.run_id }}
          path: /tmp/r5-full-dod
          retention-days: 30
          if-no-files-found: error
