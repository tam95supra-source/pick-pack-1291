name: Beta57 Final Gate

on:
  pull_request:
    branches: [ agent/beta57-reset-fence-20260823 ]
    paths:
      - 'ops/beta57-final-gate-trigger.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beta57-reset-fence-20260823
          fetch-depth: 0
      - name: Latest owner truth guards
        shell: bash
        run: |
          set -euo pipefail
          OP=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          RESET=app/src/main/java/vn/pickpack1291/app/beta/M2ResetFence.kt
          FCM=app/src/main/java/vn/pickpack1291/app/beta/M2Firebase.kt
          UPD=app/src/main/java/vn/pickpack1291/app/beta/UpdateManager.kt
          GRADLE=app/build.gradle.kts
          test -f "$OP" -a -f "$RESET" -a -f "$FCM" -a -f "$UPD"
          grep -q 'versionCode = 63' "$GRADLE"
          grep -q 'versionName = "0.4.2-beta.57"' "$GRADLE"
          grep -q 'versionCode = 1' "$GRADLE"
          grep -q 'versionName = "0.1.0-stable"' "$GRADLE"
          grep -q 'M2ResetFence.install(this)' "$FCM"
          grep -q 'RESET_DISCARDED' "$RESET"
          grep -q 'pp_beta57_outbox_authority_fence' "$RESET"
          ! grep -q 'Triple(R.drawable.ic_pp_staff,"Nhân sự","STAFF")' "$OP"
          grep -q 'setTitle("Xác nhận đăng xuất")' "$OP"
          grep -q 'Quản lý biên bản' "$OP"
          grep -q 'đang chờ xây dựng' "$OP"
          ! grep -q 'Người dùng đang kết nối' "$OP"
          grep -q 'pdaBox' "$OP"
          grep -q 'serviceBox' "$OP"
          grep -q 'sheetBox' "$OP"
          grep -q 'THÔNG TIN ỨNG DỤNG' "$OP"
          grep -q 'contentDescription="Làm mới và đồng bộ dữ liệu"' "$OP"
          grep -q 'fun openManual(activity: Activity)' "$UPD"
          test "$(grep -R --include='*.kt' -c 'UpdateManager.openManual' app/src/main/java/vn/pickpack1291/app/beta | awk -F: '{s+=$2} END{print s+0}')" -eq 1
          grep -q 'KIỂM TRA CẬP NHẬT' "$OP"
          ! grep -R --include='*.kt' -E 'on(Create|Start|Resume).*UpdateManager\.openManual' app/src/main/java/vn/pickpack1291/app/beta
          echo 'PASS - Beta57 latest owner truth static gate.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Beta57 and Stable isolation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
          echo 'PASS - Beta57 debug compile + Stable debug isolation.'
