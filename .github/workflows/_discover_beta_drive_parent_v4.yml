name: Discover Beta Drive parent v4
on:
  push:
    branches: [ release/beta68-exact-20260824 ]
    paths: [ 'ops/TRIGGER_BETA68_DRIVE_DISCOVERY.txt' ]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Discover newest Beta APK parent
        shell: bash
        run: |
          set -Eeuo pipefail
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do [[ -n "${!v:-}" ]]; done
          TOKEN=$(curl -fsSL -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token | jq -r '.access_token // empty')
          [[ -n "$TOKEN" ]]
          echo "::add-mask::$TOKEN"
          Q=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("trashed=false and mimeType='application/vnd.android.package-archive'"))
          PY
          )
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://www.googleapis.com/drive/v3/files?q=$Q&orderBy=modifiedTime%20desc&pageSize=100&fields=files(id,name,size,parents,modifiedTime,description,appProperties)" > /tmp/files.json
          jq -e '.files|length>0' /tmp/files.json >/dev/null
          jq '[.files[] | select((.appProperties.channel // "") == "BETA" or (.name|test("public-beta|beta";"i"))) | select((.parents|length)==1)] | sort_by(.modifiedTime) | reverse | .[0]' /tmp/files.json > /tmp/beta.json
          ID=$(jq -r '.id // empty' /tmp/beta.json)
          PARENT=$(jq -r '.parents[0] // empty' /tmp/beta.json)
          NAME=$(jq -r '.name // empty' /tmp/beta.json)
          [[ -n "$ID" && -n "$PARENT" && -n "$NAME" ]]
          cat > ops/beta68-v4-drive-parent.txt <<EOF
          verdict=PASS
          run_id=$GITHUB_RUN_ID
          discovered_file_id=$ID
          discovered_file_name=$NAME
          beta_folder_id=$PARENT
          source=DRIVE_API_DISCOVERY
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-v4-drive-parent.txt
          git commit -m 'ops: record discovered Beta Drive parent'
          git pull --rebase origin release/beta68-exact-20260824
          git push origin HEAD:release/beta68-exact-20260824
