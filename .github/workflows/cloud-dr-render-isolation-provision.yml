name: Cloud DR Render isolation provision
on:
  push:
    branches:
      - 'release/audit-beta104-stable-private-20260831'
    paths:
      - tools/cloud_dr_render_isolation_provision.py
      - services/cloud-dr/**
      - service/src/**
      - config/provider_free_limits.json
      - .github/workflows/cloud-dr-render-isolation-provision.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cloud-dr-render-isolation-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact libSQL cross-credential verifier
        working-directory: services/cloud-dr
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save @libsql/client@0.15.15
      - name: Validate Render provisioner
        run: python3 -m py_compile tools/cloud_dr_render_isolation_provision.py
      - name: Provision and cold-suspend isolated Render DR
        run: python3 tools/cloud_dr_render_isolation_provision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-dr-render-isolation-${{ github.run_id }}
          path: /tmp/cloud-dr-render-isolation.json
          retention-days: 90
          if-no-files-found: error
