name: Beta127 OWNER acceptance closeout v2

on:
  push:
    branches:
      - 'release/beta127-owner-r2-complete-20260905'
    paths:
      - '.github/workflows/beta127-owner-acceptance-closeout-v2.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: beta127-owner-acceptance-closeout-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact OWNER acceptance
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/beta127_owner_acceptance_closeout.py
      - name: Canonical guards
        run: |
          set -euo pipefail
          python3 tools/public_repo_secret_guard.py --self-test
          python3 tools/public_repo_secret_guard.py --base-ref HEAD
          python3 tools/owner_acceptance_ledger_guard.py --self-test
          python3 tools/owner_acceptance_ledger_guard.py --base-ref HEAD
          python3 tools/beta_current_sync_contract.py
          python3 - <<'PY'
          import json,yaml
          from pathlib import Path
          r=json.loads(Path('ops/beta-release-request.json').read_text())
          assert r['owner_acceptance']=='COMPLETE'
          assert r['next_action']=='WAIT_FOR_OWNER_NEW_SCOPE'
          assert len(r['owner_checklist'])==11
          assert all(x['owner_result']=='OK' and x['owner_status']=='ACTIVE_PASS' for x in r['owner_checklist'])
          y=yaml.safe_load(Path('qa/stable_invariants.yml').read_text())
          assert isinstance(y.get('invariants'),list) and isinstance(y.get('impact_map'),dict)
          expected=['SETTINGS-RESET-LAYOUT-002','HISTORY-DATE-BULK-DETAIL-003','STATUS-QUEUE-RECOVERY-004','STAFF-SEARCH-DEBOUNCE-001','DROP-PAGINATION-003','REPORT-MANPOWER-LABOR-003','LABOR-BULK-REALTIME-007','PDA-EXCHANGE-SOURCE-002','ATTENDANCE-LOCAL-FIRST-003','QR-INLINE-SHIFT-NAV-003','UI-REALTIME-100MS-006']
          inv={x['id']:x for x in y['invariants']}
          assert all(inv[i]['status']=='ACTIVE_PASS' for i in expected)
          assert all(i in y['impact_map']['app/**'] for i in expected)
          print('BETA127_OWNER_ACCEPTANCE_11_OF_11_REGISTRY_PASS')
          PY
      - name: Commit and canonical readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/beta-release-request.json ops/owner-acceptance-current.json ops/beta127-owner-acceptance.json CURRENT_STATE.md docs/STABLE_INVARIANTS.md docs/handovers/HANDOVER_CURRENT.md docs/handovers/HANDOVER_20260905-211436_beta127-owner-accepted.md qa/stable_invariants.yml
          git commit -m '[skip ci] accept Beta127 OWNER checklist 11 of 11 ACTIVE_PASS'
          FINAL=$(git rev-parse HEAD)
          git push origin HEAD:${GITHUB_REF_NAME}
          git fetch origin ${GITHUB_REF_NAME} beta/current --quiet
          test "$(git rev-parse origin/${GITHUB_REF_NAME})" = "$FINAL"
          git merge-base --is-ancestor origin/beta/current "$FINAL"
          git push origin "$FINAL":refs/heads/beta/current
          git fetch origin beta/current --quiet
          test "$(git rev-parse origin/beta/current)" = "$FINAL"
          test "$(git show origin/${GITHUB_REF_NAME}:ops/beta-release-request.json | jq -r '.owner_acceptance')" = COMPLETE
          test "$(git show origin/${GITHUB_REF_NAME}:ops/beta-release-request.json | jq -r '.next_action')" = WAIT_FOR_OWNER_NEW_SCOPE
          test "$(git show origin/${GITHUB_REF_NAME}:ops/owner-acceptance-current.json | jq -r '.checklist.status')" = OWNER_ACCEPTANCE_COMPLETE
          test "$(git show origin/${GITHUB_REF_NAME}:ops/owner-acceptance-current.json | jq '.checklist.items|length')" = 11
          test "$(git show origin/${GITHUB_REF_NAME}:docs/handovers/HANDOVER_CURRENT.md | grep -c '11/11 OWNER OK')" -ge 1
          test "$(git show origin/${GITHUB_REF_NAME}:CURRENT_STATE.md | grep -c 'owner_acceptance: COMPLETE (11/11 OWNER OK)')" = 1
          echo "BETA127_OWNER_ACCEPTANCE_CLOSEOUT_PASS commit=$FINAL"
