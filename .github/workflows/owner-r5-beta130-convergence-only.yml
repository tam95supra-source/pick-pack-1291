name: Owner R5 Beta130 convergence only
on:
  push:
    branches: [work/r5-beta130-timeline-20260906]
    paths:
      - .github/workflows/owner-r5-beta130-convergence-only.yml
      - tools/r5_beta130_ws_convergence.mjs
      - tools/r5_beta130_ws_gate_fix.py
      - tools/r5_beta130_convergence_only_cleanup_fix.py
      - tools/r5_auth_join_contract.py
permissions:
  contents: read
concurrency:
  group: owner-r5-beta130-convergence-only
  cancel-in-progress: false
jobs:
  convergence-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical rev6 and exact runtime fences
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          REQ=ops/beta-release-request.json
          SOURCE_SHA=$(git log -1 --format=%H -- service/src/auth.ts)
          BASE_SOURCE_SHA=$(jq -r '.base_source_sha' "$REQ")
          test "$(jq -r '.owner_scope' "$REQ")" = OWNER_20260906_R5_QUOTA_REALTIME
          test "$(jq -r '.owner_checklist_revision' "$REQ")" = 6
          test "$(jq -r '.stage' "$REQ")" = BUILD_VERIFY
          test -n "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$BASE_SOURCE_SHA^{commit}"
          test "$(git diff --name-only "$SOURCE_SHA^" "$SOURCE_SHA")" = service/src/auth.ts
          git diff --quiet "$SOURCE_SHA" HEAD -- app service google-apps-script
          python3 tools/r5_quota_realtime_guard.py
          echo "SERVICE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SERVICE_SOURCE_SHA=$BASE_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "R5 exact service source: $SOURCE_SHA"
      - name: Typecheck and auth regression exact service source
        run: |
          set -euo pipefail
          python3 tools/r5_auth_join_contract.py
          cd service
          rm -rf node_modules package-lock.json .wrangler
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          npm run check
      - name: Validate runner-only convergence harness
        run: |
          set -euo pipefail
          python3 tools/r5_beta130_convergence_only_cleanup_fix.py
          python3 tools/r5_beta130_ws_gate_fix.py
          git diff --check
          git diff --quiet HEAD -- app service google-apps-script
          bash -n tools/r5_beta130_convergence_only_gate.sh
          node --check tools/r5_beta130_ws_convergence.mjs
          python3 -m py_compile tools/r5_beta130_convergence_only_cleanup_fix.py tools/r5_beta130_ws_gate_fix.py tools/r5_auth_join_contract.py
      - name: Deploy exact service and measure five-client convergence
        run: |
          set +e
          set -uo pipefail
          SERVICE_SOURCE_SHA="$SERVICE_SOURCE_SHA" bash tools/r5_beta130_convergence_only_gate.sh
          rc=$?
          set -e
          if [[ "$rc" != 0 ]]; then
            echo "R5 convergence-only gate failed; restoring exact LIVE Beta128 service bytes" >&2
            bash tools/restore_exact_service_tree.sh "$BASE_SERVICE_SOURCE_SHA"
            rm -rf service/node_modules service/package-lock.json service/.wrangler
            R5_CONVERGENCE_OUT=/tmp/r5-beta130-convergence-recovery R5_DEPLOY_ONLY=1 SERVICE_SOURCE_SHA="$BASE_SERVICE_SOURCE_SHA" bash tools/r5_beta130_convergence_only_gate.sh || exit 97
            exit "$rc"
          fi
      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta130-convergence-only-${{ github.run_id }}
          path: |
            /tmp/r5-beta130-convergence-only
            /tmp/r5-beta130-convergence-recovery
          retention-days: 30
          if-no-files-found: error
