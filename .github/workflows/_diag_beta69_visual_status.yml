name: Beta69 visual status diagnostic
on:
  push:
    branches: [ release/beta69-owner-six-fixes-20260825 ]
    paths: [ '.github/workflows/_diag_beta69_visual_status.yml' ]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Persist latest visual run status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; branch='release/beta69-owner-six-fixes-20260825'
          raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/_gate_beta69_visual_internal_v1.yml/runs?branch=release%2Fbeta69-owner-six-fixes-20260825&per_page=3'],text=True)
          j=json.loads(raw); lines=[]
          for r in j.get('workflow_runs',[])[:3]: lines.append(f"run_id={r['id']} status={r['status']} conclusion={r.get('conclusion')} head_sha={r['head_sha']} created_at={r['created_at']}")
          data=('\n'.join(lines)+'\n').encode(); content=base64.b64encode(data).decode()
          payload={'message':'ops: record Beta69 visual run status','content':content,'branch':branch}
          # create or update safely against latest branch
          try:
            old=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/contents/ops/beta69-visual-status.txt?ref={branch}'],text=True)); payload['sha']=old['sha']
          except subprocess.CalledProcessError: pass
          subprocess.check_call(['gh','api','--method','PUT',f'repos/{repo}/contents/ops/beta69-visual-status.txt','--input','-'],input=json.dumps(payload).encode())
          PY
