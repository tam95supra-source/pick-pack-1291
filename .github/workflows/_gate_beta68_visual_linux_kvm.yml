name: Beta68 visual Linux KVM exact source
on:
  push:
    branches: [ release/beta68-exact-20260824 ]
    paths: [ '.github/workflows/_gate_beta68_visual_linux_kvm.yml' ]
permissions:
  contents: write
  actions: read
concurrency:
  group: beta68-visual-linux-kvm
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_RUN_ID: '32748150618'
      DEBUG_ARTIFACT_ID: '9527993589'
      SOURCE_SHA: afd320af178ed36e67ace7f435d881b0c853c468
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Persist start receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > ops/beta68-visual-linux-kvm-start.txt <<EOF
          run_id=$GITHUB_RUN_ID
          source_run_id=$SOURCE_RUN_ID
          source_sha=$SOURCE_SHA
          debug_artifact_id=$DEBUG_ARTIFACT_ID
          runtime=ubuntu-24.04_api29_x86_64_kvm
          state=STARTED
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-visual-linux-kvm-start.txt
          git commit -m 'ops: record Beta68 Linux KVM visual start'
          git push origin HEAD:release/beta68-exact-20260824
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo 'KVM_DEVICE_MISSING' >&2
            exit 1
          fi
      - name: Download exact debug artifact from candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$DEBUG_ARTIFACT_ID/zip" -o /tmp/debug.zip
          mkdir -p visual-input
          unzip -q /tmp/debug.zip -d visual-input
          test -s visual-input/app-beta-debug.apk
      - name: Capture login matrix API29 Linux KVM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -eu
            mkdir -p visual
            adb install -r visual-input/app-beta-debug.apk >/dev/null
            for spec in '320x568:160:login-320x568.png' '360x640:160:login-360x640.png' '480x800:240:login-480x800.png'; do
              IFS=: read -r size density name <<EOF
            $spec
            EOF
              adb shell wm size "$size"
              adb shell wm density "$density"
              adb shell am force-stop vn.pickpack1291.app.beta.publicbeta
              adb shell am start -W -n vn.pickpack1291.app.beta.publicbeta/vn.pickpack1291.app.beta.FullBetaActivity >/dev/null
              sleep 2
              adb exec-out screencap -p > "visual/$name"
            done
      - name: Enforce screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          exp={'login-320x568.png':(320,568),'login-360x640.png':(360,640),'login-480x800.png':(480,800)}
          for n,d in exp.items():
              b=(Path('visual')/n).read_bytes()
              assert len(b)>5000 and b[:8]==b'\x89PNG\r\n\x1a\n',n
              got=struct.unpack('>II',b[16:24]); assert got==d,(n,got,d)
              print(n,got,len(b))
          print('BETA68_VISUAL_LINUX_KVM_FILES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: beta68-login-visual-linux-kvm
          path: visual/*.png
          retention-days: 30
          if-no-files-found: error
      - name: Persist visual Linux KVM receipt
        shell: bash
        env:
          VISUAL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p ops
          cat > ops/beta68-visual-linux-kvm-result.txt <<EOF
          verdict=PASS_FILES
          run_id=$GITHUB_RUN_ID
          source_run_id=$SOURCE_RUN_ID
          source_sha=$SOURCE_SHA
          debug_artifact_id=$DEBUG_ARTIFACT_ID
          visual_artifact_id=$VISUAL_ARTIFACT_ID
          matrix=320x568,360x640,480x800
          runtime=ubuntu-24.04_api29_x86_64_kvm
          human_inspection=PENDING
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-visual-linux-kvm-result.txt
          git commit -m 'ops: record Beta68 Linux KVM visual files PASS'
          git push origin HEAD:release/beta68-exact-20260824
