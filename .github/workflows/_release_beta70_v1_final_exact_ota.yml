name: Final Beta70 v1 exact OTA
on:
  push:
    branches: [ release/beta70-pda-local-holder-fix-20260825 ]
    paths: [ 'ops/TRIGGER_BETA70_V1_FINAL_RELEASE.txt' ]
permissions:
  contents: write
  actions: read
concurrency:
  group: beta70-v1-final-exact-release
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '32792583861'
  ARTIFACT_ID: '9543716011'
  SOURCE_SHA: 23b3c1a786277bb3801ff2f481109a7b8e8f59a1
  TARGET_VERSION: 0.4.2-beta.70
  TARGET_CODE: '76'
  TARGET_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  APK_NAME: pick-pack-1291-public-beta-0.4.2-beta.70.apk
  EXPECTED_SHA: f4113bf8ffb330cd5ebf51f06a5fd211be04323546d28e4e04dec498d1d83899
  EXPECTED_SIZE: '13114245'
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  BETA_FOLDER_ID: 1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg
  TAG: v0.4.2-beta.70-publicbeta
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  BRANCH: release/beta70-pda-local-holder-fix-20260825

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: A lock visual PASS and fresh-read live authority
        id: pre
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence /tmp/candidate /tmp/github-live
          OUT=/tmp/release-result
          : > "$OUT"
          V=ops/beta70-visual-inspection.txt
          grep -qx 'verdict=PASS' "$V"
          grep -qx "source_sha=$SOURCE_SHA" "$V"
          grep -qx "candidate_run_id=$SOURCE_RUN_ID" "$V"
          grep -qx "candidate_artifact_id=$ARTIFACT_ID" "$V"
          grep -qx "apk_sha256=$EXPECTED_SHA" "$V"
          grep -qx "apk_size=$EXPECTED_SIZE" "$V"
          grep -qx "signer_sha256=$EXPECTED_SIGNER_SHA256" "$V"
          grep -qx 'matrix=320x568,360x640,480x800' "$V"
          grep -qx 'pda_local_holder_offline=PASS' "$V"
          grep -qx 'service_error_preserves_local_holder=PASS' "$V"
          grep -qx 'human_inspection=PASS' "$V"
          MAIN_BEFORE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" | jq -r '.commit.sha')
          [[ "$MAIN_BEFORE" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/stable-before.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.67"}' > /tmp/beta-before.json
          jq -e '.ok==true' /tmp/stable-before.json >/dev/null
          jq -e '.ok==true and .version_name=="0.4.2-beta.68" and .version_code==74' /tmp/beta-before.json >/dev/null
          OTA_SOURCE_BEFORE=$(jq -r '.source // empty' /tmp/beta-before.json); [[ -n "$OTA_SOURCE_BEFORE" ]]
          printf 'main_before=%s\nota_source_before=%s\nvisual_lock=PASS\n' "$MAIN_BEFORE" "$OTA_SOURCE_BEFORE" >> "$OUT"
          cp /tmp/stable-before.json /tmp/evidence/stable-before.json
          cp /tmp/beta-before.json /tmp/evidence/beta-before.json

      - name: B verify exact locked Beta70 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          APK=$(find /tmp/candidate -type f -name "$APK_NAME" -print -quit)
          META=$(find /tmp/candidate -type f -name release-meta.json -print -quit)
          SUM=$(find /tmp/candidate -type f -name 'SHA256SUMS-*.txt' -print -quit)
          [[ -n "$APK" && -s "$APK" && -n "$META" && -n "$SUM" ]]
          [[ "$(sha256sum "$APK"|awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' "$APK")" == "$EXPECTED_SIZE" ]]
          grep -qx "$EXPECTED_SHA  $APK_NAME" "$SUM"
          jq -e --arg v "$TARGET_VERSION" --argjson c "$TARGET_CODE" --arg p "$TARGET_PACKAGE" --arg s "$SOURCE_SHA" --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" --arg signer "$EXPECTED_SIGNER_SHA256" '.version_name==$v and .version_code==$c and .package==$p and .source_sha==$s and .apk_sha256==$h and .apk_size==$z and .signer_sha256==$signer and .stable_publish=="FORBIDDEN"' "$META" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo 'artifact_exact_bytes=PASS' >> /tmp/release-result
          cp "$META" /tmp/evidence/release-meta.json

      - name: C authorize GAS and capture exact source plus artifact transport URL
        id: auth
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID GAS_DEPLOYMENT_ID; do [[ -n "${!n:-}" ]] || { echo "MISSING_SECRET:$n"; exit 10; }; done
          RESP=$(curl -fsS https://oauth2.googleapis.com/token -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')
          TOKEN=$(jq -r '.access_token // empty' <<<"$RESP"); [[ -n "$TOKEN" ]]
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID"|tr -d '\r\n\t ')
          RAW=$(printf '%s' "$GAS_DEPLOYMENT_ID"|tr -d '\r\n\t '); DEPLOYMENT_ID="$RAW"; if [[ "$RAW" =~ /s/([^/]+)/ ]]; then DEPLOYMENT_ID="${BASH_REMATCH[1]}"; fi
          echo "::add-mask::$TOKEN"; echo "::add-mask::$SCRIPT_ID"; echo "::add-mask::$DEPLOYMENT_ID"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"; echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"; echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" > /tmp/live-original.json
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID" > /tmp/deployment-before.json
          python3 - <<'PY'
          import json,hashlib
          j=json.load(open('/tmp/live-original.json'))
          assert any(f.get('name')=='PICK_PACK_API' and f.get('source') for f in j.get('files',[]))
          canon='\n'.join(f.get('name','')+'\0'+f.get('type','')+'\0'+f.get('source','') for f in j.get('files',[]))
          open('/tmp/original-canon.sha','w').write(hashlib.sha256(canon.encode()).hexdigest())
          PY
          HDR=$(mktemp)
          curl -sS -D "$HDR" -o /dev/null -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          ART_URL=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"");sub(/^location:[[:space:]]*/,"");print;exit}' "$HDR")
          [[ "$ART_URL" == https://* ]]
          echo "::add-mask::$ART_URL"; echo "artifact_url=$ART_URL" >> "$GITHUB_OUTPUT"
          cp /tmp/original-canon.sha /tmp/evidence/gas-source-before.sha256
          cp /tmp/deployment-before.json /tmp/evidence/gas-deployment-before.json

      - name: D install temporary nonce-gated exact Beta70 Drive helper
        id: helper
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
        run: |
          set -Eeuo pipefail
          NONCE=$(openssl rand -hex 32); echo "::add-mask::$NONCE"; echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"
          python3 - "$NONCE" <<'PY'
          import json,sys
          nonce=sys.argv[1]; j=json.load(open('/tmp/live-original.json'))
          f=next(x for x in j['files'] if x.get('name')=='PICK_PACK_API'); s=f['source']
          anchor="    if (action === 'health') return ppJson_(ppHealth_());"
          if anchor not in s: raise SystemExit('HEALTH_ACTION_ANCHOR_MISSING')
          route="    if (action === '__b70_exact_drive_backup') return ppJson_(ppB70ExactDriveBackupTmp_(body));"
          s=s.replace(anchor,anchor+'\n'+route,1)
          helper=r'''
function ppB70ExactDriveBackupTmp_(body){
  if(String(body.token||'')!=='__NONCE__')return {ok:false,error:'FORBIDDEN'};
  if(String(body.folder_id||'')!=='1WMXI-8-Z1mbY2v11noYFHe_eoMNiNZXg')return {ok:false,error:'TARGET_MISMATCH'};
  const expected=String(body.sha||'').toLowerCase(), expectedSize=Number(body.size||0), apkName='pick-pack-1291-public-beta-0.4.2-beta.70.apk', sumName='SHA256SUMS-0.4.2-beta.70.txt';
  const r=UrlFetchApp.fetch(String(body.artifact_url||''),{muteHttpExceptions:true,followRedirects:true}); if(r.getResponseCode()!==200)return {ok:false,error:'FETCH_'+r.getResponseCode()};
  const blobs=Utilities.unzip(r.getBlob()); let apk=null; blobs.forEach(function(b){if(String(b.getName()||'')===apkName)apk=b;}); if(!apk)return {ok:false,error:'APK_MISSING'};
  const bytes=apk.getBytes(); if(bytes.length!==expectedSize)return {ok:false,error:'SIZE_MISMATCH',size:bytes.length};
  const dig=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,bytes), sha=dig.map(function(b){return ('0'+((b+256)%256).toString(16)).slice(-2);}).join(''); if(sha!==expected)return {ok:false,error:'SHA_MISMATCH',sha256:sha};
  const folder=DriveApp.getFolderById(String(body.folder_id)); let af=null,it=folder.getFilesByName(apkName);
  while(it.hasNext()){let x=it.next();if(x.getSize()===expectedSize){const xb=x.getBlob().getBytes(),xd=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,xb),xh=xd.map(function(b){return ('0'+((b+256)%256).toString(16)).slice(-2);}).join('');if(xh===expected){af=x;break;}}}
  if(!af)af=folder.createFile(apk.copyBlob().setName(apkName));
  af.setDescription('Beta70 PDA local holder fix | SHA256 '+expected+' | exact candidate run 32792583861');
  let sf=null,si=folder.getFilesByName(sumName); while(si.hasNext()){let x=si.next();if(String(x.getBlob().getDataAsString()).indexOf(expected)>=0){sf=x;break;}} if(!sf)sf=folder.createFile(sumName,expected+'  '+apkName+'\n','text/plain');
  try{af.setSharing(DriveApp.Access.ANYONE_WITH_LINK,DriveApp.Permission.VIEW);}catch(_){} try{sf.setSharing(DriveApp.Access.ANYONE_WITH_LINK,DriveApp.Permission.VIEW);}catch(_){}
  return {ok:true,apk_file_id:af.getId(),sum_file_id:sf.getId(),sha256:sha,size:af.getSize(),apk_name:af.getName(),sum_name:sf.getName()};
}
'''.replace('__NONCE__',nonce)
          f['source']=s+helper
          open('/tmp/helper-content.json','w').write(json.dumps({'files':j['files']},ensure_ascii=False))
          PY
          H=$(curl -sS -o /tmp/helper-put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/helper-content.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"); [[ "$H" == 200 ]] || { cat /tmp/helper-put.out; exit 1; }
          H=$(curl -sS -o /tmp/helper-ver.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"TEMP Beta70 exact Drive transport helper"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions"); [[ "$H" == 200 ]] || { cat /tmp/helper-ver.json; exit 1; }
          V=$(jq -r '.versionNumber' /tmp/helper-ver.json); [[ "$V" =~ ^[0-9]+$ ]]
          jq -nc --arg sid "$SCRIPT_ID" --argjson v "$V" '{deploymentConfig:{scriptId:$sid,versionNumber:$v,manifestFileName:"appsscript",description:"TEMP Beta70 exact Drive transport helper"}}' > /tmp/helper-deploy.json
          H=$(curl -sS -o /tmp/helper-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/helper-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID"); [[ "$H" == 200 ]] || { cat /tmp/helper-deploy.out; exit 1; }

      - name: E transport exact locked candidate to canonical Beta Drive
        id: drive
        shell: bash
        env:
          NONCE: ${{ steps.helper.outputs.nonce }}
          ARTIFACT_URL: ${{ steps.auth.outputs.artifact_url }}
        run: |
          set -Eeuo pipefail
          jq -nc --arg token "$NONCE" --arg folder "$BETA_FOLDER_ID" --arg url "$ARTIFACT_URL" --arg sha "$EXPECTED_SHA" --argjson size "$EXPECTED_SIZE" '{action:"__b70_exact_drive_backup",token:$token,folder_id:$folder,artifact_url:$url,sha:$sha,size:$size}' > /tmp/transport-request.json
          OK=false
          for i in $(seq 1 25); do
            curl -fsSL --retry 2 -H 'content-type: application/json' "$GAS_URL" --data-binary @/tmp/transport-request.json > /tmp/transport.json || true
            if jq -e --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" --arg n "$APK_NAME" '.ok==true and .sha256==$h and .size==$z and .apk_name==$n' /tmp/transport.json >/dev/null 2>&1; then OK=true; break; fi
            sleep 4
          done
          [[ "$OK" == true ]] || { cat /tmp/transport.json; exit 1; }
          APK_ID=$(jq -r '.apk_file_id' /tmp/transport.json); SUM_ID=$(jq -r '.sum_file_id' /tmp/transport.json); [[ -n "$APK_ID" && -n "$SUM_ID" ]]
          echo "apk_id=$APK_ID" >> "$GITHUB_OUTPUT"; echo "sum_id=$SUM_ID" >> "$GITHUB_OUTPUT"
          cp /tmp/transport.json /tmp/evidence/drive-transport.json
          printf 'drive_file_id=%s\ndrive_exact_bytes=PASS\n' "$APK_ID" >> /tmp/release-result

      - name: F restore exact pre-transport GAS source and deployment
        if: always() && steps.auth.outcome == 'success'
        id: restore
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
          SCRIPT_ID: ${{ steps.auth.outputs.script_id }}
          DEPLOYMENT_ID: ${{ steps.auth.outputs.deployment_id }}
        run: |
          set -Eeuo pipefail
          jq '{files:.files}' /tmp/live-original.json > /tmp/original-put.json
          H=$(curl -sS -o /tmp/restore-put.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/original-put.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content"); [[ "$H" == 200 ]] || { cat /tmp/restore-put.out; exit 1; }
          H=$(curl -sS -o /tmp/restore-ver.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{"description":"Restore exact pre-Beta70 source after temporary Drive transport"}' "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions"); [[ "$H" == 200 ]] || { cat /tmp/restore-ver.json; exit 1; }
          V=$(jq -r '.versionNumber' /tmp/restore-ver.json); [[ "$V" =~ ^[0-9]+$ ]]
          jq -nc --arg sid "$SCRIPT_ID" --argjson v "$V" '{deploymentConfig:{scriptId:$sid,versionNumber:$v,manifestFileName:"appsscript",description:"Restore exact pre-Beta70 source"}}' > /tmp/restore-deploy.json
          H=$(curl -sS -o /tmp/restore-deploy.out -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/restore-deploy.json "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID"); [[ "$H" == 200 ]] || { cat /tmp/restore-deploy.out; exit 1; }
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" > /tmp/live-after-restore.json
          python3 - <<'PY'
          import json,hashlib
          j=json.load(open('/tmp/live-after-restore.json')); canon='\n'.join(f.get('name','')+'\0'+f.get('type','')+'\0'+f.get('source','') for f in j.get('files',[])); after=hashlib.sha256(canon.encode()).hexdigest(); before=open('/tmp/original-canon.sha').read().strip(); assert after==before,(before,after); open('/tmp/evidence/gas-source-after.sha256','w').write(after+'\n')
          PY
          echo 'gas_source_restored=PASS' >> /tmp/release-result

      - name: G require exact Drive transport and GAS restore
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.drive.outcome }}' == 'success' ]]
          [[ '${{ steps.restore.outcome }}' == 'success' ]]

      - name: H publish exact same bytes as GitHub prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Beta70
          - Sửa Đổi / Trả PDA: khi dịch vụ/master tạm lỗi, PDA đang active từ local state vẫn hiển thị và thao tác được.
          - Không thay đổi Stable.

          Exact signed candidate from run 32792583861 / artifact 9543716011.
          EOF
          printf '%s  %s\n' "$EXPECTED_SHA" "$APK_NAME" > /tmp/SHA256SUMS-0.4.2-beta.70.txt
          git fetch --tags origin
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n1 "$TAG" 2>/dev/null || true); [[ "$TAG_SHA" == "$SOURCE_SHA" ]]
            gh release edit "$TAG" --prerelease --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" "$APK" /tmp/SHA256SUMS-0.4.2-beta.70.txt --clobber
          gh release download "$TAG" -p "$APK_NAME" -D /tmp/github-live
          [[ "$(sha256sum /tmp/github-live/$APK_NAME|awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/github-live/$APK_NAME)" == "$EXPECTED_SIZE" ]]
          printf 'github_prerelease=PASS\ngithub_tag=%s\ngithub_public_bytes=PASS\n' "$TAG" >> /tmp/release-result

      - name: I fresh-read public OTA manifest and exact public bytes
        shell: bash
        env:
          DRIVE_APK_ID: ${{ steps.drive.outputs.apk_id }}
        run: |
          set -Eeuo pipefail
          PASS=false
          for n in $(seq 1 25); do
            curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.68"}' > /tmp/ota-public.json
            if jq -e --arg v "$TARGET_VERSION" --argjson c "$TARGET_CODE" --arg h "$EXPECTED_SHA" --argjson z "$EXPECTED_SIZE" '.ok==true and .available==true and .version_name==$v and .version_code==$c and .sha256==$h and .size==$z' /tmp/ota-public.json >/dev/null 2>&1; then PASS=true; break; fi
            sleep 4
          done
          [[ "$PASS" == true ]] || { cat /tmp/ota-public.json; exit 1; }
          OTA_SOURCE_AFTER=$(jq -r '.source // empty' /tmp/ota-public.json); OTA_SOURCE_BEFORE=$(sed -n 's/^ota_source_before=//p' /tmp/release-result); [[ "$OTA_SOURCE_AFTER" == "$OTA_SOURCE_BEFORE" ]]
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.70"}' > /tmp/ota-current.json
          jq -e --arg v "$TARGET_VERSION" --argjson c "$TARGET_CODE" '.ok==true and .available==false and .version_name==$v and .version_code==$c' /tmp/ota-current.json >/dev/null
          LIVE_URL=$(jq -r '.apk_url // .download_url // .url // empty' /tmp/ota-public.json); [[ "$LIVE_URL" == https://* ]]
          curl -fsSL -L --connect-timeout 15 --max-time 150 "$LIVE_URL" -o /tmp/ota-public.apk
          [[ "$(sha256sum /tmp/ota-public.apk|awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/ota-public.apk)" == "$EXPECTED_SIZE" ]]
          SDKROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}; AAPT=$(find "$SDKROOT/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1); [[ -n "$AAPT" ]]
          BADGING=$($AAPT dump badging /tmp/ota-public.apk | head -1); grep -F "versionCode='76'" <<<"$BADGING"; grep -F "versionName='0.4.2-beta.70'" <<<"$BADGING"
          APKSIGNER=$(find "$SDKROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1); [[ -n "$APKSIGNER" ]]
          PUB_SIGNER=$($APKSIGNER verify --print-certs /tmp/ota-public.apk | grep -im1 'certificate SHA-256 digest' | sed -E 's/.*:[[:space:]]*//' | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          [[ "$PUB_SIGNER" == "$EXPECTED_SIGNER_SHA256" ]]
          curl -fsSL -L --connect-timeout 15 --max-time 150 "https://drive.usercontent.google.com/download?id=$DRIVE_APK_ID&export=download&confirm=t" -o /tmp/drive-public.apk
          [[ "$(sha256sum /tmp/drive-public.apk|awk '{print $1}')" == "$EXPECTED_SHA" ]]
          [[ "$(stat -c '%s' /tmp/drive-public.apk)" == "$EXPECTED_SIZE" ]]
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/stable-after.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/stable-before.json')); b=json.load(open('/tmp/stable-after.json'))
          keys=('source','channel','version_name','version_code','sha256','size','apk_url','available','reason')
          assert {k:a.get(k) for k in keys}=={k:b.get(k) for k in keys},(a,b)
          PY
          MAIN_AFTER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main"|jq -r '.commit.sha'); MAIN_BEFORE=$(sed -n 's/^main_before=//p' /tmp/release-result); [[ "$MAIN_AFTER" == "$MAIN_BEFORE" ]]
          cp /tmp/ota-public.json /tmp/evidence/update-check-beta70.json
          cp /tmp/ota-current.json /tmp/evidence/update-check-beta70-current.json
          cp /tmp/stable-after.json /tmp/evidence/stable-after.json
          printf '%s\n' "$BADGING" > /tmp/evidence/public-apk-badging.txt
          printf '%s\n' "$PUB_SIGNER" > /tmp/evidence/public-apk-signer-sha256.txt
          printf 'ota_live=PASS\nota_source=%s\nota_version=%s\nota_code=%s\nota_sha256=%s\nota_size=%s\nota_url=%s\npublic_apk_version=PASS\npublic_apk_code=PASS\npublic_apk_sha256=PASS\npublic_apk_size=PASS\npublic_apk_signer=%s\ndrive_public_bytes=PASS\nstable_unchanged=PASS\nmain_unchanged=PASS\n' "$OTA_SOURCE_AFTER" "$TARGET_VERSION" "$TARGET_CODE" "$EXPECTED_SHA" "$EXPECTED_SIZE" "$LIVE_URL" "$PUB_SIGNER" >> /tmp/release-result

      - name: J upload immutable public readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: beta70-public-ota-readback
          path: /tmp/evidence
          if-no-files-found: error
          retention-days: 30

      - name: K persist Beta70 exact OTA PASS receipt
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          {
            echo 'verdict=PASS'
            echo "release_run_id=$GITHUB_RUN_ID"
            echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=$SOURCE_SHA"
            echo "candidate_run_id=$SOURCE_RUN_ID"
            echo "candidate_artifact_id=$ARTIFACT_ID"
            echo "beta_name=$TARGET_VERSION"
            echo "beta_code=$TARGET_CODE"
            echo "package=$TARGET_PACKAGE"
            echo "apk_file=$APK_NAME"
            echo "apk_sha256=$EXPECTED_SHA"
            echo "apk_size=$EXPECTED_SIZE"
            echo "signer_sha256=$EXPECTED_SIGNER_SHA256"
            echo "beta_folder_id=$BETA_FOLDER_ID"
            cat /tmp/release-result
            echo 'stable_name=0.1.0-stable'
            echo 'stable_code=1'
            echo 'stable_publish=FORBIDDEN'
          } > /tmp/final-receipt.txt
          CONTENT=$(base64 -w0 /tmp/final-receipt.txt)
          PATHQ=ops/beta70-v1-release-result.txt
          CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$PATHQ?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$PATHQ" -f message='ops: record Beta70 v1 exact OTA PASS' -f content="$CONTENT" -f branch="$BRANCH")
          test -n "$CURRENT" && args+=(-f sha="$CURRENT")
          gh api "${args[@]}" >/dev/null
          cat /tmp/final-receipt.txt
