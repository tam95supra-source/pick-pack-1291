name: Final Beta70 v1 exact OTA
on:
  push:
    branches: [ release/beta70-pda-local-holder-fix-20260825 ]
    paths: [ 'ops/TRIGGER_BETA70_V1_FINAL_RELEASE.txt' ]
permissions:
  contents: write
  actions: read
concurrency:
  group: beta70-v1-final-exact-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Execute exact Beta70 canonical OTA flow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          cp tools/release_beta70_exact_ota_v1.sh /tmp/release-beta70.sh
          python3 - <<'PY'
          p='/tmp/release-beta70.sh'
          s=open(p).read()
          old="jq -e '.ok==true and .version_name==\"0.4.2-beta.68\" and .version_code==74' /tmp/b70/beta-before.json >/dev/null"
          new="jq -e '.ok==true and .version_name==\"0.4.2-beta.68\"' /tmp/b70/beta-before.json >/dev/null"
          assert old in s, 'beta68 live-schema precondition anchor missing'
          open(p,'w').write(s.replace(old,new,1))
          PY
          bash /tmp/release-beta70.sh
      - name: Upload public readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta70-public-ota-readback
          path: /tmp/b70/evidence
          if-no-files-found: warn
          retention-days: 30
