name: Beta126 apply owner scope remediation

on:
  push:
    branches: [release/beta126-owner-scope-20260905]
    paths:
      - .github/workflows/beta123-apply-owner-scope.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/beta126-owner-scope-20260905
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Apply deterministic Beta126 patch
        run: python3 tools/beta123_apply_owner_scope.py
      - name: Contracts and source guards
        run: |
          python3 tools/beta123_owner_scope_contract.py
          python3 tools/pda_source_master_invariant_contract.py
          git diff --check
      - name: Compile Android Beta and Stable
        run: gradle :app:compileBetaDebugKotlin :app:compileStableDebugKotlin :app:testBetaDebugUnitTest --no-daemon
      - name: Commit implementation
        run: |
          set -euo pipefail
          BRANCH=release/beta126-owner-scope-20260905
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app qa tools
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'feat(beta126): complete owner docx scope remediation'
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
