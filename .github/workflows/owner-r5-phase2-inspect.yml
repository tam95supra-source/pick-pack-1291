name: Owner R5 phase2 targeted inspect
# inspect operational snapshot consumers

on:
  push:
    branches:
      - work/r5-quota-realtime-20260906
    paths:
      - .github/workflows/owner-r5-phase2-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Canonical guard
        run: |
          python3 tools/owner_scope_guard.py --bootstrap
          python3 tools/finalizer_handoff_contract.py
      - name: Targeted R5 source map
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SNAPSHOT CONSUMERS ==='
          grep -R -n -E 'optJSONArray\("sessions"|optJSONArray\("labor"|optJSONArray\("events"|optJSONObject\("history"|optJSONObject\("report"|loadDay\(' app/src/main/java/vn/pickpack1291/app/beta --include='*.kt' | head -n 300 || true
          echo '=== COMPAT DAY CALLERS ==='
          grep -R -n -E 'sync_day|sync_bootstrap|OperationalDataStore|day_revision' app/src/main/java/vn/pickpack1291/app/beta --include='*.kt' | head -n 280 || true
