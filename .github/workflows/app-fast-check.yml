name: App fast check

on:
  push:
    branches:
      - feature/beta78-old-session-outbound-service-20260826
    paths:
      - app/build.gradle.kts
      - app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
      - app/src/main/java/vn/pickpack1291/app/beta/OldSessionWarningFeature.kt
      - app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
      - service/**
      - tools/beta78_service_live_gate.sh
      - .github/workflows/app-fast-check.yml

permissions:
  contents: read

concurrency:
  group: beta78-service-live-gate
  cancel-in-progress: false

jobs:
  beta78-service-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      D1_NAME: pick-pack-1291-service-prod
      PASS_SHA: ce4a0ee0bcf1ed6dffbd0429c5238ce3918f94d1
      OUTBOUND_SHEET_ID: 1tl6har_8vGSVsVlcErfQwjX1YgvN3o-FRG5wQV4VTEM
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reuse immutable Beta78 compile receipts
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PASS_SHA^{commit}"
          git diff --quiet "$PASS_SHA" HEAD -- app service
          grep -q 'versionCode = 84' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.78"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          git diff --check HEAD^ HEAD
          echo 'service_typecheck=REUSED_PASS run=32974026769 source_unchanged=true'
          echo 'android_compile=REUSED_PASS run=32974026769 source_unchanged=true'
          echo 'historical_3of3=REUSED_PASS run=32975908629 service_source_unchanged=true'

      - name: Google OAuth and outbound Sheet readback preflight
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/beta78-google-preflight; rm -rf "$D"; mkdir -p "$D"
          for n in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do test -n "${!n:-}"; echo "::add-mask::${!n}"; done
          TOKEN_HTTP=$(curl -sS --connect-timeout 10 --max-time 20 -o "$D/token.json" -w '%{http_code}' https://oauth2.googleapis.com/token \
            -d client_id="$GOOGLE_OAUTH_CLIENT_ID" -d client_secret="$GOOGLE_OAUTH_CLIENT_SECRET" -d refresh_token="$GOOGLE_OAUTH_REFRESH_TOKEN" -d grant_type=refresh_token || printf 000)
          jq 'del(.access_token,.id_token)' "$D/token.json" > "$D/token-sanitized.json" 2>/dev/null || printf '{}\n' > "$D/token-sanitized.json"
          echo "token_http=$TOKEN_HTTP"
          [[ "$TOKEN_HTTP" == 200 ]] || { cat "$D/token-sanitized.json"; exit 31; }
          ACCESS_TOKEN=$(jq -r '.access_token // empty' "$D/token.json"); test -n "$ACCESS_TOKEN"; echo "::add-mask::$ACCESS_TOKEN"
          SHEET_HTTP=$(curl -sS --connect-timeout 10 --max-time 20 -o "$D/sheet.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://sheets.googleapis.com/v4/spreadsheets/$OUTBOUND_SHEET_ID?fields=spreadsheetId,sheets.properties(sheetId,title)" || printf 000)
          echo "sheet_http=$SHEET_HTTP"
          if [[ "$SHEET_HTTP" != 200 ]]; then jq '{error}' "$D/sheet.json" 2>/dev/null || cat "$D/sheet.json"; exit 32; fi
          jq -e --arg id "$OUTBOUND_SHEET_ID" '.spreadsheetId==$id and any(.sheets[]; .properties.title=="Nhận hàng rớt") and any(.sheets[]; .properties.title=="Vị trí")' "$D/sheet.json" >/dev/null
          echo 'google_outbound_preflight=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Service deployment dependencies
        working-directory: service
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Patch transient post-deploy health harness only
        shell: bash
        run: |
          set -euo pipefail
          cp tools/beta78_service_live_gate.sh /tmp/beta78_service_live_gate.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/beta78_service_live_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='curl -fsS "$SERVICE_URL/health" > "$D/health-after.json"\n'
          new='''HEALTH_HTTP=000\nfor attempt in 1 2 3; do\n  HEALTH_HTTP=$(curl -sS --connect-timeout 10 --max-time 20 -o "$D/health-after.json" -w '%{http_code}' "$SERVICE_URL/health" || printf 000)\n  [[ "$HEALTH_HTTP" =~ ^2[0-9][0-9]$ ]] && break\n  [[ "$attempt" -lt 3 ]] && sleep $((attempt*3))\ndone\n[[ "$HEALTH_HTTP" =~ ^2[0-9][0-9]$ ]] || { echo "LIVE_HEALTH_HTTP=$HEALTH_HTTP" >&2; exit 22; }\n'''
          if s.count(old)!=1: raise SystemExit('HEALTH_ANCHOR_MISSING')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          bash -n /tmp/beta78_service_live_gate.sh

      - name: Run exact production Service live gate
        shell: bash
        run: bash /tmp/beta78_service_live_gate.sh

      - name: Upload Beta78 Service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta78-service-live-${{ github.run_id }}
          path: |
            /tmp/beta78-service-live
            /tmp/beta78-google-preflight/token-sanitized.json
            /tmp/beta78-google-preflight/sheet.json
          retention-days: 30
          if-no-files-found: warn
