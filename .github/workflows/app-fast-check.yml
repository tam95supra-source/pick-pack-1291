name: App fast check

on:
  push:
    branches:
      - 'feature/**'
      - 'agent/**'
      - 'release/**'
    paths:
      - app/**
      - service/**
      - services/**
      - google-apps-script/**
      - config/mutation_fallback_policy.json
      - config/provider_free_limits.json
      - tools/resilience_static_gate.mjs
      - tools/portable_backup_verify.sh
      - tools/d1_generation_autopilot.sh
      - tools/cloud_dr_provider_preflight.sh
      - tools/adb_stable_guard.sh
      - tools/beta83_verify_matrix.sh
      - tools/Beta83UiChecksInstrumentation.java
      - tools/beta89_back_api36.sh
      - tools/beta_auth_converge.py
      - tools/beta83_ota_device_gate.sh
      - tools/beta83_publish_ota.sh
      - tools/verify_beta_visual_receipt.py
      - qa/**
      - .github/workflows/app-fast-check.yml
  pull_request:
    paths:
      - app/**
      - service/**
      - services/**
      - google-apps-script/**
      - config/mutation_fallback_policy.json
      - tools/resilience_static_gate.mjs
      - qa/**
      - .github/workflows/app-fast-check.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: app-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk"
          ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: impact
        name: Resolve impacted gates
        shell: bash
        run: |
          set -euo pipefail
          app=true
          if [[ "${{ github.event_name }}" == "push" ]]; then
            app=false
            git diff --name-only HEAD^ HEAD | grep -q '^app/' && app=true || true
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "impact_app=$app"

      - name: Read-only Beta Stable capacity inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" > /tmp/d1-inventory.json
          jq -e '.success==true and (.result|type=="array")' /tmp/d1-inventory.json >/dev/null
          COUNT=$(jq '.result|length' /tmp/d1-inventory.json)
          jq -r '.result[] | "d1=" + (.name // "UNKNOWN")' /tmp/d1-inventory.json | sort
          echo "d1_database_count=$COUNT"
          [[ "$COUNT" -lt 10 ]] && echo "stable_d1_slot_available=true" || echo "stable_d1_slot_available=false"

      - name: Release verifier regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_beta_visual_receipt.py --self-test
          python3 -m py_compile tools/gas_resilience_contract_readback.py tools/gas_resilience_contract_patch.py
          python3 -m py_compile tools/stable_private_provision.py
          python3 -m py_compile tools/beta_auth_converge.py
          python3 -m py_compile tools/verify_promotion_lock.py
          python3 tools/verify_promotion_lock.py
          bash -n tools/beta83_publish_ota.sh

      - name: Static resilience gates
        shell: bash
        run: |
          set -euo pipefail
          node tools/resilience_static_gate.mjs
          cp google-apps-script/PICK_PACK_API.gs "$RUNNER_TEMP/pick-pack-api.js"
          node --check "$RUNNER_TEMP/pick-pack-api.js"
          cp google-apps-script/stable-outbound/Code.gs "$RUNNER_TEMP/stable-outbound.js"
          cp google-apps-script/stable-dr/Code.gs "$RUNNER_TEMP/stable-dr.js"
          node --check "$RUNNER_TEMP/stable-outbound.js"
          node --check "$RUNNER_TEMP/stable-dr.js"
          node -e 'const fs=require("fs"); for (const p of ["google-apps-script/stable-primary-appsscript.json","google-apps-script/stable-outbound/appsscript.json","google-apps-script/stable-dr/appsscript.json"]) JSON.parse(fs.readFileSync(p,"utf8"));'
          grep -q 'spreadsheets.currentonly' google-apps-script/stable-primary-appsscript.json
          grep -q 'spreadsheets.currentonly' google-apps-script/stable-outbound/appsscript.json
          grep -q 'spreadsheets.currentonly' google-apps-script/stable-dr/appsscript.json
          pushd service
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          popd
          pushd services/cloud-dr
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
          npm test
          popd

      - name: Static and Android debug gates
        if: ${{ steps.impact.outputs.app == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          gradle --no-daemon --build-cache --parallel :app:testBetaDebugUnitTest :app:assembleBetaDebug :app:assembleStableDebug

      - name: Validate cloud DR credentials without paid actions
        shell: bash
        run: bash tools/cloud_dr_provider_preflight.sh
