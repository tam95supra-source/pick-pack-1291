name: App fast check

on:
  push:
    branches:
      - agent/**
      - feature/**
    paths:
      - app/**
      - service/**
      - google-apps-script/**
      - tools/deploy_beta76_outbound_gas.sh
      - gradle.properties
      - .github/workflows/app-fast-check.yml
  pull_request:
    paths:
      - app/**
      - service/**
      - google-apps-script/**
      - gradle.properties

permissions:
  contents: read

concurrency:
  group: app-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed inputs
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^ HEAD)
          if grep -Eq '^(app/|service/|google-apps-script/|gradle.properties$)' <<<"$changed"; then
            echo 'code_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(google-apps-script/|tools/deploy_beta76_outbound_gas\.sh$|app/build\.gradle\.kts$|\.github/workflows/app-fast-check\.yml$)' <<<"$changed"; then
            echo 'gas_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'gas_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Focused Beta77 source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 83' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.77"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -Fq 'listOf("Chưa có vị trí")' app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
          ! grep -Fq 'listOf("Chọn vị trí")' app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
          grep -Fq 'optBoolean("owner",false)' app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
          ! grep -Fq 'OWNER_LOGIN' google-apps-script/OUTBOUND_DROP_RECEIVE.gs
          grep -Fq "auth.role||'').toUpperCase()==='SUPERADMIN'" google-apps-script/OUTBOUND_DROP_RECEIVE.gs
          grep -Fq 'PP_OUTBOUND.OWNER_EMAIL' google-apps-script/OUTBOUND_DROP_RECEIVE.gs
          grep -Fq 'OldSessionWarningFeature.build' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -Fq 'old_active_sessions' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          grep -Fq 'FROM resource_leases")' service/src/mobile_hotfix.ts
          grep -Fq 's.business_date<?1' service/src/mobile_hotfix.ts
          grep -Fq 'EXCLUSIVE_RESOURCE_CONFLICT' service/src/core.ts
          grep -Fq 'never attach an intermediate full tree' app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -Fq "action === 'outbound_drop_append'" google-apps-script/PICK_PACK_API.gs
          grep -Fq 'PP_OUTBOUND_LOCATIONS_V1' google-apps-script/OUTBOUND_DROP_RECEIVE.gs
          grep -Fq 'real_data_preserved:true' tools/deploy_beta76_outbound_gas.sh
          grep -Fq "String(p.action||'')==='__beta76_outbound_test'" tools/deploy_beta76_outbound_gas.sh
          grep -Fq -- "-w '%{http_code}'" tools/deploy_beta76_outbound_gas.sh
          git diff --check HEAD^ HEAD

      - name: Resolve current LIVE Apps Script Web App
        id: gas_live
        if: github.ref_name == 'feature/beta77-owner-fixes-20260826' && steps.scope.outputs.gas_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/beta77-gas-discovery
          rm -rf "$D" && mkdir -p "$D"
          for n in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN GAS_SCRIPT_ID; do test -n "${!n:-}"; done
          token_json=$(curl -fsS --connect-timeout 15 --max-time 30 https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token)
          ACCESS_TOKEN=$(jq -r '.access_token // empty' <<<"$token_json")
          test -n "$ACCESS_TOKEN"
          SCRIPT_ID=$(printf '%s' "$GAS_SCRIPT_ID" | tr -d '\r\n\t ')
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$SCRIPT_ID"
          api="https://script.googleapis.com/v1/projects/$SCRIPT_ID"
          curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACCESS_TOKEN" "$api/deployments?pageSize=50" > "$D/deployments.json"
          python3 - "$D/deployments.json" "$D/candidates.tsv" <<'PY'
          import json,sys
          src,out=sys.argv[1:]
          j=json.load(open(src,encoding='utf-8'))
          rows=[]
          for d in j.get('deployments',[]):
              did=str(d.get('deploymentId','')).strip()
              cfg=d.get('deploymentConfig') or {}
              ver=int(cfg.get('versionNumber') or 0)
              for ep in d.get('entryPoints') or []:
                  wa=ep.get('webApp') or {}
                  url=str(wa.get('url','')).strip()
                  ec=wa.get('entryPointConfig') or {}
                  access=str(ec.get('access','')).strip()
                  execute=str(ec.get('executeAs','')).strip()
                  if did and url.startswith('https://script.google.com/macros/s/') and url.endswith('/exec'):
                      rows.append((did,url,ver,access,execute))
          with open(out,'w',encoding='utf-8') as f:
              for r in rows:
                  f.write('\t'.join(map(str,r))+'\n')
          PY
          test -s "$D/candidates.tsv"
          : > "$D/healthy.tsv"
          while IFS=$'\t' read -r did url ver access execute; do
            http=$(curl -sSL --connect-timeout 15 --max-time 30 -o "$D/body-$ver.json" -w '%{http_code}' "$url" || printf '000')
            if [[ "$http" =~ ^2[0-9][0-9]$ ]] && jq -e '.ok==true and .service=="pick-pack-gsheet-api"' "$D/body-$ver.json" >/dev/null 2>&1; then
              printf '%s\t%s\t%s\t%s\t%s\n' "$did" "$url" "$ver" "$access" "$execute" >> "$D/healthy.tsv"
            fi
          done < "$D/candidates.tsv"
          test -s "$D/healthy.tsv"
          IFS=$'\t' read -r LIVE_ID LIVE_URL LIVE_VERSION LIVE_ACCESS LIVE_EXECUTE < <(sort -t$'\t' -k3,3nr "$D/healthy.tsv" | head -n1)
          test -n "$LIVE_ID" && test -n "$LIVE_URL"
          echo "deployment_id=$LIVE_ID" >> "$GITHUB_OUTPUT"
          echo "url=$LIVE_URL" >> "$GITHUB_OUTPUT"
          echo "version=$LIVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "access=$LIVE_ACCESS" >> "$GITHUB_OUTPUT"
          echo "execute_as=$LIVE_EXECUTE" >> "$GITHUB_OUTPUT"
          echo "LIVE_GAS_DEPLOYMENT_ID=$LIVE_ID"
          echo "LIVE_GAS_URL=$LIVE_URL"
          echo "LIVE_GAS_VERSION=$LIVE_VERSION"
          echo "LIVE_GAS_ACCESS=$LIVE_ACCESS"
          echo "LIVE_GAS_EXECUTE_AS=$LIVE_EXECUTE"

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.code_changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          gradle-version: '9.4.1'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          node-version: '22'

      - name: Service typecheck
        if: steps.scope.outputs.code_changed == 'true'
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Android focused tests and Beta/Stable compile isolation
        if: steps.scope.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:testBetaDebugUnitTest :app:assembleBetaDebug :app:assembleStableDebug

      - name: Deploy exact outbound GAS and run live focused gate
        if: github.ref_name == 'feature/beta77-owner-fixes-20260826' && steps.scope.outputs.gas_changed == 'true'
        shell: bash
        env:
          GAS_DEPLOYMENT_ID: ${{ steps.gas_live.outputs.deployment_id }}
        run: |
          set -euo pipefail
          cp tools/deploy_beta76_outbound_gas.sh /tmp/beta77-gas-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/beta77-gas-gate.sh')
          s=p.read_text(encoding='utf-8')
          needle='set -Eeuo pipefail\n'
          inject="set -Eeuo pipefail\ntrap 'rc=$?; printf \"::error title=GAS_GATE_ROOT::line=%s rc=%s\\n\" \"$LINENO\" \"$rc\"; exit \"$rc\"' ERR\n"
          assert s.count(needle)==1
          p.write_text(s.replace(needle,inject,1),encoding='utf-8')
          PY
          bash /tmp/beta77-gas-gate.sh

      - name: Enforce app config points at LIVE GAS
        if: github.ref_name == 'feature/beta77-owner-fixes-20260826' && steps.scope.outputs.gas_changed == 'true'
        shell: bash
        env:
          LIVE_GAS_URL: ${{ steps.gas_live.outputs.url }}
        run: |
          set -euo pipefail
          APP_GAS_URL=$(sed -n 's/^val approvedGsheetApiUrl = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test -n "$APP_GAS_URL"
          if [[ "$APP_GAS_URL" != "$LIVE_GAS_URL" ]]; then
            echo "::error title=APP_CONFIG_MISMATCH::approvedGsheetApiUrl must equal LIVE_GAS_URL"
            echo "APP_GAS_URL=$APP_GAS_URL"
            echo "LIVE_GAS_URL=$LIVE_GAS_URL"
            exit 78
          fi
          echo 'app_gas_config=PASS'

      - name: Upload final outbound GAS evidence
        if: success() && github.ref_name == 'feature/beta77-owner-fixes-20260826' && steps.scope.outputs.gas_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beta77-outbound-gas-final-${{ github.run_id }}
          path: /tmp/beta76-outbound-gas-evidence
          retention-days: 30
          if-no-files-found: error
