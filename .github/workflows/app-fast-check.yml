name: App fast check

on:
  push:
    branches:
      - 'feature/**'
      - 'agent/**'
      - 'release/**'
    paths:
      - app/**
      - service/**
      - services/**
      - google-apps-script/**
      - config/mutation_fallback_policy.json
      - config/provider_free_limits.json
      - tools/resilience_static_gate.mjs
      - tools/document_management_contract.py
      - tools/beta116_owner_scope_contract.py
      - tools/beta117_owner_followup_contract.py
      - tools/beta_stable_isolation_contract.mjs
      - tools/portable_backup_verify.sh
      - tools/d1_generation_autopilot.sh
      - tools/cloud_dr_provider_preflight.sh
      - tools/provider_capacity_inventory.sh
      - tools/adb_stable_guard.sh
      - tools/beta83_verify_matrix.sh
      - tools/Beta83UiChecksInstrumentation.java
      - tools/beta89_back_api36.sh
      - tools/beta89_service_live_gate.sh
      - tools/stable_private_apk_verify.sh
      - tools/ci_release_fencing_contract.py
      - tools/beta_stable_runtime_verify.py
      - tools/beta_domain_prepare.py
      - tools/beta_auth_converge.py
      - tools/beta83_ota_device_gate.sh
      - tools/Beta83UiChecksInstrumentation.java
      - tools/service_discovery_device_gate.sh
      - .github/workflows/beta-release.yml
      - tools/beta83_publish_ota.sh
      - tools/verify_beta_visual_receipt.py
      - qa/**
      - ops/beta-release-request.json
      - ops/promotion-lock-dry-run.json
      - ops/promotion-lock.schema.json
      - tools/verify_promotion_lock.py
      - .github/workflows/app-fast-check.yml
  pull_request:
    paths:
      - app/**
      - service/**
      - services/**
      - google-apps-script/**
      - config/mutation_fallback_policy.json
      - tools/resilience_static_gate.mjs
      - tools/document_management_contract.py
      - qa/**
      - .github/workflows/app-fast-check.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: app-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          SDK="$RUNNER_TEMP/android-sdk";ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools";unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline";mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV";echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Release fencing contracts
        run: |
          python3 tools/ci_release_fencing_contract.py
          python3 tools/beta123_owner_scope_contract.py
          python3 tools/pda_source_master_invariant_contract.py
      - name: Static resilience gates
        run: node tools/resilience_static_gate.mjs
      - name: Document management contract
        run: python3 tools/document_management_contract.py
      - name: Beta116/117 owner contracts
        run: |
          python3 tools/beta116_owner_scope_contract.py
          python3 tools/beta117_owner_followup_contract.py
      - name: Beta Stable isolation contract
        run: node tools/beta_stable_isolation_contract.mjs
      - name: Runtime verifier self-test
        run: |
          python3 -m py_compile tools/beta_stable_runtime_verify.py
          python3 tools/beta_stable_runtime_verify.py --self-test
      - name: OTA verifier self-test
        run: |
          python3 -m py_compile tools/verify_beta_visual_receipt.py tools/gas_ota_static_contract.py
          python3 tools/gas_ota_static_contract.py --self-test
      - name: Android compile and unit tests
        run: gradle --no-daemon --build-cache --parallel :app:compileBetaDebugKotlin :app:compileStableDebugKotlin :app:testBetaDebugUnitTest
      - name: Provider capacity inventory
        run: bash tools/provider_capacity_inventory.sh
      - name: Promotion lock dry-run
        run: python3 tools/verify_promotion_lock.py ops/promotion-lock-dry-run.json
