name: App fast check

on:
  push:
    branches:
      - feature/beta78-old-session-outbound-service-20260826
    paths:
      - app/build.gradle.kts
      - app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
      - app/src/main/java/vn/pickpack1291/app/beta/OldSessionWarningFeature.kt
      - app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
      - service/**
      - tools/beta78_service_live_gate.sh
      - .github/workflows/app-fast-check.yml

permissions:
  contents: read

concurrency:
  group: beta78-service-live-gate
  cancel-in-progress: false

jobs:
  beta78-service-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate Beta78 scope and immutable invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 84' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.78"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -Fq 'historical_session_detail' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          grep -Fq 'outbound_drop_append' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          grep -Fq 'session_id' app/src/main/java/vn/pickpack1291/app/beta/OldSessionWarningFeature.kt
          ! grep -Fq 'onOpen(item.mnv)' app/src/main/java/vn/pickpack1291/app/beta/OldSessionWarningFeature.kt
          grep -Fq 'Service/D1 xác nhận ngay' app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
          grep -Fq 'outbound_replication_outbox' service/migrations/0007_beta78_history_outbound.sql
          grep -Fq 'HISTORICAL_SESSION_OUTSIDE_RETENTION' service/src/historical_beta78.ts
          grep -Fq 'SERVICE_NOT_WRITE_AUTHORITY' service/src/outbound_beta78.ts
          grep -Fq '3/3_SERVICE_D1_EXACT' tools/beta78_service_live_gate.sh
          git diff --check HEAD^ HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck Service
        working-directory: service
        shell: bash
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/beta78-npm.log
          npx tsc --noEmit 2>&1 | tee /tmp/beta78-typecheck.log
          npx wrangler deploy --dry-run --outdir /tmp/beta78-dry-run 2>&1 | tee /tmp/beta78-dry-run.log
          find /tmp/beta78-dry-run -type f -size +0c | grep -q .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Resolve Android SDK and compile Beta78
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" || ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]]; then
            SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
            mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          gradle --no-daemon --build-cache :app:testBetaDebugUnitTest :app:assembleBetaDebug

      - name: Deploy production Service and run exact live gate
        shell: bash
        run: bash tools/beta78_service_live_gate.sh

      - name: Upload Beta78 Service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta78-service-live-${{ github.run_id }}
          path: |
            /tmp/beta78-service-live
            /tmp/beta78-typecheck.log
            /tmp/beta78-dry-run.log
            /tmp/beta78-npm.log
          retention-days: 30
          if-no-files-found: warn
