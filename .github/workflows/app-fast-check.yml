name: App fast check

on:
  push:
    branches:
      - feature/beta78-old-session-outbound-service-20260826
    paths:
      - app/build.gradle.kts
      - app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
      - app/src/main/java/vn/pickpack1291/app/beta/OldSessionWarningFeature.kt
      - app/src/main/java/vn/pickpack1291/app/beta/DropReceiveFeature.kt
      - service/**
      - tools/beta78_service_live_gate.sh
      - .github/workflows/app-fast-check.yml

permissions:
  contents: read

concurrency:
  group: beta78-service-live-gate
  cancel-in-progress: false

jobs:
  beta78-service-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reuse immutable Beta78 receipts
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ HEAD -- app service
          grep -q 'versionCode = 84' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.78"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          git diff --check HEAD^ HEAD
          echo 'service_typecheck=REUSED_PASS run=32974026769 source_unchanged=true'
          echo 'android_compile=REUSED_PASS run=32974026769 source_unchanged=true'
          echo 'historical_3of3=REUSED_PASS run=32975908629 service_source_unchanged=true'
          echo 'google_oauth_sheet_preflight=REUSED_PASS run=32976535806 attempt=2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Service deployment dependencies
        working-directory: service
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Materialize outbound continuation gate
        shell: bash
        run: |
          set -euo pipefail
          cp tools/beta78_service_live_gate.sh /tmp/beta78_outbound_continue.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/beta78_outbound_continue.sh')
          s=p.read_text(encoding='utf-8')
          old_deploy='''npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.live.jsonc 2>&1 | tee "$D/migrations.log"\nnpx wrangler deploy --config wrangler.live.jsonc 2>&1 | tee "$D/deploy.log"\ncurl -fsS "$SERVICE_URL/health" > "$D/health-after.json"\njq -e --arg gen "$GEN" --argjson epoch "$EPOCH" '.ok==true and .environment=="production" and (.generation|tostring)==$gen and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION" and .authority.authority_epoch==$epoch' "$D/health-after.json" >/dev/null\n'''
          new_deploy='''printf '%s' "$GOOGLE_OAUTH_REFRESH_TOKEN" | npx wrangler secret put GOOGLE_OAUTH_REFRESH_TOKEN --config wrangler.live.jsonc > "$D/worker-secret-sync.log"\nsleep 3\necho 'worker_google_refresh_token=SYNCED_FROM_GITHUB_SECRET'\n'''
          if s.count(old_deploy)!=1: raise SystemExit('DEPLOY_BLOCK_ANCHOR_MISSING')
          s=s.replace(old_deploy,new_deploy,1)
          start=s.index('# Exact historical session gate:')
          end=s.index('# OAuth token for conservative Google append+readback baseline')
          s=s[:start] + "# Historical exact gate reused from run 32975908629; source unchanged.\necho 'historical_3of3=REUSED_PASS run=32975908629'\n\n" + s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          bash -n /tmp/beta78_outbound_continue.sh
          grep -Fq 'worker_google_refresh_token=SYNCED_FROM_GITHUB_SECRET' /tmp/beta78_outbound_continue.sh
          grep -Fq 'historical_3of3=REUSED_PASS run=32975908629' /tmp/beta78_outbound_continue.sh

      - name: Sync Worker credential and run outbound live gate
        shell: bash
        run: bash /tmp/beta78_outbound_continue.sh

      - name: Upload Beta78 Service evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta78-service-live-${{ github.run_id }}
          path: /tmp/beta78-service-live
          retention-days: 30
          if-no-files-found: warn
