name: App fast check

on:
  push:
    branches:
      - feature/beta77-owner-fixes-20260826
    paths:
      - tools/beta77_service_live_gate.sh
      - .github/workflows/app-fast-check.yml

permissions:
  contents: read

concurrency:
  group: beta77-service-live-gate
  cancel-in-progress: true

env:
  D1_NAME: pick-pack-1291-service-prod
  TYPECHECK_PASS_SHA: 6ae90b10a942c82c79ff9e0cfc8d0586c6a4ba6c

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Beta77 immutable source and harness gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 83' app/build.gradle.kts
          grep -q 'versionName = "0.4.2-beta.77"' app/build.gradle.kts
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -Fq 'FROM resource_leases")' service/src/mobile_hotfix.ts
          grep -Fq 's.business_date<?1' service/src/mobile_hotfix.ts
          grep -Fq 'EXCLUSIVE_RESOURCE_CONFLICT' service/src/core.ts
          grep -Fq 'cross_day_active_pda_hidden' tools/beta77_service_live_gate.sh
          grep -Fq 'EXCLUSIVE_RESOURCE_CONFLICT' tools/beta77_service_live_gate.sh
          grep -Fq "Path('wrangler.live.jsonc')" tools/beta77_service_live_gate.sh
          ! grep -Fq '/tmp/wrangler.live.jsonc' tools/beta77_service_live_gate.sh
          git diff --check HEAD^ HEAD
          git cat-file -e "$TYPECHECK_PASS_SHA^{commit}"
          git diff --quiet "$TYPECHECK_PASS_SHA" HEAD -- service/
          echo 'service_typecheck_receipt=REUSED_PASS input_service_tree_unchanged=true run=32930560595'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fixed Service deployment dependencies
        working-directory: service
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve exact LIVE Worker and preflight compile/config/health
        id: live
        working-directory: service
        shell: bash
        run: |
          set -euo pipefail
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do test -n "${!n:-}"; done
          D=/tmp/beta77-service-preflight
          rm -rf "$D" && mkdir -p "$D"

          AUTH=$(npx wrangler d1 execute "$D1_NAME" --remote --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1;" --json)
          printf '%s' "$AUTH" > "$D/authority.json"
          GEN=$(node -e 'const j=JSON.parse(process.argv[1]);const r=j?.[0]?.results?.[0];if(!r||r.mode!=="SERVICE_PRIMARY"||r.scope!=="PRODUCTION")process.exit(2);process.stdout.write(String(r.service_generation||""))' "$AUTH")
          test -n "$GEN"

          LIST=$(npx wrangler d1 list --json)
          D1_ID=$(node -e 'const a=JSON.parse(process.argv[1]);const x=a.find(v=>v.name===process.env.D1_NAME);process.stdout.write(x?.uuid||x?.id||"")' "$LIST")
          test -n "$D1_ID"

          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" > "$D/scripts.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > "$D/subdomain.json"
          jq -e '.success==true' "$D/scripts.json" >/dev/null
          jq -e '.success==true and (.result.subdomain|length>0)' "$D/subdomain.json" >/dev/null
          SUBDOMAIN=$(jq -r '.result.subdomain' "$D/subdomain.json")

          : > "$D/healthy.tsv"
          while IFS= read -r name; do
            [[ "$name" == pick-pack-1291* || "$name" == pickpack* ]] || continue
            sd_http=$(curl -sS -o "$D/subdomain-${name}.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name/subdomain" || printf '000')
            [[ "$sd_http" == 200 ]] || continue
            jq -e '.success==true and .result.enabled==true' "$D/subdomain-${name}.json" >/dev/null 2>&1 || continue
            url="https://${name}.${SUBDOMAIN}.workers.dev"
            http=$(curl -sS --connect-timeout 10 --max-time 20 -o "$D/health-${name}.json" -w '%{http_code}' "$url/health" || printf '000')
            if [[ "$http" =~ ^2[0-9][0-9]$ ]] && jq -e --arg gen "$GEN" '.ok==true and .service=="pick-pack-1291-service" and .environment=="production" and (.generation|tostring)==$gen and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' "$D/health-${name}.json" >/dev/null 2>&1; then
              printf '%s\t%s\n' "$name" "$url" >> "$D/healthy.tsv"
            fi
          done < <(jq -r '.result[]? | .id // empty' "$D/scripts.json")
          count=$(wc -l < "$D/healthy.tsv")
          [[ "$count" -eq 1 ]] || { echo "LIVE_WORKER_MATCH_COUNT=$count" >&2; jq -c '.result[]? | {id,modified_on}' "$D/scripts.json" >&2; for f in "$D"/health-*.json; do [[ -e "$f" ]] && { echo "HEALTH_FILE=$f" >&2; jq -c . "$f" >&2 || cat "$f" >&2; }; done; exit 6; }
          IFS=$'\t' read -r LIVE_WORKER_NAME LIVE_SERVICE_URL < "$D/healthy.tsv"
          test -n "$LIVE_WORKER_NAME" && test -n "$LIVE_SERVICE_URL"

          python3 - "$D1_ID" "$GEN" "$LIVE_WORKER_NAME" <<'PY'
          from pathlib import Path
          import sys
          d1,generation,name=sys.argv[1:]
          s=Path('wrangler.jsonc').read_text(encoding='utf-8')
          repls={
            '"name": "pick-pack-1291-service-m1-staging"':f'"name": "{name}"',
            '"SERVICE_GENERATION": "m2-precutover-20260819-001"':f'"SERVICE_GENERATION": "{generation}"',
            '"database_name": "pick-pack-1291-m1-staging"':'"database_name": "pick-pack-1291-service-prod"',
            '"database_id": "__M1_D1_DATABASE_ID__"':f'"database_id": "{d1}"',
          }
          for old,new in repls.items():
              if old not in s: raise SystemExit('PREFLIGHT_CONFIG_ANCHOR_MISSING:'+old)
              s=s.replace(old,new,1)
          Path('wrangler.preflight.jsonc').write_text(s,encoding='utf-8')
          PY

          npx wrangler deploy --dry-run --config wrangler.preflight.jsonc --outdir "$D/dry-run" > "$D/dry-run.log"
          find "$D/dry-run" -type f -size +0c | grep -q .
          curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_SERVICE_URL/health" > "$D/live-health-before.json"
          jq -e --arg gen "$GEN" '.ok==true and .service=="pick-pack-1291-service" and .environment=="production" and (.generation|tostring)==$gen and .authority.mode=="SERVICE_PRIMARY" and .authority.scope=="PRODUCTION"' "$D/live-health-before.json" >/dev/null

          echo "worker_name=$LIVE_WORKER_NAME" >> "$GITHUB_OUTPUT"
          echo "service_url=$LIVE_SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "service_preflight=PASS worker=$LIVE_WORKER_NAME"

      - name: Deploy exact Beta77 Service source and run PDA LIVE regression
        shell: bash
        env:
          LIVE_WORKER_NAME: ${{ steps.live.outputs.worker_name }}
          LIVE_SERVICE_URL: ${{ steps.live.outputs.service_url }}
        run: |
          set -euo pipefail
          test -n "$LIVE_WORKER_NAME" && test -n "$LIVE_SERVICE_URL"
          cp tools/beta77_service_live_gate.sh /tmp/beta77_service_live_gate.sh
          python3 - "$LIVE_WORKER_NAME" <<'PY'
          from pathlib import Path
          import sys
          name=sys.argv[1]
          p=Path('/tmp/beta77_service_live_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='WORKER_NAME=pick-pack-1291-service\n'
          if s.count(old)!=1: raise SystemExit('WORKER_NAME_ANCHOR_MISSING')
          s=s.replace(old,f'WORKER_NAME={name}\n',1)
          old='  \'"name": "pick-pack-1291-service-m1-staging"\':\'"name": "pick-pack-1291-service"\',\n'
          if s.count(old)!=1: raise SystemExit('WORKER_CONFIG_ANCHOR_MISSING')
          s=s.replace(old,f'  \'"name": "pick-pack-1291-service-m1-staging"\':\'"name": "{name}"\',\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          bash /tmp/beta77_service_live_gate.sh

      - name: Upload Beta77 Service live evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beta77-service-live-${{ github.run_id }}
          path: /tmp/beta77-service-live
          retention-days: 30
          if-no-files-found: error
