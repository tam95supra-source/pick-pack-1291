name: App fast check

on:
  push:
    branches:
      - agent/**
      - feature/**
    paths:
      - app/**
      - gradle.properties
  pull_request:
    paths:
      - app/**
      - gradle.properties

permissions:
  contents: read

concurrency:
  group: app-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Static and debug build
        run: |
          set -euo pipefail
          grep -q 'versionCode = 1' app/build.gradle.kts
          grep -q 'versionName = "0.1.0-stable"' app/build.gradle.kts
          gradle --no-daemon --build-cache --parallel :app:assembleBetaDebug :app:assembleStableDebug
