name: Beta118 realtime local-first owner repair

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-realtime-localfirst-fix.yml
      - tools/beta118_realtime_localfirst_fix.py
      - tools/beta118_realtime_localfirst_fix_v2.py
      - tools/beta118_realtime_localfirst_contract.py
      - qa/beta118_realtime_localfirst_regression.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta118-realtime-localfirst-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic local-first repair
        run: python3 tools/beta118_realtime_localfirst_fix_v2.py
      - name: Owner and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/beta118_realtime_localfirst_contract.py
          python3 tools/beta118_owner_followup_contract.py
          python3 tools/beta118_owner_100_sessions_contract.py
          python3 tools/beta117_owner_followup_contract.py
          python3 tools/beta116_owner_scope_contract.py
          git diff --check
      - name: Service typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix service install --ignore-scripts --no-audit --no-fund
          npm --prefix service run check
      - name: Android compile and unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache --parallel :app:testBetaDebugUnitTest :app:assembleBetaDebug
      - name: Commit exact product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt \
            app/src/main/java/vn/pickpack1291/app/beta/OldSessionWarningFeature.kt \
            app/src/main/java/vn/pickpack1291/app/beta/PostMealAttendanceFeature.kt \
            service/src/realtime.ts
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "fix(beta118): make labor and warnings realtime local-first"
          git push origin HEAD:release/beta118-owner-realtime-bulk-exit-20260904
