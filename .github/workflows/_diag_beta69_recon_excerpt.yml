name: Beta69 reconciliation source diagnostic
on:
  push:
    branches: [ release/beta69-owner-six-fixes-20260825 ]
    paths: [ 'ops/TRIGGER_BETA69_RECON_EXCERPT.txt' ]
permissions:
  contents: write
jobs:
  excerpt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize through Beta68
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_beta64_owner_seven_fixes.py
          python3 tools/apply_beta64_compile_fix.py
          python3 tools/apply_beta65_session_resource_login_parity.py
          python3 tools/apply_beta65_behavior_compile_fix.py
          python3 tools/apply_beta65_scope_compile_fix.py
          python3 tools/apply_beta65_login_reference_finish.py
          python3 tools/apply_beta66_login_fullframe.py
          python3 tools/apply_beta68_owner_five_fixes.py
      - name: Extract exact reconciliation function
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt')
          s=p.read_text()
          sig='    private fun addBusinessShiftReconciliation(body:LinearLayout)'
          a=s.find(sig)
          if a<0: raise SystemExit('function missing')
          b=s.find('\n    private fun ',a+len(sig))
          if b<0:b=len(s)
          Path('ops/beta69-recon-excerpt.txt').write_text(s[a:b])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta69-recon-excerpt.txt
          git commit -m 'ops: capture Beta68 reconciliation function for Beta69 fix'
          git push origin HEAD:release/beta69-owner-six-fixes-20260825
