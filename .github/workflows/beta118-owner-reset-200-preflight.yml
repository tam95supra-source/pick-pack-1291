name: Beta118 owner reset 200 preflight

on:
  push:
    branches:
      - release/beta118-owner-realtime-bulk-exit-20260904
    paths:
      - .github/workflows/beta118-owner-reset-200-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install wrangler
        run: npm --prefix service install --ignore-scripts --no-audit --no-fund
      - name: Fresh-read authority, schema and exact cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Bangkok date +%F)
          test "$TODAY" = "2026-09-04"
          YDAY=$(TZ=Asia/Bangkok date -d 'yesterday' +%F)
          test "$YDAY" = "2026-09-03"
          npx --prefix service wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1; SELECT business_date,COUNT(*) n FROM attendance_sessions WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT business_date,COUNT(*) n FROM labor_sessions WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT business_date,COUNT(*) n FROM post_meal_attendance WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT business_date,COUNT(*) n FROM post_meal_attendance_audit WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT business_date,COUNT(*) n FROM resource_daily_consumption WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT business_date,COUNT(*) n FROM resource_leases WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT business_date,COUNT(*) n FROM events WHERE business_date IN ('$YDAY','$TODAY') GROUP BY business_date ORDER BY business_date; SELECT COUNT(*) n FROM employees; SELECT COUNT(*) n FROM employees e WHERE NOT EXISTS(SELECT 1 FROM attendance_sessions s WHERE s.mnv=e.mnv AND s.state='ACTIVE' AND s.business_date NOT IN ('$YDAY','$TODAY'));" > /tmp/preflight.json
          python3 - <<'PY'
          import json,sys
          raw=json.load(open('/tmp/preflight.json'))
          rows=[]
          def walk(x):
            if isinstance(x,dict):
              if isinstance(x.get('results'),list): rows.extend(v for v in x['results'] if isinstance(v,dict))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(raw)
          auth=next((r for r in rows if 'authority_epoch' in r and 'authority_seq' in r),None)
          if not auth or auth.get('mode')!='SERVICE_PRIMARY' or auth.get('scope')!='PRODUCTION' or int(auth.get('authority_epoch',0))!=9:
            raise SystemExit('AUTHORITY_FENCE_FAILED:'+repr(auth))
          eligible=[r for r in rows if set(r.keys())=={'n'}]
          if not eligible or int(eligible[-1]['n'])<200: raise SystemExit('NOT_ENOUGH_ELIGIBLE_EMPLOYEES')
          print('PREFLIGHT_PASS authority=',auth,'eligible_no_other_active=',eligible[-1]['n'])
          for r in rows: print(r)
          PY
      - name: Show pending owner acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          grep -nE 'PENDING_BETA117_ITEM_[1-8]_OF_8|PENDING_BETA118|TECHNICAL_PASS_AWAITING_OWNER' qa/stable_invariants.yml | tail -n 80 || true
