name: Beta120 owner reset 200 preflight

on:
  push:
    branches:
      - release/beta120-bulk-exit-reset200-20260904
    paths:
      - .github/workflows/beta118-owner-reset-200-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      D1_NAME: pick-pack-1291-service-prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install wrangler
        run: npm --prefix service install --ignore-scripts --no-audit --no-fund
      - name: Fresh-read authority, today-only scope and role capacity
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Bangkok date +%F)
          test "$TODAY" = "2026-09-04"
          npx --prefix service wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1; SELECT state,shift,COUNT(*) n FROM attendance_sessions WHERE business_date='$TODAY' GROUP BY state,shift ORDER BY state,shift; SELECT state,COUNT(*) n FROM labor_sessions WHERE business_date='$TODAY' GROUP BY state ORDER BY state; SELECT COUNT(*) eligible_no_other_active FROM employees e WHERE COALESCE(e.site,'')='1291' AND NOT EXISTS(SELECT 1 FROM attendance_sessions s WHERE s.mnv=e.mnv AND s.state='ACTIVE' AND s.business_date<> '$TODAY'); SELECT UPPER(TRIM(COALESCE(main_position,''))) position,COUNT(*) n FROM employees WHERE COALESCE(site,'')='1291' GROUP BY UPPER(TRIM(COALESCE(main_position,''))) ORDER BY n DESC,position; SELECT COUNT(*) pending_today_outbox FROM sheet_replication_outbox o JOIN events e ON e.event_id=o.event_id WHERE e.business_date='$TODAY' AND e.entity_type IN ('ATTENDANCE_SESSION','LABOR_SESSION','POST_MEAL_ATTENDANCE') AND o.status<>'SYNCED';" > /tmp/preflight.json
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/preflight.json'))
          rows=[]
          def walk(x):
            if isinstance(x,dict):
              if isinstance(x.get('results'),list): rows.extend(v for v in x['results'] if isinstance(v,dict))
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          walk(raw)
          auth=next((r for r in rows if 'authority_epoch' in r),None)
          if not auth or auth.get('mode')!='SERVICE_PRIMARY' or auth.get('scope')!='PRODUCTION' or int(auth.get('authority_epoch',0))!=9:
            raise SystemExit('AUTHORITY_FENCE_FAILED:'+repr(auth))
          eligible=next((r for r in rows if 'eligible_no_other_active' in r),None)
          if not eligible or int(eligible['eligible_no_other_active'])<200:
            raise SystemExit('NOT_ENOUGH_ELIGIBLE_EMPLOYEES:'+repr(eligible))
          pending=next((r for r in rows if 'pending_today_outbox' in r),None)
          if pending is None: raise SystemExit('OUTBOX_READBACK_MISSING')
          print('PREFLIGHT_PASS authority=',auth,'eligible=',eligible['eligible_no_other_active'],'pending_today_outbox=',pending['pending_today_outbox'])
          print('TODAY_AND_POSITION_ROWS')
          for r in rows:
            if r is not auth and r is not eligible and r is not pending: print(r)
          PY
