name: Beta65 PostDrive Finalize

on:
  pull_request:
    branches: [ agent/beta64-owner-seven-fixes-20260824 ]
    paths:
      - 'ops/beta65-postdrive-finalize-trigger.txt'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: beta65-postdrive-finalize
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: 1e8fb8255f26ad58c9719d99c27c08ef5d597cbf
  SOURCE_GATE_RUN: '32697993454'
  CANDIDATE_RUN_ID: '32701275784'
  CANDIDATE_JOB_ID: '97353121085'
  CANDIDATE_ARTIFACT_ID: '9510636863'
  TARGET_VERSION: 0.4.2-beta.65
  TARGET_CODE: '71'
  FROM_VERSION: 0.4.2-beta.64
  APK_NAME: pick-pack-1291-public-beta-0.4.2-beta.65.apk
  EXPECTED_SHA: be728cd8d20d6033becbfb169db89565f6078a681d47bc9079f98f9f5758e1da
  EXPECTED_SIZE: '13097861'
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  DRIVE_APK_ID: 1F2Xu0PQ7tiIWcNDlz9yUTsXBee6RWP39
  DRIVE_SUM_ID: 12iSOQ-AwToKY74ylGa4Wb5iVnQXdF8RC
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pickpack1291.cc.cd
  CANONICAL_SERVICE_URL: https://pickpack.1291.workers.dev
  TAG: v0.4.2-beta.65-publicbeta

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Finalize exact Beta65 release
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence /tmp/candidate
          fail(){ echo "FAILED_PHASE=$1" >&2; exit 1; }
          R=/tmp/evidence/receipt.txt
          download_drive(){
            local id="$1" out="$2" first="${out}.first" confirm
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "https://drive.google.com/uc?export=download&id=$id" -o "$first" || return 1
            if file "$first" | grep -qi 'HTML'; then
              DRIVE_FILE_ID="$id" DRIVE_FIRST="$first" python3 - <<'PY' > "${out}.url" || return 2
          from pathlib import Path
          import html,re,os,urllib.parse
          s=Path(os.environ['DRIVE_FIRST']).read_text(errors='ignore')
          action=re.search(r'<form[^>]+id="download-form"[^>]+action="([^"]+)"',s)
          vals={k:html.unescape(v) for k,v in re.findall(r'<input[^>]+type="hidden"[^>]+name="([^"]+)"[^>]+value="([^"]*)"',s)}
          assert action and vals.get('id')==os.environ['DRIVE_FILE_ID'] and vals.get('confirm'), vals
          print(html.unescape(action.group(1))+'?'+urllib.parse.urlencode(vals))
          PY
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 240 "$(cat "${out}.url")" -o "$out" || return 3
            else cp "$first" "$out"; fi
          }

          echo '=== IMMUTABLE CANDIDATE ==='
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" -o /tmp/candidate.zip
          unzip -q /tmp/candidate.zip -d /tmp/candidate
          APK=/tmp/candidate/$APK_NAME; SUM=/tmp/candidate/SHA256SUMS-$TARGET_VERSION.txt; META=/tmp/candidate/BETA65_CANDIDATE_RECEIPT.txt
          test -s "$APK" && test -s "$SUM" && test -s "$META" || fail CANDIDATE_FILES
          test "$(sha256sum "$APK"|awk '{print $1}')" = "$EXPECTED_SHA" || fail CANDIDATE_SHA
          test "$(stat -c '%s' "$APK")" = "$EXPECTED_SIZE" || fail CANDIDATE_SIZE
          grep -qx "$EXPECTED_SHA  $APK_NAME" "$SUM" || fail CANDIDATE_SUM
          BT=/usr/local/lib/android/sdk/build-tools/36.0.0
          "$BT/aapt" dump badging "$APK" > /tmp/evidence/candidate-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/evidence/candidate-cert.txt
          grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$TARGET_CODE' versionName='$TARGET_VERSION'" /tmp/evidence/candidate-badging.txt || fail CANDIDATE_IDENTITY
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/evidence/candidate-cert.txt|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]')
          test "$CERT" = "$EXPECTED_SIGNER_SHA256" || fail CANDIDATE_SIGNER

          echo '=== DRIVE CONNECTOR EXACT READBACK ==='
          download_drive "$DRIVE_APK_ID" /tmp/evidence/drive-public.apk || fail DRIVE_PUBLIC_DOWNLOAD
          test "$(sha256sum /tmp/evidence/drive-public.apk|awk '{print $1}')" = "$EXPECTED_SHA" || fail DRIVE_PUBLIC_SHA
          test "$(stat -c '%s' /tmp/evidence/drive-public.apk)" = "$EXPECTED_SIZE" || fail DRIVE_PUBLIC_SIZE
          download_drive "$DRIVE_SUM_ID" /tmp/evidence/drive-public-sum.txt || fail DRIVE_SUM_DOWNLOAD
          grep -qx "$EXPECTED_SHA  $APK_NAME" /tmp/evidence/drive-public-sum.txt || fail DRIVE_SUM_CONTENT

          echo '=== SERVICE + GAS LIVE ==='
          live=false
          for i in $(seq 1 20); do
            sc=$(curl -sSL --connect-timeout 15 --max-time 60 -o /tmp/evidence/service-health.json -w '%{http_code}' "$SERVICE_URL/health" || true)
            cc=$(curl -sSL --connect-timeout 15 --max-time 60 -o /tmp/evidence/canonical-health.json -w '%{http_code}' "$CANONICAL_SERVICE_URL/health" || true)
            gc=$(curl -sSL --connect-timeout 15 --max-time 60 -o /tmp/evidence/discovery.json -w '%{http_code}' -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"service_discovery\",\"_app_channel\":\"BETA\",\"_app_version\":\"$TARGET_VERSION\",\"_device_id\":\"ci-beta65-final\"}" || true)
            if test "$sc" = 200 && test "$cc" = 200 && test "$gc" = 200 && python3 - <<'PY'
          import json
          h=json.load(open('/tmp/evidence/service-health.json')); c=json.load(open('/tmp/evidence/canonical-health.json')); g=json.load(open('/tmp/evidence/discovery.json'))
          def okh(x):
              a=x.get('authority') or {}; r=x.get('replication') or {}
              return x.get('ok') is True and a.get('mode')=='SERVICE_PRIMARY' and a.get('scope')=='PRODUCTION' and r.get('state')=='HEALTHY' and int(r.get('pending_count',0))==0
          good=okh(h) and okh(c) and g.get('ok') is True and g.get('authority_mode')=='SERVICE_PRIMARY'
          raise SystemExit(0 if good else 1)
          PY
            then live=true; break; fi
            sleep 3
          done
          test "$live" = true || fail LIVE_DISCOVERY

          echo '=== OTA BETA64 TO BETA65 ==='
          ota=false
          for i in $(seq 1 30); do
            code=$(curl -sSL --connect-timeout 20 --max-time 90 -o /tmp/evidence/update-from.json -w '%{http_code}' -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$FROM_VERSION\"}" || true)
            if test "$code" = 200 && python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/evidence/update-from.json')); a=j.get('available',j.get('update_available')); v=str(j.get('version_name',j.get('version',''))); u=j.get('apk_url') or j.get('download_url') or j.get('url') or ''
          good=j.get('ok') is True and a is True and j.get('channel')=='BETA' and j.get('source')=='GOOGLE_DRIVE' and v==os.environ['TARGET_VERSION'] and str(j.get('sha256','')).lower()==os.environ['EXPECTED_SHA'] and str(j.get('size',''))==os.environ['EXPECTED_SIZE'] and bool(u)
          raise SystemExit(0 if good else 1)
          PY
            then ota=true; break; fi
            sleep 4
          done
          test "$ota" = true || { cat /tmp/evidence/update-from.json || true; fail OTA_DISCOVERY; }
          URL=$(python3 - <<'PY'
          import json
          j=json.load(open('/tmp/evidence/update-from.json')); print(j.get('apk_url') or j.get('download_url') or j.get('url') or '')
          PY
          )
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 240 "$URL" -o /tmp/evidence/ota-first.bin
          if test "$(sha256sum /tmp/evidence/ota-first.bin|awk '{print $1}')" = "$EXPECTED_SHA"; then cp /tmp/evidence/ota-first.bin /tmp/evidence/ota.apk; else OTA_FIRST=/tmp/evidence/ota-first.bin python3 - <<'PY' > /tmp/evidence/ota-confirm-url.txt || fail OTA_CONFIRM_PARSE
          from pathlib import Path
          import html,re,os,urllib.parse
          s=Path(os.environ['OTA_FIRST']).read_text(errors='ignore'); action=re.search(r'<form[^>]+id="download-form"[^>]+action="([^"]+)"',s); vals={k:html.unescape(v) for k,v in re.findall(r'<input[^>]+type="hidden"[^>]+name="([^"]+)"[^>]+value="([^"]*)"',s)}; assert action and vals.get('confirm'),vals; print(html.unescape(action.group(1))+'?'+urllib.parse.urlencode(vals))
          PY
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 240 "$(cat /tmp/evidence/ota-confirm-url.txt)" -o /tmp/evidence/ota.apk
          fi
          test "$(sha256sum /tmp/evidence/ota.apk|awk '{print $1}')" = "$EXPECTED_SHA" || fail OTA_SHA
          test "$(stat -c '%s' /tmp/evidence/ota.apk)" = "$EXPECTED_SIZE" || fail OTA_SIZE
          "$BT/aapt" dump badging /tmp/evidence/ota.apk > /tmp/evidence/ota-badging.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/evidence/ota.apk > /tmp/evidence/ota-cert.txt
          grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$TARGET_CODE' versionName='$TARGET_VERSION'" /tmp/evidence/ota-badging.txt || fail OTA_IDENTITY
          OCERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/evidence/ota-cert.txt|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]')
          test "$OCERT" = "$EXPECTED_SIGNER_SHA256" || fail OTA_SIGNER

          echo '=== SELF NO UPDATE + STABLE ISOLATION ==='
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"update_check\",\"channel\":\"BETA\",\"current_version\":\"$TARGET_VERSION\"}" > /tmp/evidence/update-self.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' > /tmp/evidence/stable-route.json
          python3 - <<'PY' || exit 31
          import json
          b=json.load(open('/tmp/evidence/update-self.json')); s=json.load(open('/tmp/evidence/stable-route.json'))
          ba=b.get('available',b.get('update_available')); sa=s.get('available',s.get('update_available'))
          assert b.get('ok') is True and b.get('channel')=='BETA' and ba is False,b
          assert s.get('ok') is True and s.get('channel')=='STABLE' and sa is False,s
          PY

          echo '=== GITHUB PRERELEASE EXACT BYTES ==='
          cat > /tmp/release-notes.txt <<EOF
          Beta65 public beta release.
          PP_PRODUCT_SOURCE_SHA=$PRODUCT_SOURCE_SHA
          PP_SHA256=$EXPECTED_SHA
          PP_SIZE=$EXPECTED_SIZE
          PP_SIGNER_SHA256=$EXPECTED_SIGNER_SHA256
          PP_APK_NAME=$APK_NAME
          PP_OTA_SOURCE=GOOGLE_DRIVE
          PP_STABLE_PUBLISH=FORBIDDEN
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.txt --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$PRODUCT_SOURCE_SHA" --title "Pick Pack 1291 $TARGET_VERSION" --notes-file /tmp/release-notes.txt --prerelease
          fi
          gh release upload "$TAG" "$APK#$APK_NAME" "$SUM#$(basename "$SUM")" --repo "$GITHUB_REPOSITORY" --clobber
          RURL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 240 "$RURL" -o /tmp/evidence/github-release.apk
          test "$(sha256sum /tmp/evidence/github-release.apk|awk '{print $1}')" = "$EXPECTED_SHA" || fail GITHUB_RELEASE_SHA
          test "$(stat -c '%s' /tmp/evidence/github-release.apk)" = "$EXPECTED_SIZE" || fail GITHUB_RELEASE_SIZE

          echo '=== FINAL HEALTH ==='
          curl -fsSL "$SERVICE_URL/health" > /tmp/evidence/service-final.json
          curl -fsSL "$CANONICAL_SERVICE_URL/health" > /tmp/evidence/canonical-final.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d "{\"action\":\"service_discovery\",\"_app_channel\":\"BETA\",\"_app_version\":\"$TARGET_VERSION\",\"_device_id\":\"ci-beta65-final-after-release\"}" > /tmp/evidence/discovery-final.json
          python3 - <<'PY' || exit 41
          import json
          for p in ['/tmp/evidence/service-final.json','/tmp/evidence/canonical-final.json']:
              j=json.load(open(p)); a=j.get('authority') or {}; r=j.get('replication') or {}; assert j.get('ok') is True and a.get('mode')=='SERVICE_PRIMARY' and a.get('scope')=='PRODUCTION' and r.get('state')=='HEALTHY' and int(r.get('pending_count',0))==0,j
          g=json.load(open('/tmp/evidence/discovery-final.json')); assert g.get('ok') is True and g.get('authority_mode')=='SERVICE_PRIMARY',g
          PY

          cat > /tmp/final-receipt.txt <<EOF
          release=Beta65
          product_source_sha=$PRODUCT_SOURCE_SHA
          source_gate_run=$SOURCE_GATE_RUN
          signed_run_id=$CANDIDATE_RUN_ID
          signed_job_id=$CANDIDATE_JOB_ID
          artifact_id=$CANDIDATE_ARTIFACT_ID
          package=$EXPECTED_PACKAGE
          version_name=$TARGET_VERSION
          version_code=$TARGET_CODE
          signer_sha256=$EXPECTED_SIGNER_SHA256
          apk_file=$APK_NAME
          apk_sha256=$EXPECTED_SHA
          apk_size=$EXPECTED_SIZE
          drive_apk_id=$DRIVE_APK_ID
          drive_checksum_id=$DRIVE_SUM_ID
          drive_readback_exact=PASS
          gas=PASS
          ota_beta64_to_beta65=PASS
          beta65_self_no_update=PASS
          stable_identity=0.1.0-stable/VC1
          stable_publish=FORBIDDEN
          stable_isolation=PASS
          github_prerelease=$TAG
          github_release_readback=PASS
          final_health=PASS
          receipt=PASS
          handover=PASS
          verdict=PASS
          EOF
          cat > /tmp/final-handover.md <<EOF
          # PICK PACK 1291 — CUMULATIVE HANDOVER BETA65 — 2026-08-24

          ## Final public Beta
          - Version: **$TARGET_VERSION / VC$TARGET_CODE**
          - Package: \`$EXPECTED_PACKAGE\`
          - Product source SHA: \`$PRODUCT_SOURCE_SHA\`
          - Source validation run: \`$SOURCE_GATE_RUN\`
          - Signed run/job: \`$CANDIDATE_RUN_ID / $CANDIDATE_JOB_ID\`
          - Immutable artifact ID: \`$CANDIDATE_ARTIFACT_ID\`
          - APK: \`$APK_NAME\`
          - APK SHA256: \`$EXPECTED_SHA\`
          - APK bytes: \`$EXPECTED_SIZE\`
          - Signer SHA256: \`$EXPECTED_SIGNER_SHA256\`
          - Drive APK ID: \`$DRIVE_APK_ID\`
          - Drive checksum ID: \`$DRIVE_SUM_ID\`
          - GitHub prerelease: \`$TAG\`

          ## Final release gates
          SOURCE_PASS; TEST_PASS; COMPILE_PASS; SIGNED_ARTIFACT_PASS; SIGNED_IDENTITY_PASS; DRIVE_PASS; DRIVE_READBACK_EXACT_PASS; GAS_PASS; OTA_BETA64_TO_BETA65_PASS; BETA65_SELF_NO_UPDATE_PASS; STABLE_ISOLATION_PASS; FINAL_HEALTH_PASS; RECEIPT_PASS; HANDOVER_PASS.

          ## Hard locks
          Stable remains **0.1.0-stable / VC1** and Stable publication remains **FORBIDDEN**. Production signer is unchanged. Exact artifact \`$CANDIDATE_ARTIFACT_ID\` was reused downstream without rebuild/resign. Service authority remains **SERVICE_PRIMARY / PRODUCTION** and replication is HEALTHY.

          ## Drive / OTA
          Exact connector-published Drive APK was read back and hashed to \`$EXPECTED_SHA\` at \`$EXPECTED_SIZE\` bytes. GAS BETA update from \`$FROM_VERSION\` resolves to \`$TARGET_VERSION\`; exact OTA bytes, Android identity and signer all PASS. \`$TARGET_VERSION\` self-check returns no update. Stable self-check returns no update.
          EOF

          git fetch origin agent/beta65-session-resource-login-parity-20260824
          git checkout -B agent/beta65-session-resource-login-parity-20260824 origin/agent/beta65-session-resource-login-parity-20260824
          cp /tmp/final-receipt.txt ops/BETA65_RELEASE_RECEIPT.txt
          cp /tmp/final-handover.md PICK_PACK_1291_CUMULATIVE_HANDOVER_BETA65_2026-08-24.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/BETA65_RELEASE_RECEIPT.txt PICK_PACK_1291_CUMULATIVE_HANDOVER_BETA65_2026-08-24.md
          git diff --cached --quiet || git commit -m 'release: record Beta65 final receipt and cumulative handover'
          git pull --rebase origin agent/beta65-session-resource-login-parity-20260824
          git push origin HEAD:agent/beta65-session-resource-login-parity-20260824

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta65-postdrive-final-evidence
          path: /tmp/evidence
          retention-days: 14
          if-no-files-found: warn
