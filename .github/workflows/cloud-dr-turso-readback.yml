name: Cloud DR Turso readback
on:
  push:
    branches:
      - 'release/audit-beta104-stable-private-20260831'
    paths:
      - .github/workflows/cloud-dr-turso-readback.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: cloud-dr-turso-readback
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Turso inventory without mutation
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request,pathlib
          token=os.environ.get("TURSO_API_TOKEN","").strip()
          if not token: raise SystemExit("MISSING_REQUIRED:TURSO_API_TOKEN")
          print("::add-mask::"+token)
          base="https://api.turso.tech/v1"
          def req(url):
              r=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"PickPack1291-DR-Readback/1"})
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      raw=x.read().decode("utf-8","replace"); return x.status,(json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try:j=json.loads(raw)
                  except:j={"raw":raw[:300]}
                  return e.code,j
          cand=[]
          explicit=os.environ.get("TURSO_ORGANIZATION","").strip()
          if explicit:cand.append(explicit)
          try:
              p=token.split(".")[1]; p+="="*((4-len(p)%4)%4); j=json.loads(base64.urlsafe_b64decode(p.encode()).decode())
              for k in ("organization_slug","organizationSlug","organization","org","org_slug","o"):
                  v=str(j.get(k) or "").strip()
                  if v:cand.append(v)
          except Exception:pass
          gh=os.environ.get("GITHUB_REPOSITORY","")
          if gh:cand += [gh.split("/",1)[0],gh.split("/",1)[-1]]
          actor=os.environ.get("GITHUB_ACTOR","").strip()
          if actor:cand.append(actor)
          c,j=req(base+"/organizations")
          if c==200:
              rows=j if isinstance(j,list) else j.get("organizations",[])
              cand += [str(x.get("slug") or "").strip() for x in rows if isinstance(x,dict)]
          org=None; dbs=None; seen=set()
          for x in cand:
              if not x or x in seen:continue
              seen.add(x)
              c,j=req(base+"/organizations/"+urllib.parse.quote(x,safe="")+"/databases?limit=100")
              if c==200 and isinstance(j.get("databases"),list):
                  org=x; dbs=j["databases"]; break
          if org is None: raise SystemExit("TURSO_ORG_UNRESOLVED")
          def pick(d):
              return {
                  "name": d.get("Name") or d.get("name"),
                  "group": d.get("group"),
                  "id": d.get("DbId") or d.get("id"),
                  "hostname": d.get("Hostname") or d.get("hostname"),
              }
          out={"status":"PASS","provider":"TURSO","organization":org,"database_count":len(dbs),"databases":[pick(d) for d in dbs],
               "beta_target_present":any((d.get("Name") or d.get("name"))=="pick-pack-1291-dr-beta" for d in dbs),
               "stable_target_present":any((d.get("Name") or d.get("name"))=="pick-pack-1291-dr-stable" for d in dbs),
               "mutation":False}
          pathlib.Path("/tmp/turso-readback.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps({"status":"PASS","database_count":out["database_count"],"beta_target_present":out["beta_target_present"],"stable_target_present":out["stable_target_present"]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-dr-turso-readback-${{ github.run_id }}
          path: /tmp/turso-readback.json
          retention-days: 30
          if-no-files-found: error
