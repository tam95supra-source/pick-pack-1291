name: Owner R5 recover exact Beta128 now
on:
  push:
    branches: [release/beta130-r5-rev6-20260906]
    paths:
      - .github/workflows/owner-r5-beta128-recovery-now.yml
permissions:
  contents: read
concurrency:
  group: owner-r5-production-service-writer
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bootstrap and recover exact canonical base
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          test "$(jq -r '.owner_scope' ops/beta-release-request.json)" = "OWNER_20260906_R5_QUOTA_REALTIME"
          test "$(jq -r '.owner_checklist_revision' ops/beta-release-request.json)" = "6"
          test "$(jq -r '.base_version' ops/beta-release-request.json)" = "0.4.2-beta.128"
          test "$(jq -r '.live' ops/beta-release-request.json)" = "false"
          export BASE_SERVICE_SOURCE_SHA="$(jq -er '.base_source_sha' ops/beta-release-request.json)"
          export R5_RECOVERY_DIR=/tmp/r5-beta128-recovery-now
          bash tools/r5_exact_base_service_recovery.sh
      - name: Upload recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-beta128-recovery-now-${{ github.run_id }}
          path: /tmp/r5-beta128-recovery-now
          retention-days: 30
          if-no-files-found: error
