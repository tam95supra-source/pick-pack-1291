name: Beta55 OTA Release Rescue

on:
  push:
    branches: [ stabilization/beta48-golden-reset-beta50-20260822 ]
    paths:
      - 'ops/beta55-release-rescue-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: beta55-signed-ota-release
  cancel-in-progress: false

env:
  BETA_NAME: 0.4.2-beta.55
  BETA_CODE: '61'
  STABLE_NAME: 0.1.0-stable
  STABLE_CODE: '1'
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  SERVICE_URL: https://pick-pack-1291-service.pp1291-d79b87776e86.workers.dev
  STABILIZATION_BRANCH: stabilization/beta48-golden-reset-beta50-20260822

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish observable run receipt immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/obs <<EOF
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          workflow=BETA55_RELEASE_RESCUE
          status=RUNNING
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          python3 - <<'PY' >/tmp/upsert.py
          print('')
          PY
          API="repos/$GITHUB_REPOSITORY/contents/ops/beta55-release-rescue-observer.txt"
          sha=$(gh api "$API?ref=$STABILIZATION_BRANCH" --jq .sha 2>/dev/null || true)
          content=$(base64 -w0 /tmp/obs)
          if [[ -n "$sha" ]]; then gh api -X PUT "$API" -f message='ops: observe Beta55 rescue run' -f content="$content" -f sha="$sha" -f branch="$STABILIZATION_BRANCH" >/dev/null
          else gh api -X PUT "$API" -f message='ops: observe Beta55 rescue run' -f content="$content" -f branch="$STABILIZATION_BRANCH" >/dev/null; fi

      - name: Lock all owner gates and inspect existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'versionCode = 61' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.2-beta.55"' app/build.gradle.kts
          grep -Fq 'versionCode = 1' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.0-stable"' app/build.gradle.kts
          grep -Fq 'S58_BETA55_GOOGLE_FALLBACK' app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt
          grep -Fq 'GOOGLE_RELAY_TEST' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          OPS=app/src/main/java/vn/pickpack1291/app/beta/OperationsActivity.kt
          grep -Fq '"Quản lý biên bản"' "$OPS"; grep -Fq 'Quản lý biên bản đang chờ xây dựng.' "$OPS"
          ! grep -Fq 'Người dùng đang kết nối' "$OPS"; ! grep -Fq 'mục chờ gửi' "$OPS"
          for x in 'THÔNG TIN TRÊN PDA' 'THÔNG TIN TRÊN SERVICE' 'THÔNG TIN TRÊN GOOGLE SHEET' 'THÔNG TIN ĐỒNG BỘ KHÁC' 'THÔNG TIN ỨNG DỤNG'; do grep -Fq "$x" "$OPS"; done
          code=$(curl -sS --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 45 -o /tmp/health.json -w '%{http_code}' "$SERVICE_URL/health")
          [[ "$code" == 200 ]]
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json'));a=j.get('authority') or {};r=j.get('replication') or {}
          assert j.get('ok') is True and a.get('mode')=='SERVICE_PRIMARY' and a.get('scope')=='PRODUCTION',j
          assert r.get('state')=='HEALTHY' and int(r.get('pending_count',-1))==0,r
          PY
          TAG="v${BETA_NAME}-publicbeta"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,assets,url,targetCommitish > /tmp/release.json 2>/dev/null; then
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json,re
          j=json.load(open('/tmp/release.json'));b=j.get('body') or ''
          def g(k):
              m=re.search(r'^'+re.escape(k)+r'=(.*)$',b,re.M);return (m.group(1).strip() if m else '')
          assert g('PP_VERSION')=='0.4.2-beta.55',g('PP_VERSION')
          assert g('PP_VERSION_CODE')=='61',g('PP_VERSION_CODE')
          assert g('PP_SIGNER_SHA256').lower()=='d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e'
          sha=g('PP_SHA256').lower();size=g('PP_SIZE');name=g('PP_APK_NAME')
          assert re.fullmatch(r'[0-9a-f]{64}',sha) and size.isdigit() and name=='pick-pack-1291-public-beta-0.4.2-beta.55.apk'
          print('EXISTING_RELEASE=true');print('FINAL_SHA='+sha);print('FINAL_SIZE='+size);print('FINAL_APK_NAME='+name)
          print('FINAL_URL=https://github.com/tam95supra-source/pick-pack-1291/releases/download/v0.4.2-beta.55-publicbeta/'+name)
          PY
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'pick-pack-1291-public-beta-0.4.2-beta.55.apk' -D /tmp/existing
            [[ "$(sha256sum /tmp/existing/pick-pack-1291-public-beta-0.4.2-beta.55.apk|awk '{print $1}')" == "$(grep '^FINAL_SHA=' "$GITHUB_ENV"|tail -1|cut -d= -f2)" ]]
          else
            echo 'EXISTING_RELEASE=false' >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        if: env.EXISTING_RELEASE != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.EXISTING_RELEASE != 'true'
        with:
          gradle-version: '9.4.1'
          cache-read-only: true

      - name: Resolve Android SDK 36
        if: env.EXISTING_RELEASE != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -f "$ANDROID_HOME/platforms/android-36/android.jar" && -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" && -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"; exit 0; fi
          SDK="$RUNNER_TEMP/android-sdk"; ZIP="$RUNNER_TEMP/commandlinetools.zip"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          mkdir -p "$SDK/cmdline-tools"; unzip -q "$ZIP" -d "$RUNNER_TEMP/android-cmdline"; mv "$RUNNER_TEMP/android-cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build sign and verify new Beta55 candidate
        id: sign
        if: env.EXISTING_RELEASE != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --build-cache --parallel :app:assembleBetaRelease :app:assembleStableRelease
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"; BETA=app/build/outputs/apk/beta/release/app-beta-release-unsigned.apk; STABLE=app/build/outputs/apk/stable/release/app-stable-release-unsigned.apk
          test -s "$BETA"; test -s "$STABLE"
          "$BT/aapt" dump badging "$BETA" >/tmp/beta; "$BT/aapt" dump badging "$STABLE" >/tmp/stable
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/beta; grep -q "versionCode='$BETA_CODE'" /tmp/beta; grep -q "versionName='$BETA_NAME'" /tmp/beta
          grep -q "package: name='vn.pickpack1291.app.stable'" /tmp/stable; grep -q "versionCode='1'" /tmp/stable; grep -q "versionName='0.1.0-stable'" /tmp/stable
          for v in SIGNING_KEY_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_ALIAS; do [[ -n "${!v:-}" ]]; done
          KS="$RUNNER_TEMP/release.jks"; printf '%s' "$SIGNING_KEY_B64"|base64 -d >"$KS"; printf '%s' "$SIGNING_STORE_PASSWORD">"$RUNNER_TEMP/store.pass"; printf '%s' "$SIGNING_KEY_PASSWORD">"$RUNNER_TEMP/key.pass"
          mkdir -p dist/beta; NAME="pick-pack-1291-public-beta-$BETA_NAME.apk"; OUT="dist/beta/$NAME"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$SIGNING_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --out "$OUT" "$BETA"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" >/tmp/cert; grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/cert
          SHA=$(sha256sum "$OUT"|awk '{print $1}'); SIZE=$(stat -c '%s' "$OUT"); printf '%s  %s\n' "$SHA" "$NAME" >"dist/beta/SHA256SUMS-$BETA_NAME.txt"
          echo "FINAL_SHA=$SHA" >> "$GITHUB_ENV"; echo "FINAL_SIZE=$SIZE" >> "$GITHUB_ENV"; echo "FINAL_APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload signed candidate artifact
        if: env.EXISTING_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pick-pack-1291-public-beta-0.4.2-beta.55-signed-candidate-rescue
          path: dist/beta/*
          retention-days: 14

      - name: Create immutable Beta55 release if absent
        if: env.EXISTING_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v${BETA_NAME}-publicbeta"; APK="dist/beta/$FINAL_APK_NAME"; SUM="dist/beta/SHA256SUMS-$BETA_NAME.txt"
          cat >/tmp/notes <<EOF
          Pick Pack 1291 Beta ${BETA_NAME}

          PP_CHANNEL=BETA
          PP_VERSION=${BETA_NAME}
          PP_VERSION_CODE=${BETA_CODE}
          PP_SHA256=${FINAL_SHA}
          PP_SIZE=${FINAL_SIZE}
          PP_SIGNER_SHA256=${EXPECTED_SIGNER_SHA256}
          PP_APK_NAME=${FINAL_APK_NAME}
          PP_MANDATORY=false
          PP_FIX=Cloudflare unavailable -> Google/GAS fallback; both unavailable -> offline
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release appeared concurrently; refusing overwrite'; exit 1; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pick Pack 1291 ${BETA_NAME}" --notes-file /tmp/notes --prerelease
          gh release upload "$TAG" "$APK#$FINAL_APK_NAME" "$SUM#$(basename "$SUM")" --repo "$GITHUB_REPOSITORY"
          echo "FINAL_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FINAL_APK_NAME" >> "$GITHUB_ENV"

      - name: Verify live GitHub release exact bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${FINAL_URL:-}" ]] || echo "FINAL_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/v${BETA_NAME}-publicbeta/$FINAL_APK_NAME" >> "$GITHUB_ENV"
          URL="${FINAL_URL:-https://github.com/$GITHUB_REPOSITORY/releases/download/v${BETA_NAME}-publicbeta/$FINAL_APK_NAME}"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$URL" -o /tmp/live.apk
          [[ "$(sha256sum /tmp/live.apk|awk '{print $1}')" == "$FINAL_SHA" ]]
          [[ "$(stat -c '%s' /tmp/live.apk)" == "$FINAL_SIZE" ]]

      - name: Stage Beta55 into canonical Service OTA metadata only if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_SHA="$GITHUB_SHA"; URL="${FINAL_URL:-https://github.com/$GITHUB_REPOSITORY/releases/download/v${BETA_NAME}-publicbeta/$FINAL_APK_NAME}"
          git fetch origin agent/service-migration-m2; git checkout -B beta55-stage origin/agent/service-migration-m2
          SAME=$(python3 - <<'PY'
          import json,os
          try:m=json.load(open('ops/beta-ota-current.json'))
          except: print('false'); raise SystemExit
          print(str(m.get('version_name')==os.environ['BETA_NAME'] and str(m.get('sha256','')).lower()==os.environ['FINAL_SHA'].lower()).lower())
          PY
          )
          if [[ "$SAME" == true ]]; then echo 'OTA metadata already staged; not retriggering GAS'; exit 0; fi
          cat > ops/beta-ota-current.json <<EOF
          {"source":"GITHUB_RELEASE","channel":"BETA","version_name":"$BETA_NAME","version_code":$BETA_CODE,"apk_name":"$FINAL_APK_NAME","apk_url":"$URL","sha256":"$FINAL_SHA","size":$FINAL_SIZE,"published_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","notes":"Beta55: Cloudflare lỗi chuyển qua Google/GAS; chỉ cả Cloudflare và Google không dùng được mới OFFLINE. Giữ nguyên sửa lỗi Beta54.","mandatory":false,"retention":10}
          EOF
          cat > ops/gas-deploy-trigger.txt <<EOF
          trigger=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          release=Beta55
          beta_source_sha=$BUILD_SHA
          apk_sha256=$FINAL_SHA
          reason=publish-beta55-google-fallback-rescue
          EOF
          cat > ops/beta55-signed-release-result.txt <<EOF
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          beta_source_sha=$BUILD_SHA
          release_run_id=$GITHUB_RUN_ID
          beta_name=$BETA_NAME
          beta_code=$BETA_CODE
          apk_name=$FINAL_APK_NAME
          apk_sha256=$FINAL_SHA
          apk_size=$FINAL_SIZE
          signer_sha256=$EXPECTED_SIGNER_SHA256
          release_url=$URL
          stable=UNTOUCHED
          main=UNTOUCHED
          pr38_merge=FORBIDDEN
          pr52_merge=FORBIDDEN
          verdict=PASS
          EOF
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta-ota-current.json ops/gas-deploy-trigger.txt ops/beta55-signed-release-result.txt
          git commit -m 'release: stage Beta55 OTA metadata for production GAS'
          git push origin HEAD:agent/service-migration-m2

      - name: Finalize observable rescue status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          cat >/tmp/obs <<EOF
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          workflow=BETA55_RELEASE_RESCUE
          status=$STATUS
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          final_sha=${FINAL_SHA:-}
          final_size=${FINAL_SIZE:-}
          final_apk=${FINAL_APK_NAME:-}
          EOF
          API="repos/$GITHUB_REPOSITORY/contents/ops/beta55-release-rescue-observer.txt"; sha=$(gh api "$API?ref=$STABILIZATION_BRANCH" --jq .sha 2>/dev/null || true); content=$(base64 -w0 /tmp/obs)
          if [[ -n "$sha" ]]; then gh api -X PUT "$API" -f message='ops: finalize Beta55 rescue run' -f content="$content" -f sha="$sha" -f branch="$STABILIZATION_BRANCH" >/dev/null
          else gh api -X PUT "$API" -f message='ops: finalize Beta55 rescue run' -f content="$content" -f branch="$STABILIZATION_BRANCH" >/dev/null; fi
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
