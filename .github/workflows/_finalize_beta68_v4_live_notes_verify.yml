name: Finalize Beta68 v4 live notes verify
on:
  push:
    branches: [ release/beta68-exact-20260824 ]
    paths: [ 'ops/TRIGGER_BETA68_V4_FINALIZE.txt' ]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Persist finalize start receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > ops/beta68-v4-finalize-start.txt <<EOF
          run_id=$GITHUB_RUN_ID
          candidate_run_id=32754196617
          candidate_artifact_id=9530301628
          apk_sha256=34554a19621be73ebc1e3bd64bef547959f5843f8d0fc902b5bcc8d573cf4641
          mode=LIVE_NOTES_AND_VERIFY_ONLY
          state=STARTED
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/beta68-v4-finalize-start.txt
          git commit -m 'ops: record Beta68 v4 finalize start'
          git push origin HEAD:release/beta68-exact-20260824
      - name: Finalize live notes and verify exact OTA
        shell: bash
        run: bash tools/finalize_beta68_v4_live_notes_verify.sh
