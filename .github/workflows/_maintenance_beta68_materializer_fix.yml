name: Beta68 materializer root-cause repair

on:
  push:
    branches: [ agent/beta68-from-beta66-20260824 ]
    paths:
      - '.github/workflows/_maintenance_beta68_materializer_fix.yml'
      - 'ops/beta68-materializer-fix-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repair brittle settings anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_beta68_owner_five_fixes.py')
          s=p.read_text()
          start=s.index("ops = replace_once(\n    ops,\n    '            \"Mã phiên bản\" to BuildConfig.VERSION_CODE.toString()")
          end=s.index('\n# Trigger OTA detection', start)
          replacement=r'''def insert_detail_rows(text: str, anchor: str, rows: list[str], label: str) -> str:
              if all(row.split(' to ')[0].strip() in text for row in rows):
                  return text
              pattern = re.compile(re.escape(anchor) + r',?')
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'{label}: anchor missing')
              indent = '            '
              block = anchor + ',\n' + ',\n'.join(indent + row for row in rows)
              return text[:m.start()] + block + text[m.end():]

          ops = insert_detail_rows(
              ops,
              '"Mã phiên bản" to BuildConfig.VERSION_CODE.toString()',
              [
                  '"Dữ liệu người dùng" to humanBytes(storageUsage.userDataBytes)',
                  '"Bộ nhớ đệm" to humanBytes(storageUsage.cacheBytes)',
              ],
              'Settings app storage rows',
          )
          ops = insert_detail_rows(
              ops,
              '"Kiểm tra APK" to "SHA-256 + chữ ký ứng dụng"',
              [
                  '"Tự động kiểm tra OTA" to "Khi mở / quay lại ứng dụng"',
                  '"Nội dung cập nhật" to "Hiển thị từng mục dạng gạch đầu dòng"',
              ],
              'Settings OTA mode rows',
          )
          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          python3 -m py_compile tools/apply_beta68_owner_five_fixes.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/apply_beta68_owner_five_fixes.py
          git commit -m 'Beta68: make settings materializer anchor robust'
          git push origin HEAD:agent/beta68-from-beta66-20260824
