name: Stable private provision

on:
  push:
    branches:
      - 'feature/beta-stable-isolation-20260830'
    paths:
      - ops/stable-private-provision-request.json
      - tools/stable_private_provision.py
      - tools/stable_gas_canary_prepare.py
      - tools/stable_auth_parity.py
      - .github/workflows/stable-private-provision.yml
      - google-apps-script/stable-primary-appsscript.json
      - google-apps-script/stable-outbound/**
      - google-apps-script/stable-dr/**
      - google-apps-script/PICK_PACK_API.gs
      - google-apps-script/SERVICE_MIGRATION_M2.gs
      - google-apps-script/OUTBOUND_DROP_RECEIVE.gs
      - service/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-private-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provisioner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stable_private_provision.py tools/stable_gas_canary_prepare.py tools/stable_auth_parity.py
          python3 tools/stable_private_provision.py --self-test
          jq -e '.environment=="STABLE" and .stable_public_activation==false and (.mode=="PREFLIGHT_ONLY" or .mode=="PROVISION_PRIVATE" or .mode=="GAS_CANARY_UPDATE" or .mode=="AUTH_PARITY_REPAIR")' ops/stable-private-provision-request.json >/dev/null
      - name: Install Worker tooling
        shell: bash
        run: |
          set -euo pipefail
          cd service
          npm install --ignore-scripts --no-audit --no-fund
      - name: Preflight or provision Stable private runtime
        shell: bash
        run: |
          set -euo pipefail
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            test -n "${!n:-}" || { echo "MISSING_REQUIRED_SECRET:$n"; exit 2; }
            echo "::add-mask::${!n}"
          done
          MODE=$(jq -r '.mode' ops/stable-private-provision-request.json)
          if [[ "$MODE" == "GAS_CANARY_UPDATE" ]]; then
            python3 tools/stable_gas_canary_prepare.py
          elif [[ "$MODE" == "AUTH_PARITY_REPAIR" ]]; then
            python3 tools/stable_auth_parity.py
          else
            python3 tools/stable_private_provision.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-private-provision-${{ github.run_id }}
          path: /tmp/stable-private-provision-receipt.json
          retention-days: 30
          if-no-files-found: error
