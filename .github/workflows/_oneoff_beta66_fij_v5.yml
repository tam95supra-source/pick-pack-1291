name: Beta66 F-I-J Final Verification V5

on:
  pull_request:
    branches: [ ci/beta66-r6-observable-base-20260824 ]
    paths:
      - 'ops/beta66-fij-v5-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: beta66-final-fij
  cancel-in-progress: false

env:
  PRODUCT_SOURCE_SHA: f8f0f599f7a1d1dc74cc36ee4cb5110d6cf10d1a
  BETA66_ARTIFACT_ID: '9516611098'
  BETA65_ARTIFACT_ID: '9510636863'
  TARGET_VERSION: 0.4.2-beta.66
  TARGET_CODE: '72'
  FROM_VERSION: 0.4.2-beta.65
  FROM_CODE: '71'
  APK_NAME: pick-pack-1291-public-beta-0.4.2-beta.66.apk
  EXPECTED_SHA: 9a4520fab3e46abc4757838c58fc05b00274bbc98a060b82dc5389f943517a68
  EXPECTED_SIZE: '13097861'
  BETA65_SHA: be728cd8d20d6033becbfb169db89565f6078a681d47bc9079f98f9f5758e1da
  EXPECTED_PACKAGE: vn.pickpack1291.app.beta.publicbeta
  EXPECTED_SIGNER_SHA256: d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e
  DRIVE_APK_ID: 18eoKONoGdAgyq22AtkQNgKnmZwl79w8s
  GAS_URL: https://script.google.com/macros/s/AKfycbzbEoGfbNg6s2HnP-gUpcBJ7mMIkVBtYuQKMndb9seDV2c55lQwSUO1GZ-LtQ2CxMCauA/exec
  SERVICE_URL: https://pickpack1291.cc.cd
  CANONICAL_SERVICE_URL: https://pickpack.1291.workers.dev
  TAG: v0.4.2-beta.66-publicbeta

jobs:
  final_verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Recover Beta65 immutable baseline and Beta66 exact live OTA bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence /tmp/b65
          curl -fLsS --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BETA65_ARTIFACT_ID/zip" -o /tmp/b65.zip
          unzip -q /tmp/b65.zip -d /tmp/b65
          B65=$(find /tmp/b65 -maxdepth 1 -type f -name '*.apk' | head -1); test -s "$B65"
          [[ "$(sha256sum "$B65"|awk '{print $1}')" == "$BETA65_SHA" ]]
          cp "$B65" /tmp/beta65.apk
          curl -fLsS --retry 5 --retry-delay 2 "https://drive.usercontent.google.com/download?id=$DRIVE_APK_ID&export=download&confirm=t" -o /tmp/beta66-live.apk
          [[ "$(sha256sum /tmp/beta66-live.apk|awk '{print $1}')" == "$EXPECTED_SHA" && "$(stat -c%s /tmp/beta66-live.apk)" == "$EXPECTED_SIZE" ]]
          printf 'INPUTS=PASS\nbeta65_artifact=%s\nbeta65_sha=%s\nbeta66_drive_id=%s\nbeta66_sha=%s\n' "$BETA65_ARTIFACT_ID" "$BETA65_SHA" "$DRIVE_APK_ID" "$EXPECTED_SHA" >/tmp/evidence/inputs.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify both APK identities and signer continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          BT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1); test -x "$BT/aapt"; test -x "$BT/apksigner"
          "$BT/aapt" dump badging /tmp/beta65.apk >/tmp/evidence/b65-badging.txt
          "$BT/aapt" dump badging /tmp/beta66-live.apk >/tmp/evidence/b66-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/evidence/b65-badging.txt; grep -q "versionName='$FROM_VERSION'" /tmp/evidence/b65-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" /tmp/evidence/b66-badging.txt; grep -q "versionName='$TARGET_VERSION'" /tmp/evidence/b66-badging.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/beta65.apk >/tmp/evidence/b65-cert.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/beta66-live.apk >/tmp/evidence/b66-cert.txt
          C65=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/evidence/b65-cert.txt|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]')
          C66=$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/evidence/b66-cert.txt|sed 's/.*digest: //'|tr 'A-F' 'a-f'|tr -d ':[:space:]')
          [[ "$C65" == "$EXPECTED_SIGNER_SHA256" && "$C66" == "$EXPECTED_SIGNER_SHA256" ]]

      - name: F actual signed Android package upgrade from Beta65 to exact live OTA Beta66
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -Eeuo pipefail
            adb install /tmp/beta65.apk
            adb shell dumpsys package "$EXPECTED_PACKAGE" >/tmp/F-before.txt
            grep -q 'versionName=0.4.2-beta.65' /tmp/F-before.txt
            grep -Eq 'versionCode=71([^0-9]|$)' /tmp/F-before.txt
            adb shell monkey -p "$EXPECTED_PACKAGE" -c android.intent.category.LAUNCHER 1 >/tmp/F-launch65.txt 2>&1 || true
            sleep 2
            adb install -r /tmp/beta66-live.apk
            adb shell dumpsys package "$EXPECTED_PACKAGE" >/tmp/F-after.txt
            grep -q 'versionName=0.4.2-beta.66' /tmp/F-after.txt
            grep -Eq 'versionCode=72([^0-9]|$)' /tmp/F-after.txt
            adb shell monkey -p "$EXPECTED_PACKAGE" -c android.intent.category.LAUNCHER 1 >/tmp/F-launch66.txt 2>&1 || true
            sleep 2
            PID=$(adb shell pidof "$EXPECTED_PACKAGE" | tr -d '\r'); test -n "$PID"
            cp /tmp/F-before.txt /tmp/evidence/F-before-package.txt
            cp /tmp/F-after.txt /tmp/evidence/F-after-package.txt
            cp /tmp/F-launch66.txt /tmp/evidence/F-launch66.txt
            printf 'F=PASS\nfrom=0.4.2-beta.65/71\nto=0.4.2-beta.66/72\nmethod=ADB_SIGNED_PACKAGE_UPGRADE_USING_LIVE_OTA_BYTES\npid=%s\n' "$PID" >/tmp/evidence/F.txt

      - name: I publish/reuse exact GitHub prerelease and exact download readback
        id: rel
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          CODE=$(curl -sS -o /tmp/release-get.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API/releases/tags/$TAG")
          if [[ "$CODE" == 404 ]]; then
            python3 - <<'PY' >/tmp/create.json
          import json,os
          print(json.dumps({'tag_name':os.environ['TAG'],'target_commitish':os.environ['PRODUCT_SOURCE_SHA'],'name':'Pick Pack 1291 '+os.environ['TARGET_VERSION']+' Public Beta','body':'Exact locked Beta66 login full-frame release. Stable untouched. Service S64 unchanged.','draft':False,'prerelease':True}))
          PY
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @/tmp/create.json "$API/releases" >/tmp/release.json
          elif [[ "$CODE" == 200 ]]; then cp /tmp/release-get.json /tmp/release.json; else cat /tmp/release-get.json; exit 1; fi
          RID=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["id"])')
          python3 - <<'PY' >/tmp/aid
          import json,os
          j=json.load(open('/tmp/release.json')); a=next((x for x in j.get('assets',[]) if x.get('name')==os.environ['APK_NAME']),None); print(a.get('id','') if a else '')
          PY
          AID=$(cat /tmp/aid)
          if [[ -n "$AID" ]]; then
            curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$API/releases/assets/$AID" -o /tmp/existing.apk
            if [[ "$(sha256sum /tmp/existing.apk|awk '{print $1}')" != "$EXPECTED_SHA" || "$(stat -c%s /tmp/existing.apk)" != "$EXPECTED_SIZE" ]]; then
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$AID" >/dev/null; AID=''
            fi
          fi
          if [[ -z "$AID" ]]; then
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/vnd.android.package-archive' --data-binary @/tmp/beta66-live.apk "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$APK_NAME" >/tmp/asset.json
            AID=$(python3 -c 'import json;print(json.load(open("/tmp/asset.json"))["id"])')
          fi
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$API/releases/assets/$AID" -o /tmp/release-readback.apk
          [[ "$(sha256sum /tmp/release-readback.apk|awk '{print $1}')" == "$EXPECTED_SHA" && "$(stat -c%s /tmp/release-readback.apk)" == "$EXPECTED_SIZE" ]]
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API/releases/$RID" >/tmp/release-final.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/release-final.json')); assert j.get('draft') is False and j.get('prerelease') is True,j; assert j.get('tag_name')==os.environ['TAG'],j
          PY
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"; echo "asset_id=$AID" >> "$GITHUB_OUTPUT"
          printf 'I=PASS\nrelease_id=%s\nasset_id=%s\ntag=%s\nsha256=%s\nsize=%s\n' "$RID" "$AID" "$TAG" "$EXPECTED_SHA" "$EXPECTED_SIZE" >/tmp/evidence/I.txt
          cp /tmp/release-final.json /tmp/evidence/I-release.json

      - name: J fresh S64 final service health verification
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SERVICE_URL/api/v1/health" >/tmp/health.json
          curl -fsSL --retry 5 --retry-delay 2 "$SERVICE_URL/api/v1/s1/health" >/tmp/s1.json
          curl -fsSL --retry 5 --retry-delay 2 "$CANONICAL_SERVICE_URL/api/v1/health" >/tmp/canonical.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); s=json.load(open('/tmp/s1.json')); c=json.load(open('/tmp/canonical.json'))
          assert h.get('ok') is True,h; assert h.get('service')=='PICK_PACK_EDGE_S64',h
          assert s.get('ok') is True,s
          assert c.get('ok') is True,c; assert c.get('service')=='PICK_PACK_EDGE_S64',c
          PY
          cp /tmp/health.json /tmp/evidence/J-health.json; cp /tmp/s1.json /tmp/evidence/J-s1.json; cp /tmp/canonical.json /tmp/evidence/J-canonical.json
          printf 'J=PASS\nservice=PICK_PACK_EDGE_S64\nprimary=%s\ncanonical=%s\n' "$SERVICE_URL" "$CANONICAL_SERVICE_URL" >/tmp/evidence/J.txt

      - name: Final fresh OTA sanity after prerelease and emulator upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.65"}' >/tmp/final-ota.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"BETA","current_version":"0.4.2-beta.66"}' >/tmp/final-self.json
          curl -fsSL -H 'content-type: application/json' "$GAS_URL" -d '{"action":"update_check","channel":"STABLE","current_version":"0.1.0-stable"}' >/tmp/final-stable.json
          python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/final-ota.json')); b=json.load(open('/tmp/final-self.json')); c=json.load(open('/tmp/final-stable.json'))
          assert a.get('ok') is True and a.get('available') is True and a.get('version_name')==os.environ['TARGET_VERSION'] and a.get('sha256')==os.environ['EXPECTED_SHA'],a
          assert b.get('ok') is True and b.get('available') is False and b.get('version_name')==os.environ['TARGET_VERSION'],b
          assert c.get('ok') is True and c.get('available') is False and c.get('channel')=='STABLE',c
          PY
          cp /tmp/final-ota.json /tmp/evidence/final-ota.json; cp /tmp/final-self.json /tmp/evidence/final-self.json; cp /tmp/final-stable.json /tmp/evidence/final-stable.json

      - name: Upload F-I-J evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta66-fij-final-evidence
          path: /tmp/evidence
          retention-days: 30
          if-no-files-found: warn
