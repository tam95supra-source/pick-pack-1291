name: Beta118 exact owner100 UI gate
on:
  push:
    branches: [release/beta118-owner-realtime-bulk-exit-20260904]
    paths: [.github/workflows/beta118-owner100-exact-ui.yml]
permissions: {contents: read, actions: read}
jobs:
  owner100-exact-ui:
    runs-on: ubuntu-24.04
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beta-candidate-33833810807
          path: /tmp/beta-candidate
          github-token: ${{ github.token }}
          repository: tam95supra-source/pick-pack-1291
          run-id: 33833810807
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Generate harness and runner
        run: |
          set -euo pipefail
          python3 tools/beta118_owner100_exact_ui_patch.py
          bash tools/build_beta83_verify_harness.sh
          git diff -- app service google-apps-script --exit-code
          cat >/tmp/run-owner100-exact.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=vn.pickpack1291.app.beta.publicbeta
          APK=/tmp/beta-candidate/pick-pack-1291-public-beta-0.4.2-beta.118.apk
          test "$(sha256sum "$APK" | awk '{print $1}')" = "5216f0eb09f187aed9cb71dcc21cd145fdc3ba7ea7852c74ffe6f85dea2b478f"
          adb install -r "$APK" >/dev/null
          adb install -r "$VERIFY_HARNESS_APK" >/dev/null
          adb shell pm clear "$PKG" >/dev/null
          mkdir -p /tmp/owner100-exact
          set +e
          timeout 180s adb shell am instrument -w -r -e mode owner100 vn.pickpack1291.verify/.Beta83UiChecksInstrumentation > /tmp/owner100-exact/instrument.txt 2>&1
          RC=$?
          set -e
          cat /tmp/owner100-exact/instrument.txt
          test "$RC" = 0
          grep -Fq 'INSTRUMENTATION_CODE: 0' /tmp/owner100-exact/instrument.txt
          grep -Fq 'owner100_exact_ui=PASS' /tmp/owner100-exact/instrument.txt
          grep -Fq 'expected_minus_actual=0' /tmp/owner100-exact/instrument.txt
          grep -Fq 'actual_minus_expected=0' /tmp/owner100-exact/instrument.txt
          grep -Fq 'positions=PASS' /tmp/owner100-exact/instrument.txt
          grep -Fq 'in_only=PASS' /tmp/owner100-exact/instrument.txt
          SH
          chmod +x /tmp/run-owner100-exact.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Exact 100 receipt to actual Android UI set diff
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash /tmp/run-owner100-exact.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta118-owner100-exact-ui-${{ github.run_id }}
          path: /tmp/owner100-exact
          if-no-files-found: warn
          retention-days: 30
