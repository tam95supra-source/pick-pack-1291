name: Beta117 invariant register

on:
  push:
    branches:
      - release/beta117-owner-followup-performance-20260904
    paths:
      - .github/workflows/beta117-invariant-register.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register Beta117 technical-pass invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          evidence = (
              "0.4.2-beta.117 Technical PASS/LIVE; candidate source d8ea2c2f31549647e8676b40dc536d2b1b80e6e5; "
              "candidate 33800745880/9911117214; fresh Service 33821884023/9918676363; "
              "visual/PDA/API36 33816769626/9916961610 + human PASS 43 screenshots 320x568/360x640/480x800; "
              "Beta Auth 33817394774/9917295154; device/discovery 33818941214/9917593203; "
              "Stable private primary recovery 33821666160/9918483812; runtime 33822369696/9918733617; "
              "domain 33822700732/9918901726; Fast Check 33821883976 PASS; terminal 33822875354; "
              "publish 9918907009; OTA install/open/readback 9918960606; final 9918965646; "
              "SHA256 b3454574547eece69ea44c51b2f88da93dd142eb5d1afb82e7fbd0f293cc0d87; size 14396405; "
              "signer d180450ae47ac6e8daf26840308e62bd602d5f8d6ac12ee0da58e5eb1a44731e; Stable/main/authority unchanged."
          )
          receipt = "ops/beta117-technical-pass.json"
          regression = "tools/beta117_owner_followup_contract.py"

          md_path = Path("docs/STABLE_INVARIANTS.md")
          md = md_path.read_text(encoding="utf-8")
          marker = "## 4C. Beta117 — TECHNICAL_PASS_AWAITING_OWNER"
          if marker not in md:
              block = f'''\n\n{marker}\n\nTechnical receipt: `{receipt}`. Regression: `{regression}`. Chỉ chuyển các invariant mới sang ACTIVE_PASS sau OWNER xác nhận từng mục. Hai invariant Beta116 còn pending tiếp tục giữ nguyên semantics và được re-verify trên Beta117.\n\n### DOCUMENT-COMPACT-MULTI-EDIT-005\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: document-management / draft-actions / edit\n- Parent: DOCUMENT-DRAFT-NOTE-UX-003 ACTIVE_PASS.\n- Rule: 0/1 ảnh draft không hiện chế độ một/nhiều; vùng ảnh chờ tải rỗng phải ẩn; từ 2 ảnh mới mở chọn nhiều; Chọn tất cả/Xóa/Tải lên cùng hàng compact; fullscreen; cho sửa loại/note và xóa một/nhiều ảnh đúng document group.\n- Regression: empty_pending_hidden / mode_hidden_zero_one / mode_multi_two_plus / compact_action_row / fullscreen / edit_category_note / delete_one_many / canonical_document_group.\n- Technical evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 1/8.\n\n### DOCUMENT-CROSS-GROUP-VIEWER-005\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: document-viewer\n- Parent: DOCUMENT-GROUP-VIEWER-004 ACTIVE_PASS.\n- Rule: viewer biên bản vuốt liên tục qua toàn bộ ảnh/biên bản trong tập đang xem, hỗ trợ pinch zoom và kéo X/Y; đổi ảnh không tạo adapter/rerender thừa.\n- Regression: cross_group_swipe / pinch / pan_xy / adapter_reuse / exact_group_metadata.\n- Technical evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 2/8.\n\n### DROP-RECEIVE-COMPACT-LIST-002\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: drop-receive\n- Parent: DROP-RECEIVE-CRUD-001 ACTIVE_PASS.\n- Rule: danh sách Nhận hàng rớt mới nhất trước, format compact HH:mm dd/MM/yyyy | vị trí | DO | Số kiện; ADMIN/SUPERADMIN được xóa qua canonical auth, USER không được nâng quyền.\n- Regression: newest_first / compact_datetime_location_do_package / admin_delete / superadmin_delete / user_forbidden.\n- Technical evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 3/8.\n\n### UI-PERFORMANCE-COMPACT-005\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: UI performance / compact select / tap feedback\n- Parent: UI-TAP-FEEDBACK-004 ACTIVE_PASS + UI-FORM-CONSISTENCY-002 ACTIVE_PASS.\n- Rule: các danh sách lớn render theo chunk/generation và search debounce để giảm lag PDA; select/spinner compact nhưng giữ khả năng đọc/chạm; tap feedback 0.95 → 1.01 chỉ transform, không đổi geometry/layout.\n- Regression: chunked_render / generation_cancel / search_debounce / compact_select / transform_only / no_layout_animation.\n- Technical evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 4/8.\n\n### LABOR-FIXED-ROLE-BULK-006\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: labor fixed-role bulk\n- Parent: LABOR-FIXED-ROLE-REVIEW-005 ACTIVE_PASS.\n- Rule: Tổ trưởng/Kéo hàng/5S cho phép chọn nhiều/chọn tất cả đúng candidate, áp một khoảng giờ hàng loạt và ACK riêng theo từng NLĐ/session; không tự sinh công nhật và không đổi exact-session authority.\n- Regression: fixed_role_candidates / select_many / select_all / batch_time / per_employee_ack / no_auto_labor / exact_session_authority.\n- Technical evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 5/8.\n\n### LAN-MANUAL-REAL-003\n- Status: TECHNICAL_PASS_AWAITING_OWNER\n- Scope: LAN production manual mode\n- Parent: LAN-GLOBAL-TEST-002 ACTIVE_PASS.\n- Rule: LAN thực tế thủ công tách hoàn toàn LAN test; chỉ SUPERADMIN bật/tắt; có trạng thái pending/not-ready; khi Service hội tụ lại phải reconcile an toàn, giữ fencing/idempotency và không tự đổi authority/provider.\n- Regression: manual_vs_test_isolation / superadmin_only / global_state / pending_not_ready / safe_reconcile / authority_unchanged.\n- Technical evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 6/8.\n\n### Beta117 re-verification — REPORT-LABOR-DEDUCTION-002\n- Status: TECHNICAL_PASS_AWAITING_OWNER (giữ nguyên).\n- Rule/semantics: không đổi so với Beta116 item 4; Tổng nhân sự trước khấu trừ, Khấu trừ công nhật, Picker thực tế, Packer thực tế tách riêng.\n- Beta117 evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 7/8.\n\n### Beta117 re-verification — LOCAL-FIRST-RECONCILE-002\n- Status: TECHNICAL_PASS_AWAITING_OWNER (giữ nguyên).\n- Rule/semantics: không đổi so với Beta116 item 6; Đổi/Trả PDA và Công nhật local-first rồi reconcile nền, exact Service session vẫn là business authority.\n- Beta117 evidence: {evidence}\n- OWNER acceptance: PENDING — checklist Beta117 item 8/8.\n'''
              md = md.rstrip() + block + "\n"
              md_path.write_text(md, encoding="utf-8")

          yml_path = Path("qa/stable_invariants.yml")
          yml = yml_path.read_text(encoding="utf-8")
          if "DOCUMENT-COMPACT-MULTI-EDIT-005" not in yml:
              entries = f'''\n  - id: DOCUMENT-COMPACT-MULTI-EDIT-005\n    status: TECHNICAL_PASS_AWAITING_OWNER\n    scope: document-compact-multi-edit\n    parent_invariant: DOCUMENT-DRAFT-NOTE-UX-003\n    rule: "0/1 draft hides one/many mode; empty pending box hidden; 2+ enables multi-select; compact select-all/delete/upload row; fullscreen; edit category/note; delete one/many within canonical document group."\n    regression_minimum: [empty_pending_hidden, mode_hidden_zero_one, mode_multi_two_plus, compact_action_row, fullscreen, edit_category_note, delete_one_many, canonical_document_group]\n    regression_case: "{regression}"\n    technical_evidence: "{evidence}"\n    technical_receipt: "{receipt}"\n    owner_acceptance: "PENDING_BETA117_ITEM_1_OF_8"\n    active_pass: false\n\n  - id: DOCUMENT-CROSS-GROUP-VIEWER-005\n    status: TECHNICAL_PASS_AWAITING_OWNER\n    scope: document-cross-group-viewer\n    parent_invariant: DOCUMENT-GROUP-VIEWER-004\n    rule: "Viewer swipes continuously across current image/document set with pinch zoom and pan X/Y while reusing adapter and preserving exact group metadata."\n    regression_minimum: [cross_group_swipe, pinch, pan_xy, adapter_reuse, exact_group_metadata]\n    regression_case: "{regression}"\n    technical_evidence: "{evidence}"\n    technical_receipt: "{receipt}"\n    owner_acceptance: "PENDING_BETA117_ITEM_2_OF_8"\n    active_pass: false\n\n  - id: DROP-RECEIVE-COMPACT-LIST-002\n    status: TECHNICAL_PASS_AWAITING_OWNER\n    scope: drop-receive-compact-list\n    parent_invariant: DROP-RECEIVE-CRUD-001\n    rule: "Drop receive list is newest-first and compact HH:mm dd/MM/yyyy | location | DO | package count; ADMIN/SUPERADMIN delete through canonical auth; USER forbidden."\n    regression_minimum: [newest_first, compact_row, admin_delete, superadmin_delete, user_forbidden]\n    regression_case: "{regression}"\n    technical_evidence: "{evidence}"\n    technical_receipt: "{receipt}"\n    owner_acceptance: "PENDING_BETA117_ITEM_3_OF_8"\n    active_pass: false\n\n  - id: UI-PERFORMANCE-COMPACT-005\n    status: TECHNICAL_PASS_AWAITING_OWNER\n    scope: ui-performance-compact\n    parent_invariant: UI-TAP-FEEDBACK-004\n    rule: "Large lists render chunked with generation cancellation/search debounce; selects remain compact/readable; tap feedback 0.95 to 1.01 is transform-only and never changes layout geometry."\n    regression_minimum: [chunked_render, generation_cancel, search_debounce, compact_select, transform_only, no_layout_animation]\n    regression_case: "{regression}"\n    technical_evidence: "{evidence}"\n    technical_receipt: "{receipt}"\n    owner_acceptance: "PENDING_BETA117_ITEM_4_OF_8"\n    active_pass: false\n\n  - id: LABOR-FIXED-ROLE-BULK-006\n    status: TECHNICAL_PASS_AWAITING_OWNER\n    scope: labor-fixed-role-bulk\n    parent_invariant: LABOR-FIXED-ROLE-REVIEW-005\n    rule: "Fixed roles Tổ trưởng/Kéo hàng/5S support multi/select-all, one batch time range and per-employee/session ACK; no auto labor and exact-session authority stays canonical."\n    regression_minimum: [fixed_role_candidates, select_many, select_all, batch_time, per_employee_ack, no_auto_labor, exact_session_authority]\n    regression_case: "{regression}"\n    technical_evidence: "{evidence}"\n    technical_receipt: "{receipt}"\n    owner_acceptance: "PENDING_BETA117_ITEM_5_OF_8"\n    active_pass: false\n\n  - id: LAN-MANUAL-REAL-003\n    status: TECHNICAL_PASS_AWAITING_OWNER\n    scope: lan-manual-real\n    parent_invariant: LAN-GLOBAL-TEST-002\n    rule: "Real manual LAN is isolated from LAN test; SUPERADMIN-only global toggle with pending/not-ready states; safe reconcile preserves fencing/idempotency and does not change authority/provider."\n    regression_minimum: [manual_vs_test_isolation, superadmin_only, global_state, pending_not_ready, safe_reconcile, authority_unchanged]\n    regression_case: "{regression}"\n    technical_evidence: "{evidence}"\n    technical_receipt: "{receipt}"\n    owner_acceptance: "PENDING_BETA117_ITEM_6_OF_8"\n    active_pass: false\n\n'''
              if "\nimpact_map:\n" not in yml:
                  raise SystemExit("IMPACT_MAP_MARKER_MISSING")
              yml = yml.replace("\nimpact_map:\n", entries + "impact_map:\n", 1)

              # Re-verify the two still-pending Beta116 invariants without changing their semantics/status.
              def update_pending(text, invariant_id, item):
                  start = text.index(f"  - id: {invariant_id}\n")
                  nxt = text.find("\n  - id: ", start + 1)
                  if nxt < 0:
                      nxt = text.index("\nimpact_map:\n", start)
                  section = text[start:nxt]
                  section = section.replace('    technical_evidence: "', '    technical_evidence: "Beta117 re-verification: ' + evidence.replace('"','') + ' | ', 1)
                  section = section.replace('    technical_receipt: "ops/beta116-technical-pass.json"', f'    technical_receipt: "{receipt}"', 1)
                  old_prefix = '    owner_acceptance: "PENDING_BETA116_ITEM_'
                  pos = section.find(old_prefix)
                  if pos >= 0:
                      end = section.find('\n', pos)
                      section = section[:pos] + f'    owner_acceptance: "PENDING_BETA117_ITEM_{item}_OF_8"' + section[end:]
                  return text[:start] + section + text[nxt:]
              yml = update_pending(yml, "REPORT-LABOR-DEDUCTION-002", 7)
              yml = update_pending(yml, "LOCAL-FIRST-RECONCILE-002", 8)

              new_ids = [
                  "DOCUMENT-COMPACT-MULTI-EDIT-005","DOCUMENT-CROSS-GROUP-VIEWER-005","DROP-RECEIVE-COMPACT-LIST-002",
                  "UI-PERFORMANCE-COMPACT-005","LABOR-FIXED-ROLE-BULK-006","LAN-MANUAL-REAL-003"
              ]
              for key in ['  "app/**": [', '  "service/**": [']:
                  p = yml.index(key) + len(key)
                  e = yml.index("]", p)
                  current = yml[p:e]
                  for iid in new_ids:
                      if iid not in current:
                          current = (current.rstrip() + (", " if current.strip() else "") + iid)
                  yml = yml[:p] + current + yml[e:]
              yml_path.write_text(yml, encoding="utf-8")

          # Fail closed if registry state is not exactly owner-pending for new Beta117 entries.
          md = md_path.read_text(encoding="utf-8")
          yml = yml_path.read_text(encoding="utf-8")
          for iid in ["DOCUMENT-COMPACT-MULTI-EDIT-005","DOCUMENT-CROSS-GROUP-VIEWER-005","DROP-RECEIVE-COMPACT-LIST-002","UI-PERFORMANCE-COMPACT-005","LABOR-FIXED-ROLE-BULK-006","LAN-MANUAL-REAL-003"]:
              assert md.count(f"### {iid}") == 1, iid
              assert yml.count(f"- id: {iid}") == 1, iid
              s = yml[yml.index(f"- id: {iid}"):]
              s = s[:s.find("\n  - id: ") if "\n  - id: " in s else len(s)]
              assert "status: TECHNICAL_PASS_AWAITING_OWNER" in s and "active_pass: false" in s, iid
          assert yml.count("impact_map:") == 1
          print("beta117_invariant_register=PASS")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STABLE_INVARIANTS.md qa/stable_invariants.yml
          if git diff --cached --quiet; then
            echo "registry_already_current=PASS"
            exit 0
          fi
          git commit -m "ops(beta117): register technical-pass owner-pending invariants"
          git push origin HEAD:release/beta117-owner-followup-performance-20260904
