name: Beta55 Google Fallback Runner

on:
  push:
    branches: [ stabilization/beta48-golden-reset-beta50-20260822 ]
    paths: [ 'ops/beta55-google-fallback-runner-trigger.txt' ]

permissions:
  contents: write

concurrency:
  group: beta55-google-fallback-runner
  cancel-in-progress: false

jobs:
  apply-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta55-google-fallback-20260823
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply S58 owner fallback contract
        run: python3 tools/apply_s58_beta55_google_fallback.py
      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'S58_BETA55_GOOGLE_FALLBACK' app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt
          grep -Fq 'return flushFallbackItems(store.unresolvedMutations(100))' app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt
          grep -Fq 'if(failureCount()>=FALLBACK_PROBE_FAILURES)return flushFallbackItems(items)' app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt
          grep -Fq 'cfOff && !googleOff -> "GOOGLE_FALLBACK"' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          grep -Fq 'cfOff && googleOff -> "OFFLINE"' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          grep -Fq 'Google Drive / GSheet dự phòng' app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          git diff --check
      - name: Compile Beta and Stable debug
        run: ./gradlew :app:assembleBetaDebug :app:assembleStableDebug --no-daemon
      - name: Commit canonical Beta55 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pick-pack-1291-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/app/beta/M2ServiceTransport.kt app/src/main/java/vn/pickpack1291/app/beta/M2RuntimeBridge.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore Cloudflare to Google fallback [beta55-fallback-applied]'
          git pull --rebase origin fix/beta55-google-fallback-20260823
          git push origin HEAD:fix/beta55-google-fallback-20260823
