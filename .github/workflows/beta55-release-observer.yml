name: Beta55 Release Observer

on:
  pull_request:
    branches: [ stabilization/beta48-golden-reset-beta50-20260822 ]

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: ${{ startsWith(github.head_ref, 'obs/beta55-release-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Beta55 release workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow beta55-signed-release.yml --branch stabilization/beta48-golden-reset-beta50-20260822 --limit 10 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle | tee /tmp/runs.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/runs.json'))
          print('BETA55_RELEASE_RUNS='+json.dumps(rows,ensure_ascii=False))
          if not rows: raise SystemExit('NO_BETA55_RELEASE_RUN_FOUND')
          PY
