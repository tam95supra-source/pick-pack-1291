name: Beta128 OWNER acceptance closeout

on:
  push:
    branches:
      - 'release/beta128-owner-r3-drop-realtime-20260905'
    paths:
      - '.github/workflows/beta128-owner-acceptance-closeout.yml'

permissions:
  contents: write

concurrency:
  group: beta128-owner-acceptance-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap pre-acceptance canonical scope
        run: |
          set -euo pipefail
          python3 tools/owner_scope_guard.py --bootstrap
          python3 tools/owner_acceptance_ledger_guard.py --self-test
          python3 tools/owner_acceptance_ledger_guard.py

      - name: Apply explicit OWNER acceptance fail-closed
        shell: bash
        env:
          OWNER_RESPONSE: 'Tất cả ok'
          OWNER_ACCEPTED_AT: '2026-09-06T05:59:00+07:00'
          OWNER_ACCEPTED_AT_UTC: '2026-09-05T22:59:00Z'
          STATE_EPOCH: '20260906055900'
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD^1)
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          python3 -m pip install --quiet pyyaml
          python3 <<'PY'
          from __future__ import annotations
          import json, os, re, sys
          from pathlib import Path
          import yaml

          root=Path('.')
          sys.path.insert(0, str(root/'tools'))
          from owner_scope_guard_v2 import semantic_hash, full_scope_hash, sha_obj

          accepted_at=os.environ['OWNER_ACCEPTED_AT']
          accepted_at_utc=os.environ['OWNER_ACCEPTED_AT_UTC']
          response=os.environ['OWNER_RESPONSE']
          state_epoch=int(os.environ['STATE_EPOCH'])
          pending_nums={7,9,10,11,12}
          pending_rids={'R2-07','R2-09','R2-10','R2-11','R3-12'}
          receipt_rel='ops/beta128-owner-acceptance.json'

          scope_path=root/'ops/OWNER_SCOPE_CURRENT.json'
          req_path=root/'ops/beta-release-request.json'
          command_ledger_path=root/'ops/owner-command-ledger.jsonl'
          acceptance_path=root/'ops/owner-acceptance-current.json'
          stable_path=root/'docs/STABLE_INVARIANTS.md'
          registry_path=root/'qa/stable_invariants.yml'
          current_path=root/'CURRENT_STATE.md'
          handoff_path=root/'docs/handovers/HANDOVER_CURRENT.md'

          scope=json.loads(scope_path.read_text())
          req=json.loads(req_path.read_text())
          old_acceptance=json.loads(acceptance_path.read_text())
          old_sem=scope['semantics_sha256']
          old_rev=scope['revision']
          if scope['scope_id']!='OWNER_20260905_R3_DROP_REALTIME_BETA128' or old_rev!=3:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:SCOPE_ID_OR_REV')
          if scope['scope_status']!='TECHNICAL_PASS_AWAITING_OWNER':
              raise SystemExit('OWNER_CLOSEOUT_FAIL:SCOPE_NOT_AWAITING_OWNER')
          if req.get('stage')!='pass_live' or req.get('live') is not True or req.get('version_name')!='0.4.2-beta.128' or req.get('version_code')!=134:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:NOT_EXACT_BETA128_LIVE')
          if req.get('technical_pass_status')!='PASS' or req.get('ota_readback_status')!='PASS':
              raise SystemExit('OWNER_CLOSEOUT_FAIL:TECH_OR_OTA_NOT_PASS')
          if req.get('owner_acceptance')!='PENDING':
              raise SystemExit('OWNER_CLOSEOUT_FAIL:RELEASE_NOT_PENDING')
          if req.get('apk_sha256')!='04b135c554c6de6aa979b113a3435cec65063c87e79f232d8c8ea28e1d75f4ce':
              raise SystemExit('OWNER_CLOSEOUT_FAIL:APK_HASH')
          if req.get('stable_publish')!='FORBIDDEN' or req.get('authority_change')!='NONE':
              raise SystemExit('OWNER_CLOSEOUT_FAIL:PROTECTED_STATE')

          requirements=scope['requirements']
          if [x['checklist_number'] for x in requirements] != list(range(1,13)):
              raise SystemExit('OWNER_CLOSEOUT_FAIL:CHECKLIST_NUMBERS')
          by_num={x['checklist_number']:x for x in requirements}
          if {n for n,x in by_num.items() if x['state']=='TECHNICAL_PASS_AWAITING_OWNER'} != pending_nums:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:PENDING_SET')
          if {x['requirement_id'] for x in requirements if x['state']=='TECHNICAL_PASS_AWAITING_OWNER'} != pending_rids:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:PENDING_RID_SET')
          if any(by_num[n]['state']!='ACTIVE_PASS' for n in {1,2,3,4,5,6,8}):
              raise SystemExit('OWNER_CLOSEOUT_FAIL:INHERITED_ACTIVE_PASS_LOST')
          for n in pending_nums:
              ev=by_num[n].get('technical_evidence') or {}
              if ev.get('status')!='PASS' or ev.get('version_name')!='0.4.2-beta.128':
                  raise SystemExit(f'OWNER_CLOSEOUT_FAIL:TECH_EVIDENCE:{n}')

          # Append exactly one OWNER acceptance event. Acceptance does not alter requirement semantics/source commands.
          events=[json.loads(line) for line in command_ledger_path.read_text().splitlines() if line.strip()]
          if len(events)!=scope['ledger_head_sequence'] or len(events)!=3:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:LEDGER_PRESTATE')
          prev=events[-1]['event_sha256']
          event={
              'sequence':4,
              'command_id':'CMD-20260906-004',
              'recorded_at':accepted_at,
              'source':'OWNER_CHAT',
              'event_type':'OWNER_ACCEPTANCE',
              'raw_text':response,
              'related_requirement_ids':['R2-07','R2-09','R2-10','R2-11','R3-12'],
              'previous_event_sha256':prev,
          }
          event['event_sha256']=sha_obj(event)
          events.append(event)
          command_ledger_path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in events)+'\n')

          # ACTIVE_PASS transition only for the five canonical pending requirements.
          for item in requirements:
              if item['checklist_number'] in pending_nums:
                  item['state']='ACTIVE_PASS'
                  item['owner_result']='OK'
                  item['owner_acceptance']={
                      'status':'OWNER_OK',
                      'accepted_at':accepted_at,
                      'command_id':event['command_id'],
                  }
          scope['scope_status']='OWNER_ACCEPTANCE_COMPLETE'
          scope['ledger_head_sequence']=event['sequence']
          scope['ledger_head_event_sha256']=event['event_sha256']
          binding=scope.setdefault('release_binding',{})
          binding['owner_acceptance_receipt']=receipt_rel
          scope['semantics_sha256']=semantic_hash(scope)
          if scope['semantics_sha256']!=old_sem or scope['revision']!=old_rev:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:SEMANTICS_OR_REV_CHANGED')
          scope['scope_sha256']=full_scope_hash(scope)
          scope_path.write_text(json.dumps(scope,ensure_ascii=False,indent=2)+'\n')

          # Receipt derives mapping from canonical SC, not chat reconstruction.
          tech=dict(by_num[7]['technical_evidence'])
          tech.update({
              'human_visual':'PASS',
              'visual_matrix':'PASS_320x568_360x640_480x800',
              'ota_readback':'PASS',
              'stable_unchanged':True,
              'main_unchanged':True,
              'authority_change':'NONE',
          })
          receipt={
              'schema_version':1,
              'project':'APK PICK PACK 1291',
              'channel':'BETA',
              'version_name':req['version_name'],
              'version_code':req['version_code'],
              'owner_scope':scope['scope_id'],
              'owner_scope_revision':scope['revision'],
              'owner_scope_semantics_sha256':scope['semantics_sha256'],
              'owner_scope_sha256':scope['scope_sha256'],
              'checklist_id':req['owner_checklist_id'],
              'checklist_revision':req['owner_checklist_revision'],
              'accepted_at':accepted_at,
              'owner_response':response,
              'owner_response_applies_to':[7,9,10,11,12],
              'status':'OWNER_ACCEPTANCE_COMPLETE',
              'items':[
                  {
                      'number':x['checklist_number'],
                      'requirement_id':x['requirement_id'],
                      'invariant_id':x['invariant_id'],
                      'status':'OWNER_OK',
                      'invariant_state':'ACTIVE_PASS',
                      'acceptance_source':('OWNER_RESPONSE_2026-09-06' if x['checklist_number'] in pending_nums else 'INHERITED_OWNER_OK'),
                  }
                  for x in requirements
              ],
              'technical_evidence':tech,
              'owner_command_ledger_head':event['event_sha256'],
              'next_action':'WAIT_FOR_OWNER_NEW_SCOPE',
          }
          (root/receipt_rel).write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')

          # Monotonic acceptance ledger; preserve the full Beta127 ledger inline.
          acceptance={
              'schema_version':1,
              'state_epoch':state_epoch,
              'channel':'BETA',
              'public_beta':{
                  'version_name':req['version_name'],
                  'version_code':req['version_code'],
                  'source_sha':req['source_sha'],
                  'apk_sha256':req['apk_sha256'],
                  'technical_status':'PASS_LIVE',
              },
              'owner_scope':{
                  'scope_id':scope['scope_id'],
                  'status':'OWNER_ACCEPTANCE_COMPLETE',
                  'requirements':[
                      {'id':x['invariant_id'],'status':'ACTIVE_PASS','rule':' '.join(x['acceptance'])}
                      for x in requirements
                  ],
              },
              'technical_evidence':tech | {'owner_receipt':receipt_rel},
              'checklist':{
                  'checklist_id':req['owner_checklist_id'],
                  'revision':req['owner_checklist_revision'],
                  'status':'OWNER_ACCEPTANCE_COMPLETE',
                  'items':[
                      {
                          'number':x['checklist_number'],
                          'id':x['invariant_id'],
                          'status':'OWNER_OK',
                          'test':('OWNER explicitly confirmed this remaining Beta128 item OK.' if x['checklist_number'] in pending_nums else 'Inherited explicit OWNER OK from prior accepted baseline.'),
                      }
                      for x in requirements
                  ],
                  'owner_responses':[
                      {
                          'recorded_at':accepted_at,
                          'response':response,
                          'items':{str(n):'OK' for n in sorted(pending_nums)},
                      }
                  ],
              },
              'previous_acceptance':old_acceptance,
              'fencing':{
                  'reject_lower_state_epoch':True,
                  'reject_older_beta_version':True,
                  'reject_lower_checklist_revision':True,
                  'owner_silence_is_acceptance':False,
              },
              'security':old_acceptance.get('security',{}),
              'next_action':'WAIT_FOR_OWNER_NEW_SCOPE',
          }
          acceptance_path.write_text(json.dumps(acceptance,ensure_ascii=False,indent=2)+'\n')

          target_ids=[by_num[n]['invariant_id'] for n in sorted(pending_nums)]

          # Durable Markdown: preserve old failure history and append Beta128 owner receipt.
          stable=stable_path.read_text()
          for iid in target_ids:
              pat=re.compile(rf'(?m)^### {re.escape(iid)} — TECHNICAL_PASS_AWAITING_OWNER$')
              stable,count=pat.subn(f'### {iid} — ACTIVE_PASS',stable,count=1)
              if count!=1:
                  raise SystemExit(f'OWNER_CLOSEOUT_FAIL:STABLE_HEADING:{iid}:{count}')
              start=stable.index(f'### {iid} — ACTIVE_PASS')
              m=re.search(r'(?m)^### ',stable[start+4:])
              end=(start+4+m.start()) if m else len(stable)
              block=stable[start:end]
              owner_line=f'- OWNER acceptance Beta128: PASS — OWNER confirmed all remaining items OK, {accepted_at}.\n'
              receipt_line=f'- Owner receipt Beta128: `{receipt_rel}`\n'
              verify_line=f'- Last verified Beta128: `0.4.2-beta.128` LIVE / OWNER acceptance complete 12/12.\n'
              for line in (owner_line,receipt_line,verify_line):
                  if line.strip() not in block:
                      block=block.rstrip()+'\n'+line
              stable=stable[:start]+block+stable[end:]
          stable_path.write_text(stable)

          # Machine registry: only state/acceptance/evidence metadata changes; rule semantics stay byte-for-byte.
          reg=registry_path.read_text()
          def update_registry_block(text:str,iid:str)->str:
              matches=list(re.finditer(r'(?m)^  - id: ([A-Za-z0-9_.-]+)$',text))
              hit=[(i,m) for i,m in enumerate(matches) if m.group(1)==iid]
              if len(hit)!=1:
                  raise SystemExit(f'OWNER_CLOSEOUT_FAIL:REGISTRY_CARDINALITY:{iid}:{len(hit)}')
              idx,m=hit[0]
              start=m.start(); end=matches[idx+1].start() if idx+1<len(matches) else text.find('\nimpact_map:',start)
              if end<0: end=len(text)
              block=text[start:end]
              block,n=re.subn(r'(?m)^    status: [A-Z_]+$', '    status: ACTIVE_PASS', block, count=1)
              if n!=1: raise SystemExit(f'OWNER_CLOSEOUT_FAIL:REGISTRY_STATUS:{iid}')
              values={
                  'owner_acceptance':json.dumps(f'PASS — OWNER Beta128 accepted {accepted_at}.',ensure_ascii=False),
                  'owner_receipt':json.dumps(receipt_rel,ensure_ascii=False),
                  'active_pass':'true',
                  'last_verified':json.dumps(f'0.4.2-beta.128 LIVE / OWNER acceptance complete 12/12 / {accepted_at}',ensure_ascii=False),
              }
              for key,val in values.items():
                  p=rf'(?m)^    {re.escape(key)}: .*?$'
                  if re.search(p,block):
                      block=re.sub(p,f'    {key}: {val}',block,count=1)
                  else:
                      block=block.rstrip()+f'\n    {key}: {val}\n'
              return text[:start]+block+text[end:]
          for iid in target_ids:
              reg=update_registry_block(reg,iid)
          parsed=yaml.safe_load(reg)
          if not isinstance(parsed,dict) or not isinstance(parsed.get('invariants'),list) or not isinstance(parsed.get('impact_map'),dict):
              raise SystemExit('OWNER_CLOSEOUT_FAIL:REGISTRY_YAML_STRUCTURE')
          reg_states={x.get('id'):x.get('status') for x in parsed['invariants'] if isinstance(x,dict)}
          if any(reg_states.get(iid)!='ACTIVE_PASS' for iid in target_ids):
              raise SystemExit('OWNER_CLOSEOUT_FAIL:REGISTRY_NOT_ACTIVE')
          registry_path.write_text(reg)

          # Release request acceptance + canonical pointers.
          req['owner_scope_semantics_sha256']=scope['semantics_sha256']
          req['owner_scope_sha256']=scope['scope_sha256']
          req['owner_command_ledger_head']=event['event_sha256']
          req['owner_acceptance']='COMPLETE'
          req['owner_acceptance_receipt']=receipt_rel
          req['owner_acceptance_completed_at']=accepted_at
          req['next_action']='WAIT_FOR_OWNER_NEW_SCOPE'
          req_path.write_text(json.dumps(req,ensure_ascii=False,indent=2)+'\n')

          def replace_or_add(text:str,key:str,value:str,anchor:str='- owner_scope_file: ops/OWNER_SCOPE_CURRENT.json')->str:
              pat=rf'(?m)^- {re.escape(key)}:\s*.*$'
              line=f'- {key}: {value}'
              if re.search(pat,text): return re.sub(pat,line,text,count=1)
              if anchor in text: return text.replace(anchor,anchor+'\n'+line,1)
              raise SystemExit(f'OWNER_CLOSEOUT_FAIL:POINTER_ANCHOR:{key}')

          pointers={
              'owner_scope_id':scope['scope_id'],
              'owner_scope_revision':str(scope['revision']),
              'owner_scope_semantics_sha256':scope['semantics_sha256'],
              'owner_scope_sha256':scope['scope_sha256'],
              'owner_command_ledger':'ops/owner-command-ledger.jsonl',
              'owner_command_ledger_head':event['event_sha256'],
          }
          current=current_path.read_text()
          for k,v in pointers.items(): current=replace_or_add(current,k,v)
          if re.search(r'(?m)^- owner_acceptance:',current):
              current=re.sub(r'(?m)^- owner_acceptance:.*$','- owner_acceptance: COMPLETE (12/12 OWNER OK)',current,count=1)
          else:
              current=current.replace('- next_action:','- owner_acceptance: COMPLETE (12/12 OWNER OK)\n- next_action:',1)
          current=re.sub(r'(?m)^- next_action:.*$','- next_action: WAIT_FOR_OWNER_NEW_SCOPE',current,count=1)
          current_path.write_text(current)

          archive_rel='docs/handovers/HANDOVER_20260905-225900_beta128-owner-accepted.md'
          handoff=handoff_path.read_text()
          for k,v in pointers.items(): handoff=replace_or_add(handoff,k,v)
          handoff=re.sub(r'(?m)^- time_utc:.*$',f'- time_utc: {accepted_at_utc}',handoff,count=1)
          handoff=re.sub(r'(?m)^- archive_file:.*$',f'- archive_file: {archive_rel}',handoff,count=1)
          handoff=re.sub(r'(?m)^- TARGET:.*$','- TARGET: PASS/LIVE; OWNER acceptance COMPLETE for canonical scope revision 3.',handoff,count=1)
          handoff=re.sub(r'(?s)(## Blocker\n).*?(?=\n## NEXT_ACTION)',r'\1Không có blocker kỹ thuật. OWNER acceptance COMPLETE; canonical scope đã khóa ACTIVE_PASS.\n',handoff,count=1)
          handoff=re.sub(r'(?m)(^## NEXT_ACTION\n)[^\n]+$',r'\1WAIT_FOR_OWNER_NEW_SCOPE',handoff,count=1)
          if '## Checklist OWNER nghiệm thu' in handoff:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:HANDOFF_DUPLICATES_CHECKLIST')
          handoff_path.write_text(handoff)
          (root/archive_rel).write_text(handoff)

          # Internal consistency before external guards.
          scope2=json.loads(scope_path.read_text())
          if scope2['semantics_sha256']!=old_sem or scope2['revision']!=old_rev:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:POSTWRITE_SEMANTICS')
          if scope2['scope_status']!='OWNER_ACCEPTANCE_COMPLETE' or any(x['state']!='ACTIVE_PASS' for x in scope2['requirements']):
              raise SystemExit('OWNER_CLOSEOUT_FAIL:POSTWRITE_SCOPE_STATE')
          if json.loads(acceptance_path.read_text())['previous_acceptance']['public_beta']['version_name']!='0.4.2-beta.127':
              raise SystemExit('OWNER_CLOSEOUT_FAIL:PREVIOUS_ACCEPTANCE_LOST')
          if len(json.loads(acceptance_path.read_text())['owner_scope']['requirements'])!=12:
              raise SystemExit('OWNER_CLOSEOUT_FAIL:ACCEPTANCE_COUNT')
          print('BETA128_OWNER_ACCEPTANCE_WRITE=PASS scope_sha='+scope2['scope_sha256']+' ledger_head='+event['event_sha256'])
          PY

      - name: Validate acceptance, hashes, registry and no app byte change
        run: |
          set -euo pipefail
          python3 tools/owner_acceptance_ledger_guard.py --self-test
          python3 tools/owner_acceptance_ledger_guard.py --base-ref "$BASE"
          python3 tools/owner_scope_guard.py --base-ref "$BASE"
          python3 tools/owner_scope_guard.py --bootstrap
          git diff --quiet "$BASE" -- app service google-apps-script
          git diff --check
          jq -e '.scope_status=="OWNER_ACCEPTANCE_COMPLETE" and ([.requirements[].state]|all(.=="ACTIVE_PASS")) and .revision==3 and .semantics_sha256=="4ba607f61fd8877c1bbf0a86a69ac947e0fa0912e039e9f1085fb6d2e179eb90"' ops/OWNER_SCOPE_CURRENT.json >/dev/null
          jq -e '.public_beta.version_name=="0.4.2-beta.128" and .owner_scope.status=="OWNER_ACCEPTANCE_COMPLETE" and (.owner_scope.requirements|length)==12 and ([.owner_scope.requirements[].status]|all(.=="ACTIVE_PASS")) and .checklist.status=="OWNER_ACCEPTANCE_COMPLETE"' ops/owner-acceptance-current.json >/dev/null
          jq -e '.status=="OWNER_ACCEPTANCE_COMPLETE" and (.items|length)==12 and .owner_response=="Tất cả ok"' ops/beta128-owner-acceptance.json >/dev/null
          jq -e '.owner_acceptance=="COMPLETE" and .next_action=="WAIT_FOR_OWNER_NEW_SCOPE"' ops/beta-release-request.json >/dev/null
          test "$(grep -c '^WAIT_FOR_OWNER_NEW_SCOPE$' docs/handovers/HANDOVER_CURRENT.md)" = 1

      - name: Commit canonical OWNER acceptance and remote readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/OWNER_SCOPE_CURRENT.json ops/owner-command-ledger.jsonl ops/owner-acceptance-current.json ops/beta128-owner-acceptance.json ops/beta-release-request.json CURRENT_STATE.md docs/STABLE_INVARIANTS.md qa/stable_invariants.yml docs/handovers/HANDOVER_CURRENT.md docs/handovers/HANDOVER_20260905-225900_beta128-owner-accepted.md
          git commit -m '[skip ci] owner(beta128): accept remaining checklist and lock 12 of 12 ACTIVE_PASS'
          FINAL=$(git rev-parse HEAD)
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git fetch origin "$GITHUB_REF_NAME" --quiet
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$FINAL"
          git reset --hard "origin/$GITHUB_REF_NAME"
          python3 tools/owner_acceptance_ledger_guard.py --base-ref "$BASE"
          python3 tools/owner_scope_guard.py --base-ref "$BASE"
          python3 tools/owner_scope_guard.py --bootstrap
          test "$(jq -r '.scope_status' ops/OWNER_SCOPE_CURRENT.json)" = OWNER_ACCEPTANCE_COMPLETE
          test "$(jq '[.requirements[]|select(.state=="ACTIVE_PASS")]|length' ops/OWNER_SCOPE_CURRENT.json)" = 12
          test "$(jq -r '.public_beta.version_name' ops/owner-acceptance-current.json)" = 0.4.2-beta.128
          test "$(jq -r '.owner_acceptance' ops/beta-release-request.json)" = COMPLETE
          test "$(awk '/^## NEXT_ACTION/{getline; print}' docs/handovers/HANDOVER_CURRENT.md)" = WAIT_FOR_OWNER_NEW_SCOPE
          echo "BETA128_OWNER_ACCEPTANCE_CLOSEOUT_PASS commit=$FINAL"
