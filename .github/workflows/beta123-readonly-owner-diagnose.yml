name: Beta123 read-only owner scope diagnose

on:
  push:
    branches: [tmp/beta123-readonly-diag4-20260905]
    paths: [.github/workflows/beta123-readonly-owner-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Inspect stale production replication claims
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix service install --ignore-scripts --no-audit --no-fund >/dev/null
          DB_NAME=$(python3 - <<'PY'
          import re,pathlib
          t=pathlib.Path('.github/workflows/beta118-owner-reset-200-preflight.yml').read_text()
          m=re.search(r'^\s*D1_NAME:\s*([^\s#]+)',t,re.M)
          if not m: raise SystemExit('PRODUCTION_D1_RUNBOOK_NAME_MISSING')
          print(m.group(1).strip('"\''))
          PY
          )
          SQL="SELECT authority_epoch,authority_seq,mode,scope,service_generation FROM authority_state WHERE singleton_id=1; SELECT status,COUNT(*) n,MIN(claimed_at) oldest_claim,MAX(claimed_at) newest_claim,MIN(created_at) oldest_created,MAX(created_at) newest_created,MIN(attempt_count) min_attempt,MAX(attempt_count) max_attempt FROM sheet_replication_outbox GROUP BY status ORDER BY status; SELECT COALESCE(last_error_class,'') error_class,COALESCE(last_error,'') last_error,COUNT(*) n FROM sheet_replication_outbox WHERE status IN ('INFLIGHT','RETRY','PENDING') GROUP BY error_class,last_error ORDER BY n DESC LIMIT 10; SELECT COUNT(*) stale_15m FROM sheet_replication_outbox WHERE status='INFLIGHT' AND (claimed_at IS NULL OR claimed_at < strftime('%Y-%m-%dT%H:%M:%fZ','now','-15 minutes')); SELECT state,pending_count,retry_count,last_attempt_at,last_success_at,last_error_class,last_error FROM replication_status WHERE singleton_id=1;"
          npx --prefix service wrangler d1 execute "$DB_NAME" --remote --json --command "$SQL" > /tmp/r.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/r.json'))
          rows=[]
          def w(v):
            if isinstance(v,dict):
              if isinstance(v.get('results'),list): rows.extend(v['results'])
              for z in v.values(): w(z)
            elif isinstance(v,list):
              for z in v: w(z)
          w(x)
          for r in rows: print(r)
          auth=next(r for r in rows if isinstance(r,dict) and 'authority_epoch' in r)
          assert auth['mode']=='SERVICE_PRIMARY' and auth['scope']=='PRODUCTION' and auth['authority_epoch']==9
          PY
