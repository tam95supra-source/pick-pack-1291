name: TEMP Service Live Health Probe

on:
  push:
    branches: [ agent/service-prod-replication-fix-20260823 ]
    paths:
      - '.github/workflows/service-live-health-probe-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production health read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LIVE_HEALTH_BEGIN ==='
          curl --fail-with-body --silent --show-error --max-time 20 'https://pickpack.1291.workers.dev/health'
          echo
          echo '=== LIVE_HEALTH_END ==='
